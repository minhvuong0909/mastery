<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#5b5ce2" />
  <meta name="description" content="Web ôn tập 739 câu trắc nghiệm Dược liệu 1 - TH2 từ 18 bộ câu hỏi, có đáp án, giải thích và từ khóa." />
  <title>Dược liệu Mastery — Ôn trắc nghiệm thông minh</title>
  <style>:root {
  --bg: #f5f7fb;
  --surface: #ffffff;
  --surface-2: #f8f9fd;
  --surface-3: #eef0ff;
  --text: #17182b;
  --text-2: #575b75;
  --text-3: #8a8ea8;
  --primary: #5b5ce2;
  --primary-2: #7476f1;
  --primary-weak: #ececff;
  --success: #13a46b;
  --success-weak: #e8f8f1;
  --danger: #e04f5f;
  --danger-weak: #fff0f2;
  --warning: #e49a24;
  --warning-weak: #fff7e8;
  --border: #e5e7f0;
  --shadow-sm: 0 1px 2px rgba(18, 22, 48, .04), 0 3px 10px rgba(18, 22, 48, .04);
  --shadow-md: 0 14px 38px rgba(25, 29, 70, .10);
  --radius-sm: 12px;
  --radius: 18px;
  --radius-lg: 26px;
  --sidebar: 252px;
  --content-max: 1180px;
  --transition: .18s ease;
  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #11131d;
  --surface: #191c29;
  --surface-2: #202432;
  --surface-3: #2a2c4b;
  --text: #f5f6fb;
  --text-2: #b7bbcc;
  --text-3: #81869b;
  --primary: #8587ff;
  --primary-2: #9b9dff;
  --primary-weak: #2a2c4d;
  --success: #43cf93;
  --success-weak: #17382e;
  --danger: #ff7884;
  --danger-weak: #41242a;
  --warning: #f0b653;
  --warning-weak: #40341f;
  --border: #2d3142;
  --shadow-sm: 0 2px 10px rgba(0,0,0,.18);
  --shadow-md: 0 18px 44px rgba(0,0,0,.28);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; }
button { color: inherit; }
button, [role="button"] { -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--primary) 28%, transparent);
  outline-offset: 2px;
}
svg { display: block; }

.app-shell { min-height: 100vh; }
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 30;
  width: var(--sidebar);
  display: flex;
  flex-direction: column;
  padding: 24px 18px 18px;
  background: var(--surface);
  border-right: 1px solid var(--border);
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 11px;
  padding: 4px 8px;
  color: var(--text);
  text-decoration: none;
}
.brand-mark {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  color: #fff;
  background: linear-gradient(145deg, var(--primary), #8b66f6);
  box-shadow: 0 8px 18px color-mix(in srgb, var(--primary) 26%, transparent);
}
.brand-mark svg { width: 26px; height: 26px; }
.brand > span:last-child { display: flex; flex-direction: column; line-height: 1.05; }
.brand strong { font-size: 17px; letter-spacing: .02em; }
.brand small { margin-top: 4px; color: var(--text-3); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
.nav-list { display: grid; gap: 7px; margin-top: 34px; }
.nav-item {
  width: 100%;
  min-height: 46px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 13px;
  border: 0;
  border-radius: 13px;
  background: transparent;
  color: var(--text-2);
  font-size: 14px;
  font-weight: 650;
  text-align: left;
  cursor: pointer;
  transition: background var(--transition), color var(--transition), transform var(--transition);
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item:active { transform: scale(.985); }
.nav-item.active { color: var(--primary); background: var(--primary-weak); }
.nav-item svg { width: 20px; height: 20px; fill: currentColor; flex: 0 0 auto; }
.nav-badge {
  margin-left: auto;
  min-width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  padding: 0 6px;
  border-radius: 999px;
  color: #fff;
  background: var(--danger);
  font-size: 11px;
  font-weight: 800;
}
.nav-badge:empty, .nav-badge[data-zero="true"] { display: none; }
.sidebar-spacer { flex: 1; }
.sidebar-tip {
  margin: 12px 2px 14px;
  padding: 15px;
  border: 1px solid color-mix(in srgb, var(--primary) 18%, var(--border));
  border-radius: 16px;
  background: linear-gradient(145deg, var(--primary-weak), var(--surface));
}
.sidebar-tip .tip-icon { color: var(--primary); font-size: 20px; }
.sidebar-tip strong { display: block; margin-top: 5px; font-size: 13px; }
.sidebar-tip p { margin: 6px 0 0; color: var(--text-2); font-size: 11.5px; line-height: 1.45; }

.main-content {
  min-height: 100vh;
  margin-left: var(--sidebar);
  padding: 34px 38px 60px;
}
.page { width: min(100%, var(--content-max)); margin: 0 auto; animation: pageIn .28s ease; }
.session-page { animation: none; }
@keyframes pageIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

.mobile-header, .mobile-nav { display: none; }

.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 26px;
}
.page-title { margin: 0; font-size: clamp(25px, 3vw, 34px); line-height: 1.18; letter-spacing: -.035em; }
.page-subtitle { margin: 8px 0 0; color: var(--text-2); font-size: 14px; }
.header-actions { display: flex; align-items: center; gap: 10px; }

.button {
  min-height: 43px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 10px 16px;
  border: 1px solid transparent;
  border-radius: 12px;
  font-size: 13.5px;
  font-weight: 750;
  cursor: pointer;
  transition: transform var(--transition), box-shadow var(--transition), background var(--transition), border-color var(--transition);
}
.button:hover { transform: translateY(-1px); }
.button:active { transform: translateY(0) scale(.985); }
.button.primary { color: #fff; background: linear-gradient(135deg, var(--primary), var(--primary-2)); box-shadow: 0 8px 18px color-mix(in srgb, var(--primary) 25%, transparent); }
.button.primary:hover { box-shadow: 0 10px 22px color-mix(in srgb, var(--primary) 34%, transparent); }
.button.secondary { border-color: var(--border); background: var(--surface); color: var(--text); }
.button.secondary:hover { border-color: color-mix(in srgb, var(--primary) 35%, var(--border)); }
.button.ghost { background: transparent; color: var(--text-2); }
.button.ghost:hover { background: var(--surface-2); color: var(--text); }
.button.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 25%, var(--border)); background: var(--danger-weak); }
.button.success { color: #fff; background: var(--success); }
.button.small { min-height: 35px; padding: 7px 11px; font-size: 12.5px; border-radius: 10px; }
.button.wide { width: 100%; }
.button svg { width: 18px; height: 18px; fill: currentColor; }
.button[disabled] { opacity: .5; pointer-events: none; box-shadow: none; }
.icon-button {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  cursor: pointer;
}
.icon-button:hover { background: var(--surface-2); }

.hero {
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-columns: 1.45fr .75fr;
  gap: 28px;
  min-height: 245px;
  padding: 34px 36px;
  border-radius: var(--radius-lg);
  color: #fff;
  background:
    radial-gradient(circle at 86% 20%, rgba(255,255,255,.22) 0 8%, transparent 9%),
    radial-gradient(circle at 92% 75%, rgba(255,255,255,.10) 0 20%, transparent 21%),
    linear-gradient(135deg, #4e4fd2 0%, #6e63e8 56%, #8b65ec 100%);
  box-shadow: 0 18px 50px rgba(76, 72, 190, .2);
}
.hero::after {
  content: "";
  position: absolute;
  width: 260px;
  height: 260px;
  right: -80px;
  top: -100px;
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 50%;
  box-shadow: 0 0 0 34px rgba(255,255,255,.05), 0 0 0 70px rgba(255,255,255,.035);
}
.hero-copy { position: relative; z-index: 2; align-self: center; }
.eyebrow { display: inline-flex; align-items: center; gap: 7px; margin-bottom: 12px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .86; }
.eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #baf6dc; box-shadow: 0 0 0 5px rgba(186,246,220,.13); }
.hero h1 { max-width: 630px; margin: 0; font-size: clamp(28px, 4vw, 42px); line-height: 1.13; letter-spacing: -.045em; }
.hero p { max-width: 590px; margin: 14px 0 22px; color: rgba(255,255,255,.82); font-size: 14px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.hero .button.primary { color: var(--primary); background: #fff; box-shadow: 0 8px 20px rgba(24,22,82,.18); }
.hero .button.secondary { color: #fff; border-color: rgba(255,255,255,.24); background: rgba(255,255,255,.11); backdrop-filter: blur(6px); }
.hero-visual { position: relative; z-index: 2; display: grid; place-items: center; }
.mastery-orbit { position: relative; width: 174px; height: 174px; display: grid; place-items: center; }
.mastery-ring { width: 150px; height: 150px; transform: rotate(-90deg); filter: drop-shadow(0 8px 18px rgba(25,20,96,.18)); }
.mastery-ring .track { fill: rgba(255,255,255,.08); stroke: rgba(255,255,255,.18); stroke-width: 10; }
.mastery-ring .progress { fill: none; stroke: #fff; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .7s ease; }
.mastery-label { position: absolute; text-align: center; }
.mastery-label strong { display: block; font-size: 34px; line-height: 1; letter-spacing: -.04em; }
.mastery-label span { display: block; margin-top: 8px; color: rgba(255,255,255,.72); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.orbit-dot { position: absolute; width: 14px; height: 14px; border: 3px solid rgba(255,255,255,.48); border-radius: 50%; background: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.18); }
.orbit-dot.one { top: 6px; right: 26px; }
.orbit-dot.two { bottom: 13px; left: 10px; width: 10px; height: 10px; }

.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 20px; }
.stat-card {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
  padding: 18px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}
.stat-icon { width: 43px; height: 43px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 13px; }
.stat-icon svg { width: 21px; height: 21px; fill: currentColor; }
.stat-icon.purple { color: var(--primary); background: var(--primary-weak); }
.stat-icon.green { color: var(--success); background: var(--success-weak); }
.stat-icon.orange { color: var(--warning); background: var(--warning-weak); }
.stat-icon.red { color: var(--danger); background: var(--danger-weak); }
.stat-value { display: block; font-size: 22px; font-weight: 820; line-height: 1.05; letter-spacing: -.02em; }
.stat-label { display: block; margin-top: 5px; color: var(--text-3); font-size: 11.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.section { margin-top: 30px; }
.section-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.section-heading h2 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
.section-heading p { margin: 4px 0 0; color: var(--text-3); font-size: 12.5px; }
.text-button { border: 0; background: transparent; color: var(--primary); font-size: 12.5px; font-weight: 750; cursor: pointer; }
.text-button:hover { text-decoration: underline; }

.chapter-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.chapter-card {
  position: relative;
  overflow: hidden;
  min-height: 190px;
  display: flex;
  flex-direction: column;
  padding: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
}
.chapter-card:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--chapter-color) 35%, var(--border)); box-shadow: var(--shadow-md); }
.chapter-card::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--chapter-color); }
.chapter-top { display: flex; align-items: center; justify-content: space-between; }
.chapter-number { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 13px; color: var(--chapter-color); background: color-mix(in srgb, var(--chapter-color) 12%, var(--surface)); font-weight: 850; }
.chapter-count { color: var(--text-3); font-size: 11.5px; font-weight: 700; }
.chapter-card h3 { margin: 16px 0 8px; min-height: 44px; font-size: 14px; line-height: 1.45; }
.chapter-progress-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; color: var(--text-3); font-size: 11px; font-weight: 700; }
.progress-bar { width: 100%; height: 7px; overflow: hidden; border-radius: 99px; background: var(--surface-2); }
.progress-bar > span { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--bar-color, var(--primary)); transition: width .5s ease; }
.chapter-card .progress-bar { margin-top: 8px; }
.chapter-action { margin-top: 15px; display: flex; gap: 8px; }
.chapter-action .button { flex: 1; }

.two-column { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, .72fr); gap: 18px; }
.panel { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }
.panel-header { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 19px 20px 0; }
.panel-header h3 { margin: 0; font-size: 15px; }
.panel-body { padding: 18px 20px 20px; }
.activity-list { display: grid; gap: 11px; }
.activity-item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); }
.activity-item:last-child { border-bottom: 0; }
.activity-score { width: 42px; height: 42px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 12px; background: var(--surface-2); font-size: 12px; font-weight: 850; }
.activity-score.good { color: var(--success); background: var(--success-weak); }
.activity-score.mid { color: var(--warning); background: var(--warning-weak); }
.activity-score.low { color: var(--danger); background: var(--danger-weak); }
.activity-info { min-width: 0; flex: 1; }
.activity-info strong { display: block; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.activity-info span { color: var(--text-3); font-size: 11px; }
.empty-state { padding: 28px 16px; text-align: center; }
.empty-icon { width: 58px; height: 58px; display: grid; place-items: center; margin: 0 auto 12px; border-radius: 18px; color: var(--primary); background: var(--primary-weak); font-size: 24px; }
.empty-state h3 { margin: 0; font-size: 15px; }
.empty-state p { max-width: 390px; margin: 7px auto 16px; color: var(--text-3); font-size: 12.5px; }

.study-plan { display: grid; gap: 14px; }
.plan-step { display: grid; grid-template-columns: 34px 1fr; gap: 11px; align-items: start; }
.plan-index { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; color: var(--primary); background: var(--primary-weak); font-size: 12px; font-weight: 850; }
.plan-step strong { display: block; font-size: 12.5px; }
.plan-step p { margin: 4px 0 0; color: var(--text-3); font-size: 11.5px; line-height: 1.45; }
.choice-text{

flex:1;

min-width:0;

}
/* Setup */
.setup-layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 20px; align-items: start; }
.setup-card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }
.setup-section { padding: 22px; border-bottom: 1px solid var(--border); }
.setup-section:last-child { border-bottom: 0; }
.setup-section-title { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
.setup-section-title span { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 9px; color: var(--primary); background: var(--primary-weak); font-size: 12px; font-weight: 850; }
.setup-section-title h3 { margin: 0; font-size: 14px; }
.chapter-select-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.choice-card, .mode-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: var(--surface);
  cursor: pointer;
  transition: border-color var(--transition), background var(--transition), transform var(--transition);
}
.choice-card:hover, .mode-card:hover { border-color: color-mix(in srgb, var(--primary) 40%, var(--border)); }
.choice-card.selected, .mode-card.selected { border-color: var(--primary); background: var(--primary-weak); }
.choice-card input, .mode-card input { position: absolute; opacity: 0; pointer-events: none; }
.choice-check { width: 20px; height: 20px; display: grid; place-items: center; flex: 0 0 auto; border: 1.5px solid var(--border); border-radius: 7px; color: #fff; background: var(--surface); font-size: 12px; font-weight: 900; }
.choice-card.selected .choice-check { border-color: var(--primary); background: var(--primary); }
.choice-text { min-width: 0; }
.choice-text strong { display: block; font-size: 12.5px; }
.choice-text span {

display:block;

margin-top:4px;

color:var(--text-3);

font-size:12px;

line-height:1.5;

white-space:normal;

overflow:visible;

text-overflow:unset;

word-break:break-word;

}
.mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mode-card { align-items: flex-start; min-height: 100px; }
.mode-icon { width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 10px; color: var(--primary); background: var(--primary-weak); font-size: 17px; }
.mode-card.selected .mode-icon { color: #fff; background: var(--primary); }
.mode-card strong { display: block; margin-top: 1px; font-size: 12.5px; }
.mode-card p { margin: 4px 0 0; color: var(--text-3); font-size: 10.5px; line-height: 1.4; }
.segmented { display: flex; flex-wrap: wrap; gap: 8px; }
.segmented button {
  min-width: 58px;
  padding: 9px 13px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: var(--surface);
  color: var(--text-2);
  font-size: 12px;
  font-weight: 750;
  cursor: pointer;
}
.segmented button:hover { border-color: color-mix(in srgb, var(--primary) 38%, var(--border)); }
.segmented button.active { color: var(--primary); border-color: var(--primary); background: var(--primary-weak); }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 8px 0; }
.switch-copy strong { display: block; font-size: 12.5px; }
.switch-copy span { display: block; margin-top: 3px; color: var(--text-3); font-size: 10.5px; }
.switch { position: relative; width: 43px; height: 25px; flex: 0 0 auto; }
.switch input { position: absolute; opacity: 0; }
.switch-track { position: absolute; inset: 0; border-radius: 99px; background: var(--border); transition: background var(--transition); cursor: pointer; }
.switch-track::after { content: ""; position: absolute; width: 19px; height: 19px; top: 3px; left: 3px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.18); transition: transform var(--transition); }
.switch input:checked + .switch-track { background: var(--primary); }
.switch input:checked + .switch-track::after { transform: translateX(18px); }
.setup-summary { position: sticky; top: 25px; padding: 22px; }
.setup-summary h3 { margin: 0; font-size: 15px; }
.summary-list { display: grid; gap: 11px; margin: 18px 0; padding: 14px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.summary-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--text-3); font-size: 11.5px; }
.summary-line strong { color: var(--text); font-size: 12px; text-align: right; }
.summary-note { margin: 0 0 15px; color: var(--text-3); font-size: 10.5px; line-height: 1.5; }

/* Session */
.session-page { width: min(100%, 900px); }
.session-topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.session-topbar .progress-wrap { flex: 1; }
.session-progress-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 7px; color: var(--text-3); font-size: 11px; font-weight: 700; }
.session-progress { height: 8px; overflow: hidden; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); }
.session-progress span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--primary), #9272ef); transition: width .35s ease; }
.session-tools { display: flex; gap: 8px; }
.session-card { padding: 28px; border: 1px solid var(--border); border-radius: 22px; background: var(--surface); box-shadow: var(--shadow-md); }
.question-meta { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
.question-tags { display: flex; flex-wrap: wrap; gap: 7px; }
.tag { display: inline-flex; align-items: center; gap: 5px; min-height: 25px; padding: 4px 9px; border-radius: 999px; color: var(--text-2); background: var(--surface-2); font-size: 10.5px; font-weight: 750; }
.tag.primary { color: var(--primary); background: var(--primary-weak); }
.tag.warning { color: var(--warning); background: var(--warning-weak); }
.bookmark-button { width: 37px; height: 37px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 11px; background: var(--surface); color: var(--text-3); cursor: pointer; }
.bookmark-button svg { width: 19px; height: 19px; fill: currentColor; }
.bookmark-button.active { color: var(--warning); border-color: color-mix(in srgb, var(--warning) 35%, var(--border)); background: var(--warning-weak); }
.question-title { margin: 0; font-size: clamp(20px, 3vw, 27px); line-height: 1.42; letter-spacing: -.025em; }
.options-list { display: grid; gap: 11px; margin-top: 25px; }
.option-button {
  width: 100%;
  display: grid;
  grid-template-columns: 38px 1fr auto;
  align-items: center;
  gap: 13px;
  min-height: 62px;
  padding: 11px 15px;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  background: var(--surface);
  text-align: left;
  cursor: pointer;
  transition: border-color var(--transition), background var(--transition), transform var(--transition), box-shadow var(--transition);
}
.option-button:hover:not([disabled]) { transform: translateY(-1px); border-color: color-mix(in srgb, var(--primary) 45%, var(--border)); box-shadow: var(--shadow-sm); }
.option-letter { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 11px; color: var(--text-2); background: var(--surface-2); font-size: 12px; font-weight: 850; }
.option-text { color: var(--text); font-size: 13.5px; line-height: 1.5; }
.option-indicator { width: 23px; height: 23px; display: none; place-items: center; border-radius: 50%; color: #fff; font-size: 13px; font-weight: 900; }
.option-button.selected { border-color: var(--primary); background: var(--primary-weak); }
.option-button.selected .option-letter { color: #fff; border-color: var(--primary); background: var(--primary); }
.option-button.correct { border-color: var(--success); background: var(--success-weak); }
.option-button.correct .option-letter { color: #fff; border-color: var(--success); background: var(--success); }
.option-button.correct .option-indicator { display: grid; background: var(--success); }
.option-button.wrong { border-color: var(--danger); background: var(--danger-weak); }
.option-button.wrong .option-letter { color: #fff; border-color: var(--danger); background: var(--danger); }
.option-button.wrong .option-indicator { display: grid; background: var(--danger); }
.option-button[disabled] { cursor: default; }
.feedback-box { display: flex; align-items: flex-start; gap: 12px; margin-top: 18px; padding: 14px 15px; border-radius: 13px; }
.feedback-box.correct { color: var(--success); background: var(--success-weak); }
.feedback-box.wrong { color: var(--danger); background: var(--danger-weak); }
.feedback-icon { width: 28px; height: 28px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 9px; color: #fff; background: currentColor; }
.feedback-icon span { color: #fff; font-weight: 900; }
.feedback-copy strong { display: block; font-size: 12.5px; }
.feedback-copy p { margin: 4px 0 0; color: var(--text-2); font-size: 11.5px; }
.feedback-details { display: grid; gap: 8px; margin-top: 10px; }
.feedback-note { padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--surface) 72%, transparent); }
.feedback-note b { display: block; margin-bottom: 2px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; }
.feedback-note span { color: var(--text-2); font-size: 11.5px; line-height: 1.5; }
.session-footer { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 14px; }
.side-nav {
  position: fixed;
  top: 50%;
  z-index: 20;
  width: 58px;
  height: 78px;
  min-width: 58px;
  min-height: 78px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  color: var(--text);
  box-shadow: var(--shadow-md);
  backdrop-filter: blur(12px);
  font-size: 30px;
  font-weight: 850;
  line-height: 1;
  cursor: pointer;
  transform: translateY(-50%);
  transition: border-color var(--transition), background var(--transition), opacity var(--transition);
}
.side-nav:hover { border-color: color-mix(in srgb, var(--primary) 42%, var(--border)); background: var(--surface); }
.side-nav:active { filter: brightness(.97); }
.side-nav[disabled] { opacity: .35; pointer-events: none; box-shadow: var(--shadow-sm); }
.side-nav.prev { left: calc(var(--sidebar) + 18px); }
.side-nav.next { right: 18px; color: #fff; border-color: transparent; background: linear-gradient(135deg, var(--primary), var(--primary-2)); }
.side-nav span {
  width: 1em;
  height: 1em;
  display: grid;
  place-items: center;
  font-family: Arial, sans-serif;
  line-height: 1;
}
.keyboard-hint { color: var(--text-3); font-size: 10.5px; }
kbd { min-width: 22px; display: inline-grid; place-items: center; padding: 2px 5px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; background: var(--surface-2); font: inherit; font-size: 9.5px; font-weight: 800; }

.flashcard-shell { margin-top: 8px; }
.flashcard { min-height: 520px; display: flex; flex-direction: column; padding: 30px; overflow: hidden; border: 1px solid var(--border); border-radius: 22px; background: var(--surface); box-shadow: var(--shadow-md); cursor: pointer; }
.flashcard.show-answer { border-color: color-mix(in srgb, var(--success) 36%, var(--border)); }
.flash-label { color: var(--text-3); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
.flash-question { margin: 14px 0 0; text-align: left; font-size: clamp(17px, 2.5vw, 22px); line-height: 1.45; letter-spacing: -.025em; }
.flash-options { margin-top: 14px; flex: 1; min-height: 0; overflow-y: auto; gap: 9px; }
.flash-options .option-button { min-height: 54px; padding: 9px 12px; pointer-events: none; cursor: default; transform: none !important; box-shadow: none !important; }
.flash-hint { margin-top: auto; padding-top: 12px; color: var(--text-3); text-align: center; font-size: 10.5px; }
.flash-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.flash-actions.rate { grid-template-columns: 1fr 1fr; }
.flash-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 14px; }
.flash-nav .keyboard-hint { text-align: center; }

/* Summary */
.result-hero { display: grid; grid-template-columns: 220px 1fr; gap: 30px; align-items: center; padding: 30px; border: 1px solid var(--border); border-radius: 24px; background: var(--surface); box-shadow: var(--shadow-md); }
.result-ring-wrap { position: relative; width: 190px; height: 190px; display: grid; place-items: center; margin: auto; }
.result-ring { width: 190px; height: 190px; transform: rotate(-90deg); }
.result-ring circle { fill: none; stroke-width: 13; }
.result-ring .track { stroke: var(--surface-2); }
.result-ring .value { stroke: var(--primary); stroke-linecap: round; }
.result-score { position: absolute; text-align: center; }
.result-score strong { display: block; font-size: 41px; line-height: 1; letter-spacing: -.05em; }
.result-score span { display: block; margin-top: 8px; color: var(--text-3); font-size: 11px; font-weight: 750; }
.result-copy h1 { margin: 0; font-size: 30px; letter-spacing: -.035em; }
.result-copy p { margin: 9px 0 20px; color: var(--text-2); font-size: 13px; }
.result-mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.result-mini { padding: 12px; border-radius: 12px; background: var(--surface-2); }
.result-mini strong { display: block; font-size: 18px; }
.result-mini span { color: var(--text-3); font-size: 10.5px; }
.result-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.review-list { display: grid; gap: 12px; }
.review-item { padding: 18px; border: 1px solid var(--border); border-radius: 15px; background: var(--surface); }
.review-item-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 9px; }
.review-item h4 { margin: 0; font-size: 13.5px; line-height: 1.48; }
.answer-row { display: grid; grid-template-columns: 105px 1fr; gap: 10px; margin-top: 9px; font-size: 11.5px; }
.answer-row > span:first-child { color: var(--text-3); font-weight: 700; }
.answer-row.wrong > span:last-child { color: var(--danger); }
.answer-row.correct > span:last-child { color: var(--success); }

/* Review */
.review-hero { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; padding: 25px; border: 1px solid var(--border); border-radius: 20px; background: linear-gradient(135deg, var(--surface), var(--primary-weak)); }
.review-hero h2 { margin: 0; font-size: 21px; }
.review-hero p { margin: 7px 0 0; color: var(--text-2); font-size: 12.5px; }
.review-hero-number { min-width: 118px; text-align: center; }
.review-hero-number strong { display: block; color: var(--primary); font-size: 38px; line-height: 1; }
.review-hero-number span { color: var(--text-3); font-size: 10.5px; }
.review-actions-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
.review-action-card { padding: 19px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); cursor: pointer; transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition); }
.review-action-card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 38%, var(--border)); box-shadow: var(--shadow-md); }
.review-action-icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); font-size: 18px; }
.review-action-card strong { display: block; margin-top: 12px; font-size: 13px; }
.review-action-card p { margin: 4px 0 12px; color: var(--text-3); font-size: 10.5px; line-height: 1.45; }
.review-action-card .count { color: var(--accent); font-size: 20px; font-weight: 850; }
.weak-list { display: grid; gap: 9px; }
.weak-item { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--border); }
.weak-item:last-child { border-bottom: 0; }
.weak-item strong { display: block; font-size: 12px; line-height: 1.45; }
.weak-item span { color: var(--text-3); font-size: 10.5px; }
.mastery-dots { display: flex; gap: 4px; }
.mastery-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--border); }
.mastery-dots i.on { background: var(--primary); }

/* Bank */
.filter-bar { display: grid; grid-template-columns: minmax(220px, 1fr) 180px 170px; gap: 10px; padding: 14px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-sm); }
.search-box { position: relative; }
.search-box svg { position: absolute; left: 13px; top: 50%; width: 18px; height: 18px; fill: var(--text-3); transform: translateY(-50%); }
.field, .select {
  width: 100%;
  min-height: 42px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: var(--surface-2);
  color: var(--text);
  font-size: 12.5px;
}
.search-box .field { padding-left: 40px; }
.field::placeholder { color: var(--text-3); }
.field:focus, .select:focus { border-color: var(--primary); background: var(--surface); }
.bank-meta { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin: 18px 2px 10px; color: var(--text-3); font-size: 11.5px; }
.question-list { display: grid; gap: 9px; }
.question-row { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 15px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); cursor: pointer; transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition); }
.question-row:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--primary) 35%, var(--border)); box-shadow: var(--shadow-sm); }
.question-index { width: 48px; height: 42px; display: grid; place-items: center; border-radius: 11px; color: var(--primary); background: var(--primary-weak); font-size: 11px; font-weight: 850; }
.question-row-copy { min-width: 0; }
.question-row-copy strong { display: block; font-size: 12.5px; line-height: 1.45; }
.question-row-copy span { display: block; margin-top: 4px; color: var(--text-3); font-size: 10.5px; }
.status-pill { display: inline-flex; align-items: center; gap: 5px; padding: 5px 8px; border-radius: 999px; font-size: 9.5px; font-weight: 800; white-space: nowrap; }
.status-pill.new { color: var(--text-3); background: var(--surface-2); }
.status-pill.learning { color: var(--warning); background: var(--warning-weak); }
.status-pill.mastered { color: var(--success); background: var(--success-weak); }
.status-pill.review { color: var(--danger); background: var(--danger-weak); }
.pagination { display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 18px; }
.pagination button { min-width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text-2); font-size: 11px; font-weight: 750; cursor: pointer; }
.pagination button.active { color: #fff; border-color: var(--primary); background: var(--primary); }
.pagination button:disabled { opacity: .4; cursor: default; }

/* Settings */
.settings-grid { display: grid; gap: 16px; }
.settings-card { padding: 21px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }
.settings-card h3 { margin: 0; font-size: 14px; }
.settings-card > p { margin: 5px 0 17px; color: var(--text-3); font-size: 11.5px; }
.theme-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.theme-option { padding: 13px; border: 1.5px solid var(--border); border-radius: 13px; background: var(--surface); cursor: pointer; }
.theme-option.active { border-color: var(--primary); background: var(--primary-weak); }
.theme-preview { height: 62px; overflow: hidden; padding: 9px; border-radius: 9px; background: #f4f5f9; border: 1px solid #e3e5ee; }
.theme-option.dark .theme-preview { background: #151722; border-color: #2a2e3d; }
.theme-preview::before, .theme-preview::after { content: ""; display: block; border-radius: 5px; }
.theme-preview::before { width: 42%; height: 8px; background: #5b5ce2; }
.theme-preview::after { width: 100%; height: 30px; margin-top: 7px; background: #fff; box-shadow: 0 0 0 1px #e3e5ee; }
.theme-option.dark .theme-preview::after { background: #202330; box-shadow: 0 0 0 1px #303445; }
.theme-option strong { display: block; margin-top: 8px; font-size: 11.5px; }
.data-actions { display: flex; flex-wrap: wrap; gap: 9px; }
.source-note { padding: 15px; border-radius: 13px; background: var(--surface-2); color: var(--text-2); font-size: 11.5px; line-height: 1.6; }

/* Modal & toast */
.modal-root:empty { display: none; }
.modal-root { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px; background: rgba(12,14,27,.52); backdrop-filter: blur(5px); }
.modal { width: min(100%, 650px); max-height: min(88vh, 760px); overflow: auto; border: 1px solid var(--border); border-radius: 20px; background: var(--surface); box-shadow: 0 28px 70px rgba(0,0,0,.25); animation: modalIn .2s ease; }
@keyframes modalIn { from { opacity: 0; transform: scale(.97) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.modal-header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
.modal-header h3 { margin: 0; font-size: 15px; }
.modal-body { padding: 20px; }
.modal-question { margin: 0 0 18px; font-size: 17px; line-height: 1.5; }
.modal-options { display: grid; gap: 8px; }
.modal-option { display: grid; grid-template-columns: 31px 1fr; gap: 10px; padding: 11px; border: 1px solid var(--border); border-radius: 11px; font-size: 12px; }
.modal-option.correct { border-color: var(--success); background: var(--success-weak); }
.modal-option b { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 8px; background: var(--surface-2); }
.modal-option.correct b { color: #fff; background: var(--success); }
.modal-footer { display: flex; justify-content: flex-end; gap: 9px; padding: 0 20px 20px; }
.toast-region { position: fixed; right: 22px; bottom: 22px; z-index: 120; display: grid; gap: 9px; }
.toast { min-width: 260px; max-width: 360px; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 13px; background: var(--surface); box-shadow: var(--shadow-md); font-size: 11.5px; animation: toastIn .24s ease; }
.toast.success { border-color: color-mix(in srgb, var(--success) 25%, var(--border)); }
.toast.error { border-color: color-mix(in srgb, var(--danger) 25%, var(--border)); }
.toast-icon { width: 24px; height: 24px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 8px; color: #fff; background: var(--primary); font-weight: 900; }
.toast.success .toast-icon { background: var(--success); }
.toast.error .toast-icon { background: var(--danger); }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 1100px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .chapter-grid { grid-template-columns: repeat(2, 1fr); }
  .mode-grid { grid-template-columns: 1fr; }
  .setup-layout { grid-template-columns: minmax(0, 1fr) 280px; }
}

@media (max-width: 820px) {
  :root { --mobile-header: 66px; --mobile-nav: 70px; }
  .sidebar { display: none; }
  .mobile-header {
    position: fixed;
    inset: 0 0 auto;
    z-index: 40;
    height: var(--mobile-header);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface) 90%, transparent);
    backdrop-filter: blur(14px);
  }
  .mobile-header .brand-mark { width: 34px; height: 34px; }
  .mobile-header .brand-mark svg { width: 23px; height: 23px; }
  .main-content { margin-left: 0; padding: calc(var(--mobile-header) + 22px) 16px calc(var(--mobile-nav) + 28px); }
  .mobile-nav {
    position: fixed;
    inset: auto 0 0;
    z-index: 50;
    height: var(--mobile-nav);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface) 94%, transparent);
    backdrop-filter: blur(14px);
  }
  .mobile-nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; background: transparent; color: var(--text-3); font-size: 9.5px; font-weight: 700; }
  .mobile-nav-item svg { width: 20px; height: 20px; fill: currentColor; }
  .mobile-nav-item.active { color: var(--primary); }
  .hero { grid-template-columns: 1fr; padding: 28px; }
  .hero-visual { display: none; }
  .two-column, .setup-layout { grid-template-columns: 1fr; }
  .setup-summary { position: static; }
  .review-actions-grid { grid-template-columns: 1fr; }
  .filter-bar { grid-template-columns: 1fr 1fr; }
  .filter-bar .search-box { grid-column: 1 / -1; }
  .result-hero { grid-template-columns: 1fr; text-align: center; }
  .result-actions { justify-content: center; }
}

@media (max-width: 580px) {
  .main-content { padding-left: 12px; padding-right: 12px; }
  .page-header { align-items: flex-start; }
  .header-actions .button span.optional { display: none; }
  .hero { min-height: 0; padding: 24px 21px; border-radius: 20px; }
  .hero h1 { font-size: 28px; }
  .hero p { font-size: 12.5px; }
  .hero-actions .button { flex: 1; }
  .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-card { padding: 14px 12px; gap: 10px; }
  .stat-icon { width: 37px; height: 37px; border-radius: 11px; }
  .stat-value { font-size: 18px; }
  .stat-label { font-size: 10px; }
  .chapter-grid { grid-template-columns: 1fr; }
  .chapter-card { min-height: 178px; }
  .chapter-select-grid { grid-template-columns: 1fr; }
  .setup-section { padding: 18px 15px; }
  .setup-summary { padding: 18px 15px; }
  .session-card { padding: 19px 14px; border-radius: 18px; }
  .session-topbar { gap: 8px; }
  .session-tools .icon-button:first-child { display: none; }
  .question-title { font-size: 19px; }
  .option-button { grid-template-columns: 34px 1fr auto; gap: 10px; min-height: 58px; padding: 10px; }
  .option-letter { width: 32px; height: 32px; }
  .option-text { font-size: 12.5px; }
  .keyboard-hint { display: none; }
  .side-nav {
    top: auto;
    bottom: calc(var(--mobile-nav) + 12px);
    width: 64px;
    height: 64px;
    min-width: 64px;
    min-height: 64px;
    border-radius: 50%;
    font-size: 31px;
    transform: none;
  }
  .side-nav.prev { left: 14px; }
  .side-nav.next { right: 14px; }
  .flash-actions.rate { grid-template-columns: 1fr 1fr; }
  .flashcard { min-height: 480px; }
  .flashcard { padding: 23px 18px; }
  .flash-options .option-button { min-height: 50px; padding: 8px 10px; }
  .flash-nav .keyboard-hint { display: none; }
  .result-hero { padding: 21px 15px; }
  .result-mini-stats { grid-template-columns: 1fr 1fr; }
  .result-mini-stats .result-mini:last-child { grid-column: 1 / -1; }
  .review-hero { grid-template-columns: 1fr; }

  <script>window.QUIZ_DATA = [{"number":1,"question":"Trong thử nghiệm vi thăng hoa của anthranoid, tinh thể bám trên lam kính ở dạng","options":["Anthraglycosid","Anthraquinon","Anthron","Dihydroanthranol"],"answer":"B","explanation":"Khi đun vi thăng hoa, phần aglycon anthraquinon dễ bay hơi và kết tinh lại trên lam kính; dạng glycosid không thăng hoa trực tiếp.","keywords":"vi thăng hoa anthranoid anthraquinon","chapter":1},{"number":2,"question":"Phương pháp có thể dùng định tính saponin, TRỪ","options":["TLC với chất chuẩn","HPLC đầu dò UV-Vis","Phổ IR","Thử nghiệm chỉ số bọt, chỉ số phá huyết"],"answer":"B","explanation":"Nhiều saponin không có nhóm hấp thụ UV mạnh, nên HPLC-UV/Vis thường không phải lựa chọn định tính trực tiếp tối ưu nếu không có dẫn xuất hoặc bước sóng phù hợp.","keywords":"saponin ít hấp thụ UV không ưu tiên HPLC-UV","chapter":1},{"number":3,"question":"Tính chất nào không được dùng để định tính các saponin","options":["Kích ứng","Độc với cá","Kết tủa với cholesterol","Phá huyết"],"answer":"A","explanation":"Định tính saponin thường dựa vào tạo bọt, phá huyết, độc với cá hoặc tạo phức/kết tủa với cholesterol; kích ứng không phải phép thử định tính chuẩn.","keywords":"saponin: bọt - phá huyết - độc cá - cholesterol","chapter":1},{"number":4,"question":"Tính chất nào không được dùng để định tính các saponin","options":["Kích ứng","Độc với cá","Kết tủa với cholesterol","Phá huyết"],"answer":"C","explanation":"Đáp án tô trong tài liệu gốc là C. Tuy nhiên câu này trùng Câu 3 nhưng đáp án lại khác; về lý thuyết, kết tủa với cholesterol vẫn là tính chất có thể dùng nhận biết saponin. Cần ưu tiên xác nhận với giảng viên.","keywords":"câu trùng nhưng đáp án gốc mâu thuẫn","chapter":1},{"number":5,"question":"Cơ chế của thuốc thử hiện màu H2SO4 10%/EtOH","options":["Oxy hóa và loại nước tạo các nhóm mang màu","Tạo muối sulfat mang màu","Hydrat hóa các vòng thơm","Gắn nhóm mang màu vào vòng thơm để tăng màu"],"answer":"C","explanation":"Tài liệu gốc tô C. Tuy nhiên mô tả cơ chế thông dụng của H2SO4 khi hiện màu thường liên quan đến proton hóa, khử nước và tạo sản phẩm liên hợp có màu hơn là hydrat hóa vòng thơm. Đây là câu cần đối chiếu lại.","keywords":"đáp án gốc C; cơ chế thường: acid hóa/khử nước","chapter":1},{"number":6,"question":"Giả sử dược liệu chứa saponin và sapogenin. Nếu thay cồn 70% bằng CHCl3 thì hiện tượng định tính","options":["Tạo bọt: âm; Liebermann: dương","Tạo bọt: dương; Liebermann: âm","Tạo bọt: âm; Liebermann: âm","Tạo bọt: dương; Liebermann: dương"],"answer":"C","explanation":"Đáp án gốc tô C. Về nguyên tắc, CHCl3 ưu tiên hòa tan sapogenin hơn saponin nên thử bọt thường âm; phản ứng Liebermann-Burchard có thể dương nếu sapogenin steroid/triterpen được chiết. Vì vậy câu này có khả năng cần kiểm tra lại.","keywords":"CHCl3: bọt âm; Liebermann có thể dương","chapter":1},{"number":7,"question":"Nhóm dược liệu cùng có saponin. Chọn câu SAI","options":["Tam thất, Cát cánh","Cam thảo, Tỳ giải","Mạch môn, Ngũ gia bì","Ngũ gia bì, Đại hoàng"],"answer":"D","explanation":"Đại hoàng nổi bật với anthranoid, không xếp điển hình vào nhóm dược liệu chứa saponin như Ngũ gia bì.","keywords":"Đại hoàng anthranoid, không phải nhóm saponin","chapter":1},{"number":8,"question":"Hiện tượng đường bờ xảy ra do","options":["Chấm mẫu quá tải","Bình sắc ký chưa bão hòa","Mẫu chấm quá sát rìa bản mỏng làm vết gần bờ di chuyển chậm hơn","Mẫu quá phân cực"],"answer":"C","explanation":"Khi chấm quá sát rìa, sự bay hơi và dòng dung môi ở mép bản không đồng đều làm vết gần bờ chạy khác với vùng giữa.","keywords":"đường bờ chấm quá sát mép bản","chapter":1},{"number":9,"question":"Nguyên nhân mẫu không di chuyển khi khai triển sắc ký","options":["Mẫu bị lẫn nước","Pha động quá phân cực","Mẫu quá kém phân cực","Tất cả đúng"],"answer":"A","explanation":"Nước làm mẫu bám mạnh và tạo vùng ẩm trên silica, khiến vết khó được pha động kéo đi hoặc bị dồn tại điểm chấm.","keywords":"mẫu không chạy kiểm tra nước","chapter":1},{"number":10,"question":"Bước sóng thường dùng để phát hiện các chất có vòng thơm","options":["345 nm","254 nm","365 nm","245 nm"],"answer":"B","explanation":"Nhiều hợp chất có hệ liên hợp hoặc vòng thơm hấp thụ ở vùng UV 254 nm nên tạo vết tối trên bản F254.","keywords":"vòng thơm UV 254 nm","chapter":1},{"number":11,"question":"Chọn câu SAI về thuốc thử VS","options":["Thuốc thử kém bền nên pha ngay trước khi dùng","Ngâm bản mỏng vào thuốc thử khoảng 1 phút cho ngấm đều","Cần đợi bản mỏng khô sau khi nhúng VS mới nung","Cơ chế sử dụng thuốc thử VS là oxy hóa - khử và loại nước để tạo nhóm mang màu"],"answer":"B","explanation":"Không nên ngâm bản quá lâu trong thuốc thử vì dễ làm loang vết; thường nhúng nhanh hoặc phun đều rồi để khô trước khi gia nhiệt.","keywords":"VS nhúng nhanh/phun đều, không ngâm lâu","chapter":1},{"number":12,"question":"Hợp chất nào sau đây có tính vi thăng hoa","options":["Saponin","Flavonoid","Coumarin","Tanin"],"answer":"C","explanation":"Coumarin có phân tử tương đối nhỏ, dễ bay hơi và có thể thăng hoa; đây cũng là một tính chất hỗ trợ định tính.","keywords":"coumarin thơm, huỳnh quang, thăng hoa","chapter":1},{"number":13,"question":"Sau khi chiết dược liệu bằng cồn 96%, ống 1 cho NaOH 10% và đun cách thủy, ống 2 thêm nước. Chọn phát biểu đúng","options":["Ống 1 đục hơn ống 2 có coumarin","Ống 1 trong hơn ống 2 có coumarin","Hai ống đục như nhau có coumarin","Hai ống trong như nhau có coumarin"],"answer":"B","explanation":"Trong môi trường kiềm, vòng lacton của coumarin mở tạo dạng muối tan tốt hơn nên ống có NaOH trở nên trong hơn ống chỉ thêm nước.","keywords":"coumarin + kiềm mở lacton, tăng độ tan","chapter":1},{"number":14,"question":"Phương pháp có thể dùng định tính saponin, TRỪ","options":["TLC với chất chuẩn","HPLC đầu dò UV-Vis","Phổ IR","Thử nghiệm chỉ số bọt, chỉ số phá huyết"],"answer":"B","explanation":"Saponin thường hấp thụ UV yếu, vì vậy HPLC với đầu dò UV-Vis không phải phương pháp định tính trực tiếp thuận lợi bằng TLC, IR hoặc các thử nghiệm đặc trưng.","keywords":"saponin ít chromophore UV yếu","chapter":1},{"number":15,"question":"Lưu ý về pha động CHCl3 - MeOH - H2O (65:35:10)","options":["Là hệ không hỗn hòa nên ổn định tối đa 30 phút trước khi sử dụng","Chỉ lấy lớp dưới để làm pha động","Thời gian khai triển nhanh do có nước làm giảm độ nhớt","Tất cả đúng"],"answer":"D","explanation":"Đáp án gốc tô D. Tuy nhiên các mệnh đề có dấu hiệu chưa thống nhất: hệ này thường phải để phân lớp ổn định rồi lấy lớp thích hợp, còn nước không làm giảm độ nhớt theo cách mô tả. Nên kiểm tra lại hướng dẫn thực hành của giảng viên.","keywords":"hệ CHCl3-MeOH-H2O: để phân lớp, thường lấy lớp dưới","chapter":1},{"number":16,"question":"Lưu ý khi chấm mẫu trên bản mỏng. Chọn câu SAI","options":["Không nên chấm ngắt quãng vì sẽ gây tách lớp","Đèn UV có thể dùng kiểm tra lượng mẫu đã chấm nếu mẫu có vòng thơm","Rửa sạch mao quản bằng MeOH trước khi chấm mẫu mới","Nên dùng dung môi dễ bay hơi như CHCl3, EtOAc để hòa tan mẫu kém phân cực"],"answer":"A","explanation":"Khi chấm nhiều lần nên chấm ngắt quãng để dung môi bay hơi giữa các lần, giúp vết nhỏ và gọn; chấm liên tục mới dễ gây loang.","keywords":"chấm nhiều lần ngắt quãng, để khô","chapter":1},{"number":17,"question":"Tính chất không phải của coumarin","options":["Có mùi thơm","Tăng huỳnh quang trong môi trường kiềm","Tan tốt trong nước","Thăng hoa"],"answer":"C","explanation":"Coumarin tự do thường kém tan trong nước nhưng tan tốt hơn trong dung môi hữu cơ; nhiều dẫn chất có mùi thơm, huỳnh quang và có thể thăng hoa.","keywords":"coumarin tự do kém tan nước","chapter":1},{"number":18,"question":"Phát biểu SAI về chỉ số bọt","options":["Trong mỗi dược liệu thì khác nhau","Chỉ số bọt càng cao thường lượng saponin càng nhiều","Một số dược liệu có saponin nhưng không tạo bọt rõ","Có thể dùng để bán định lượng, tinh chế saponin"],"answer":"D","explanation":"Chỉ số bọt có thể dùng đánh giá hoặc bán định lượng sơ bộ saponin, nhưng không phải phương pháp tinh chế saponin.","keywords":"chỉ số bọt nhận biết/bán định lượng, không tinh chế","chapter":1},{"number":19,"question":"Trong định tính dược liệu chứa saponin bằng TLC, có thể thay thuốc thử H2SO4 10%/EtOH bằng","options":["FeCl3","UV 254","VS","B và C đúng"],"answer":"D","explanation":"Vanillin-sulfuric là thuốc thử hiện màu phổ biến cho saponin; một số vết có thể được quan sát trước dưới UV 254 nm, nên tài liệu chọn cả B và C.","keywords":"saponin TLC UV254 + VS","chapter":1},{"number":20,"question":"Coumarin có cấu trúc khung nền","options":["C6-C3-C6","C6-C2-C6","C6-C3","(C6-C1)2"],"answer":"C","explanation":"Coumarin là benzo-alpha-pyrone, được sinh tổng hợp từ khung phenylpropanoid C6-C3.","keywords":"coumarin C6-C3","chapter":1},{"number":21,"question":"Chọn phát biểu SAI về coumarin","options":["Có khung cơ bản là benzo-alpha-pyrone","Có ester ngoại phân tử/không mùi","Có vòng lacton","Thường kém phân cực"],"answer":"B","explanation":"Coumarin có vòng lacton nội phân tử và nhiều chất có mùi thơm đặc trưng; mô tả 'ester ngoại phân tử/không mùi' là sai.","keywords":"coumarin lacton nội phân tử, thường có mùi","chapter":1},{"number":22,"question":"Mục đích chính sử dụng bản mỏng chế hóa","options":["Theo dõi phản ứng","Thử tinh khiết","Phân lập","Kiểm nghiệm dược liệu"],"answer":"C","explanation":"Bản mỏng chế hóa có lớp pha tĩnh dày hơn để nạp lượng mẫu lớn và cạo lấy vùng chứa chất, nên mục đích chính là phân lập.","keywords":"bản mỏng chế hóa phân lập","chapter":1},{"number":23,"question":"Cho thuốc thử hiện vết vanillin-acid sulfuric, chọn câu ĐÚNG","options":["Cho màu nhờ phản ứng tạo phức","Là thuốc thử chọn lọc cho polyphenol","Cho màu đặc trưng riêng với flavonoid","Cho màu sắc đa dạng tùy thuộc hợp chất"],"answer":"D","explanation":"Vanillin-sulfuric là thuốc thử hiện màu khá rộng; sản phẩm màu phụ thuộc cấu trúc từng hợp chất nên có thể cho nhiều màu khác nhau.","keywords":"VS thuốc thử chung, màu đa dạng","chapter":1},{"number":24,"question":"Phát biểu SAI về bình sắc ký","options":["Một số trường hợp đặc biệt không cần bão hòa bình","Nếu bình không được bão hòa dung môi, các vết sẽ tách không hiệu quả","Thời gian khai triển thường nhanh hơn khi bình đã bão hòa dung môi","Có thể bão hòa nhanh bằng giấy lọc"],"answer":"B","explanation":"Đáp án gốc tô B. Tuy nhiên về nguyên tắc, không bão hòa bình thường làm kết quả kém lặp lại và phân tách kém; vì vậy câu này có khả năng đáp án gốc bị lỗi. Cần đối chiếu với giảng viên.","keywords":"bão hòa bình giúp ổn định khai triển","chapter":1},{"number":25,"question":"Viết lại pha động Ethyl acetat 40 ml; HCOOH 1 ml; Methanol 10 ml","options":["EtOAc-MeOH-HCOOH (4:0,1:1)","EtOAc-MeOH-HCOOH (4:1:0,1)","EtOAc:HCOOH:MeOH (4-0,1-1)","EtOAc:HCOOH:MeOH (4-0,1-1)"],"answer":"B","explanation":"Chia các thể tích cho 10 được tỉ lệ 4:1:0,1 và viết theo thứ tự EtOAc - MeOH - HCOOH.","keywords":"40:10:1 4:1:0,1","chapter":1},{"number":26,"question":"Hiện tượng dồn vết là do","options":["Dung môi chưa bão hòa","Pha động quá kém phân cực","Dung môi hòa tan mẫu lẫn tạp kim loại","Pha động quá phân cực"],"answer":"C","explanation":"Tạp kim loại hoặc ion trong dung môi mẫu có thể tương tác mạnh với silica và làm chất bị giữ, co cụm hoặc dồn vết.","keywords":"dồn vết dung môi mẫu lẫn tạp kim loại","chapter":1},{"number":27,"question":"Phát biểu SAI về pha động trong sắc ký lớp mỏng","options":["Muốn tăng Rf phải tăng độ phân cực pha động","Rf quá thấp cho thấy mẫu bị giữ mạnh so với pha động","Pha động càng phân cực thì khả năng phân tách càng tốt","Có hệ pha động hỗn hòa và không hỗn hòa"],"answer":"C","explanation":"Không phải pha động càng phân cực càng tốt; độ phân cực phải phù hợp để các vết có Rf và độ phân giải tối ưu.","keywords":"pha động phù hợp, không phải càng phân cực càng tốt","chapter":1},{"number":28,"question":"Phát biểu SAI về bình sắc ký","options":["Một số trường hợp đặc biệt không cần bão hòa bình","Nếu bình không được bão hòa dung môi, các vết sẽ tách không hiệu quả","Thời gian khai triển nhanh hơn khi bình được bão hòa dung môi","Có thể bão hòa nhanh bằng giấy lọc"],"answer":"B","explanation":"Đáp án gốc tô B, dù nội dung B thường được xem là đúng trong thực hành TLC. Đây là câu lặp lại Câu 24 và cần xác nhận lại đáp án với giảng viên.","keywords":"câu lặp; đáp án gốc có dấu hiệu sai","chapter":1},{"number":29,"question":"Viết lại pha động Ethyl acetat 40 ml; HCOOH 1 ml; Methanol 10 ml","options":["EtOAc-MeOH-HCOOH (4:0,1:1)","EtOAc-MeOH-HCOOH (4:1:0,1)","EtOAc:HCOOH:MeOH (4-0,1-1)","EtOAc:HCOOH:MeOH (4-0,1-1)"],"answer":"B","explanation":"Tỉ lệ rút gọn của 40:10:1 là 4:1:0,1; tên dung môi được viết theo đúng thứ tự tương ứng.","keywords":"EtOAc:MeOH:HCOOH = 4:1:0,1","chapter":1},{"number":30,"question":"Hiện tượng dồn vết là do","options":["Dung môi chưa bão hòa","Pha động quá kém phân cực","Dung môi hòa tan mẫu lẫn tạp kim loại","Pha động quá phân cực"],"answer":"C","explanation":"Tạp kim loại trong dung môi có thể làm tăng tương tác với pha tĩnh và khiến vết co cụm, dồn tại một vùng.","keywords":"dồn vết tạp kim loại","chapter":1},{"number":31,"question":"Phát biểu SAI về pha động trong sắc ký lớp mỏng","options":["Muốn tăng Rf phải tăng độ phân cực pha động","Rf quá thấp cho thấy mẫu bị giữ mạnh so với pha động","Pha động càng phân cực thì khả năng phân tách càng tốt","Có hệ pha động hỗn hòa và không hỗn hòa"],"answer":"C","explanation":"Độ phân cực quá cao có thể làm các vết chạy sát mặt dung môi và giảm phân giải; cần chọn độ phân cực vừa đủ.","keywords":"không có nguyên tắc 'càng phân cực càng tốt'","chapter":1},{"number":32,"question":"Cho mẫu thử có chứa saponin, chọn pha động phân tách thích hợp","options":["CHCl3-aceton (9:1)","n-Hexan-CHCl3 (9:1)","n-Hexan-EtOAc-MeOH (8:1:1)","CHCl3-MeOH-H2O (8:1:1)"],"answer":"D","explanation":"Saponin phân cực nên cần hệ pha động có thành phần phân cực mạnh như MeOH và nước; hệ CHCl3-MeOH-H2O phù hợp hơn các hệ quá kém phân cực.","keywords":"saponin phân cực CHCl3-MeOH-H2O","chapter":1},{"number":33,"question":"Dung môi thích hợp để hòa tan chất kém phân cực trước khi chấm sắc ký","options":["n-Butanol","Aceton","MeOH","DCM"],"answer":"D","explanation":"Dichloromethane hòa tan tốt nhiều chất kém phân cực và bay hơi tương đối nhanh, giúp tạo vết chấm gọn.","keywords":"mẫu kém phân cực DCM","chapter":1},{"number":34,"question":"Phát biểu SAI về sắc ký lớp mỏng","options":["Là sắc ký lỏng-rắn","Cơ chế chính là hấp thu","Pha tĩnh thường là silica gel","Có pha thuận và pha đảo"],"answer":"B","explanation":"Cơ chế chính của TLC pha thuận là hấp phụ trên bề mặt chất rắn, không phải hấp thu vào toàn bộ thể tích vật liệu.","keywords":"TLC hấp phụ, không phải hấp thu","chapter":1},{"number":35,"question":"Các vết flavonoid thường cho màu gì với thuốc thử FeCl3","options":["Nâu","Tím","Đỏ","Xanh đen"],"answer":"D","explanation":"Nhóm hydroxyl phenol của flavonoid tạo phức màu với Fe3+, thường biểu hiện xanh đen hoặc xanh sẫm.","keywords":"flavonoid + FeCl3 xanh đen","chapter":1},{"number":36,"question":"Bước sóng UV thông dụng dùng để phát hiện vết trong SKLM","options":["240-350 nm","254-365 nm","240-366 nm","254-350 nm"],"answer":"B","explanation":"Hai bước sóng thông dụng là 254 nm để quan sát vết hấp thụ trên nền F254 và 365 nm để quan sát huỳnh quang.","keywords":"TLC UV 254 và 365 nm","chapter":1},{"number":37,"question":"Pha động nào sau đây không hỗn hòa","options":["EtOAc-MeOH-H2O (100:17:13)","PE-MeOH (9:1)","CHCl3-MeOH-HCOOH (6:3:1)","n-BuOH-MeOH-H2O (5:3:2)"],"answer":"D","explanation":"Theo đáp án gốc, hệ n-butanol-MeOH-H2O ở tỉ lệ này được xem là không hỗn hòa và cần để phân lớp trước khi lấy pha thích hợp.","keywords":"hệ không hỗn hòa để phân lớp","chapter":1},{"number":38,"question":"Dung môi nào được xếp chung nhóm có độ phân cực gần bằng nhau","options":["MeOH, EtOAc","Aceton, Ether","Dichloromethane, Ether","Petrol ether, MeOH"],"answer":"C","explanation":"Dichloromethane và ether đều thuộc nhóm dung môi có độ phân cực thấp đến trung bình và gần nhau hơn các cặp còn lại.","keywords":"DCM ether","chapter":1},{"number":39,"question":"Phát biểu SAI về bình sắc ký","options":["Thời gian khai triển nhanh hơn khi bình được bão hòa","Có thể bão hòa nhanh bằng giấy lọc","Một số trường hợp đặc biệt không cần bão hòa","Nếu bình không được bão hòa, các vết sẽ tách không hiệu quả"],"answer":"D","explanation":"Đáp án gốc tô D. Tuy nhiên D thường được coi là nhận định đúng trong TLC; vì vậy câu này có khả năng lỗi đáp án hoặc diễn đạt. Nên xác nhận với giảng viên.","keywords":"không bão hòa thường làm giảm độ lặp lại/phân tách","chapter":1},{"number":40,"question":"Khi phân tích alkaloid, để gọn vết cần thêm vào pha động","options":["NH4OH","NaOH","HCOOH","CH3COOH"],"answer":"A","explanation":"Alkaloid là base; thêm NH4OH giúp giữ chúng ở dạng base tự do, giảm kéo đuôi do tương tác ion với silica và làm vết gọn hơn.","keywords":"alkaloid thêm NH4OH để gọn vết","chapter":1},{"number":1,"question":"Dung môi hay dùng để rửa sạch mao quản tránh lẫn chéo","options":["MeOH","CHCl3","EtOH 96%","EtOH"],"answer":"A","explanation":"","keywords":"rửa mao quản = MeOH (bay hơi nhanh, hòa tan tốt)","chapter":2},{"number":2,"question":"Dung môi nào sau đây được xếp chung nhóm có độ phân cực gần bằng nhau?","options":["Petrol ether, Meoh","Dichoromethan, Ether","Meoh, EtOAc","Aceton, Ether"],"answer":"B","explanation":"","keywords":"DCM ~ Ether","chapter":2},{"number":3,"question":"Pha động nào sau đây viết sai nguyên tắc:","options":["PE – EtOAc – NH3 đ (8:2:0,1)","N-Hexan – EtOAc (8:2)","MeOH – CHCl3 (8:2)","N-BuOH – AcOH (4:1)"],"answer":"C","explanation":"Nguyên tắc pha động: dung môi kém phân cực đứng trước (lượng nhiều hơn), dung môi phân cực hơn đứng sau (lượng ít) và cần đủ 2 thành phần hợp lý; MeOH-CHCl3 (8:2) không hợp nguyên tắc phối hợp kém pc/pc thường dùng trong bài.","keywords":"nguyên tắc viết pha động: kém pc pc, tỉ lệ giảm dần","chapter":2},{"number":4,"question":"Để kiểm tra độ tinh khiết trên sắc ký lớp mỏng cần:","options":["Thử trên tối thiểu 3 bản mỏng với 3 pha động giống nhau ít nhất 1 thành phần","Chỉ cần sử dụng 1 bản mỏng với 1 pha động phù hợp","Thử trên tối thiểu 3 bản mỏng với 1 pha động thích hợp","Thử trên tối thiểu 3 bản mỏng với 3 pha động khác nhau về độ phân cực"],"answer":"D","explanation":"","keywords":"kiểm tra tinh khiết SKLM = 3 bản, 3 pha động khác độ phân cực","chapter":2},{"number":5,"question":"Các vết flavonoid thường cho màu …… với thuốc thử fecl3","options":["Tím","Xanh đen","Nâu","Đỏ"],"answer":"B","explanation":"","keywords":"Flavonoid + FeCl3 xanh đen","chapter":2},{"number":6,"question":"Các bước phát hiện vết trên sắc ký đồ của SKLM","options":["Quan sát – UV254 – UV 365 - THUỐC THỬ","UV254 – UV365 - thuốc thử - quan sát","UV254 – UV365 – quan sát - thuốc thử","Quan sát - thuốc thử - UV254 – UV365"],"answer":"A","explanation":"","keywords":"thứ tự: quan sát UV254 UV365 thuốc thử","chapter":2},{"number":7,"question":"Dung môi thích hợp để hòa tan các chất kém phân cực để chuẩn bị chấm sắc ký","options":["N-butanol","Aceton","Meoh","DCM"],"answer":"D","explanation":"","keywords":"mẫu kém phân cực DCM","chapter":2},{"number":8,"question":"Phát biểu đúng về giá trị Rf trong TLC pha thuận","options":["Rf càng gần 1,00 càng tốt","Nếu Rf quá thấp thì cần lựa chọn pha động phân cực hơn","Hai vết có cùng Rf, cùng hình dạng và màu sắc trên 2 bản mỏng khác nhau thì giống nhau","B,C đúng"],"answer":"A","explanation":"Thực ra B cũng đúng về nguyên tắc (Rf thấp tăng phân cực pha động), nhưng theo đáp án gốc chọn A là ý chính xác nhất được công nhận trong đề.","keywords":"Rf gần 1 = phân tách tốt (lưu ý B cũng là nguyên tắc đúng)","chapter":2},{"number":9,"question":"Viết lại pha động: ethylacetat (40ml); HCOOH (1ml); methanol (10ml)","options":["Etoac:HCOOH:Meoh(4:0,1:1)","Etoac:Meoh:HCOOH (4:1:0,1)","Etoac:HCOOH:Meoh (4:0,1:1)","Etoac:Meoh:HCOOH (4:0,1:1)"],"answer":"B","explanation":"","keywords":"quy đổi thể tích theo đúng thứ tự tên gọi", options":["N-hexan - etoac - meoh (50:40:10)","Etoac - nhexan - meoh (40:50:10)","N-hexan : etoac : meoh (50-40-10)","Etoac : nhexan : meoh (40-50-10)"],"answer":"A","explanation":"","keywords":"sắp xếp theo % giảm dần và ghi đúng thứ tự tên","chapter":2},{"number":18,"question":"Cơ chế chính của sắc ký lớp mỏng","options":["Phân bố giữa hai pha rắn và lỏng","Phân bố giữa hai pha lỏng và lỏng","Hấp phụ giữa hai pha rắn và lỏng","Hấp phụ giữa hai pha lỏng và lỏng"],"answer":"C","explanation":"","keywords":"SKLM pha thuận = hấp phụ rắn-lỏng","chapter":2},{"number":19,"question":"Đối với mẫu thử là dược liệu chứa saponin, chọn quy trình chuẩn bị mẫu tối ưu","options":["Chiết với cồn 80%, cô còn 2ml","Chiết với cồn 80%, cô chiết dịch tới căn, hòa tan cắn bằng methanol","Chiết với methanol 80%, cô còn 2ml","Chiết với methanol, cô chiết dịch tới cắn, hòa tan cắn bằng methanol"],"answer":"B","explanation":"","keywords":"mẫu saponin tối ưu = cồn 80% cô cắn hòa lại bằng MeOH","chapter":2},{"number":20,"question":"Phát biểu sai về pha động trong SKLM","options":["Gồm 2 loại pha động hỗn hòa và không hỗn hòa","Nếu muốn tăng Rf phải tăng độ phân cực của pha động","Pha động càng phân cực thì khả năng phân tách càng ổn","Rf quá thấp chứng tỏ mẫu quá phân cực so với pha động"],"answer":"A","explanation":"Thực ra A là ý ĐÚNG (pha động có cả hệ hỗn hòa và không hỗn hòa); câu này cần đối chiếu kỹ với giảng viên vì có thể câu \"sai\" thực sự nằm ở C (không phải lúc nào phân cực hơn cũng tốt hơn).","keywords":"xem lại GV nếu lệch – trọng tâm: pha động cần phù hợp mẫu, không phải \"càng phân cực càng tốt\"","chapter":2},{"number":21,"question":"Thuốc thử VS là","options":["Vanilin 10%/ etoh và H2SO4 10%/etoh (1:1, v/v)","Vanilin 1%/ etoh và H2SO4 10%/etoh (1:1, v/v)","Vanilin 1%/ etoh và H2SO4 10%/etoh (1:1, g/g)","Vanilin 10%/ etoh và H2SO4 10%/etoh (1:1, v/v)"],"answer":"B","explanation":"","keywords":"VS = Vanilin 1% + H2SO4 10% (1:1 v/v)","chapter":2},{"number":22,"question":"Hiện tượng dồn vết là do","options":["Dung môi hòa tan mẫu lẫn tạp kim loại","Pha động quá kém phân cực","Dung môi chưa bão hòa","Pha động quá phân cực"],"answer":"A","explanation":"","keywords":"dồn vết = dung môi lẫn tạp kim loại","chapter":2},{"number":23,"question":"Cho các dung môi: acid formic (1), aceton (2), cloroform (3), ethyl acetat (4); sắp xếp theo độ phân cực tăng dần","options":["1<2<3<4","3<4<2<1","3<4<1<2","2<4<3<1"],"answer":"B","explanation":"","keywords":"cloroform < ethyl acetat < aceton < acid formic (tăng dần)","chapter":2},{"number":24,"question":"Chữ F trong silica gel GF254 có nghĩa là","options":["Bản mỏng silica gel có chất kết dính","Bản mỏng silica gel có chất phát huỳnh quang","Bản mỏng silica gel có glycerol","Bản mỏng silica gel có chất chỉ thị màu"],"answer":"B","explanation":"","keywords":"F = chất phát huỳnh quang (254nm)","chapter":2},{"number":25,"question":"Chọn đáp án đúng","options":["Anthranoid dạng kết hợp tan tốt trong dung môi kém phân cực","Anthranoid dạng tự do tan tốt trong dung môi phân cực","Anthranoid dạng tự do, kết hợp đều tan trong nước","Anthranoid dạng tự do tan được trong dung môi kém phân cực"],"answer":"D","explanation":"","keywords":"anthranoid tự do (aglycon) tan dung môi kém phân cực","chapter":2},{"number":26,"question":"Lưu ý về pha động CHCl3 – meoh – H2O (65 : 35 : 10)","options":["Là hệ không hỗn hòa nên ổn định tối thiểu 30 phút trước khi sử dụng","Chỉ lấy lớp trên chứa nước để làm pha động","Thời gian khai triển sắc ký chậm do có CHCl3 nhớt","Tất cả đúng"],"answer":"A","explanation":"","keywords":"chỉ lấy LỚP DƯỚI, ổn định tối thiểu 30 phút","chapter":2},{"number":27,"question":"Tính chất nào không được dùng để định tính các saponin","options":["Kích ứng","Độc với cá","Kết tủa với cholesterol","Phá huyết"],"answer":"A","explanation":"","keywords":"saponin test \"kích ứng\"","chapter":2},{"number":28,"question":"Phát biểu đúng tính chất của sapogenin","options":["Tạo bọt bền khi lắc với nước","Tan được trong CHCl3","Kém tan trong các dung môi kém phân cực như n-Hexan","A,B đúng"],"answer":"B","explanation":"","keywords":"sapogenin (aglycon) tan tốt CHCl3","chapter":2},{"number":29,"question":"Phát biểu sai về thí nghiệm Liebermann-Burchard","options":["Các phytosterol, glycosid tim cũng dương tính với phản ứng này do có khung aglycon là steroid","Môi trường càng khan, vòng nhẫn càng rõ","Là phản ứng giúp sơ bộ phân biệt cấu trúc saponin","Dịch chiết càng đậm, vòng nhẫn càng rõ"],"answer":"D","explanation":"Độ đậm dịch chiết không quyết định độ rõ vòng nhẫn — yếu tố quan trọng là độ khan của môi trường phản ứng, không phải nồng độ dịch chiết.","keywords":"Liebermann-Burchard: môi trường khan quyết định, không phải nồng độ dịch chiết","chapter":2},{"number":30,"question":"Để tránh bị quá tải, cần","options":["Pha loãng mẫu với dung môi phù hợp (thường là meoh, CHCl3)","Dùng đèn UV 254 nm để đánh giá độ đậm nhạt của vết trong một số trường hợp","Giảm số lần chấm","Tất cả đều đúng"],"answer":"D","explanation":"","keywords":"tránh quá tải = pha loãng + giảm số lần chấm + dùng UV254 đánh giá","chapter":2},{"number":31,"question":"Các chất A, B, C có độ phân cực tăng dần khi chạy sắc ký lớp mỏng pha thuận sẽ cho giá trị Rf","options":["C > B","A","C>A","A > B"],"answer":"D","explanation":"Chất càng phân cực (theo thứ tự A<B<C tăng dần) thì trên pha thuận Rf càng THẤP; nên A (ít phân cực nhất) có Rf cao nhất A > B.","keywords":"pha thuận: chất ít phân cực hơn Rf cao hơn","chapter":2},{"number":32,"question":"Cho pha động gồm n-Hexan (5 ml), Ethyl acetat (3 ml), Acid formic (0.1 ml). Chọn phát biểu ĐÚNG","options":["N-Hexan đóng vai trò là tác nhân \"modify\"","Hệ này dùng để phân tích các polyphenol","Hệ được viết; n-Hex : etoac : HCOOH (5:3:0.1)","Đây là hệ dung môi không hỗn hòa"],"answer":"B","explanation":"","keywords":"hệ n-Hex-EtOAc-acid formic dùng cho polyphenol (acid hữu cơ là \"modifier\")","chapter":2},{"number":33,"question":"Lưu ý khi chấm mẫu trên bản mỏng.","options":["Tất cả đều đúng","Nếu mẫu kém phân cực có thể sử dụng CHCl3 để hòa tan mẫu","Nên chấm vạch nếu mẫu đa thành phần để cải thiện độ phân giải","Không nên chấm liên tục vì sẽ làm vết bị loang, không gọn"],"answer":"A","explanation":"","keywords":"lưu ý chấm mẫu: cả 3 ý đều đúng","chapter":2},{"number":34,"question":"Thuốc thử fecl3 không hiện màu xanh đen với","options":["Tanin","Saponin","Coumarin","Flavonoid"],"answer":"D","explanation":"Thực tế FeCl3 CHO xanh đen với flavonoid (OH-phenol); câu này hỏi ngoại lệ – FeCl3 không hiện màu đặc trưng với coumarin/saponin (không có OH-phenol tự do rõ). Đối chiếu kỹ với GV nếu khác đáp án gốc.","keywords":"FeCl3 đặc hiệu nhóm OH-phenol (tanin, flavonoid); coumarin/saponin không phản ứng rõ","chapter":2},{"number":35,"question":"Cho pha động gồm n-Hexan (5 ml), Ethyl acetat (3 ml), Acid formic (0.1 ml). Chọn phát biểu SAI","options":["Hệ được viết; n-Hex : etoac : HCOOH (5-3-0.1)","Hệ này dùng để phân tích các polyphenol","Đây là hệ dung môi hỗn hòa","Acid formic đóng vai trò là tác nhân \"modify\""],"answer":"C","explanation":"Hệ n-Hexan/EtOAc/acid formic khá kém đồng nhất (n-hexan kém phân cực khó hòa tan hoàn toàn với acid formic phân cực) — do đó phát biểu \"đây là hệ hỗn hòa\" là SAI.","keywords":"hệ n-Hex-EtOAc-acid formic không hoàn toàn hỗn hòa","chapter":2},{"number":36,"question":"Thuốc thử chọn lọc, NGOẠI TRỪ","options":["Dragendorff","Vanilin sulfuric","KOH/cồn","Fecl3"],"answer":"B","explanation":"","keywords":"VS là thuốc thử CHUNG, không chọn lọc","chapter":2},{"number":37,"question":"Lưu ý khi chấm mẫu trên bản mỏng. Chọn câu SAI","options":["Không nên dùng meoh để hòa mẫu vì khó bay hơi","Làm khan nước nếu có thao tác làm mẫu bị lẫn nước","Chấm liên tục dễ làm vết bị loang, xấu hoặc bong tróc bản mỏng","Dùng mao quản để vết nhỏ, gọn"],"answer":"A","explanation":"Thực ra A là ĐÚNG (MeOH khó bay hơi, không nên dùng hòa mẫu) — câu này có thể đề đang hỏi câu SAI ở ý khác; xem thêm với GV.","keywords":"MeOH khó bay hơi tránh dùng hòa mẫu chấm SK","chapter":2},{"number":38,"question":"Phân tích chất A bằng sắc ký lớp mỏng với hệ dung môi n-Hex – etoac (7:3) cho Rf = 0.22. Để tăng Rf cần","options":["Tăng tỷ lệ etoac","Thay bằng hệ n-Hex – CHCl3 (5:5)","Tăng tỷ lệ n- Hex","Tất cả đúng"],"answer":"A","explanation":"","keywords":"tăng Rf = tăng tỉ lệ dung môi phân cực hơn (etoac)","chapter":2},{"number":39,"question":"Hai bước sóng hay sử dụng để phát hiện vết trong kỹ thuật TLC","options":["254 nm và 345 nm","245 nm và 365 nm","245 nm và 354 nm","254 nm và 365 nm"],"answer":"D","explanation":"","keywords":"TLC: 254 & 365 nm","chapter":2},{"number":1,"question":"Phát biểu đúng về cách chuẩn bị mẫu là dược liệu trong sắc ký lớp mỏng pha thuận","options":["Rắc đều bột dược liệu lên vạch xuất phát","Chiết dược liệu bằng MeOH, sau đó chấm thành vạch trên bản mỏng","Chiết dược liệu bằng nước, sau đó chấm thành vạch trên bản mỏng","Tất cả đúng"],"answer":"B","explanation":"Phải chiết hoạt chất ra khỏi dược liệu bằng dung môi phù hợp rồi mới chấm. MeOH hòa tan được nhiều nhóm chất và dễ thao tác hơn việc chấm trực tiếp bột.","keywords":"mẫu dược liệu chiết bằng MeOH rồi chấm","chapter":3},{"number":2,"question":"Ứng dụng ít gặp trong sử dụng kỹ thuật sắc ký lớp mỏng","options":["Định tính","Định danh","Kiểm tra độ tinh khiết","Định lượng"],"answer":"D","explanation":"TLC chủ yếu dùng định tính, so sánh/định danh và kiểm tra tinh khiết; định lượng có thể làm nhưng ít phổ biến và độ chính xác thường thấp hơn HPLC.","keywords":"TLC ít dùng để định lượng","chapter":3},{"number":3,"question":"Bước sóng thường dùng để phát hiện các chất có vòng thơm","options":["365 nm","245 nm","254 nm","345 nm"],"answer":"C","explanation":"Nhiều hợp chất có vòng thơm hấp thụ UV ở 254 nm, tạo vết tối trên nền huỳnh quang của bản F254.","keywords":"vòng thơm UV 254 nm","chapter":3},{"number":4,"question":"Hiện tượng hay gặp khi khai triển mẫu là chất kém phân cực","options":["Bị quá tải","Tất cả đúng","Rf thường cao","Vết bị kéo đuôi"],"answer":"C","explanation":"Trong TLC pha thuận, chất kém phân cực tương tác yếu với silica nên đi theo pha động xa hơn và thường có Rf cao.","keywords":"kém phân cực Rf cao","chapter":3},{"number":5,"question":"Phát biểu sai về thí nghiệm Liebermann-Burchard","options":["Dịch chiết càng đậm, vòng nhẫn càng rõ","Môi trường càng khan, vòng nhẫn càng rõ","Là phản ứng giúp sơ bộ phân biệt cấu trúc saponin","Phytosterol và glycosid tim cũng có thể dương tính do có khung steroid"],"answer":"A","explanation":"Độ rõ của vòng màu phụ thuộc quan trọng vào môi trường khan và kỹ thuật tạo lớp; dịch chiết quá đậm không bảo đảm vòng rõ, thậm chí dễ che màu.","keywords":"Liebermann-Burchard môi trường khan","chapter":3},{"number":6,"question":"Phát biểu sai về bình sắc ký","options":["Thời gian khai triển có thể nhanh hơn khi bình được bão hòa dung môi","Có thể bão hòa nhanh khí quyển trong bình bằng giấy lọc","Một số trường hợp đặc biệt không cần bão hòa bình","Nếu bình không bão hòa dung môi, các vết sẽ tách không hiệu quả"],"answer":"D","explanation":"Đáp án nguồn tô D, nhưng về thực hành câu D thường là nhận định đúng: bình không bão hòa làm giảm độ lặp lại và chất lượng phân tách. Câu này cần xác nhận lại với giảng viên.","keywords":"đáp án nguồn D nhưng có dấu hiệu mâu thuẫn","chapter":3},{"number":7,"question":"Pha động nào sau đây không hỗn hòa","options":["EtOAc-MeOH-H2O (100:17:13)","n-BuOH-MeOH-H2O (5:3:2)","PE-MeOH (9:1)","CHCl3-MeOH-HCOOH (6:3:1)"],"answer":"B","explanation":"Theo đáp án nguồn, hệ n-butanol–MeOH–nước ở tỉ lệ này được xem là hệ phân lớp, cần để ổn định rồi lấy pha phù hợp.","keywords":"hệ không hỗn hòa để phân lớp","chapter":3},{"number":8,"question":"Cho Rf của A=0,85; B=0,90; C=0,52; D=0,63. Sắp xếp theo độ phân cực tăng dần","options":["C<D<A<B","A<B<C<D","D<C<B<A","B<A<D<C"],"answer":"D","explanation":"Trong pha thuận, Rf càng cao thì chất càng kém phân cực. Vì vậy tăng dần độ phân cực: B (0,90) < A (0,85) < D (0,63) < C (0,52).","keywords":"pha thuận: Rf cao chất kém phân cực","chapter":3},{"number":9,"question":"Cho Rf của A=0,85; B=0,90; C=0,52; D=0,63. Sắp xếp theo độ phân cực giảm dần","options":["C<D<A<B","A<B<C<D","D<C<B<A","B<A<D<C"],"answer":"A","explanation":"Chất phân cực hơn bị giữ mạnh hơn nên Rf thấp hơn. Do đó giảm dần độ phân cực là C > D > A > B.","keywords":"độ phân cực giảm dần Rf tăng dần","chapter":3},{"number":10,"question":"Quan sát bản mỏng F254 dưới UV365, chọn câu đúng","options":["Các vết phát huỳnh quang trên nền đen","Các vết dưới UV365 không có trên UV254","Các vết hấp thụ UV cho màu đen trên nền xanh lục","Tất cả các chất cho vết dưới UV365"],"answer":"A","explanation":"Ở 365 nm, các chất có khả năng phát huỳnh quang sẽ hiện thành vết sáng trên nền tối.","keywords":"UV365 vết huỳnh quang sáng, nền tối","chapter":3},{"number":11,"question":"Mục đích chính sử dụng bản mỏng chế hóa","options":["Thử tinh khiết","Phân lập","Theo dõi phản ứng","Kiểm nghiệm dược liệu"],"answer":"B","explanation":"Bản mỏng chế hóa có lớp pha tĩnh dày, cho phép nạp nhiều mẫu và cạo lấy vùng chứa chất để phân lập.","keywords":"bản mỏng chế hóa phân lập","chapter":3},{"number":12,"question":"Dung môi nào được xếp chung nhóm có độ phân cực gần bằng nhau","options":["Aceton, ether","Petrol ether, MeOH","Dichloromethane, ether","MeOH, EtOAc"],"answer":"C","explanation":"Dichloromethane và ether đều thuộc nhóm dung môi phân cực thấp đến trung bình và gần nhau hơn các cặp còn lại.","keywords":"DCM ether","chapter":3},{"number":13,"question":"Cách khắc phục khi dùng CHCl3-MeOH (8:2) cho Rf=0,90","options":["Tăng MeOH","Giảm CHCl3","Tất cả sai","Tăng CHCl3"],"answer":"D","explanation":"Rf quá cao nghĩa là pha động đang kéo chất quá mạnh. Tăng CHCl3 làm giảm độ phân cực của pha động và hạ Rf.","keywords":"Rf cao tăng dung môi kém phân cực","chapter":3},{"number":14,"question":"Cho mẫu thử chứa saponin, chọn pha động phân tách thích hợp","options":["CHCl3-MeOH-H2O (8:1:1)","n-Hexan-EtOAc-MeOH (8:1:1)","n-Hexan-CHCl3 (9:1)","CHCl3-aceton (9:1)"],"answer":"A","explanation":"Saponin khá phân cực nên cần hệ có MeOH và nước; hệ CHCl3-MeOH-H2O phù hợp hơn các hệ quá kém phân cực.","keywords":"saponin CHCl3-MeOH-H2O","chapter":3},{"number":15,"question":"Đối với dược liệu chứa saponin, chọn quy trình chuẩn bị mẫu tối ưu","options":["Chiết cồn 80%, cô còn 2 ml","Chiết MeOH, cô đến cắn rồi hòa cắn bằng MeOH","Chiết MeOH 80%, cô còn 2 ml","Chiết cồn 80%, cô đến cắn rồi hòa cắn bằng MeOH"],"answer":"D","explanation":"Cồn 80% chiết tốt saponin; cô đến cắn giúp loại dung môi và tăng độ tập trung, sau đó hòa lại bằng MeOH để chấm sắc ký.","keywords":"saponin: cồn 80% cô cắn MeOH","chapter":3},{"number":16,"question":"Chữ F trong silica gel GF254 có nghĩa là","options":["Có chất kết dính","Có chất chỉ thị màu","Có glycerol","Có chất phát huỳnh quang"],"answer":"D","explanation":"F là fluorescent indicator, tức chất chỉ thị huỳnh quang giúp quan sát vết ở 254 nm.","keywords":"F254 chất phát huỳnh quang","chapter":3},{"number":17,"question":"Phát biểu đúng về giá trị Rf trong TLC pha thuận","options":["Rf càng gần 1,00 càng tốt","Hai vết cùng Rf, hình dạng và màu trên hai bản khác nhau thì giống nhau","Nếu Rf quá thấp thì cần chọn pha động phân cực hơn","B và C đúng"],"answer":"A","explanation":"Đáp án nguồn chọn A. Tuy nhiên về thực hành, Rf quá sát 1 thường không tối ưu phân tách; còn C là nguyên tắc điều chỉnh đúng. Câu này nên học theo đáp án nguồn nhưng cần lưu ý.","keywords":"nguồn chọn A; thực hành thường ưu tiên Rf trung bình","chapter":3},{"number":18,"question":"Cho acid formic (1), aceton (2), chloroform (3), ethyl acetat (4). Sắp xếp độ phân cực tăng dần","options":["3<4<1<2","1<2<3<4","3<4<2<1","2<4<3<1"],"answer":"C","explanation":"Trong các dung môi này, chloroform kém phân cực nhất, tiếp đến EtOAc, aceton và acid formic phân cực nhất.","keywords":"CHCl3 < EtOAc < aceton < HCOOH","chapter":3},{"number":19,"question":"Dung môi hay dùng để r
