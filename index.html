ons":["Không tan trong nước","Bền với acid","Tan tốt trong nước, vị ngọt, bị thủy phân bởi acid hoặc enzym","Chỉ tồn tại mạch thẳng"],"answer":"C","explanation":"Oligosaccharid thường tan trong nước, có vị ngọt, có thể mạch thẳng hoặc nhánh và bị thủy phân bởi acid/enzym.","keywords":"oligo tan nước, ngọt, thủy phân"},{"chapter":15,"number":22,"question":"Lactose trong bào chế có ưu điểm","options":["Rất hút ẩm","Có tính acid mạnh","Vị dễ chịu, trung tính, ít hút ẩm","Không phối hợp được với hầu hết dược chất"],"answer":"C","explanation":"Slide mô tả lactose dễ tan, vị dễ chịu, trung tính, ít hút ẩm và phối hợp được với nhiều dược chất.","keywords":"lactose tá dược độn, ít hút ẩm"},{"chapter":15,"number":23,"question":"Lactose cần lưu ý không phối hợp với thuốc có","options":["Chức amin","Chức ester","Nhóm hydroxyl","Nhân thơm"],"answer":"A","explanation":"Slide ghi ngoại lệ với dược chất có chức amin, liên quan nguy cơ phản ứng Maillard.","keywords":"lactose + amin cần tránh"},{"chapter":15,"number":24,"question":"Maltose được dùng làm","options":["Tá dược dập thẳng cho viên nén","Chất bao tan trong ruột","Thuốc giảm béo","Môi trường cấy vi sinh"],"answer":"A","explanation":"Maltose được dùng làm tá dược dập thẳng trong viên nén nhai hoặc không nhai.","keywords":"maltose tá dược dập thẳng"},{"chapter":15,"number":25,"question":"Homopolysaccharid gồm","options":["Tinh bột, cellulose, inulin","Gôm, pectin, chất nhầy","Lactose, maltose, sucrose","Heparin, chondroitin, hyaluronan"],"answer":"A","explanation":"Homopolysaccharid được cấu tạo từ một loại monosaccharid; slide nêu tinh bột, cellulose và inulin.","keywords":"homo tinh bột, cellulose, inulin"},{"chapter":15,"number":26,"question":"Heteropolysaccharid gồm","options":["Tinh bột, cellulose, inulin","Gôm, pectin, chất nhầy","Glucose, fructose, rhamnose","Maltose, lactose, cellobiose"],"answer":"B","explanation":"Heteropolysaccharid chứa nhiều loại đơn vị đường; các ví dụ chính trong slide là gôm, pectin và chất nhầy.","keywords":"hetero gôm, pectin, chất nhầy"},{"chapter":15,"number":27,"question":"Tinh bột là","options":["Sản phẩm quang hợp dự trữ của cây xanh","Thành phần chính của thành tế bào động vật","Heteropolysaccharid chứa acid uronic","Disaccharid"],"answer":"A","explanation":"Tinh bột là sản phẩm quang hợp được dự trữ trong hạt, củ, rễ, quả, thân và lá.","keywords":"tinh bột chất dự trữ thực vật"},{"chapter":15,"number":28,"question":"Tính chất đúng của tinh bột là","options":["Tan tốt trong nước lạnh","Không trương nở","Hồ hóa trong nước nóng","Không tạo gel"],"answer":"C","explanation":"Tinh bột không tan trong nước lạnh nhưng trương nở và hồ hóa trong nước nóng, có khả năng tạo gel, màng và sợi.","keywords":"tinh bột + nước nóng hồ hóa"},{"chapter":15,"number":29,"question":"Amylose có cấu trúc","options":["Mạch thẳng alpha-D-glucose, liên kết alpha-1,4","Mạch nhánh beta-D-glucose","Mạch thẳng beta-1,4","Mạch nhánh alpha-1,4 và beta-1,6"],"answer":"A","explanation":"Amylose là mạch thẳng gồm alpha-D-glucose nối alpha-1,4.","keywords":"amylose mạch thẳng alpha-1,4"},{"chapter":15,"number":30,"question":"Amylopectin có cấu trúc","options":["Mạch thẳng alpha-1,4","Mạch nhánh với alpha-1,4 và alpha-1,6","Mạch thẳng beta-1,4","Mạch nhánh beta-1,3"],"answer":"B","explanation":"Amylopectin có mạch chính alpha-1,4 và điểm nhánh alpha-1,6.","keywords":"amylopectin alpha-1,4 + nhánh alpha-1,6"},{"chapter":15,"number":31,"question":"Amylose tác dụng iod cho màu","options":["Đỏ nâu","Tím đỏ","Xanh đậm","Không màu"],"answer":"C","explanation":"Phức amylose-iod cho màu xanh đậm.","keywords":"amylose + I2 xanh đậm"},{"chapter":15,"number":32,"question":"Amylopectin tác dụng iod cho màu","options":["Xanh đậm","Tím đỏ","Vàng","Không màu"],"answer":"B","explanation":"Amylopectin tạo màu tím đỏ với iod.","keywords":"amylopectin + I2 tím đỏ"},{"chapter":15,"number":33,"question":"Tinh bột toàn phần tác dụng iod cho màu","options":["Xanh tím","Đỏ cam","Xanh lục","Không màu"],"answer":"A","explanation":"Hỗn hợp amylose và amylopectin trong tinh bột cho màu xanh tím.","keywords":"tinh bột + iod xanh tím"},{"chapter":15,"number":34,"question":"Trong quá trình thủy phân acid tinh bột, màu với iod biến đổi theo xu hướng","options":["Xanh tím đỏ đỏ nâu không màu","Đỏ xanh vàng","Không màu xanh đậm","Tím đen xanh"],"answer":"A","explanation":"Khi mạch tinh bột bị cắt ngắn, màu với iod chuyển từ xanh sang tím đỏ, đỏ nâu rồi mất màu.","keywords":"thủy phân tinh bột màu nhạt dần"},{"chapter":15,"number":35,"question":"Alpha-amylase cắt liên kết","options":["Ngẫu nhiên liên kết alpha-1,4","Từ đầu mạch và dừng ở nhánh","Liên kết beta-1,4","Chỉ liên kết alpha-1,6"],"answer":"A","explanation":"Alpha-amylase cắt ngẫu nhiên các liên kết alpha-1,4 trong mạch.","keywords":"alpha-amylase cắt ngẫu nhiên alpha-1,4"},{"chapter":15,"number":36,"question":"Beta-amylase có đặc điểm","options":["Cắt ngẫu nhiên toàn mạch","Cắt xen kẽ từ đầu mạch, gặp nhánh thì dừng","Cắt liên kết alpha-1,6","Bền đến 100°C"],"answer":"B","explanation":"Beta-amylase cắt tuần tự liên kết alpha-1,4 từ đầu không khử và dừng khi gặp điểm nhánh.","keywords":"beta-amylase từ đầu mạch, gặp nhánh dừng"},{"chapter":15,"number":37,"question":"Phương pháp phân biệt các loại tinh bột trong dược liệu là","options":["Đo pH","Phương pháp vi học","Phản ứng Borntrager","Sắc ký khí"],"answer":"B","explanation":"Slide nêu phân biệt dựa vào hình dạng, kích thước, tễ và vân tăng trưởng dưới kính hiển vi.","keywords":"tinh bột vi học"},{"chapter":15,"number":38,"question":"Tinh bột khoai tây có đặc điểm","options":["Hình đa giác, 2-12 µm","Hình trứng, vân đồng tâm rõ, 50-100 µm","Hình dĩa, 6-7 µm","Hình cầu, 3-30 µm"],"answer":"B","explanation":"Tinh bột khoai tây có hạt hình trứng, vân đồng tâm rõ và kích thước lớn 50-100 µm.","keywords":"khoai tây hình trứng, vân rõ"},{"chapter":15,"number":39,"question":"Tinh bột gạo có đặc điểm","options":["Hình đa giác, kích thước 2-12 µm","Hình trứng 50-100 µm","Hình cầu bị lẹm","Hình thấu kính 30 µm"],"answer":"A","explanation":"Tinh bột gạo thường là hạt đa giác nhỏ, 2-12 µm, tễ là chấm nhỏ và vân tăng trưởng không rõ.","keywords":"gạo đa giác nhỏ"},{"chapter":15,"number":40,"question":"Cellulose là","options":["Thành phần chính của thành tế bào thực vật","Chất dự trữ chính trong gan","Disaccharid","Pectin hòa tan"],"answer":"A","explanation":"Cellulose là thành phần cấu trúc chính của thành tế bào thực vật.","keywords":"cellulose thành tế bào thực vật"},{"chapter":15,"number":41,"question":"Cellulose tan trong","options":["Nước lạnh","Ethanol 96%","Dung dịch Schweitzer","Chloroform"],"answer":"C","explanation":"Cellulose không tan trong dung môi hữu cơ thông thường nhưng tan trong dung dịch Schweitzer và ZnCl2 đậm đặc.","keywords":"cellulose tan dung dịch Schweitzer"},{"chapter":15,"number":42,"question":"NaCMC được dùng chủ yếu để","options":["Ổn định hệ treo","Bao tan trong ruột","Làm thuốc giảm béo","Cầm máu"],"answer":"A","explanation":"Na carboxymethylcellulose là polymer tăng độ nhớt, dùng ổn định hỗn dịch.","keywords":"NaCMC ổn định hệ treo"},{"chapter":15,"number":43,"question":"HPMC được dùng làm","options":["Tá dược dính, bao phim, viên phóng thích kéo dài","Chất cầm máu đường ruột","Môi trường nuôi cấy","Thuốc hạ cholesterol"],"answer":"A","explanation":"HPMC được dùng làm tá dược dính, bao phim và kiểm soát giải phóng kéo dài.","keywords":"HPMC dính, bao phim, kéo dài"},{"chapter":15,"number":44,"question":"Pectin là","options":["Homopolysaccharid của glucose","Heteropolysaccharid giàu acid galacturonic","Disaccharid","Polyol"],"answer":"B","explanation":"Pectin là heteropolysaccharid có thành phần chính là acid galacturonic, thường gặp ở lớp vỏ giữa quả họ Cam.","keywords":"pectin acid galacturonic"},{"chapter":15,"number":45,"question":"Pectin tạo gel tốt khi có","options":["Môi trường kiềm mạnh","Acid pH 3,1-3,5 và đường 65-70%","Chloroform","Amoniac"],"answer":"B","explanation":"Slide nêu pectin tạo gel khi có acid ở pH 3,1-3,5 và nồng độ saccharose khoảng 65-70%.","keywords":"pectin gel acid + đường"},{"chapter":15,"number":46,"question":"Định tính pectin bằng acid hydroxamic và FeCl3 cho","options":["Phức màu đỏ","Tủa xanh đen","Màu xanh tím","Không màu"],"answer":"A","explanation":"Pectin tạo hydroxamic acid rồi tạo phức đỏ với Fe(III).","keywords":"pectin + hydroxamic/Fe3+ đỏ"},{"chapter":15,"number":47,"question":"Công dụng của pectin là","options":["Thuốc giảm béo, chữa táo bón, cầm máu đường ruột","Chỉ dùng làm chất tạo màu","Tăng đường huyết","Làm tan cellulose"],"answer":"A","explanation":"Pectin có khả năng giữ nước, tạo gel và giảm hấp thu lipid nên được dùng giảm béo, táo bón và cầm máu đường ruột.","keywords":"pectin giảm béo, táo bón, cầm máu"},{"chapter":15,"number":48,"question":"Khác biệt cơ bản giữa gôm và chất nhầy là","options":["Gôm do biến đổi màng tế bào; chất nhầy là thành phần cấu tạo màng tế bào và chiết được bằng nước","Gôm luôn là protein","Chất nhầy không tan trong nước","Không có khác biệt về nguồn gốc"],"answer":"A","explanation":"Gôm thường hình thành do biến đổi bệnh lý hoặc thời tiết; chất nhầy là thành phần tự nhiên của tế bào và chiết được bằng nước.","keywords":"gôm = sản phẩm biến đổi; nhầy = thành phần tế bào"},{"chapter":15,"number":49,"question":"Chỉ số nở được định nghĩa là","options":["Khối lượng nước mà 1 g dược liệu hấp thu","Thể tích ml mà 1 g dược liệu chiếm sau khi nở trong nước","Thời gian tan hoàn toàn","Độ nhớt của 1% dung dịch"],"answer":"B","explanation":"Chỉ số nở là thể tích tính bằng ml mà 1 g dược liệu chiếm được sau khi nở trong nước.","keywords":"chỉ số nở ml/1 g dược liệu"},{"chapter":15,"number":50,"question":"Inulin có đặc điểm","options":["Polymer glucose phân nhánh","Mạch thẳng gồm fructose, tan trong nước, chất ngọt nghèo năng lượng","Không tan trong nước","Gây tăng hấp thu cholesterol"],"answer":"B","explanation":"Slide mô tả inulin là polymer fructose mạch thẳng, tan trong nước, có vị ngọt nhưng ít năng lư  nước.","keywords":"kiềm mở vòng lacton"},{"chapter":16,"number":29,"question":"Khi acid hóa dung dịch coumarinat","options":["Vòng lacton đóng trở lại","Vòng tiếp tục mở","Tạo anthraquinon","Tạo glycosid"],"answer":"A","explanation":"Acid hóa chuyển muối về acid rồi đóng vòng lacton, coumarin tự do kém tan xuất hiện lại.","keywords":"acid hóa đóng vòng"},{"chapter":16,"number":30,"question":"Dạng trans của acid coumarinic có huỳnh quang","options":["Yếu hơn cis","Mạnh hơn cis","Không phát quang","Giống hệt cis"],"answer":"B","explanation":"Slide nêu dạng cis phát huỳnh quang yếu, dạng trans phát huỳnh quang mạnh.","keywords":"trans huỳnh quang mạnh"},{"chapter":16,"number":31,"question":"Coumarin có nhóm OH phenol phản ứng với FeCl3 cho","options":["Màu xanh","Màu đỏ cam","Tủa trắng","Không màu"],"answer":"A","explanation":"Nhóm OH phenol tạo phức màu xanh với Fe3+.","keywords":"OH phenol + FeCl3 xanh"},{"chapter":16,"number":32,"question":"Phản ứng diazo với coumarin có OH phenol cho màu","options":["Đỏ cam","Xanh đen","Vàng chanh","Tím xanh"],"answer":"A","explanation":"Phản ứng ghép cặp diazo trong môi trường kiềm tạo phẩm màu azo đỏ cam.","keywords":"diazo đỏ cam"},{"chapter":16,"number":33,"question":"Chiết coumarin bằng dãy dung môi tăng dần độ phân cực, coumarin thường ra ở","options":["Phân đoạn cuối","Phân đoạn đầu","Chỉ ở pha nước","Không chiết được"],"answer":"B","explanation":"Do coumarin aglycon kém phân cực, chúng thường đi ra ở các phân đoạn đầu.","keywords":"coumarin kém phân cực phân đoạn đầu"},{"chapter":16,"number":34,"question":"Cơ sở chiết coumarin bằng kiềm loãng là","options":["Khả năng tạo tủa protein","Đóng - mở vòng lacton","Tạo phức với iod","Phản ứng oxy hóa mạnh"],"answer":"B","explanation":"Kiềm mở vòng tạo muối tan; acid hóa đóng vòng và kết tủa coumarin.","keywords":"chiết kiềm đóng/mở lacton"},{"chapter":16,"number":35,"question":"Không nên dùng chì acetat loại tạp khi coumarin có","options":["Nhóm methoxy","o-diOH ở C6-C7","Nhân furan","Nhân pyran"],"answer":"B","explanation":"Coumarin có hai OH kề nhau C6-C7 có thể tạo phức/tủa với chì acetat và bị mất theo tạp.","keywords":"Pb acetat tránh với o-diOH"},{"chapter":16,"number":36,"question":"Coumarin bền nhiệt có thể phân lập bằng","options":["Vi thăng hoa","Kết tủa gelatin","Phản ứng Cyanidin","Phá huyết"],"answer":"A","explanation":"Một số coumarin có khả năng thăng hoa nên có thể dùng vi thăng hoa để phân lập/định tính.","keywords":"coumarin bền nhiệt vi thăng hoa"},{"chapter":16,"number":37,"question":"Trong vi thăng hoa coumarin, tinh thể tác dụng Lugol cho","options":["Màu nâu hoặc tím","Màu xanh đen","Màu vàng chanh","Không màu"],"answer":"A","explanation":"Tinh thể iodocoumarin có màu nâu hay tím.","keywords":"vi thăng hoa + Lugol nâu/tím"},{"chapter":16,"number":38,"question":"Pha tĩnh TLC thường dùng cho coumarin là","options":["Silica gel G","Cellulose trao đổi ion","Than hoạt","Alumin kim loại"],"answer":"A","explanation":"Slide dùng bản silica gel G hoặc F254 để phân tích coumarin.","keywords":"TLC coumarin silica gel"},{"chapter":16,"number":39,"question":"Hệ pha động phù hợp cho coumarin thường","options":["Rất phân cực","Kém phân cực","Chỉ dùng nước","Chỉ dùng methanol"],"answer":"B","explanation":"Coumarin aglycon kém phân cực nên dùng hệ dung môi kém phân cực như benzen-aceton hoặc benzen-EtOAc.","keywords":"TLC coumarin pha động kém phân cực"},{"chapter":16,"number":40,"question":"Phổ UV coumarin có hai băng hấp thụ chính khoảng","options":["320-340 nm và 250-260 nm","400-500 nm và 600-700 nm","100-120 nm và 150-170 nm","210-220 nm duy nhất"],"answer":"A","explanation":"Do hệ liên hợp giữa carbonyl lacton và nhân benzen, coumarin có hai băng UV chính.","keywords":"UV coumarin 320-340 và 250-260 nm"},{"chapter":16,"number":41,"question":"Trong phổ IR, carbonyl vòng lacton coumarin xuất hiện khoảng","options":["1715-1750 cm-1","1000-1050 cm-1","2800-2900 cm-1","3600-3800 cm-1"],"answer":"A","explanation":"Dải C=O lacton nằm khoảng 1715-1750 cm-1.","keywords":"IR lacton C=O 1715-1750"},{"chapter":16,"number":42,"question":"Phương pháp định lượng coumarin thông dụng nhất theo slide là","options":["HPLC","Oxy hóa-khử","Chuẩn độ acid-base","Kjeldahl"],"answer":"A","explanation":"Slide ghi HPLC là phương pháp định lượng thông dụng; UV cần mẫu tinh khiết, oxy hóa-khử kém chính xác.","keywords":"định lượng coumarin HPLC"},{"chapter":16,"number":43,"question":"Phương pháp đo UV định lượng coumarin yêu cầu","options":["Mẫu tinh khiết","Mẫu chứa nhiều tạp","Không cần chất chuẩn","Chỉ dùng pha nước"],"answer":"A","explanation":"Đo UV cần mẫu tinh khiết và so sánh độ hấp thụ với mẫu chuẩn tại lambda max.","keywords":"UV định lượng mẫu tinh khiết + chuẩn"},{"chapter":16,"number":44,"question":"Tác dụng đặc trưng của dicoumarol là","options":["Chống đông máu","Long đờm","Kháng virus duy nhất","Hạ đường huyết"],"answer":"A","explanation":"Dicoumarol được dùng chống đông trong huyết khối và nghẽn mạch.","keywords":"dicoumarol chống đông"},{"chapter":16,"number":45,"question":"Aesculetin có tác dụng","options":["Vitamin P","Phá huyết","Nhuận tràng","Gây tê"],"answer":"A","explanation":"Slide nêu aesculetin có tác dụng vitamin P, liên quan bảo vệ thành mạch.","keywords":"aesculetin vitamin P"},{"chapter":16,"number":46,"question":"Dược liệu Bạch chỉ có tên khoa học tiêu biểu","options":["Angelica dahurica","Peucedanum praeruptorum","Wedelia calendulacea","Calophyllum inophyllum"],"answer":"A","explanation":"Bạch chỉ được trình bày là Angelica dahurica thuộc họ Apiaceae.","keywords":"Bạch chỉ Angelica dahurica"},{"chapter":16,"number":47,"question":"Thành phần coumarin của Bạch chỉ gồm nhiều chất thuộc nhóm","options":["Psoralen","Anthraquinon","Saponin steroid","Tanin pyrogallic"],"answer":"A","explanation":"Bạch chỉ chứa scopoletin và khoảng 10 chất nhóm psoralen như bergapten, xanthotoxin, byakangelicin.","keywords":"Bạch chỉ psoralen"},{"chapter":16,"number":48,"question":"Định tính Bạch chỉ trên TLC thường phát hiện vết bằng","options":["UV 365 nm","Phản ứng Borntrager","Lugol duy nhất","Ninhydrin"],"answer":"A","explanation":"Dịch chiết ethanol được chạy trên silica gel và soi UV365; scopoletin cho xanh da trời sáng.","keywords":"Bạch chỉ TLC UV365"},{"chapter":16,"number":49,"question":"Tiền hồ được dùng chủ yếu để","options":["Long đờm, chữa ho và bệnh hô hấp","Cầm máu ngoài da","Trị táo bón","Điều trị sốt rét"],"answer":"A","explanation":"Tiền hồ làm tăng tiết dịch đường hô hấp, long đờm, giảm ho và hỗ trợ các bệnh viêm hô hấp.","keywords":"Tiền hồ long đờm, ho"},{"chapter":16,"number":50,"question":"Coumarin đặc trưng của Sài đất là","options":["Wedelolacton","Dicoumarol","Warfarin","Psoralen"],"answer":"A","explanation":"Sài đất chứa wedelolacton, cùng tinh dầu, saponin và isoflavonoid; có tác dụng kháng khuẩn, chống viêm.","keywords":"Sài đất wedelolacton"},{"chapter":17,"number":1,"question":"Flavonoid được định nghĩa là","options":["Hợp chất polyphenol có khung C6-C3-C6","Glycosid steroid 27C","Dẫn chất anthracen","Polysaccharid thực vật"],"answer":"A","explanation":"Flavonoid là nhóm polyphenol thực vật có cấu trúc cơ bản diphenylpropan C6-C3-C6, tổng cộng 15 carbon.","keywords":"flavonoid polyphenol C6-C3-C6"},{"chapter":17,"number":2,"question":"Khung flavonoid cơ bản gồm","options":["12 carbon","15 carbon","18 carbon","30 carbon"],"answer":"B","explanation":"Khung C6-C3-C6 gồm tổng cộng 15 nguyên tử carbon.","keywords":"C6-C3-C6 15C"},{"chapter":17,"number":3,"question":"Trong khung flavonoid, mạch 3 carbon thường","options":["Đóng thành dị vòng C","Tạo vòng steroid","Không bao giờ đóng vòng","Tạo vòng lacton 5 cạnh"],"answer":"A","explanation":"Mạch C3 thường đóng vòng với nguyên tử oxy để tạo dị vòng C.","keywords":"mạch C3 dị vòng C"},{"chapter":17,"number":4,"question":"Phân loại eu-, iso- và neo-flavonoid chủ yếu dựa vào","options":["Vị trí gắn của vòng B trên vòng C","Số nhóm đường","Màu sắc","Độ tan trong nước"],"answer":"A","explanation":"Vòng B gắn tại C2 tạo eu-flavonoid, tại C3 tạo isoflavonoid và tại C4 tạo neoflavonoid.","keywords":"vị trí vòng B eu/iso/neo"},{"chapter":17,"number":5,"question":"Eu-flavonoid có cấu trúc cơ bản","options":["2-phenylbenzopyran","3-phenylbenzopyran","4-phenylbenzopyran","Benzo-alpha-pyron"],"answer":"A","explanation":"Eu-flavonoid là flavonoid thực, có vòng B gắn tại C2 của benzopyran.","keywords":"eu-flavonoid 2-phenylbenzopyran"},{"chapter":17,"number":6,"question":"Isoflavonoid có vòng B gắn tại","options":["C2","C3","C4","C5"],"answer":"B","explanation":"Đặc trưng của isoflavonoid là vòng B gắn vào C3 của vòng C.","keywords":"isoflavonoid B tại C3"},{"chapter":17,"number":7,"question":"Neoflavonoid có vòng B gắn tại","options":["C2","C3","C4","C7"],"answer":"C","explanation":"Neoflavonoid có vòng B gắn tại C4 của vòng C.","keywords":"neoflavonoid B tại C4"},{"chapter":17,"number":8,"question":"Flavonol khác flavon chủ yếu bởi","options":["Có thêm nhóm OH tại C3","Có thêm đường tại C7","Không có nhóm carbonyl","Không có vòng B"],"answer":"A","explanation":"Flavonol là flavon có thêm nhóm hydroxyl tại C3.","keywords":"flavonol = flavon + 3-OH"},{"chapter":17,"number":9,"question":"Flavanonol khác flavanon chủ yếu bởi","options":["Có thêm nhóm OH tại C3","Có thêm nối đôi C2-C3","Mất nhóm C=O","Có điện tích dương"],"answer":"A","explanation":"Flavanonol là flavanon có thêm 3-OH.","keywords":"flavanonol = flavanon + 3-OH"},{"chapter":17,"number":10,"question":"Flavanon có đặc điểm","options":["Không màu, kém bền, dễ oxy hóa","Luôn có màu đỏ","Bền hơn flavonol","Có điện tích dương"],"answer":"A","explanation":"Flavanon và flavanonol thường không màu, kém bền và dễ bị oxy hóa.","keywords":"flavanon không màu, kém bền"},{"chapter":17,"number":11,"question":"Trong môi trường base, flavanon có thể","options":["Mở vòng tạo chalcon tương ứng","Tạo anthraquinon","Kết tủa protein","Tạo saponin"],"answer":"A","explanation":"Kiềm có thể mở vòng C của flavanon để tạo chalcon tương ứng; acid có thể đóng vòng lại.","keywords":"flavanon + base chalcon"},{"chapter":17,"number":12,"question":"Catechin thuộc nhóm","options":["Flavan-3-ol","Flavonol","Anthocyanidin","Isoflavon"],"answer":"A","explanation":"Catechin có khung flavan và nhóm OH tại C3 nên gọi là flavan-3-ol.","keywords":"catechin flavan-3-ol"},{"chapter":17,"number":13,"question":"Catechin có hai carbon bất đối nên có thể có","options":["2 đồng phân quang học","4 đồng phân quang học","6 đồng phân quang học","8 đồng phân quang học"],"answer":"B","explanation":"Hai trung tâm bất đối lý thuyết tạo 2² = 4 đồng phân quang học.","keywords":"catechin: 2 C* 4 đồng phân"},{"chapter":17,"number":14,"question":"Dạng oligomer của catechin liên quan đến","options":["Tanin ngưng tụ","Tanin thủy phân","Saponin","Coumarin"],"answer":"A","explanation":"Các proanthocyanidin oligomer của catechin là thành phần của tanin ngưng tụ.","keywords":"catechin oligomer tanin ngưng tụ"},{"chapter":17,"number":15,"question":"EGCG là","options":["Epigallocatechin gallat","Epigallocatecoumarin gallat","Quercetin rutinosid","Anthocyanidin glycosid"],"answer":"A","explanation":"EGCG là ester gallat của epigallocatechin, phổ biến trong trà xanh.","keywords":"EGCG = epigallocatechin gallat"},{"chapter":17,"number":16,"question":"Leucoanthocyanidin còn được gọi là","options":["Flavan-3,4-diol","Flavan-3-ol","Flavon-3-ol","Chalcon"],"answer":"A","explanation":"LAC có khung flavan và hai nhóm OH tại C3, C4.","keywords":"LAC flavan-3,4-diol"},{"chapter":17,"number":17,"question":"Leucoanthocyanidin có thể chuyển thành anthocyanidin trong","options":["Môi trường acid và đun nóng","Môi trường kiềm lạnh","Nước trung tính","Dung môi hexan"],"answer":"A","explanation":"Acid và nhiệt làm LAC chuyển thành anthocyanidin có màu.","keywords":"LAC + H+, nhiệt AC"},{"chapter":17,"number":18,"question":"Anthocyanidin trong môi trường acid có màu","options":["Đỏ","Tím","Xanh","Vàng"],"answer":"A","explanation":"Ở pH acid, dạng flavyliu s":"không màu flavanon(ol), DHC, catechin, LAC"},{"chapter":17,"number":26,"question":"Chalcon và auron thường có màu","options":["Vàng đến đỏ cam","Xanh lục","Không màu","Đen"],"answer":"A","explanation":"Hệ liên hợp mở rộng làm chalcon và auron có màu vàng đến đỏ cam.","keywords":"chalcon/auron vàng-đỏ cam"},{"chapter":17,"number":27,"question":"Dạng flavonoid genin thường","options":["Dễ kết tinh, điểm chảy cao","Khó kết tinh hơn glycosid","Tan tốt trong nước lạnh","Không tan trong EtOAc"],"answer":"A","explanation":"Aglycon/genin thường dễ kết tinh và có nhiệt độ nóng chảy cao.","keywords":"genin dễ kết tinh"},{"chapter":17,"number":28,"question":"Dạng glycosid flavonoid thường","options":["Khó kết tinh hơn genin","Tan tốt trong hexan","Ít phân cực hơn genin","Không tan trong methanol"],"answer":"A","explanation":"Phần đường làm glycosid phân cực hơn và thường khó kết tinh.","keywords":"glycosid phân cực, khó kết tinh"},{"chapter":17,"number":29,"question":"Độ bền glycosid flavonoid tăng theo thứ tự","options":["O-glycosid < O-glucuronid < C-glycosid","C-glycosid < O-glycosid < O-glucuronid","O-glucuronid < C-glycosid < O-glycosid","Ba loại như nhau"],"answer":"A","explanation":"Liên kết C-glycosid bền hơn liên kết O-glycosid; O-glucuronid nằm trung gian.","keywords":"độ bền O-glycosid < O-glucuronid < C-glycosid"},{"chapter":17,"number":30,"question":"Flavonoid glycosid thường tan tốt trong","options":["Ethanol và methanol","Hexan và benzen","Ether dầu hỏa","Chloroform khan duy nhất"],"answer":"A","explanation":"Glycosid flavonoid phân cực, tan tốt trong EtOH, MeOH và một phần trong nước nóng.","keywords":"glycosid EtOH/MeOH"},{"chapter":17,"number":31,"question":"Flavonoid aglycon thường tan trong","options":["Dung môi phân cực trung bình đến mạnh như EtOAc, EtOH, MeOH","Chỉ trong nước","Chỉ trong hexan","Không tan trong kiềm"],"answer":"A","explanation":"Aglycon có độ phân cực trung bình, thường tan trong EtOAc, ethanol và methanol.","keywords":"aglycon EtOAc/EtOH/MeOH"},{"chapter":17,"number":32,"question":"Flavonoid có OH phenol tan được trong kiềm vì","options":["Tạo muối phenolat","Tạo phức với cholesterol","Tạo glycosid","Bị khử thành alcol"],"answer":"A","explanation":"OH phenol có tính acid yếu, phản ứng với kiềm tạo phenolat tan và thường làm tăng màu.","keywords":"OH phenol + kiềm phenolat"},{"chapter":17,"number":33,"question":"Thứ tự giảm dần tính acid của các OH phenol theo slide là","options":["7 > 4' > 3' > 3,5","3,5 > 3' > 4' > 7","4' > 7 > 3 > 5","5 > 3 > 7 > 4'"],"answer":"A","explanation":"Slide nêu tính acid giảm dần: OH-7, OH-4', OH-3', rồi OH-3 và OH-5.","keywords":"acid OH: 7 > 4' > 3' > 3,5"},{"chapter":17,"number":34,"question":"Flavonoid tạo phức màu rõ với ion kim loại khi có","options":["3-OH, 5-OH hoặc o-diOH ở vòng B","Chỉ nhóm methoxy","Chỉ phần đường","Không có nhóm OH"],"answer":"A","explanation":"Các nhóm OH thích hợp tạo chelat với kim loại, đặc biệt 3-OH, 5-OH và o-dihydroxy.","keywords":"tạo phức 3-OH/5-OH/o-diOH"},{"chapter":17,"number":35,"question":"Phản ứng với diazonium của flavonoid dựa chủ yếu vào","options":["Nhóm OH phenol","Nhóm đường","Nhóm carbonyl của đường","Mạch alkyl"],"answer":"A","explanation":"Phenolat ghép cặp với muối diazoni tạo phẩm màu azo đỏ.","keywords":"diazo OH phenol, đỏ"},{"chapter":17,"number":36,"question":"Phản ứng Cyanidin dùng để định tính","options":["Vòng gamma-pyron của flavon(ol), flavanon(ol)","Vòng lacton coumarin","Anthraquinon","Saponin steroid"],"answer":"A","explanation":"Mg/HCl khử hệ gamma-pyron tạo anthocyanidin màu đỏ/hồng.","keywords":"Cyanidin gamma-pyron"},{"chapter":17,"number":37,"question":"Tác nhân khử trong phản ứng Cyanidin là","options":["Hydrogen mới sinh từ Mg/HCl","Oxygen","Nitrogen","Carbon dioxide"],"answer":"A","explanation":"Mg trong HCl tạo hydro mới sinh làm tác nhân khử.","keywords":"Mg/HCl H mới sinh"},{"chapter":17,"number":38,"question":"Định tính anthocyanidin trong dịch chiết cồn 25% cho màu","options":["HCl đỏ, nước tím, NaOH xanh","HCl xanh, nước đỏ, NaOH tím","Cả ba không màu","HCl vàng, nước xanh, NaOH đỏ"],"answer":"A","explanation":"Anthocyanidin đổi màu theo pH: acid đỏ, trung tính tím, kiềm xanh.","keywords":"AC: HCl đỏ - H2O tím - NaOH xanh"},{"chapter":17,"number":39,"question":"Dung môi thường dùng để chiết flavonoid toàn phần là","options":["EtOH hoặc MeOH 70-90%","Hexan tuyệt đối","Benzen","Ether dầu hỏa"],"answer":"A","explanation":"Hỗn hợp cồn-nước 70-90% chiết tốt cả aglycon và glycosid flavonoid.","keywords":"chiết flavonoid cồn 70-90%"},{"chapter":17,"number":40,"question":"Dung môi kém phân cực trong quy trình chiết flavonoid chủ yếu dùng để","options":["Loại chất béo và chlorophyll","Chiết glycosid chính","Thủy phân đường","Tạo màu"],"answer":"A","explanation":"Hexan hoặc ether dầu hỏa giúp loại lipid và sắc tố kém phân cực trước khi phân bố.","keywords":"loại tạp hexan/PE"},{"chapter":17,"number":41,"question":"Trong phân bố dịch chiết flavonoid, chloroform hoặc ether thường kéo","options":["Genin","Đường tự do","Glycosid rất phân cực","Muối vô cơ"],"answer":"A","explanation":"Aglycon kém phân cực hơn nên ưu tiên sang chloroform/ether.","keywords":"Cf/Et2O genin"},{"chapter":17,"number":42,"question":"Ethyl acetat trong phân bố flavonoid thường kéo","options":["Glycosid và một phần genin","Chỉ đường tự do","Chỉ lipid","Muối khoáng"],"answer":"A","explanation":"EtOAc có độ phân cực trung bình, kéo được glycosid tương đối phân cực và một phần aglycon.","keywords":"EtOAc glycosid + ít genin"},{"chapter":17,"number":43,"question":"Chiết bằng DCM hoặc chloroform thích hợp nhất với","options":["Polymethoxyflavonoid","Anthocyanin glycosid","Đường tự do","Muối flavonoid"],"answer":"A","explanation":"Nhiều nhóm methoxy làm flavonoid kém phân cực, phù hợp DCM/chloroform.","keywords":"polymethoxyflavonoid DCM/Cf"},{"chapter":17,"number":44,"question":"Phương pháp định tính flavonoid thông dụng và tin cậy nhất theo thời gian lưu là","options":["HPLC","Thử bọt","Borntrager","Vi thăng hoa"],"answer":"A","explanation":"HPLC so sánh thời gian lưu với chất chuẩn cùng điều kiện, cho độ tin cậy cao.","keywords":"định tính HPLC, thời gian lưu"},{"chapter":17,"number":45,"question":"Phương pháp định lượng flavonoid đơn giản nhưng sai số cao là","options":["Phương pháp cân","HPLC","LC-MS","Đo quang có chuẩn"],"answer":"A","explanation":"Phương pháp cân chỉ phù hợp dược liệu giàu flavonoid và có độ chính xác thấp.","keywords":"định lượng cân đơn giản, sai số cao"},{"chapter":17,"number":46,"question":"Phương pháp định lượng flavonoid thông dụng, tin cậy và chính xác là","options":["HPLC","Chỉ số bọt","Phản ứng Fontan-Kaudel","Vi thăng hoa"],"answer":"A","explanation":"HPLC áp dụng cho dược liệu, chế phẩm và dịch sinh học với độ chính xác cao.","keywords":"định lượng flavonoid HPLC"},{"chapter":17,"number":47,"question":"Dược liệu Hòe nổi bật với flavonoid","options":["Rutin","Glycyrrhizin","Diosgenin","Psoralen"],"answer":"A","explanation":"Nụ Hòe chứa hàm lượng rutin rất cao và thường dùng làm nguồn rutin.","keywords":"Hòe rutin"},{"chapter":17,"number":48,"question":"Hoàng cầm có flavonoid tiêu biểu","options":["Baicalin","Madecassosid","Ginsenosid","Wedelolacton"],"answer":"A","explanation":"Baicalin là flavon glycosid đặc trưng của Hoàng cầm.","keywords":"Hoàng cầm baicalin"},{"chapter":17,"number":49,"question":"Cúc gai có hoạt chất flavonoid tiêu biểu và công dụng","options":["Silymarin, bảo vệ gan","Rutin, long đờm","Hesperidin, nhuận tràng","Catechin, chống đông"],"answer":"A","explanation":"Cúc gai chứa phức hợp silymarin, có tác dụng chống oxy hóa, bảo vệ và tái sinh tế bào gan.","keywords":"Cúc gai silymarin, bảo vệ gan"},{"chapter":17,"number":50,"question":"Nhóm tác dụng nổi bật của flavonoid là","options":["Chống oxy hóa, bảo vệ thành mạch, chống viêm","Chỉ phá huyết","Chỉ độc với cá","Chỉ gây tê"],"answer":"A","explanation":"Nhiều flavonoid dập tắt gốc tự do, hỗ trợ bền thành mạch và có tác dụng chống viêm.","keywords":"flavonoid chống OXH, vitamin P, chống viêm"},{"chapter":18,"number":1,"question":"Saponin được định nghĩa phù hợp nhất là","options":["Một alkaloid steroid","Một glycosid có aglycon là sapogenin","Một polyphenol","Một protein tạo bọt"],"answer":"B","explanation":"Saponin là glycosid gồm phần aglycon gọi là sapogenin và phần đường.","keywords":"saponin = sapogenin + đường"},{"chapter":18,"number":2,"question":"Tính chất đặc trưng thường gặp của saponin là","options":["Tạo bọt khi lắc với nước","Tạo màu xanh với iod","Tan tốt trong hexan","Có mùi thơm mạnh"],"answer":"A","explanation":"Do hoạt động bề mặt, saponin thường tạo bọt bền khi lắc với nước.","keywords":"saponin hoạt động bề mặt, tạo bọt"},{"chapter":18,"number":3,"question":"Tính chất nào KHÔNG nhất thiết có ở mọi saponin","options":["Tạo bọt","Phá huyết","Có phần đường","Có aglycon"],"answer":"B","explanation":"Không phải saponin nào cũng phá huyết; saponin Smilax không phá huyết, ginsenosid phá huyết yếu.","keywords":"không phải saponin nào cũng phá huyết"},{"chapter":18,"number":4,"question":"Một số chất không phải saponin vẫn có thể tạo bọt, ví dụ","options":["Glycosid tim, protein, chất nhầy","Anthraquinon","Coumarin","Tanin thủy phân"],"answer":"A","explanation":"Slide nhấn mạnh tạo bọt không đặc hiệu tuyệt đối vì glycosid tim, protein và chất nhầy cũng có thể tạo bọt.","keywords":"tạo bọt không đặc hiệu tuyệt đối"},{"chapter":18,"number":5,"question":"Saponin được phân loại lớn thành","options":["Saponin triterpen và saponin steroid","Saponin flavonoid và tanin","Saponin acid và base","Saponin aldehyd và ceton"],"answer":"A","explanation":"Phân loại dựa vào khung sapogenin: triterpen 30C hoặc steroid 27C.","keywords":"saponin triterpen 30C / steroid 27C"},{"chapter":18,"number":6,"question":"Sapogenin của saponin triterpen thường có","options":["18 carbon","21 carbon","27 carbon","30 carbon"],"answer":"D","explanation":"Triterpen có khung 30 carbon.","keywords":"triterpen 30C"},{"chapter":18,"number":7,"question":"Sapogenin của saponin steroid thường có","options":["27 carbon","30 carbon","15 carbon","40 carbon"],"answer":"A","explanation":"Saponin steroid có khung steroid 27 carbon.","keywords":"steroid 27C"},{"chapter":18,"number":8,"question":"Khung oleanan thuộc nhóm","options":["Saponin triterpen 5 vòng","Saponin triterpen 4 vòng","Saponin steroid","Steroid alkaloid"],"answer":"A","explanation":"Oleanan là khung pentacyclic, thuộc saponin triterpen 5 vòng.","keywords":"oleanan triterpen 5 vòng"},{"chapter":18,"number":9,"question":"Dẫn chất điển hình của khung oleanan là","options":["Beta-amyrin","Alpha-amyrin","Diosgenin","Solasodin"],"answer":"A","explanation":"Khung oleanan thường là dẫn chất của beta-amyrin.","keywords":"oleanan beta-amyrin"},{"chapter":18,"number":10,"question":"Khung ursan thường là dẫn chất của","options":["Alpha-amyrin","Beta-amyrin","Diosgenin","Cholesterol"],"answer":"A","explanation":"Ursan khá phổ biến và thường là dẫn chất của alpha-amyrin.","keywords":"ursan alpha-amyrin"},{"chapter":18,"number":11,"question":"Madecassosid trong Rau má thuộc khung","options":["Ursan","Lanostan","Spirostan","Furostan"],"answer":"A","explanation":"Madecassosid là saponin triterpen khung ursan.","keywords":"madecassosid ursan"},{"chapter":18,"number":12,"question":"Đặc điểm của khung lupan là","options":["Vòng E có 5 cạnh","Có dị tố N","Chỉ có 4 vòng","Không có nhóm thế ở C19"],"answer":"A","explanation":"Khung lupan ít phổ biến, vòng E có 5 cạnh và có nhóm thế tại C19.","keywords":"lupan vòng E 5 cạnh"},{"chapter":18,"number":13,"question":"Lupeol, betulin và acid betulinic thuộc khung","options":["Lupan","Oleanan","Damaran","Spirostan"],"answer":"A","explanation":"Ba hợp chất này là các dẫn chất điển hình của khung lupan.","keywords":"lupan lupeol, betulin, acid betulinic"},{"chapter":18,"number":14,"question":"Khung damaran thuộc","options":["Triterpen 4 vòng","Triterpen 5 vòng","Steroid alkaloid","Coumarin"],"answer":"A","explanation":"Damaran là khung triterpen tetracyclic, rất quan trọng trong các loài Panax.","keywords":"damaran triterpen 4 vòng"},{"chapter":18,"number":15,"question":"Khung damaran đặc trưng trong","options":["Các loài sâm Panax","Các loài Smilax","Các loài Dioscorea","Cây họ Cam"],"answer":"A","explanation":"Damaran đặc trưng cho các loài sâm thuộc chi Panax.","keywords":"damaran Panax"},{"chapter":18,"number":16,"question":"Ginsenosid thường thuộc loại","options":["Bidesmosid","Không có đường","Monosaccharid tự do","Alkaloid"],"answer":"A","explanation":"Slide nhấn mạnh saponin khung damaran thường là bidesmosid.","keywords":"ginsenosid thường bidesmosid"},{"chapter":18,"number":17,"question":"Khung lanostan nổi bật ở","options":["Động vật nhuyễn thể như hải sâm, sao biển","Nhân sâm","Cam thảo","Rau má"],"answer":"A","explanation":"Lanostan gặp ở động vật nhuyễn thể và có thể phá huyết mạnh như một cơ chế tự vệ.","keywords":"lanostan hải sâm, sao biển"},{"chapter":18,"number":18,"question":"Khung cucurbitan thường có trong","options":["Họ Cucurbitaceae","Họ Apiaceae","Họ Fabaceae","Họ Asteraceae"],"answer":"A","explanation":"Khung cucurbitan thường gặp trong họ Bầu bí, như mướp đắng.","keywords":"cucurbitan Cucurbitaceae"},{"chapter":18,"number":19,"question":"Saponin steroid thường có dị tố","options":["O hoặc N tạo dị vòng E hoặc F","S","Cl","Br"],"answer":"A","explanation":"Trong cấu trúc steroid thường có O hoặc N tham gia tạo dị vòng E/F.","keywords":"saponin steroid dị tố O/N"},{"chapter":18,"number":20,"question":"Spirostan có đặc điểm","options":["Mạch C20-C27 tạo hai dị vòng O E và F, chung C22","Vòng F mở","Có N trong phân tử","Chỉ có 3 vòng"],"answer":"A","explanation":"Spirostan có hai dị vòng chứa O và cầu spiro chung tại C22.","keywords":"spirostan 2 dị vòng O, C22 spiro"},{"chapter":18,"number":21,"question":"Furostan khác spirostan chủ yếu ở","options":["Vòng F mở","Có thêm vòng benzen","Có N","Không có mạch nhánh"],"answer":"A","explanation":"Furostan có cấu trúc gần spirostan nhưng vòng F đang mở và có thể chuyển thành spirostan.","keywords":"furostan vòng F mở"},{"chapter":18,"number":22,"question":"Diosgenin có giá trị vì","options":["Là nguyên liệu bán tổng hợp thuốc steroid","Là chất tạo màu","Là chất phá bọt","Là carbohydrate"],"answer":"A","explanation":"Diosgenin là nguyên liệu quan trọng để bán tổng hợp hormon steroid, corticoid và thuốc tránh thai.","keywords":"diosgenin nguyên liệu bán tổng hợp steroid"},{"chapter":18,"number":23,"question":"Steroid alkaloid saponin có đặc điểm","options":["Chứa N và vừa có tính kiềm vừa là glycosid","Chỉ chứa O","Không có đường","Không có tính base"],"answer":"A","explanation":"Nhóm này chứa N nên mang tính kiềm kiểu alkaloid đồng thời vẫn là glycosid.","keywords":"steroid alkaloid glyco-alkaloid"},{"chapter":18,"number":24,"question":"Solanin thường gặp trong","options":["Mầm khoai tây","Cam thảo","Nhân sâm","Rau má"],"answer":"A","explanation":"Solanin là glyco-alkaloid steroid trong mầm khoai tây.","keywords":"solanin mầm khoai tây"},{"chapter":18,"number":25,"question":"Saponin thường phân bố trong","options":["Không bào và nhiều bộ phận của cây","Chỉ ở hoa","Chỉ ở hạt","Chỉ ở vỏ thân"],"answer":"A","explanation":"Saponin thường có trong không bào và có thể gặp ở rễ, thân, lá, quả, hạt.","keywords":"phân bố không bào, nhiều bộ phận"},{"chapter":18,"number":26,"question":"Ở thực vật hai lá mầm, saponin thường là","options":["Saponin triterpen","Saponin steroid","Glyco-alkaloid","Không có saponin"],"answer":"A","explanation":"Thực vật hai lá mầm chủ yếu chứa saponin triterpen, phần lớn khung oleanan.","keywords":"hai lá mầm triterpen"},{"chapter":18,"number":27,"question":"Ở thực vật một lá mầm, saponin thường là","options":["Saponin steroid","Saponin triterpen oleanan","Anthraquinon","Tanin"],"answer":"A","explanation":"Thực vật một lá mầm như Mạch môn, Thiên môn, Tỳ giải thường chứa saponin steroid.","keywords":"một lá mầm steroid"},{"chapter":18,"number":28,"question":"Chi Solanum thường chứa","options":["Glyco-alkaloid","Saponin damaran","Tanin ngưng tụ","Coumarin"],"answer":"A","explanation":"Cà chua, cà pháo, khoai tây thường có glyco-alkaloid steroid.","keywords":"Solanum glyco-alkaloid"},{"chapter":18,"number":29,"question":"Tính chất độ tan đúng của saponin là","options":["Tan trong nước và cồn loãng, ít tan trong dung môi không phân cực","Tan tốt trong hexan","Không tan trong n-butanol","Chỉ tan trong chloroform"],"answer":"A","explanation":"Do phần đường, saponin tan trong nước/cồn loãng; n-butanol là dung môi phân bố chọn lọc.","keywords":"saponin tan nước/cồn loãng"},{"chapter":18,"number":30,"question":"Dung môi chọn lọc thường dùng để phân bố saponin là","options":["n-Butanol bão hòa nước","Hexan","Benzen","Ether dầu hỏa"],"answer":"A","explanation":"n-Butanol bão hòa nước được dùng rộng rãi để kéo saponin sang pha hữu cơ.","keywords":"saponin n-BuOH"},{"chapter":18,"number":31,"question":"Saponin có thể được tủa bằng","options":["Ether hoặc aceton","Nước","Hexan duy nhất","Dung dịch NaCl loãng"],"answer":"A","explanation":"Saponin hòa trong methanol có thể tủa khi thêm ether, aceton hoặc ether-aceton.","keywords":"tủa saponin ether/aceton"},{"chapter":18,"number":32,"question":"Sapogenin có độ tan","options":["Ngược với saponin, dễ tan trong dung môi hữu cơ kém phân cực","Giống hệt saponin","Chỉ tan nước","Không tan chloroform"],"answer":"A","explanation":"Sapogenin là aglycon kém phân cực nên tan tốt hơn trong dung môi hữu cơ.","keywords":"sapogenin tan hữu cơ"},{"chapter":18,"number":33,"question":"Thủy phân saponin bằng acid mạnh có thể gây","options":["Tạo artefact","Không thay đổi cấu trúc","Tạo protein","Tạo cellulose"],"answer":"A","explanation":"Acid mạnh có thể làm biến đổi sapogenin và tạo artefact không có sẵn trong cây.","keywords":"acid mạnh artefact"},{"chapter":18,"number":34,"question":"Để hạn chế artefact khi thủy phân saponin nên dùng","options":["Enzym chọn lọc như beta-glucosidase","H2SO4 đặc nóng","KMnO4","NaOH đặc"],"answer":"A","explanation":"Enzym chọn lọc giúp cắt đường nhẹ nhàng, tránh tái sắp xếp cấu trúc.","keywords":"thủy phân chọn lọc enzym"},{"chapter":18,"number":35,"question":"Dung môi thường dùng nhất để chiết saponin là","options":["MeOH, EtOH 50-90% hoặc nước","Hexan tuyệt đối","Benzen","CHCl3 khan"],"answer":"A","explanation":"Saponin phân cực nên thường được chiết bằng methanol, ethanol-nước hoặc nước.","keywords":"chiết saponin MeOH/EtOH-nước"},{"chapter":18,"number":36,"question":"Nếu dược liệu nhiều chất béo, bước đầu nên","options":["Loại béo bằng ether dầu hỏa hoặc hexan","Thêm nước ngay","Thêm gelatin","Dùng FeCl3"],"answer":"A","explanation":"Loại chất béo trước giúp giảm tạp không phân cực trong dịch chiết saponin.","keywords":"loại béo PE/hexan"},{"chapter":18,"number":37,"question":"Phương pháp tinh sạch saponin đơn lẻ hiệu quả nhất là","options":["Sắc ký cột","Đun sôi lâu","Lọc giấy đơn thuần","Vi thăng hoa"],"answer":"A","explanation":"Do hỗn hợp nhiều chất tương tự, sắc ký cột/điều chế được dùng để tách riêng saponin.","keywords":"tinh sạch sắc ký cột"},{"chapter":18,"number":38,"question":"Chỉ số bọt được xác định dựa trên","options":["Độ pha loãng của 1 g dược liệu vẫn tạo lớp bọt 1 cm sau 15 phút","Màu của bọt","Khối lượng sapogenin","Thời gian sôi"],"answer":"A","explanation":"Chỉ số bọt là độ pha loãng cần để 1 g dược liệu tạo cột bọt cao 1 cm sau 15 phút.","keywords":"chỉ số bọt 1 cm sau 15 phút"},{"chapter":18,"number":39,"question":"Phản ứng Rosenthaler dùng","options":["Vanillin + HCl","Mg + HCl","FeCl3","Dragendorff"],"answer":"A","explanation":"Rosenthaler là phản ứng màu với vanillin và HCl, màu chuyển lục đến tím.","keywords":"Rosenthaler vanillin/HCl"},{"chapter":18,"number":40,"question":"Thuốc thử VS gồm","options":["Vanillin 1% + H2SO4 10%","NaOH + FeCl3","Mg + HCl","Iod + KI"],"answer":"A","explanation":"Vanillin-sulfuric là thuốc thử hiện màu thông dụng cho saponin trên TLC.","keywords":"VS vanillin 1% + H2SO4 10%"},{"chapter":18,"number":41,"question":"Trong phản ứng Fontan-Kaudel, bọt hai ống acid và kiềm tương đương gợi ý","options":["Saponin triterpen","Saponin steroid","Không có saponin","Tanin"],"answer":"A","explanation":"Saponin triterpen cho độ bền bọt gần tương đương ở pH acid và kiềm.","keywords":"Fontan-Kaudel: bọt tương đương triterpen"},{"chapter":18,"number":42,"question":"Trong phản ứng Fontan-Kaudel, bọt ở pH 13 lớn hơn pH 1 gợi ý","options":["Saponin steroid","Saponin triterpen","Coumarin","Flavonoid"],"answer":"A","explanation":"Saponin steroid tạo bọt mạnh hơn trong môi trường kiềm.","keywords":"Fontan-Kaudel: kiềm > acid steroid"},{"chapter":18,"number":43,"question":"Phản ứng Liebermann-Burchard cho màu hồng đến đỏ tím ở phía trên gợi ý","options":["Triterpen","Steroid","Alkaloid","Tanin"],"answer":"A","explanation":"Sapogenin triterpen thường cho màu hồng đến đỏ tím.","keywords":"Liebermann triterpen hồng/đỏ tím"},{"chapter":18,"number":44,"question":"Phản ứng Liebermann-Burchard cho màu xanh lá cây gợi ý","options":["Steroid","Triterpen","Anthraquinon","Coumarin"],"answer":"A","explanation":"Sapogenin steroid thường cho màu xanh lá.","keywords":"Liebermann steroid xanh lá"},{"chapter":18,"number":45,"question":"Phương pháp định lượng saponin hiện nay hiệu quả và khá chính xác là","options":["HPLC","Phương pháp cân đơn thuần","Thử bọt","Thử cá"],"answer":"A","explanation":"HPLC pha đảo với các đầu dò phù hợp là phương pháp thông dụng và chính xác hơn.","keywords":"định lượng HPLC"},{"chapter":18,"number":46,"question":"Trong HPLC saponin thường dùng cột","options":["RP-18","Silica pha thường duy nhất","Alumina","Giấy sắc ký"],"answer":"A","explanation":"Slide nêu cột pha đảo RP-18 với hệ MeOH-nước hoặc acetonitril-nước.","keywords":"HPLC saponin RP-18"},{"chapter":18,"number":47,"question":"Glycyrrhizin là saponin đặc trưng của","options":["Cam thảo","Rau má","Nhân sâm","Tam thất"],"answer":"A","explanation":"Cam thảo chứa glycyrrhizin, có vị ngọt và nhiều tác dụng dược lý.","keywords":"Cam thảo glycyrrhizin"},{"chapter":18,"number":48,"question":"Asiaticosid và madecassosid là thành phần tiêu biểu của","options":["Rau má","Bạch chỉ","Tiền hồ","Mù u"],"answer":"A","explanation":"Rau má chứa các saponin triterpen như asiaticosid và madecassosid.","keywords":"Rau má asiaticosid/madecassosid"},{"chapter":18,"number":49,"question":"Ginsenosid là nhóm saponin đặc trưng của","options":["Nhân sâm và các loài Panax","Cam thảo","Viễn chí","Mạch môn"],"answer":"A","explanation":"Các loài Panax chứa nhiều ginsenosid khung damaran.","keywords":"Panax ginsenosid"},{"chapter":18,"number":50,"question":"Công dụng thường gặp của dược liệu chứa saponin là","options":["Chữa ho long đờm, bổ tăng lực, chống viêm và hỗ trợ tim mạch","Chỉ gây tê","Chỉ nhuận tràng","Chỉ tạo màu"],"answer":"A","explanation":"Saponin có nhiều công dụng: long đờm, bổ tăng lực, chống viêm, kháng nấm và hỗ trợ tim mạch tùy dược liệu.","keywords":"saponin long đờm, bổ, chống viêm"}];
