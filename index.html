r đến trong","Thêm nước sôi vừa đủ đến trong","Lọc lại đến trong"],"answer":"D","explanation":"Lọc giúp loại cặn và chất không tan trước khi tiến hành phản ứng màu, tránh nhiễu quan sát.","keywords":"dịch đục lọc lại","chapter":9},{"number":7,"question":"Dung môi hòa tan mẫu trong TLC, chọn câu đúng nhất","options":["Hòa tan được mẫu và dễ bay hơi","Dung môi nào cũng được","Luôn dùng CHCl3","Luôn dùng MeOH"],"answer":"A","explanation":"Dung môi chấm phải hòa tan mẫu, dễ bay hơi và không gây loang vết.","keywords":"dung môi chấm hòa tan tốt, dễ bay hơi","chapter":9},{"number":8,"question":"Dung môi chiết KHÔNG thích hợp cho coumarin","options":["Nước","Benzen","CHCl3","Cồn 96%"],"answer":"A","explanation":"Coumarin tự do kém tan trong nước, tan tốt hơn trong dung môi hữu cơ.","keywords":"coumarin không ưu tiên nước","chapter":9},{"number":9,"question":"Trong thử nghiệm tạo bọt saponin, cồn 70% có thể thay bằng","options":["Chloroform","Methanol 80%","Ethyl acetat","Nước acid"],"answer":"B","explanation":"Methanol 80% có độ phân cực tương tự và chiết tốt saponin.","keywords":"saponin MeOH 80%","chapter":9},{"number":10,"question":"Chọn câu SAI về thử nghiệm tạo bọt","options":["Đặc hiệu tuyệt đối cho saponin","Có thể đánh giá sơ bộ hàm lượng","Đọc kết quả sau 15 phút","Thực hiện trong môi trường nước"],"answer":"A","explanation":"Thử tạo bọt không hoàn toàn đặc hiệu vì một số chất hoạt động bề mặt khác cũng có thể tạo bọt.","keywords":"tạo bọt không đặc hiệu tuyệt đối","chapter":9},{"number":11,"question":"Tính chất không phải của anthraglycosid","options":["Tan trong NaHSO3","Tan trong nước","Có khung 9,10-diceton anthracen","Dễ thủy phân trong acid"],"answer":"A","explanation":"Anthraglycosid tan trong nước/cồn và bị thủy phân acid; NaHSO3 không phải dung môi điển hình cho dạng glycosid.","keywords":"anthraglycosid không đặc trưng tan NaHSO3","chapter":9},{"number":12,"question":"Phát biểu SAI về EGCG","options":["Có nhiều trong trà xanh","FeCl3 1% cho xanh đen","Chống oxy hóa","Là epigallocatecoumarin gallat"],"answer":"D","explanation":"EGCG là epigallocatechin gallate, không phải epigallocatecoumarin gallate.","keywords":"EGCG = epigallocatechin gallate","chapter":9},{"number":13,"question":"Thuốc thử phát hiện rutin bằng TLC","options":["FeCl3 1%/cồn","FeCl3 1%/nước","KOH/nước","KOH/MeOH"],"answer":"A","explanation":"Rutin có nhóm phenol nên tạo phức màu với FeCl3 trong cồn.","keywords":"rutin + FeCl3/cồn","chapter":9},{"number":14,"question":"Chọn phát biểu SAI về phản ứng diazo","options":["Kém bền với nhiệt","Xảy ra trong môi trường kiềm","Không dùng thừa thuốc thử","Đặc trưng cho coumarin"],"answer":"D","explanation":"Phản ứng diazo chủ yếu nhận biết nhóm phenol, flavonoid và một số chất khác; không đặc trưng riêng cho coumarin.","keywords":"diazo OH phenol, không riêng coumarin","chapter":9},{"number":15,"question":"Phát biểu sai về tính chất hóa học chung của flavonoid","options":["Vừa có tính oxy hóa vừa có tính khử","Có tính kiềm do vòng gamma-pyron","Có tính lưỡng tính","Nhân benzopyrylium có tính kiềm yếu nhất"],"answer":"D","explanation":"Nhân benzopyrylium của anthocyanidin mang tính cation và biểu hiện tính base rõ hơn, không phải yếu nhất.","keywords":"benzopyrylium không phải base yếu nhất","chapter":9},{"number":16,"question":"Dịch chiết phản ứng NaOH loãng, lớp kiềm đỏ có thể kết luận có","options":["1,8-diOH anthraquinon","C-glycoside","O-glycoside","1,2-diOH anthraquinon"],"answer":"A","explanation":"1,8-dihydroxyanthraquinon tạo muối phenolat màu đỏ rõ trong kiềm.","keywords":"1,8-diOH anthraquinon + kiềm đỏ","chapter":9},{"number":17,"question":"Dịch chiết Đậu đen trong cồn tác dụng AlCl3 cho","options":["Dung dịch tăng màu","Tủa vàng đục","Tím huỳnh quang","Phức xanh đen"],"answer":"A","explanation":"AlCl3 tạo phức với flavonoid làm tăng cường màu/huỳnh quang của dịch chiết.","keywords":"flavonoid + AlCl3 tăng màu","chapter":9},{"number":18,"question":"Tính chất của saponin","options":["Tạo phức không tan với cholesterol","Vị ngọt","Tạo tủa với FeCl3","Chỉ phá huyết ở nồng độ cao"],"answer":"A","explanation":"Saponin tạo phức không tan với cholesterol, là tính chất dùng hỗ trợ định tính.","keywords":"saponin + cholesterol phức không tan","chapter":9},{"number":19,"question":"Thuốc thử hiện màu TLC với hầu hết saponin","options":["NaOH/MeOH","FeCl3 1%","H2SO4 10%","Dragendorff"],"answer":"C","explanation":"H2SO4 10% sau gia nhiệt là thuốc thử hiện màu chung cho nhiều saponin.","keywords":"saponin TLC H2SO4 10%","chapter":9},{"number":20,"question":"Cơ chế loại chlorophyll bằng than hoạt","options":["Oxy hóa-khử","Hấp phụ","Phân bố","Trao đổi ion"],"answer":"B","explanation":"Than hoạt giữ chlorophyll trên bề mặt nhờ hấp phụ.","keywords":"than hoạt hấp phụ","chapter":9},{"number":21,"question":"Với thuốc thử Dragendorff, chọn câu SAI","options":["Cho màu nhờ phản ứng oxy hóa","Không phát hiện hết hợp chất hữu cơ","Chọn lọc cho alkaloid","Cho vết màu cam"],"answer":"A","explanation":"Dragendorff tạo ion-pair/kết tủa màu với alkaloid, không phải phản ứng oxy hóa.","keywords":"Dragendorff alkaloid, màu cam","chapter":9},{"number":22,"question":"Hiện tượng dương tính của Borntrager","options":["Vòng nhẫn nâu đỏ","Lớp CHCl3 vàng","Lớp kiềm tím","Lớp kiềm đỏ"],"answer":"D","explanation":"Anthraquinon chuyển sang lớp kiềm dưới dạng muối phenolat đỏ/hồng.","keywords":"Borntrager lớp kiềm đỏ","chapter":9},{"number":23,"question":"Dung môi có thể chiết anthraglycosid, NGOẠI TRỪ","options":["Cồn 96%","Nước sôi","Methanol","Chloroform"],"answer":"D","explanation":"Anthraglycosid phân cực, không tan tốt trong chloroform nếu chưa thủy phân.","keywords":"anthraglycosid CHCl3","chapter":9},{"number":24,"question":"Vai trò của gelatin trong định tính tanin","options":["Thuốc thử đặc trưng","Tác nhân xúc tác","Dung môi chiết","Thuốc thử phân biệt"],"answer":"A","explanation":"Gelatin là protein, tạo tủa đặc trưng với tanin nhờ liên kết hydro và tương tác kỵ nước.","keywords":"tanin + gelatin tủa","chapter":9},{"number":25,"question":"Để hiện vết flavonoid trong sắc ký đồ có lẫn saponin và coumarin nên dùng","options":["FeCl3","Diazo","Dragendorff","Vanillin"],"answer":"B","explanation":"Diazo chọn lọc hơn cho các flavonoid có OH phenol, giúp phân biệt khỏi saponin và nhiều coumarin.","keywords":"flavonoid diazo","chapter":9},{"number":26,"question":"Phản ứng đặc hiệu khi định tính anthraquinon","options":["Thăng hoa","Diazo","Borntrager","Cyanidin"],"answer":"C","explanation":"Borntrager là phản ứng đặc trưng nhất cho anthraquinon.","keywords":"anthraquinon Borntrager","chapter":9},{"number":27,"question":"Cơ chế hấp phụ trong sắc ký bao gồm","options":["Hấp phụ và giải hấp liên tục trên bề mặt pha tĩnh","Trên bề mặt pha động","Chỉ giải hấp trên pha tĩnh","Chỉ hấp phụ trên pha tĩnh"],"answer":"A","explanation":"Chất liên tục hấp phụ lên và giải hấp khỏi bề mặt pha tĩnh trong quá trình di chuyển.","keywords":"hấp phụ giải hấp trên pha tĩnh","chapter":9},{"number":28,"question":"Chọn câu SAI về pha động TLC","options":["Mẫu phân cực trung bình chọn pha động kém-trung bình","Polyphenol chọn pha động có thành phần acid","Mẫu kém phân cực chọn pha động kém-trung bình","Mẫu phân cực mạnh chọn pha động phân cực mạnh"],"answer":"A","explanation":"Mẫu phân cực trung bình thường cần pha động có độ phân cực trung bình; cách mô tả 'kém-trung bình' quá rộng và dễ không phù hợp.","keywords":"mẫu phân cực trung bình pha động trung bình","chapter":9},{"number":29,"question":"Trong định tính tanin, quan sát phản ứng FeCl3 1% sau khi","options":["Pha loãng ether","Pha loãng benzen","Pha loãng nước","Pha loãng CHCl3"],"answer":"C","explanation":"Dịch chiết tanin được pha loãng bằng nước để màu phản ứng rõ và đồng nhất.","keywords":"FeCl3 tanin pha loãng nước","chapter":9},{"number":30,"question":"Chữ G trong silica gel GF254 nghĩa là","options":["Có glycerol","Có chất kết dính","Có chất chỉ thị màu","Có chất phát huỳnh quang"],"answer":"B","explanation":"G chỉ chất kết dính, thường là calcium sulfate; F254 chỉ chất chỉ thị huỳnh quang.","keywords":"G = binder; F = fluorescent","chapter":9},{"number":31,"question":"Phản ứng giúp phân biệt tinh thể vi thăng hoa anthraquinon và coumarin","options":["Borntrager","Liebermann-Burchard","Pyridin/MeOH","Magnesi acetat/alcol"],"answer":"A","explanation":"Anthraquinon cho phản ứng Borntrager đỏ với kiềm, coumarin không cho phản ứng này.","keywords":"phân biệt anthraquinon/coumarin Borntrager","chapter":9},{"number":32,"question":"Chọn phát biểu SAI","options":["Sapogenin tan trong CHCl3, EtOAc","Saponosid kém tan trong hexan, CHCl3","Saponosid tan tốt trong ethanol","Sapogenin tan kém hơn saponin trong dung môi hữu cơ kém phân cực"],"answer":"D","explanation":"Sapogenin kém phân cực hơn nên tan tốt hơn saponin trong dung môi hữu cơ kém phân cực.","keywords":"sapogenin tan hữu cơ tốt hơn saponin","chapter":9},{"number":33,"question":"Ngũ bội tử chiết nước sôi, thử gelatin và FeCl3 1% cho hiện tượng","options":["Gelatin không tủa; FeCl3 không đổi màu","Gelatin tủa; FeCl3 không đổi màu","Gelatin tủa; xanh đen","Gelatin tủa; xanh rêu"],"answer":"C","explanation":"Ngũ bội tử giàu tanin thủy phân nên kết tủa gelatin và cho xanh đen với FeCl3.","keywords":"Ngũ bội tử tanin pyrogallic","chapter":9},{"number":34,"question":"Hiện tượng quá tải TLC xảy ra khi","options":["Nhiều chất kém phân cực","Nhiều bột dược liệu","Nhiều dung môi hòa tan","Mẫu quá đậm đặc"],"answer":"D","explanation":"Nạp lượng chất quá lớn làm vết to, kéo đuôi và chồng lấp.","keywords":"quá tải mẫu quá đậm đặc","chapter":9},{"number":35,"question":"Phenolat của anthranoid sau phản ứng kiềm tan trong","options":["Chloroform","Nước","NaHSO3","H2SO4 25%"],"answer":"B","explanation":"Muối phenolat ion hóa tan trong pha nước kiềm.","keywords":"phenolat anthranoid tan nước","chapter":9},{"number":36,"question":"Quy trình chuẩn bị mẫu tối ưu cho dược liệu chứa saponin trong TLC","options":["MeOH 80%, cô còn 2 ml","Cồn 80%, cô còn 2 ml","Cồn 80%, cô đến cắn, hòa cắn bằng MeOH","MeOH, cô đến cắn, hòa lại MeOH"],"answer":"C","explanation":"Cồn 80% chiết saponin tốt; cô đến cắn giúp loại dung môi và hòa lại bằng MeOH để chấm gọn.","keywords":"saponin: cồn 80% cô cắn MeOH","chapter":9},{"number":37,"question":"KĐ1: tính thuộc da của tanin nhờ liên kết hydro; KĐ2: dựa vào tính thuộc da để xác định tanin trong dược liệu","options":["KĐ1 đúng; KĐ2 sai","Cả hai đúng","Cả hai sai","KĐ1 sai; KĐ2 đúng"],"answer":"B","explanation":"Tanin liên kết protein nhờ liên kết hydro; khả năng thuộc da/kết tủa protein được dùng để nhận biết tanin.","keywords":"tanin liên kết H với protein","chapter":9},{"number":38,"question":"Hệ dung môi phù hợp sắc ký saponin, TRỪ","options":["CHCl3-MeOH-H2O (65:35:10, lớp dưới)","n-BuOH-EtOH (8:2)","n-Hexan-CHCl3 (8:2)","EtOAc-HCOOH-H2O (80:10:20)"],"answer":"C","explanation":"Saponin phân cực, nên hệ n-hexan-CHCl3 quá kém phân cực và không thích hợp.","keywords":"saponin n-hexan-CHCl3","chapter":9},{"number":39,"question":"Trị số Rf còn được gọi là","options":["Hệ số phân bố","Hệ số lưu giữ","Hệ số hấp phụ","Hệ số khoảng cách"],"answer":"B","explanation":"Rf thường được gọi là hệ số lưu giữ/retardation factor trong TLC.","keywords":"Rf hệ số lưu giữ","chapter":9},{"number":40,"question":"Tính chất của anthraquinon","options":["Mùi thơm","Tan trong nước sôi","Thăng hoa","Dễ thủy phân trong acid"],"answer":"C","explanation":"Anthraquinon tự do có khả năng vi thăng hoa; không tan tốt trong nước và không phải glycosid để bị thủy phân.","keywords":"anthraquinon thăng hoa","chapter":9},{"number":1,"question":"Dạng anthranoid có thể thăng hoa","options":["Glycosid","Dạng kết hợp","Dạng oxy hóa","Muối phenolat"],"answer":"C","explanation":"Dạng oxy hóa, điển hình là anthraquinon tự do, có thể vi thăng hoa và kết tinh lại trên lam kính; glycosid và muối phenolat không thăng hoa trực tiếp.","keywords":"anthranoid thăng hoa anthraquinon dạng oxy hóa","chapter":10},{"number":2,"question":"Phản ứng dùng để định lượng anthranoid bằng phương pháp đo quang","options":["Liebermann-Burchard","Magnesi acetat/alcol","Pyridin/MeOH (1:1)","Borntrager"],"answer":"B","explanation":"Magnesi acetat tạo phức màu với anthraquinon, có thể đo độ hấp thụ quang để định lượng.","keywords":"anthranoid đo quang Mg acetat/alcol","chapter":10},{"number":3,"question":"Phát biểu SAI về EGCG","options":["Có tác dụng chống oxy hóa","Thuộc nhóm alkaloid","Là epigallocatechin gallate","FeCl3 1% cho màu xanh đen"],"answer":"B","explanation":"EGCG là một catechin polyphenol, không phải alkaloid.","keywords":"EGCG polyphenol, không phải alkaloid","chapter":10},{"number":4,"question":"Phản ứng Cyanidin là phản ứng khử với tác nhân khử là","options":["Nitrogen","Khí carbonic","Hydrogen","Oxygen"],"answer":"C","explanation":"Trong phản ứng Cyanidin, Mg/HCl tạo hydro mới sinh làm tác nhân khử vòng gamma-pyron.","keywords":"Cyanidin hydro mới sinh","chapter":10},{"number":5,"question":"Cơ chế của phản ứng Cyanidin","options":["Tạo phức","Gián tiếp","Oxy hóa-khử","Cộng hợp"],"answer":"C","explanation":"Phản ứng Cyanidin là phản ứng khử flavonoid trong môi trường Mg/HCl, thuộc cơ chế oxy hóa-khử.","keywords":"Cyanidin phản ứng oxy hóa-khử","chapter":10},{"number":6,"question":"Dung môi chiết flavon(ol), flavanon(ol) trong thực hành","options":["MeOH","CHCl3","Cồn 96%","Cồn 25%"],"answer":"C","explanation":"Các flavonoid nhóm gamma-pyron tan tốt trong ethanol nồng độ cao; cồn 96% thường được dùng trong thực hành.","keywords":"flavon/flavanon cồn 96%","chapter":10},{"number":7,"question":"Phản ứng Borntrager dùng để định tính dạng","options":["Anthranol","Dihydroanthranol","Anthron","Anthraquinon"],"answer":"D","explanation":"Borntrager đặc trưng cho anthraquinon, tạo lớp kiềm màu đỏ hoặc hồng.","keywords":"Borntrager anthraquinon","chapter":10},{"number":8,"question":"Coumarin âm tính với phản ứng","options":["Diazo","Đóng-mở vòng lacton","Tăng huỳnh quang","Tủa protein"],"answer":"D","explanation":"Coumarin không có tính chất kết tủa protein; tủa protein là đặc trưng của tanin.","keywords":"coumarin không tủa protein","chapter":10},{"number":9,"question":"Chọn ý SAI khi nói về anthraglycosid","options":["Kém phân cực","Rất phân cực","Gồm nhóm nhuận tẩy và nhóm phẩm nhuộm","Bị thủy phân trong acid"],"answer":"A","explanation":"Anthraglycosid có phần đường nên khá phân cực, tan trong dung môi phân cực và bị thủy phân acid.","keywords":"anthraglycosid phân cực","chapter":10},{"number":10,"question":"Chọn ý SAI khi nói về anthraquinon","options":["Rất phân cực","Có thể phát quang dưới UV365","Kém phân cực","Gồm nhóm nhuận tẩy và nhóm phẩm nhuộm"],"answer":"A","explanation":"Anthraquinon tự do thường kém phân cực hơn dạng glycosid và tan trong dung môi hữu cơ.","keywords":"anthraquinon tự do kém phân cực","chapter":10},{"number":11,"question":"Nhóm dung môi phù hợp để chiết saponin","options":["CHCl3, n-butanol, ethanol","n-Butanol, ethanol, methanol","Ethyl acetat, ethanol, methanol","CHCl3, ethyl acetat, ethanol"],"answer":"B","explanation":"Saponin phân cực, chiết tốt bằng methanol, ethanol và có thể phân bố sang n-butanol bão hòa nước.","keywords":"saponin MeOH, EtOH, n-BuOH","chapter":10},{"number":12,"question":"Dịch chiết coumarin sau khi mở vòng bằng NaOH, chia hai ống: ống 1 thêm HCl đậm đặc, ống 2 thêm nước. Hiện tượng","options":["Trong - trong","Trong - đục","Đục - đục","Đục - trong"],"answer":"D","explanation":"Ống thêm HCl đóng vòng lacton trở lại, coumarin kém tan nên đục; ống thêm nước vẫn ở dạng muối coumarinat nên trong.","keywords":"HCl đóng vòng đục; nước trong","chapter":10},{"number":13,"question":"Chọn phát biểu đúng về coumarin","options":["Có khả năng mở vòng lactam","Khó tan trong cồn 96%","Có cấu trúc benzo-alpha-pyron","Có ester ngoại phân tử"],"answer":"C","explanation":"Coumarin có khung benzo-alpha-pyron và vòng lacton nội phân tử.","keywords":"coumarin benzo-alpha-pyron","chapter":10},{"number":14,"question":"Khả năng hấp phụ của silica gel trên bản mỏng do nhóm chức","options":["CO","COOH","CHO","OH"],"answer":"D","explanation":"Bề mặt silica có nhiều nhóm silanol -SiOH tạo liên kết hydro và tương tác phân cực với chất phân tích.","keywords":"silica gel nhóm silanol OH","chapter":10},{"number":15,"question":"Trong thử nghiệm tạo bọt saponin, hiện tượng tạo bọt là quá trình","options":["Vật lý","Oxy hóa-khử","Thủy phân","Hóa học"],"answer":"A","explanation":"Bọt hình thành do tính hoạt động bề mặt làm giảm sức căng bề mặt, không tạo chất mới.","keywords":"tạo bọt hiện tượng vật lý","chapter":10},{"number":16,"question":"Dung môi thích hợp trong chiết xuất, phân lập flavonoid","options":["Chloroform","Ethyl acetat","Cồn 96%","Nước"],"answer":"B","explanation":"Ethyl acetat thường dùng phân bố và phân lập nhiều flavonoid aglycon có độ phân cực trung bình.","keywords":"phân lập flavonoid EtOAc","chapter":10},{"number":17,"question":"Tính chất KHÔNG phải của saponin","options":["Độc với cá","Tạo bọt bền khi lắc với nước","Vị đắng và gây kích ứng","Có mùi thơm"],"answer":"D","explanation":"Saponin thường có vị đắng, gây kích ứng và độc với cá; mùi thơm không phải tính chất đặc trưng.","keywords":"saponin không đặc trưng mùi thơm","chapter":10},{"number":18,"question":"Muốn chiết anthraquinon có thể dùng các dung môi sau, NGOẠI TRỪ","options":["Chloroform","Methanol","Nước sôi","Cồn 96%"],"answer":"C","explanation":"Anthraquinon tự do kém tan trong nước sôi nhưng tan trong dung môi hữu cơ như chloroform, methanol và ethanol.","keywords":"anthraquinon tự do nước sôi","chapter":10},{"number":19,"question":"Rutin có tính chất","options":["Phát huỳnh quang","Đổi màu theo pH","Dương tính Borntrager","Dương tính với Mg/HCl đậm đặc"],"answer":"D","explanation":"Rutin là flavonol glycosid nên dương tính với phản ứng Cyanidin dùng Mg/HCl.","keywords":"rutin Mg/HCl dương tính","chapter":10},{"number":20,"question":"Viết lại pha động Ethyl acetat 40 ml, HCOOH 1 ml, Methanol 10 ml","options":["EtOAc:HCOOH:MeOH (4:0,1:1)","EtOAc-MeOH-HCOOH (4:1:0,1)","EtOAc-MeOH-HCOOH (4:0,1:1)","EtOAc:HCOOH:MeOH (4:0,1:1)"],"answer":"B","explanation":"Rút gọn 40:10:1 thành 4:1:0,1 và viết đúng thứ tự EtOAc-MeOH-HCOOH.","keywords":"40:10:1 4:1:0,1","chapter":10},{"number":21,"question":"Vai trò của FeCl3 1% trong định tính tanin","options":["Thuốc thử phân biệt","Dung môi chiết","Thuốc thử đặc trưng","Tác nhân xúc tác"],"answer":"C","explanation":"FeCl3 tạo phức màu xanh đen hoặc xanh rêu với nhóm phenol của tanin, dùng làm thuốc thử đặc trưng.","keywords":"tanin + FeCl3 màu đặc trưng","chapter":10},{"number":22,"question":"Tính chất KHÔNG phải của flavonoid","options":["Thường có màu","Cấu trúc chủ yếu thuộc khung gamma-pyron","Là polyphenol","Có mùi thơm"],"answer":"D","explanation":"Flavonoid là polyphenol thường có màu, nhưng mùi thơm không phải tính chất chung đặc trưng.","keywords":"flavonoid không đặc trưng mùi thơm","chapter":10},{"number":23,"question":"Sản phẩm khi cho dịch chiết coumarin phản ứng NaOH 10%, đun cách thủy","options":["Đóng vòng","Coumarat","Cis","Trans"],"answer":"B","explanation":"Kiềm mở vòng lacton, tạo muối coumarat/coumarinat tan trong nước.","keywords":"coumarin + NaOH coumarat","chapter":10},{"number":24,"question":"Chọn phát biểu ĐÚNG","options":["Sapogenin tan kém hơn saponin trong dung môi hữu cơ kém phân cực","Sapogenin kém tan trong CHCl3, EtOAc","Saponosid tan chuyên biệt trong EtOAc","Saponosid tan tốt trong hexan, CHCl3"],"answer":"B","explanation":"Trong các phương án nguồn, không có lựa chọn hoàn toàn chuẩn. Về lý thuyết, sapogenin tan tốt hơn saponin trong CHCl3/EtOAc, còn saponosid kém tan trong dung môi kém phân cực. Cần kiểm tra lại câu này với giảng viên.","keywords":"câu nguồn có dấu hiệu lỗi đáp án","chapter":10},{"number":25,"question":"Sau khi mở vòng lacton, soi UV365 thấy nửa sáng và nửa tối tương ứng","options":["Đóng vòng - mở vòng","Trans - cis","Cis - trans","Coumarinat - coumarat"],"answer":"B","explanation":"Dạng trans phát huỳnh quang mạnh hơn nên sáng; dạng cis yếu hơn nên tối.","keywords":"trans sáng - cis tối","chapter":10},{"number":26,"question":"Trong phản ứng định tính vòng gamma-pyron của flavonoid, khi Mg dư sẽ có hiện tượng","options":["Dung dịch xanh","Xuất hiện tủa","Tinh thể vàng sáng","Dung dịch đỏ"],"answer":"D","explanation":"Mg/HCl khử flavonoid tạo sản phẩm anthocyanidin màu đỏ; Mg dư không làm mất màu phản ứng.","keywords":"Cyanidin màu đỏ","chapter":10},{"number":27,"question":"Trong định tính flavonoid, phản ứng với FeCl3 1% là của","options":["Vòng gamma-pyron","Vòng lacton","Vòng benzen","Nhóm OH-phenol"],"answer":"D","explanation":"FeCl3 tạo phức với các nhóm hydroxyl phenol của flavonoid.","keywords":"FeCl3 OH-phenol","chapter":10},{"number":28,"question":"Dịch chiết hoa Hòe trong cồn tác dụng diazo cho","options":["Tủa vàng đục","Huỳnh quang UV365","Phức xanh đen","Màu đỏ cam"],"answer":"D","explanation":"Rutin ghép cặp diazo trong môi trường kiềm tạo phẩm màu azo đỏ cam.","keywords":"Hòe + diazo đỏ cam","chapter":10},{"number":29,"question":"Phản ứng với dung dịch protein cho hiện tượng","options":["Tủa xanh rêu","Tăng màu","Tủa, đục hơn so với ống chứng","Tủa xanh đen"],"answer":"C","explanation":"Tanin kết hợp với protein tạo phức không tan làm dung dịch đục hoặc xuất hiện tủa.","keywords":"tanin + protein tủa đục","chapter":10},{"number":30,"question":"Phản ứng Liebermann gồm","options":["CHCl3, AcOH, H2SO4 đậm đặc","CHCl3, Ac2O, H2SO4 đậm đặc","CHCl3, ether ethylic, H2SO4 đậm đặc","CHCl3, aldehyd acetic, H2SO4 đậm đặc"],"answer":"B","explanation":"Phản ứng Liebermann-Burchard dùng chloroform, anhydrid acetic và H2SO4 đậm đặc.","keywords":"Liebermann-Burchard CHCl3 + Ac2O + H2SO4","chapter":10},{"number":31,"question":"Phản ứng đặc hiệu để định tính vòng gamma-pyron","options":["Borntrager","Cyanidin","Vi thăng hoa","Huỳnh quang trong kiềm"],"answer":"B","explanation":"Phản ứng Cyanidin dùng Mg/HCl đặc trưng cho hệ gamma-pyron của nhiều flavonoid.","keywords":"gamma-pyron Cyanidin","chapter":10},{"number":32,"question":"Phản ứng KHÔNG dùng trong phân biệt tanin","options":["Tủa với protein","Tủa với brom","Tủa với thuốc thử Stiasny","Tủa với FeCl3 1%"],"answer":"D","explanation":"FeCl3 chủ yếu cho phản ứng màu, không phải phản ứng tủa dùng để phân biệt các loại tanin.","keywords":"FeCl3 màu, không phải tủa phân biệt","chapter":10},{"number":33,"question":"Tanin thủy phân được có","options":["Cầu nối ester","Không có OH liền kề","Cầu nối C-C","Là tanin ngưng tụ"],"answer":"A","explanation":"Tanin thủy phân chứa các liên kết ester giữa đường và acid phenolic, dễ bị thủy phân bởi acid hoặc enzyme.","keywords":"tanin thủy phân liên kết ester","chapter":10},{"number":34,"question":"Phát biểu sai về tính chất hóa học chung của flavonoid","options":["Nhân benzopyrylium của anthocyanidin có tính kiềm mạnh nhất","Tính kiềm do vòng B quy định","Có tính lưỡng tính","Vừa có tính oxy hóa vừa có tính khử"],"answer":"B","explanation":"Tính base của flavonoid liên quan dị vòng chứa oxy, không do vòng B benzen quy định.","keywords":"tính kiềm flavonoid dị vòng, không do vòng B","chapter":10},{"number":35,"question":"Chiết Ngũ bội tử bằng ether rồi thử gelatin và brom. Hiện tượng","options":["Gelatin tủa; brom tủa","Gelatin tủa; brom không đổi","Gelatin tủa; xanh đen","Gelatin không tủa; brom không đổi"],"answer":"D","explanation":"Tanin của Ngũ bội tử rất phân cực, không được chiết đáng kể bằng ether, nên dịch ether không cho phản ứng với gelatin hay brom.","keywords":"Ngũ bội tử tanin không chiết bằng ether","chapter":10},{"number":36,"question":"Hợp chất có tính vi thăng hoa","options":["Tanin","Saponin","Coumarin","Flavonoid"],"answer":"C","explanation":"Coumarin có phân tử nhỏ, dễ bay hơi và có khả năng thăng hoa.","keywords":"coumarin vi thăng hoa","chapter":10},{"number":37,"question":"Cho nước vào dịch chiết cồn thấy trong; thêm NaOH đun thấy đục. Dược liệu có","options":["Anthranoid","Flavonoid","Không xác định","Coumarin"],"answer":"C","explanation":"Hiện tượng này trái với phản ứng coumarin điển hình, trong đó NaOH phải làm dung dịch trong hơn; vì vậy không đủ cơ sở kết luận.","keywords":"hiện tượng không điển hình không xác định","chapter":10},{"number":38,"question":"Thuốc thử dùng trong định tính tanin","options":["Gelatin, Dragendorff","Gelatin, HCl đậm đặc","Gelatin, FeCl3 1%","Dragendorff, FeCl3 1%"],"answer":"C","explanation":"Gelatin kiểm tra khả năng kết tủa protein, còn FeCl3 tạo màu đặc trưng với tanin.","keywords":"tanin gelatin + FeCl3","chapter":10},{"number":39,"question":"H2SO4 25% trong định tính anthranoid dạng kết hợp có vai trò","options":["Trung hòa kiềm dư","Chuyển anthraquinon oxy hóa thành dạng khử","Dung môi chiết","Thủy phân anthraglycosid"],"answer":"D","explanation":"Acid sulfuric thủy phân liên kết glycosid, giải phóng aglycon anthraquinon để chiết và làm phản ứng Borntrager.","keywords":"H2SO4 25% thủy phân glycosid","chapter":10},{"number":40,"question":"Phản ứng định tính anthraquinon, NGOẠI TRỪ","options":["Borntrager","Magnesi acetat/EtOH","Cyanidin","Pyridin/MeOH"],"answer":"C","explanation":"Cyanidin là phản ứng của flavonoid có vòng gamma-pyron, không dùng cho anthraquinon.","keywords":"anthraquinon Cyanidin","chapter":10},{"number":1,"question":"Phản ứng Liebermann-Burchard có vòng nhẫn màu hồng đến đỏ nghĩa là dịch chiết có","options":["Saponin nhóm triterpen","Saponin nhóm steroid","Triterpen","Steroid"],"answer":"A","explanation":"Màu hồng đến đỏ tím thường gợi ý sapogenin triterpen; trong bối cảnh định tính saponin, kết luận phù hợp là saponin triterpen.","keywords":"Liebermann hồng-đỏ saponin triterpen","chapter":11},{"number":2,"question":"Tính chất KHÔNG phải của vòng lacton","options":["Mở vòng trong môi trường kiềm","Là cấu trúc đặc trưng của coumarin","Dễ bị thủy phân","Tan trong nước"],"answer":"D","explanation":"Vòng lacton có thể bị mở bởi kiềm và thủy phân, nhưng coumarin tự do nhìn chung kém tan trong nước.","keywords":"lacton coumarin kém tan nước","chapter":11},{"number":3,"question":"Thuốc thử dùng trong phản ứng Cyanidin","options":["Mg/HCl","AlCl3","Diazonium","NaOH"],"answer":"A","explanation":"Phản ứng Cyanidin/Shinoda dùng Mg và HCl đậm đặc để khử flavonoid tạo màu đỏ/hồng.","keywords":"Cyanidin Mg/HCl","chapter":11},{"number":4,"question":"Cho Rf A=0,85; B=0,90; C=0,52; D=0,63. Sắp xếp độ phân cực tăng dần","options":["C < D < A < B","A < B < C < D","D < C < B < A","B < A < D < C"],"answer":"D","explanation":"Trong TLC pha thuận, Rf càng cao thì chất càng kém phân cực. Do đó độ phân cực tăng dần: B < A < D < C.","keywords":"pha thuận: Rf cao kém phân cực","chapter":11},{"number":5,"question":"Nhận định SAI về flavonoid","options":["Ức chế enzym hyaluronidase","Hay gặp ở Asteraceae, Rutaceae, Theaceae","Phân bố rộng rãi ở động vật và thực vật","Có khả năng bắt giữ gốc tự do"],"answer":"C","explanation":"Flavonoid phân bố chủ yếu trong thực vật, không phân bố rộng rãi ở động vật.","keywords":"flavonoid chủ yếu ở thực vật","chapter":11},{"number":6,"question":"Nhóm dược liệu có chứa coumarin","options":["Bồ kết, Cam thảo","Hoa Hòe, Đậu đen","Măng cụt, Ngũ bội tử","Bạch chỉ, Tiền hồ, Mù u, Sài đất"],"answer":"D","explanation":"Bạch chỉ, Tiền hồ và một số dược liệu như Mù u có các dẫn chất coumarin; các nhóm còn lại nổi bật bởi saponin, flavonoid hoặc tanin.","keywords":"coumarin Bạch chỉ, Tiền hồ","chapter":11},{"number":7,"question":"Anthraquinon có cấu trúc khung","options":["C6-C1-C6","C6-C3","C6-C2-C6","C6-C3-C6"],"answer":"A","explanation":"Khung anthraquinon gồm hai vòng benzen nối qua phần carbonyl trung tâm, thường quy ước C6-C1-C6.","keywords":"anthraquinon C6-C1-C6","chapter":11},{"number":8,"question":"Rutin là","options":["Quercetin-3-O-rutinosid","Quercetin-7-O-rutinosid","Quercetin-5-O-rutinosid","Quercetin-6-O-rutinosid"],"answer":"A","explanation":"Rutin là quercetin-3-O-rutinosid, tức rutinose gắn tại vị trí C3 của quercetin.","keywords":"rutin = quercetin-3-O-rutinosid","chapter":11},{"number":9,"question":"Trong thử nghiệm tạo bọt saponin, thực hiện trong dung môi nào và lắc liên tục bao lâu","options":["Methanol - 15 phút","Methanol - 1 phút","Nước cất - 1 phút","Nước cất - 15 phút"],"answer":"C","explanation":"Mẫu được lắc mạnh với nước cất khoảng 1 phút, sau đó để yên và đánh giá độ bền cột bọt sau 15 phút.","keywords":"lắc nước 1 phút, đọc sau 15 phút","chapter":11},{"number":10,"question":"Dịch chiết Đậu đen trong cồn 25% tác dụng NaOH 1% cho","options":["Phức xanh đen","Vàng huỳnh quang","Dung dịch màu xanh","Tủa vàng đục"],"answer":"C","explanation":"Anthocyanidin đổi màu theo pH; trong môi trường kiềm chuyển sang xanh.","keywords":"anthocyanidin + kiềm xanh","chapter":11},{"number":11,"question":"Chiết Ngũ bội tử bằng ether rồi thử gelatin và FeCl3 1%, hiện tượng","options":["Gelatin tủa; FeCl3 không đổi màu","Gelatin tủa; xanh rêu","Không tủa; không đổi màu","Gelatin tủa; xanh đen"],"answer":"C","explanation":"Tanin Ngũ bội tử rất phân cực, không được chiết đáng kể bằng ether, nên dịch ether không cho phản ứng rõ với gelatin hay FeCl3.","keywords":"tanin Ngũ bội tử không chiết bằng ether","chapter":11},{"number":12,"question":"Chọn dung môi chiết và thuốc thử hiện vết phù hợp kiểm nghiệm saponin bằng TLC","options":["Ethanol - H2SO4 đậm đặc","Methanol - H2SO4 10%","Ethanol - FeCl3 1%","Methanol - FeCl3 1%"],"answer":"B","explanation":"Methanol chiết tốt saponin và H2SO4 10% sau gia nhiệt là thuốc thử hiện màu thông dụng.","keywords":"saponin TLC MeOH + H2SO4 10%","chapter":11},{"number":13,"question":"Tại sao phải để thật khô dung môi hòa mẫu trước khi triển khai TLC saponin","options":["Tăng khả năng phân giải","Tránh Rf thay đổi do dung môi còn sót","Tránh làm rộp bản","Tránh thuốc thử loang"],"answer":"B","explanation":"Dung môi chấm còn sót làm thay đổi môi trường tại điểm xuất phát, gây loang và làm sai lệch Rf.","keywords":"để khô điểm chấm Rf ổn định","chapter":11},{"number":14,"question":"TLC KHÔNG có công dụng","options":["Cho biết đặc điểm chất phân tích","Xác định chính xác khối lượng chất trong mẫu","Sơ bộ cho biết thành phần mẫu","So sánh hai hợp chất có giống nhau không"],"answer":"B","explanation":"TLC chủ yếu dùng định tính, so sánh và kiểm tra tinh khiết; không xác định chính xác khối lượng nếu không có thiết bị định lượng chuyên dụng.","keywords":"TLC không định lượng chính xác","chapter":11},{"number":15,"question":"Ưu điểm của TLC, chọn câu SAI","options":["Độ ổn định cao","Thuận tiện, thao tác dễ","Phân tách tốt hơn sắc ký lỏng","Khả năng lặp lại tương đối tốt"],"answer":"C","explanation":"TLC không phân tách tốt hơn các kỹ thuật sắc ký lỏng hiệu năng cao; ưu thế chính là đơn giản, nhanh và rẻ.","keywords":"TLC không vượt HPLC về phân tách","chapter":11},{"number":16,"question":"Nguyên tắc phản ứng phát huỳnh quang của coumarin","options":["UV365 làm cis chuyển trans","UV254 làm cis chuyển trans","UV365 làm trans chuyển cis","UV254 làm cis chuyển trans"],"answer":"A","explanation":"Dưới UV365, dạng cis chuyển sang trans có huỳnh quang mạnh hơn.","keywords":"coumarin: UV365, cis trans","chapter":11},{"number":17,"question":"Điều kiện để phản ứng diazo xảy ra","options":["pH kiềm yếu","pH kiềm mạnh","pH acid yếu","pH acid mạnh"],"answer":"A","explanation":"Phản ứng ghép cặp diazo với phenol cần môi trường kiềm nhẹ để tạo phenolat nhưng tránh phân hủy thuốc thử.","keywords":"diazo kiềm yếu, nhiệt độ thấp","chapter":11},{"number":18,"question":"Cách quan sát độ đục khi làm phản ứng đóng-mở vòng lacton","options":["Nền đen, nhìn ngang","Nền trắng, nhìn từ trên xuống","Nền trắng, nhìn ngang","Nền đen, nhìn từ trên xuống"],"answer":"C","explanation":"Quan sát ngang trên nền trắng giúp so sánh độ đục giữa hai ống rõ hơn.","keywords":"độ đục nền trắng, nhìn ngang","chapter":11},{"number":19,"question":"Flavonoid có khả năng chuyển màu theo pH","options":["Anthocyanidin","Leucoanthocyanidin","Catechin","Flavonol"],"answer":"A","explanation":"Anthocyanidin có hệ flavylium thay đổi cấu trúc theo pH, tạo màu đỏ-tím-xanh.","keywords":"anthocyanidin đổi màu theo pH","chapter":11},{"number":20,"question":"Phản ứng dùng phân biệt tanin","options":["Tủa với AlCl3 1%","Tủa với protein","Tủa phức với NaOH 10%","Tủa với thuốc thử Stiasny"],"answer":"D","explanation":"Thuốc thử Stiasny dùng phân biệt tanin ngưng tụ với tanin thủy phân; tanin ngưng tụ tạo tủa.","keywords":"phân biệt tanin Stiasny","chapter":11},{"number":21,"question":"Silica gel là","options":["Có nhiều nhóm COOH","Hạt kích thước 1-2 cm","Hợp chất hữu cơ giàu carbon","Chất vô cơ chứa silic"],"answer":"D","explanation":"Silica gel là silicon dioxide ngậm nước, một chất vô cơ có nhiều nhóm silanol bề mặt.","keywords":"silica gel chất vô cơ","chapter":11},{"number":22,"question":"Rf phụ thuộc nhiều yếu tố, NGOẠI TRỪ","options":["Bản chất chất tan và pha động","Độ ẩm môi trường","Nhiệt độ môi trường","Kích thước bản mỏng"],"answer":"D","explanation":"Rf chịu ảnh hưởng bởi chất, pha động, pha tĩnh, nhiệt độ và độ ẩm; kích thước tổng thể của bản không quyết định trực tiếp.","keywords":"Rf không phụ thuộc kích thước bản","chapter":11},{"number":23,"question":"Vết chấm cách mép bản tối thiểu 5 mm để tránh","options":["Chất hấp phụ quá mạnh","Vết đi quá chậm","Hiện tượng bờ","Chất hòa tan vào pha động"],"answer":"C","explanation":"Chấm sát mép làm dòng dung môi không đều, gây hiệu ứng đường bờ.","keywords":"cách mép tránh đường bờ","chapter":11},{"number":24,"question":"Thuốc thử phát hiện vết hợp chất hữu cơ nói chung trong TLC","options":["CoCl3 1%","ZnCl2 1%","AlCl3 1%","Vanillin sulfuric 1%"],"answer":"D","explanation":"Vanillin-sulfuric là thuốc thử hiện màu chung cho nhiều hợp chất hữu cơ.","keywords":"thuốc thử chung VS","chapter":11},{"number":25,"question":"Giới hạn giá trị Rf trong TLC","options":["0 < Rf < 0,5","1 < Rf < 2","0,5 < Rf < 1","0 < Rf < 1"],"answer":"D","explanation":"Rf là tỉ số quãng đường chất đi được trên quãng đường dung môi nên nằm giữa 0 và 1.","keywords":"Rf (0,1)","chapter":11},{"number":26,"question":"Phát biểu SAI về Liebermann-Burchard","options":["Dịch chiết càng đậm, vòng càng rõ","Giúp sơ bộ phân biệt cấu trúc saponin","Phytosterol và glycosid tim có thể dương tính","Môi trường càng khan, vòng càng rõ"],"answer":"A","explanation":"Dịch quá đậm có thể che màu; yếu tố quan trọng là môi trường khan và thao tác tạo lớp đúng.","keywords":"Liebermann khan, không phải càng đậm càng tốt","chapter":11},{"number":27,"question":"Tính chất KHÔNG dùng để định tính saponin","options":["Kích ứng","Độc với cá","Phá huyết","Kết tủa với cholesterol"],"answer":"A","explanation":"Độc với cá, phá huyết và tạo phức với cholesterol có thể dùng nhận biết saponin; kích ứng không phải phép thử định tính chuẩn.","keywords":"saponin: bọt - phá huyết - độc cá - cholesterol","chapter":11},{"number":28,"question":"Phát biểu ĐÚNG về saponin","options":["Tạo bọt bền khi lắc với nước/cồn-nước","Tan trong n-hexan, ether dầu hỏa","A và B đúng","Tan tốt trong n-butanol"],"answer":"A","explanation":"Tạo bọt bền là tính chất đặc trưng. Saponin không tan tốt trong dung môi rất kém phân cực; n-butanol thường dùng phân bố nhưng phát biểu 'tan tốt' phụ thuộc loại.","keywords":"saponin tạo bọt bền","chapter":11},{"number":29,"question":"Ý nghĩa của Rf: đặc trưng cho","options":["Chất phân tích và giá mang","Chất lượng bản","Chất phân tích và pha động sử dụng","Pha tĩnh và pha động"],"answer":"C","explanation":"Trong cùng điều kiện, Rf phản ánh tương tác của chất phân tích với hệ dung môi và pha tĩnh; trong các lựa chọn, C phù hợp nhất.","keywords":"Rf chất + hệ pha động","chapter":11},{"number":30,"question":"Sơ bộ kiểm tra độ tinh khiết chất phân lập bằng TLC","options":["Ba nồng độ mẫu","Ba cách phát hiện","Ba bản kích thước khác nhau","Ba hệ pha động có độ phân cực khác nhau"],"answer":"D","explanation":"Chất được xem tinh khiết đáng tin cậy khi vẫn cho một vết trong nhiều hệ dung môi khác nhau.","keywords":"độ tinh khiết TLC 3 hệ dung môi","chapter":11},{"number":31,"question":"Nhóm chất có thể dùng H2SO4 10%/cồn để hiện màu TLC","options":["Tất cả đúng","Saponin","Anthraquinon","Flavonoid"],"answer":"A","explanation":"H2SO4/cồn là thuốc thử hiện màu rộng, có thể dùng cho cả ba nhóm sau gia nhiệt.","keywords":"H2SO4/cồn thuốc thử chung","chapter":11},{"number":32,"question":"Lưu ý khi chấm mẫu lên bản mỏng, chọn câu SAI","options":["Không nên dùng MeOH vì khó bay hơi","Chấm liên tục làm vết loang","Dùng mao quản tạo vết nhỏ","Làm khan nếu mẫu lẫn nước"],"answer":"A","explanation":"MeOH khá dễ bay hơi và thường dùng hòa mẫu/chấm TLC; nhận định không nên dùng vì khó bay hơi là sai.","keywords":"MeOH dùng được để chấm TLC","chapter":11},{"number":33,"question":"Các chất A, B, C có độ phân cực tăng dần trong TLC pha thuận, quan hệ Rf đúng là","options":["A > B > C","A < B < C","C > B > A","Không xác định"],"answer":"A","explanation":"Trong pha thuận, chất càng phân cực càng bị giữ mạnh và có Rf thấp. Nếu A < B < C về độ phân cực thì Rf A > Rf B > Rf C. Câu nguồn bị lỗi phương án nên đã chuẩn hóa.","keywords":"độ phân cực tăng Rf giảm","chapter":11},{"number":34,"question":"Phân tích chất A bằng n-Hexan-EtOAc (7:3), Rf=0,22. Để tăng Rf cần","options":["Tăng n-hexan","Đổi sang n-hexan-CHCl3 (5:5)","Tăng EtOAc","B và C đúng"],"answer":"C","explanation":"Rf thấp nên cần tăng độ phân cực pha động; tăng EtOAc là biện pháp trực tiếp.","keywords":"Rf thấp tăng EtOAc","chapter":11},{"number":35,"question":"Vết tanin khi nhúng FeCl3/cồn cho màu","options":["Tím đỏ","Xanh dương","Vàng nâu","Xanh đen"],"answer":"D","explanation":"Tanin tạo phức xanh đen hoặc xanh rêu với Fe3+; đáp án chung là xanh đen.","keywords":"tanin + FeCl3 xanh đen","chapter":11},{"number":36,"question":"Để tránh quá tải khi chấm TLC","options":["Tất cả đúng","Giảm số lần chấm","Dùng UV254 đánh giá độ đậm trong một số trường hợp","Pha loãng bằng dung môi phù hợp"],"answer":"A","explanation":"Giảm lượng mẫu, quan sát độ đậm và pha loãng hợp lý đều giúp tránh quá tải.","keywords":"tránh quá tải giảm lượng mẫu","chapter":11},{"number":37,"question":"Khung 9,10-diceton anthracen ở dạng oxy hóa là","options":["Anthraquinon","Anthranol","Dihydroanthranol","Anthron"],"answer":"A","explanation":"Anthraquinon là dạng oxy hóa có hai nhóm carbonyl tại C9 và C10.","keywords":"dạng oxy hóa anthraquinon","chapter":11},{"number":38,"question":"Coumarin có cấu trúc khung nền","options":["C6-C3","C6-C2-C6","C6-C3-C6","(C6-C1)2"],"answer":"A","explanation":"Coumarin thuộc dẫn chất phenylpropanoid, có khung C6-C3.","keywords":"coumarin C6-C3","chapter":11},{"number":39,"question":"Chọn phát biểu SAI về coumarin","options":["Thường kém phân cực","Có khung benzo-alpha-pyron","Có ester ngoại phân tử","Có vòng lacton"],"answer":"C","explanation":"Coumarin có vòng lacton nội phân tử, không phải ester ngoại phân tử.","keywords":"coumarin lacton nội phân tử","chapter":11},{"number":40,"question":"Hợp chất có tính vi thăng hoa","options":["Saponin","Tanin","Flavonoid","Coumarin"],"answer":"D","explanation":"Coumarin có phân tử nhỏ, dễ bay hơi và có khả năng thăng hoa.","keywords":"coumarin vi thăng hoa","chapter":11},{"number":1,"question":"Khi soi bản mỏng silica gel F254 dưới ánh sáng 254 nm","options":["Toàn bộ bản phát quang trừ vết mẫu","Cả bản tắt quang trừ vết mẫu","Giữa bản phát quang sáng nhất","Toàn bộ bản tắt quang"],"answer":"A","explanation":"Nền F254 phát huỳnh quang, còn chất hấp thụ UV254 làm tắt quang nên hiện thành vết tối.","keywords":"UV254 nền sáng, vết tối","chapter":12},{"number":2,"question":"Tính chất KHÔNG dùng để định tính saponin","options":["Phá huyết","Kết tủa với cholesterol","Kích ứng","Độc với cá"],"answer":"C","explanation":"Phá huyết, độc với cá và tạo phức với cholesterol đều có thể hỗ trợ định tính saponin; kích ứng không phải phép thử chuẩn.","keywords":"saponin: bọt - phá huyết - độc cá - cholesterol","chapter":12},{"number":3,"question":"Phân nhóm có màu thay đổi theo pH: acid đỏ, kiềm xanh, trung tính tím","options":["Anthocyanidin","Flavon","Leucoanthocyanidin","Flavanon"],"answer":"A","explanation":"Anthocyanidin chuyển dạng cấu trúc theo pH nên đổi màu rõ rệt.","keywords":"anthocyanidin đổi màu theo pH","chapter":12},{"number":4,"question":"Phát biểu đúng về sapogenin","options":["Tạo bọt bền với nước","Kém tan trong dung môi kém phân cực","Tan trong CHCl3","A và C đúng"],"answer":"C","explanation":"Sapogenin là phần aglycon, kém phân cực hơn saponosid nên tan tốt trong dung môi hữu cơ như chloroform.","keywords":"sapogenin tan CHCl3","chapter":12},{"number":5,"question":"Trong định tính flavonoid, phản ứng tạo phức với FeCl3 1% là của","options":["Vòng lacton","Vòng gamma-pyron","Nhóm OH phenol","Phần đường"],"answer":"C","explanation":"Fe3+ tạo phức màu với các nhóm hydroxyl phenol của flavonoid.","keywords":"FeCl3 OH phenol","chapter":12},{"number":6,"question":"Nhóm hợp chất có màu thay đổi theo pH môi trường","options":["Chalcon","Anthocyanidin","Flavon","Flavan"],"answer":"B","explanation":"Anthocyanidin có màu phụ thuộc pH do chuyển đổi giữa các dạng flavylium, quinonoid và dạng base.","keywords":"anthocyanidin màu phụ thuộc pH","chapter":12},{"number":7,"question":"Phát biểu SAI về Liebermann-Burchard","options":["Dịch chiết càng đậm vòng càng rõ","Môi trường càng khan vòng càng rõ","Phytosterol và glycosid tim cũng có thể dương tính","Giúp sơ bộ phân biệt cấu trúc saponin"],"answer":"A","explanation":"Dịch quá đậm có thể che màu; yếu tố quan trọng là môi trường khan và thao tác tạo lớp đúng.","keywords":"Liebermann khan, không phải càng đậm càng tốt","chapter":12},{"number":8,"question":"Phân nhóm flavonoid dương tính với phản ứng Cyanidin","options":["Flavon và flavanon","Flavanon","Flavon","Anthocyanidin"],"answer":"A","explanation":"Flavon và flavanon đều có thể bị khử bởi Mg/HCl để tạo sản phẩm màu anthocyanidin.","keywords":"Cyanidin flavon + flavanon","chapter":12},{"number":9,"question":"Phát biểu đúng về saponosid","options":["Tan trong n-hexan và ether dầu hỏa","A và B đúng","Tan tốt trong n-butanol","Tạo bọt bền khi lắc với nước/cồn-nước"],"answer":"D","explanation":"Tính tạo bọt bền trong nước là đặc trưng nhất của saponosid; chúng không tan tốt trong dung môi rất kém phân cực.","keywords":"saponosid tạo bọt bền","chapter":12},{"number":10,"question":"Phát biểu SAI về Liebermann-Burchard","options":["Dịch chiết càng đậm vòng càng rõ","Môi trường càng khan vòng càng rõ","Phytosterol và glycosid tim có thể dương tính","Giúp sơ bộ phân biệt cấu trúc saponin"],"answer":"A","explanation":"Dịch quá đậm không bảo đảm vòng rõ, thậm chí làm khó quan sát màu.","keywords":"Liebermann không phải càng đậm càng rõ","chapter":12},{"number":11,"question":"Giới hạn giá trị Rf trong TLC","options":["0 < Rf < 0,5","0,5 < Rf < 1","0 < Rf < 1","1 < Rf < 2"],"answer":"C","explanation":"Rf là tỉ số quãng đường chất đi được trên quãng đường dung môi nên luôn nằm giữa 0 và 1.","keywords":"Rf (0,1)","chapter":12},{"number":12,"question":"Thuốc thử phát hiện vết saponin trong TLC","options":["FeCl3 1%","H2SO4 10%","Hager","HCl 20%"],"answer":"B","explanation":"H2SO4 10% sau gia nhiệt thường được dùng để hiện màu nhiều saponin.","keywords":"saponin TLC H2SO4 10%","chapter":12},{"number":13,"question":"Khi soi bản mỏng silica gel F254 dưới UV254","options":["Toàn bộ bản phát quang trừ vết mẫu","Cả bản tắt quang trừ vết mẫu","Giữa bản sáng nhất","Toàn bộ bản tắt quang"],"answer":"A","explanation":"Nền bản phát huỳnh quang còn chất hấp thụ UV tạo vết tối.","keywords":"F254 nền sáng, vết tối","chapter":12},{"number":14,"question":"Phản ứng Cyanidin là phản ứng khử với tác nhân khử là","options":["Oxygen","Hydrogen","Khí carbonic","Nitrogen"],"answer":"B","explanation":"Mg/HCl tạo hydro mới sinh, đóng vai trò tác nhân khử.","keywords":"Cyanidin hydro mới sinh","chapter":12},{"number":15,"question":"Nhóm OH phenol của flavonoid tác dụng NaOH cho màu","options":["Vàng đậm","Đỏ","Xanh lá","Tím hoa cà"],"answer":"A","explanation":"Trong môi trường kiềm, nhóm phenol ion hóa làm tăng hệ liên hợp và cho màu vàng đậm.","keywords":"flavonoid + NaOH vàng đậm","chapter":12},{"number":16,"question":"Silica gel là","options":["Hạt kích thước 1-2 cm","Có nhiều nhóm COOH","Chất vô cơ chứa silic","Hợp chất hữu cơ giàu carbon"],"answer":"C","explanation":"Silica gel là silicon dioxide ngậm nước, một chất vô cơ có nhiều nhóm silanol trên bề mặt.","keywords":"silica gel chất vô cơ","chapter":12},{"number":17,"question":"Tính chất KHÔNG dùng để định tính saponin","options":["Phá huyết","Kết tủa với cholesterol","Độc với cá","Kích ứng"],"answer":"D","explanation":"Kích ứng không phải phép thử định tính chuẩn cho saponin.","keywords":"saponin không định tính bằng kích ứng","chapter":12},{"number":18,"question":"Vết chấm phải cách mép bản tối thiểu 5 mm để tránh","options":["Vết đi quá chậm","Chất hòa tan vào pha động","Hiện tượng bờ","Chất hấp phụ quá mạnh"],"answer":"C","explanation":"Chấm sát mép làm dòng dung môi không đều và gây hiệu ứng đường bờ.","keywords":"cách mép tránh đường bờ","chapter":12},{"number":19,"question":"Phân nhóm flavonoid dương tính với phản ứng Cyanidin","options":["Flavon","Anthocyanidin","Flavanon","Flavon và flavanon"],"answer":"D","explanation":"Cả flavon và flavanon đều có thể cho phản ứng Cyanidin.","keywords":"Cyanidin flavon + flavanon","chapter":12},{"number":20,"question":"Nhóm OH phenol của flavonoid tác dụng NaOH cho màu","options":["Xanh lá","Tím hoa cà","Đỏ","Vàng đậm"],"answer":"D","explanation":"Kiềm hóa nhóm OH phenol làm tăng màu vàng của flavonoid.","keywords":"NaOH vàng đậm","chapter":12},{"number":21,"question":"Ý nghĩa của Rf: đặc trưng cho","options":["Chất phân tích và pha động sử dụng","Chất phân tích và giá mang","Pha tĩnh và pha động","Chất lượng bản mỏng"],"answer":"A","explanation":"Trong cùng điều kiện, Rf phản ánh mối quan hệ giữa chất phân tích và hệ dung môi/pha tĩnh; trong các lựa chọn, A phù hợp nhất.","keywords":"Rf chất + pha động","chapter":12},{"number":22,"question":"Sơ bộ kiểm tra độ tinh khiết chất phân lập bằng TLC","options":["Ba hệ pha động có độ phân cực khác nhau","Ba bản kích thước khác nhau","Ba nồng độ mẫu","Ba cách phát hiện"],"answer":"A","explanation":"Chất tinh khiết đáng tin cậy phải cho một vết trong nhiều hệ dung môi khác nhau.","keywords":"độ tinh khiết TLC 3 hệ dung môi","chapter":12},{"number":23,"question":"Lưu ý khi chấm mẫu trên bản mỏng, chọn câu SAI","options":["Làm khan nếu mẫu lẫn nước","Không nên dùng MeOH vì khó bay hơi","Dùng mao quản cho vết nhỏ","Chấm liên tục làm vết loang"],"answer":"B","explanation":"MeOH tương đối dễ bay hơi và thường dùng hòa mẫu TLC; phát biểu không nên dùng vì khó bay hơi là sai.","keywords":"MeOH dùng được để chấm TLC","chapter":12},{"number":24,"question":"Để tránh quá tải khi chấm TLC","options":["Pha loãng bằng dung môi phù hợp","Giảm số lần chấm","Dùng UV254 đánh giá độ đậm trong một số trường hợp","Tất cả đúng"],"answer":"D","explanation":"Cả ba biện pháp đều giúp giảm nguy cơ nạp mẫu quá nhiều.","keywords":"tránh quá tải giảm lượng mẫu","chapter":12},{"number":25,"question":"A, B, C có độ phân cực tăng dần trong TLC pha thuận, quan hệ Rf đúng là","options":["A < B","A > C","C > B","A và C đúng"],"answer":"B","explanation":"Trong pha thuận, chất càng phân cực càng bị giữ mạnh và có Rf thấp; do đó Rf(A) > Rf(B) > Rf(C), nên A > C đúng.","keywords":"độ phân cực tăng Rf giảm","chapter":12},{"number":26,"question":"Vết tanin khi nhúng FeCl3/cồn cho màu","options":["Xanh dương","Xanh đen","Vàng nâu","Tím đỏ"],"answer":"B","explanation":"Tanin tạo phức xanh đen hoặc xanh rêu với Fe3+.","keywords":"tanin + FeCl3 xanh đen","chapter":12},{"number":27,"question":"Lưu ý đúng khi chấm mẫu trên bản mỏng","options":["Làm khan nếu mẫu lẫn nước","Chấm liên tục để hấp phụ nhanh","Dùng pipet Pasteur cho vết nhỏ","Không nên dùng MeOH vì khó bay hơi"],"answer":"A","explanation":"Mẫu lẫn nước dễ làm loang vết và ảnh hưởng quá trình khai triển, nên cần làm khan.","keywords":"mẫu TLC không được lẫn nước","chapter":12},{"number":28,"question":"A, B, C có độ phân cực tăng dần trong TLC pha thuận, quan hệ Rf đúng là","options":["A > B","A < C","C > B","B và C đúng"],"answer":"A","explanation":"Rf giảm khi độ phân cực tăng, vì vậy Rf(A) > Rf(B) > Rf(C).","keywords":"A kém phân cực nhất Rf lớn nhất","chapter":12},{"number":29,"question":"Chiết anthranoid dạng aglycon","options":["MeOH","Hỗn hợp cồn-nước","EtOH","Thủy phân acid rồi chiết CHCl3"],"answer":"D","explanation":"Nếu anthranoid ban đầu ở dạng glycosid, cần thủy phân acid để giải phóng aglycon rồi chiết bằng CHCl3.","keywords":"anthraglycosid thủy phân acid CHCl3","chapter":12},{"number":30,"question":"Khung 9,10-diceton anthracen ở dạng oxy hóa là","options":["Dihydroanthranol","Anthron","Anthraquinon","Anthranol"],"answer":"C","explanation":"Anthraquinon là dạng oxy hóa có hai nhóm carbonyl tại C9 và C10.","keywords":"dạng oxy hóa anthraquinon","chapter":12},{"number":31,"question":"Dung môi phù hợp để chiết anthraglycosid","options":["Nước sôi","CHCl3","H2SO4 25%","Tất cả đúng"],"answer":"A","explanation":"Anthraglycosid phân cực nên tan trong nước nóng; CHCl3 dùng cho aglycon, H2SO4 là tác nhân thủy phân chứ không phải dung môi chiết.","keywords":"anthraglycosid nước sôi","chapter":12},{"number":32,"question":"Silica gel là","options":["Hạt 1-2 cm","Hợp chất hữu cơ giàu carbon","Có nhiều nhóm COOH","Chất vô cơ chứa silic"],"answer":"D","explanation":"Silica gel là chất vô cơ nền SiO2 ngậm nước.","keywords":"silica gel chất vô cơ","chapter":12},{"number":33,"question":"Phát biểu đúng về saponosid","options":["Tan trong n-hexan, ether dầu hỏa","Tạo bọt bền với nước/cồn-nước","Tan tốt trong n-butanol","A và B đúng"],"answer":"B","explanation":"Tạo bọt bền là đặc tính điển hình; saponosid không tan trong dung môi rất kém phân cực.","keywords":"saponosid bọt bền","chapter":12},{"number":34,"question":"Tính chất KHÔNG dùng để định tính saponin","options":["Phá huyết","Kích ứng","Kết tủa với cholesterol","Độc với cá"],"answer":"B","explanation":"Kích ứng không phải phép thử định tính chuẩn.","keywords":"saponin không dùng tính kích ứng","chapter":12},{"number":35,"question":"Ý nghĩa của Rf: đặc trưng cho","options":["Chất lượng bản","Chất phân tích và pha động sử dụng","Chất phân tích và giá mang","Pha tĩnh và pha động"],"answer":"B","explanation":"Rf được dùng so sánh chất trong cùng hệ pha động và điều kiện sắc ký.","keywords":"Rf chất + pha động","chapter":12},{"number":36,"question":"Phát biểu SAI về Liebermann-Burchard","options":["Giúp sơ bộ phân biệt cấu trúc saponin","Dịch chiết càng đậm vòng càng rõ","Phytosterol, glycosid tim có thể dương tính","Môi trường càng khan vòng càng rõ"],"answer":"B","explanation":"Dịch quá đậm không làm vòng rõ hơn một cách chắc chắn và có thể che màu.","keywords":"Liebermann không phải càng đậm càng tốt","chapter":12},{"number":37,"question":"Giới hạn Rf trong TLC","options":["1 < Rf < 2","0 < Rf < 1","0 < Rf < 0,5","0,5 < Rf < 1"],"answer":"B","explanation":"Rf là một tỉ số không vượt quá 1.","keywords":"Rf (0,1)","chapter":12},{"number":38,"question":"Phản ứng KHÔNG phải của nhóm OH-phenol","options":["Với H2SO4 10%","Với FeCl3","Tạo phức với kim loại đa hóa trị","Với diazonium"],"answer":"A","explanation":"H2SO4 10% là thuốc thử hiện màu chung, không phải phản ứng đặc hiệu cho OH-phenol.","keywords":"OH-phenol H2SO4 đặc hiệu","chapter":12},{"number":39,"question":"Thuốc thử phát hiện vết hợp chất hữu cơ nói chung trong TLC","options":["ZnCl2 1%","Vanillin sulfuric 1%","CoCl3 1%","AlCl3 1%"],"answer":"B","explanation":"Vanillin-sulfuric là thuốc thử hiện màu rộng cho nhiều nhóm hợp chất hữu cơ.","keywords":"thuốc thử chung VS","chapter":12},{"number":1,"question":"Thành phần thuốc thử của phản ứng Cyanidin","options":["Mg/HCl","NaOH","Chì acetat","FeCl3"],"answer":"A","explanation":"Phản ứng Cyanidin (Shinoda) dùng Mg và HCl đậm đặc để khử flavonoid tạo sản phẩm màu đỏ hoặc hồng.","keywords":"Cyanidin Mg/HCl","chapter":13},{"number":2,"question":"Có thể loại tạp chlorophyll trong dịch chiết bằng cách","options":["Dùng than hoạt","Dùng giấy lọc","Dùng bông lọc","Đun sôi"],"answer":"A","explanation":"Than hoạt hấp phụ mạnh chlorophyll và nhiều sắc tố không mong muốn, giúp làm trong dịch chiết.","keywords":"loại chlorophyll than hoạt","chapter":13},{"number":3,"question":"Khi soi bản mỏng silica gel F254 dưới ánh sáng 254 nm","options":["Giữa bản phát quang sáng nhất","Cả bản tắt quang trừ vết mẫu","Toàn bộ bản tắt quang","Toàn bộ bản phát quang trừ vết mẫu"],"answer":"D","explanation":"Nền F254 phát huỳnh quang, còn chất hấp thụ UV254 làm tắt quang nên hiện thành vết tối.","keywords":"F254 nền sáng, vết tối","chapter":13},{"number":4,"question":"Phát biểu ĐÚNG về sapogenin","options":["Tạo bọt bền khi lắc với nước","Tan được trong CHCl3","A và B đúng","Kém tan trong dung môi kém phân cực như n-hexan"],"answer":"B","explanation":"Sapogenin là phần aglycon, kém phân cực hơn saponosid nên tan tốt trong dung môi hữu cơ như chloroform.","keywords":"sapogenin tan CHCl3","chapter":13},{"number":5,"question":"Phản ứng Cyanidin là phản ứng khử với tác nhân khử là","options":["Oxygen","Khí carbonic","Hydrogen","Nitrogen"],"answer":"C","explanation":"Mg/HCl tạo hydro mới sinh, đóng vai trò tác nhân khử.","keywords":"Cyanidin hydro mới sinh","chapter":13},{"number":6,"question":"Khi chuẩn bị pha động để sắc ký alkaloid, thường thêm","options":["Acid sulfuric","Amoniac","Nước cất","Acid acetic"],"answer":"B","explanation":"Alkaloid là base; thêm amoniac giúp giữ chúng ở dạng base tự do, giảm kéo đuôi và làm vết gọn.","keywords":"alkaloid thêm NH3/NH4OH","chapter":13},{"number":7,"question":"Phát biểu đúng về saponosid","options":["Tan trong n-hexan, ether dầu hỏa","Tan tốt trong n-butanol","A và B đúng","Tạo bọt bền khi lắc với nước hoặc cồn-nước"],"answer":"D","explanation":"Tính tạo bọt bền trong nước là đặc trưng nhất của saponosid; chúng không tan tốt trong dung môi rất kém phân cực.","keywords":"saponosid tạo bọt bền","chapter":13},{"number":8,"question":"Ý nghĩa của tỉ số Rf: đặc trưng cho","options":["Chất phân tích và pha động sử dụng","Pha tĩnh và pha động","Chất lượng bản mỏng","Chất phân tích và giá mang"],"answer":"A","explanation":"Rf chỉ có ý nghĩa so sánh trong cùng hệ sắc ký; trong các lựa chọn, quan hệ giữa chất phân tích và pha động là phù hợp nhất.","keywords":"Rf chất + pha động","chapter":13},{"number":9,"question":"Dung môi KHÔNG dùng để chiết rutin từ dược liệu Hòe","options":["MeOH 80%","EtOH 80%","Hỗn hợp EtOH-H2O","Hỗn hợp CHCl3-EtOAc"],"answer":"D","explanation":"Rutin là glycosid flavonoid khá phân cực, tan tốt trong cồn-nước hoặc methanol; hệ CHCl3-EtOAc quá kém phân cực.","keywords":"rutin phân cực không dùng CHCl3-EtOAc","chapter":13},{"number":10,"question":"Để thực hiện phản ứng Cyanidin, cần có","options":["HCl đậm đặc","NaOH","Mg","Mg và HCl đậm đặc"],"answer":"D","explanation":"Phản ứng cần cả Mg và HCl đậm đặc để tạo hydro mới sinh và khử flavonoid.","keywords":"Cyanidin Mg + HCl đậm đặc","chapter":13},{"number":11,"question":"Dịch chiết coumarin được mở vòng bằng NaOH, chia 2 ống: ống 1 thêm nước, ống 2 thêm HCl đậm đặc. So sánh độ đục","options":["Ống 2 đục hơn","Hai ống đục như nhau","Hai ống trong như nhau","Ống 1 đục hơn"],"answer":"A","explanation":"Ống thêm HCl đóng vòng lacton trở lại, coumarin tự do kém tan nên đục; ống thêm nước vẫn ở dạng muối tan nên trong hơn.","keywords":"HCl đóng vòng đục","chapter":13},{"number":12,"question":"Trong môi trường NaOH 10% và đun nóng, dạng tồn tại của coumarin là","options":["Coumarinat","Đóng vòng","Coumarat","Mở vòng dạng trans"],"answer":"A","explanation":"NaOH mở vòng lacton và tạo muối coumarinat tan trong nước.","keywords":"coumarin + NaOH coumarinat","chapter":13},{"number":13,"question":"Phản ứng Cyanidin định tính phần nào trong khung flavonoid","options":["Vòng gamma-pyron","Nhóm OH phenol","Vòng lacton","Vòng benzen"],"answer":"A","explanation":"Phản ứng Cyanidin đặc trưng cho hệ gamma-pyron của nhiều flavonoid.","keywords":"Cyanidin vòng gamma-pyron","chapter":13},{"number":14,"question":"Chiết dược liệu bằng chloroform, dịch chiết Borntrager dương tính. Nhận định đúng","options":["Có anthraglycosid","Có cả dạng tự do và kết hợp","Có anthranoid dạng tự do","Có anthranoid dạng kết hợp"],"answer":"C","explanation":"Chloroform chiết tốt anthraquinon aglycon tự do; glycosid cần thủy phân trước khi chiết.","keywords":"CHCl3 + Borntrager dương anthranoid tự do","chapter":13},{"number":15,"question":"Khi soi bản mỏng H254 dưới ánh sáng 254 nm","options":["Cả bản tắt quang trừ vết mẫu","Giữa bản phát quang sáng nhất","Toàn bộ bản phát quang trừ vết mẫu","Toàn bộ bản tắt quang"],"answer":"A","explanation":"Bản H254 là loại không có chất chỉ thị huỳnh quang; theo cách diễn đạt của nguồn, nền tắt quang và vết hấp thụ có thể hiện tương phản. Câu này phụ thuộc loại bản dùng trong bài thực hành.","keywords":"H254 theo dõi đúng loại bản thực hành","chapter":13},{"number":16,"question":"Khi chuẩn bị pha động để sắc ký alkaloid, thường thêm","options":["Amoniac","Acid acetic","Acid sulfuric","Nước cất"],"answer":"A","explanation":"Amoniac giúp alkaloid ở dạng base tự do, giảm tương tác ion với silica và hạn chế kéo đuôi.","keywords":"alkaloid thêm amoniac","chapter":13},{"number":17,"question":"Sau khi chiết bằng cồn 96%, ống 1 thêm NaOH 10% và đun, ống 2 thêm nước. Phát biểu đúng","options":["Ống 1 đục hơn ống 2 có coumarin","Ống 1 trong hơn ống 2 có coumarin","Hai ống trong như nhau có coumarin","Hai ống đục như nhau có coumarin"],"answer":"B","explanation":"NaOH mở vòng lacton tạo muối tan, nên ống kiềm trong hơn ống chỉ thêm nước.","keywords":"coumarin + kiềm trong hơn","chapter":13},{"number":18,"question":"Thuốc thử phát hiện rutin bằng TLC","options":["KOH/MeOH","FeCl3 1%/nước","KOH/nước","FeCl3 1%/cồn"],"answer":"D","explanation":"Rutin có nhiều nhóm phenol nên tạo phức màu với FeCl3 trong cồn.","keywords":"rutin + FeCl3/cồn","chapter":13},{"number":19,"question":"A, B, C có độ phân cực tăng dần trong TLC pha thuận, quan hệ Rf đúng là","options":["A < B","A và C đúng","A > C","C > B"],"answer":"C","explanation":"Trong pha thuận, chất càng phân cực càng bị giữ mạnh và có Rf thấp; do đó Rf(A) > Rf(B) > Rf(C).","keywords":"độ phân cực tăng Rf giảm","chapter":13},{"number":20,"question":"Để tránh quá tải khi chấm TLC","options":["Giảm số lần chấm","Dùng UV254 đánh giá độ đậm trong một số trường hợp","Pha loãng mẫu bằng dung môi phù hợp","Tất cả đúng"],"answer":"D","explanation":"Cả ba biện pháp đều giúp kiểm soát lượng mẫu nạp lên bản.","keywords":"tránh quá tải giảm lượng mẫu","chapter":13},{"number":21,"question":"Phân tích A bằng n-hexan-EtOAc (7:3), Rf=0,22. Để tăng Rf cần","options":["Tăng tỉ lệ EtOAc","B và C đúng","Đổi sang n-hexan-CHCl3 (5:5)","Tăng tỉ lệ n-hexan"],"answer":"A","explanation":"Rf thấp nên cần tăng độ phân cực pha động; tăng EtOAc là biện pháp trực tiếp.","keywords":"Rf thấp tăng EtOAc","chapter":13},{"number":22,"question":"Nhóm chất có thể dùng H2SO4 10%/cồn để hiện màu trong TLC","options":["Flavonoid","Tất cả đúng","Anthraquinon","Saponin"],"answer":"B","explanation":"H2SO4/cồn là thuốc thử hiện màu khá rộng, dùng được cho flavonoid, anthraquinon và saponin sau gia nhiệt.","keywords":"H2SO4/cồn thuốc thử chung","chapter":13},{"number":23,"question":"Lưu ý khi chấm mẫu trên bản mỏng, chọn câu SAI","options":["Dùng mao quản để vết nhỏ gọn","Làm khan nếu mẫu lẫn nước","Không nên dùng MeOH vì khó bay hơi","Chấm liên tục dễ làm vết loang"],"answer":"C","explanation":"MeOH tương đối dễ bay hơi và thường dùng hòa mẫu TLC; phát biểu không nên dùng vì khó bay hơi là sai.","keywords":"MeOH dùng được trong TLC","chapter":13},{"number":24,"question":"Sau khi chiết bằng cồn 96%, ống 1 thêm NaOH 10% và đun, ống 2 thêm nước. Phát biểu đúng","options":["Hai ống đục như nhau có coumarin","Ống 1 trong hơn ống 2 có coumarin","Hai ống trong như nhau có coumarin","Ống 1 đục hơn ống 2 có coumarin"],"answer":"B","explanation":"Ống NaOH tạo muối coumarinat tan nên trong hơn ống thêm nước.","keywords":"ống kiềm trong hơn coumarin","chapter":13},{"number":25,"question":"Hợp chất có tính vi thăng hoa","options":["Coumarin","Tanin","Saponin","Flavonoid"],"answer":"A","explanation":"Coumarin có phân tử nhỏ, dễ bay hơi và có thể thăng hoa.","keywords":"coumarin vi thăng hoa","chapter":13},{"number":26,"question":"Dung môi phù hợp để chiết anthraglycosid","options":["Tất cả đúng","Nước sôi","CHCl3","H2SO4 25%"],"answer":"B","explanation":"Anthraglycosid phân cực nên tan trong nước nóng; CHCl3 dùng cho aglycon, H2SO4 là tác nhân thủy phân.","keywords":"anthraglycosid nước sôi","chapter":13},{"number":27,"question":"Viết lại pha động EtOAc 40%, n-hexan 50%, MeOH 10%","options":["EtOAc:n-hexan:MeOH (40:50:10)","EtOAc-n-hexan-MeOH (40:50:10)","n-Hexan:EtOAc:MeOH (50:40:10)","n-Hexan-EtOAc-MeOH (50:40:10)"],"answer":"D","explanation":"Viết dung môi theo thứ tự tỉ lệ giảm dần: n-hexan 50, EtOAc 40, MeOH 10.","keywords":"50:40:10 n-hexan-EtOAc-MeOH","chapter":13},{"number":28,"question":"Thuốc thử có thể áp dụng cho hầu hết hợp chất hữu cơ","options":["Vanillin-sulfuric","NaOH/MeOH","FeCl3/cồn","Dragendorff"],"answer":"A","explanation":"Vanillin-sulfuric là thuốc thử hiện màu chung, phản ứng với nhiều nhóm hợp chất hữu cơ.","keywords":"thuốc thử chung VS","chapter":13},{"number":29,"question":"Thuốc thử VS là","options":["Vanillin 10%/EtOH + H2SO4 1%/EtOH (1:1, v/v)","Vanillin 10%/EtOH + H2SO4 1%/EtOH (1:1, v/v)","Vanillin 1%/EtOH + H2SO4 10%/EtOH (1:1, v/v)","Vanillin 1%/EtOH + H2SO4 10%/EtOH (1:1, g/g)"],"answer":"C","explanation":"Công thức thực hành thường dùng vanillin 1% và H2SO4 10% trong ethanol, phối hợp theo thể tích 1:1.","keywords":"VS = vanillin 1% + H2SO4 10%","chapter":13},{"number":30,"question":"Cùng một mẫu, pha động nào cho các vết có Rf cao nhất","options":["n-Hexan-DCM (7:3)","n-Hexan-CHCl3 (7:3)","n-Hexan-EtOAc (8:2)","n-Hexan-aceton (8:2)"],"answer":"D","explanation":"Aceton phân cực mạnh hơn EtOAc, DCM và CHCl3; hệ chứa aceton có sức rửa giải lớn hơn nên thường cho Rf cao hơn.","keywords":"Rf cao pha động phân cực mạnh hơn","chapter":13},{"number":31,"question":"Phát biểu SAI về bình sắc ký","options":["Có thể bão hòa nhanh bằng giấy lọc","Không bão hòa làm tách kém hiệu quả","Thời gian khai triển nhanh hơn khi bình bão hòa","Một số trường hợp đặc biệt không cần bão hòa"],"answer":"C","explanation":"Bão hòa bình giúp ổn định điều kiện và độ lặp lại, nhưng không thể khẳng định luôn làm thời gian khai triển nhanh hơn.","keywords":"bão hòa bình ổn định, không nhất thiết nhanh hơn","chapter":13},{"number":32,"question":"Acid formic (1), aceton (2), CHCl3 (3), EtOAc (4): sắp xếp độ phân cực tăng dần","options":["2 < 4 < 3 < 1","3 < 4 < 1 < 2","3 < 4 < 2 < 1","1 < 2 < 3 < 4"],"answer":"C","explanation":"Trong nhóm này: CHCl3 kém phân cực nhất, sau đó EtOAc, aceton và acid formic phân cực nhất.","keywords":"CHCl3 < EtOAc < aceton < HCOOH","chapter":13},{"number":33,"question":"Rf A=0,85; B=0,90; C=0,52; D=0,63. Sắp xếp độ phân cực tăng dần","options":["C < D < A < B","B < A < D < C","D < C < B < A","A < B < C < D"],"answer":"B","explanation":"Trong TLC pha thuận, Rf càng cao thì chất càng kém phân cực. Do đó tăng dần độ phân cực: B < A < D < C.","keywords":"Rf cao kém phân cực","chapter":13},{"number":34,"question":"Cơ chế chính của TLC","options":["Hấp phụ giữa pha rắn và pha lỏng","Phân bố giữa pha rắn và pha lỏng","Hấp phụ giữa hai pha lỏng","Phân bố giữa hai pha lỏng"],"answer":"A","explanation":"TLC pha thuận thông dụng dùng pha tĩnh rắn silica gel và pha động lỏng; cơ chế chính là hấp phụ - giải hấp.","keywords":"TLC pha thuận hấp phụ rắn-lỏng","chapter":13},{"number":35,"question":"Cùng một mẫu, pha động nào cho các vết có Rf thấp nhất","options":["n-Hexan-CHCl3 (7:3)","n-Hexan-aceton (8:2)","n-Hexan-EtOAc (8:2)","n-Hexan-DCM (7:3)"],"answer":"A","explanation":"Hệ n-hexan-CHCl3 có sức rửa giải thấp hơn các hệ chứa DCM, EtOAc hoặc aceton, nên thường cho Rf thấp nhất.","keywords":"Rf thấp pha động kém phân cực","chapter":13},{"number":36,"question":"Quan sát bản mỏng F254 dưới UV365, chọn câu đúng","options":["Vết UV màu đen trên nền xanh lục","Vết phát huỳnh quang trên nền đen","Vết UV365 không có trên UV254","Tất cả chất đều cho vết dưới UV365"],"answer":"B","explanation":"Ở UV365, các chất phát huỳnh quang hiện thành vết sáng trên nền tối.","keywords":"UV365 vết huỳnh quang sáng","chapter":13},{"number":37,"question":"Trong thử nghiệm vi thăng hoa anthranoid, tinh thể bám trên lam kính ở dạng","options":["Anthraquinon","Anthron","Anthraglycosid","Dihydroanthranol"],"answer":"A","explanation":"Anthraquinon tự do có khả năng thăng hoa và kết tinh lại trên lam kính.","keywords":"vi thăng hoa anthranoid anthraquinon","chapter":13},{"number":38,"question":"Khi chuẩn bị pha động để sắc ký alkaloid, thường thêm","options":["Acid sulfuric","Nước cất","Acid acetic","Amoniac"],"answer":"D","explanation":"Amoniac làm alkaloid ở dạng base tự do, giảm kéo đuôi trên silica.","keywords":"alkaloid thêm amoniac","chapter":13},{"number":39,"question":"Câu nào sau đây SAI về coumarin","options":["Dễ bị mở vòng bởi kiềm","Thường tan tốt trong nước","Thường tồn tại dạng aglycon","Dạng mở vòng cis phát huỳnh quang yếu dưới UV365"],"answer":"B","explanation":"Coumarin tự do thường kém tan trong nước và tan tốt hơn trong dung môi hữu cơ.","keywords":"coumarin kém tan nước","chapter":13},{"number":40,"question":"Tính chất KHÔNG phải của coumarin","options":["Tan tốt trong nước","Có mùi thơm","Tăng huỳnh quang trong môi trường kiềm","Thăng hoa"],"answer":"A","explanation":"Coumarin tự do kém tan trong nước; các tính chất còn lại là đặc trưng thường gặp.","keywords":"coumarin không tan tốt trong nước","chapter":13},{"number":1,"question":"Trong thử nghiệm vi thăng hoa anthranoid, tinh thể bám trên lam kính ở dạng","options":["Anthron","Anthraquinon","Anthraglycosid","Dihydroanthranol"],"answer":"B","explanation":"Anthraquinon tự do có khả năng thăng hoa và kết tinh lại trên lam kính; dạng glycosid không thăng hoa trực tiếp.","keywords":"vi thăng hoa anthranoid anthraquinon","chapter":14},{"number":2,"question":"Tính chất KHÔNG phải của coumarin","options":["Có mùi thơm","Tan tốt trong nước","Tăng huỳnh quang trong môi trường kiềm","Thăng hoa"],"answer":"B","explanation":"Coumarin tự do thường kém tan trong nước nhưng tan tốt hơn trong ethanol và dung môi hữu cơ.","keywords":"coumarin kém tan nước","chapter":14},{"number":3,"question":"Dưới UV bao nhiêu nm, coumarin chuyển từ dạng nào sang dạng nào có huỳnh quang mạnh hơn","options":["254 nm: trans cis","254 nm: cis trans","365 nm: cis trans","365 nm: trans cis"],"answer":"C","explanation":"Dưới UV365, dạng cis chuyển sang dạng trans có huỳnh quang mạnh hơn.","keywords":"UV365: cis trans","chapter":14},{"number":4,"question":"Trong TLC, thuốc thử phát hiện vết hợp chất hữu cơ nói chung","options":["ZnCl2 1%","AlCl3 1%","Vanillin-sulfuric 1%","CoCl3 1%"],"answer":"C","explanation":"Vanillin-sulfuric là thuốc thử hiện màu rộng, áp dụng cho nhiều nhóm hợp chất hữu cơ.","keywords":"thuốc thử chung VS","chapter":14},{"number":5,"question":"Chiết dược liệu chứa anthranoid bằng toluen (d<1), thêm NaOH loãng; lớp kiềm ở vị trí","options":["Trên","Giữa","Không xác định","Dưới"],"answer":"D","explanation":"Toluen nhẹ hơn nước nên nằm trên; lớp NaOH có khối lượng riêng lớn hơn nằm dưới.","keywords":"toluen trên - kiềm dưới","chapter":14},{"number":6,"question":"Dưới UV bao nhiêu nm, coumarin chuyển từ dạng nào sang dạng nào có huỳnh quang mạnh hơn","options":["254 nm: cis trans","365 nm: cis trans","365 nm: trans cis","254 nm: trans cis"],"answer":"B","explanation":"UV365 thúc đẩy chuyển cis sang trans, dạng trans phát huỳnh quang mạnh hơn.","keywords":"UV365 trans sáng hơn","chapter":14},{"number":7,"question":"Muốn chạy TLC anthranoid dạng glycosid nên dùng pha động","options":["Kém phân cực, thêm kiềm","Phân cực, thêm acid","Kém phân cực, thêm acid","Phân cực, thêm kiềm"],"answer":"B","explanation":"Anthraglycosid phân cực nên cần pha động phân cực; thêm acid giúp hạn chế ion hóa nhóm phenol và làm vết gọn hơn.","keywords":"anthraglycosid pha động phân cực + acid","chapter":14},{"number":8,"question":"Phản ứng Liebermann-Burchard gồm","options":["CHCl3, ether, H2SO4 đậm đặc","CHCl3, aldehyd acetic, H2SO4 đậm đặc","CHCl3, Ac2O, H2SO4 đậm đặc","CHCl3, AcOH, H2SO4 đậm đặc"],"answer":"C","explanation":"Thuốc thử gồm chloroform, anhydrid acetic và acid sulfuric đậm đặc.","keywords":"Liebermann-Burchard CHCl3 + Ac2O + H2SO4","chapter":14},{"number":9,"question":"Chiết dược liệu chứa anthranoid bằng toluen (d<1), thêm NaOH loãng; lớp kiềm ở vị trí","options":["Giữa","Trên","Dưới","Không xác định"],"answer":"C","explanation":"Toluen nhẹ hơn nước nên ở lớp trên; lớp kiềm nằm dưới.","keywords":"lớp kiềm dưới","chapter":14},{"number":10,"question":"Phát biểu đúng về saponosid","options":["Tan tốt trong n-butanol","Tạo bọt bền khi lắc với nước/cồn-nước","A và B đúng","Tan trong n-hexan, ether dầu hỏa"],"answer":"B","explanation":"Tạo bọt bền là tính chất đặc trưng nhất. n-Butanol thường dùng phân bố saponin nhưng phát biểu 'tan tốt' phụ thuộc loại, nên đáp án chắc chắn nhất là B.","keywords":"saponosid tạo bọt bền","chapter":14},{"number":11,"question":"Câu nào sau đây SAI về coumarin","options":["Thường tan tốt trong nước","Dễ bị mở vòng bởi kiềm","Dạng mở vòng cis phát huỳnh quang yếu dưới UV365","Thường tồn tại dạng aglycon"],"answer":"A","explanation":"Coumarin tự do thường kém tan trong nước; các mệnh đề còn lại phù hợp với tính chất chung.","keywords":"coumarin không tan tốt trong nước","chapter":14},{"number":12,"question":"Phát biểu ĐÚNG về sapogenin","options":["Tan được trong CHCl3","Tạo bọt bền khi lắc với nước","Kém tan trong dung môi kém phân cực như n-hexan","A và B đúng"],"answer":"A","explanation":"Sapogenin là aglycon, kém phân cực hơn saponosid nên tan trong chloroform; khả năng tạo bọt kém hơn saponin.","keywords":"sapogenin tan CHCl3","chapter":14},{"number":13,"question":"Muốn chạy TLC anthranoid dạng glycosid nên dùng pha động","options":["Phân cực, thêm kiềm","Kém phân cực, thêm kiềm","Phân cực, thêm acid","Kém phân cực, thêm acid"],"answer":"C","explanation":"Anthraglycosid phân cực; môi trường acid hạn chế ion hóa nhóm phenol và giảm kéo đuôi.","keywords":"anthraglycosid phân cực + acid","chapter":14},{"number":14,"question":"Ngoài saponin, nhóm chất nào cũng có khả năng tạo bọt","options":["Glycosid tim","Sapogenin","Coumarin","Anthraglycosid"],"answer":"A","explanation":"Một số glycosid tim có tính hoạt động bề mặt và có thể tạo bọt, dù không đặc trưng bằng saponin.","keywords":"tạo bọt không tuyệt đối riêng cho saponin","chapter":14},{"number":15,"question":"Dược liệu chứa saponin và sapogenin. Nếu thay cồn 70% bằng CHCl3 thì hiện tượng định tính","options":["Tạo bọt âm; Liebermann dương","Tạo bọt dương; Liebermann âm","Tạo bọt âm; Liebermann âm","Tạo bọt dương; Liebermann dương"],"answer":"A","explanation":"CHCl3 ưu tiên chiết sapogenin nên thử bọt âm; sapogenin vẫn có thể dương tính với Liebermann-Burchard.","keywords":"CHCl3 chiết sapogenin bọt âm, Liebermann dương","chapter":14},{"number":16,"question":"Chiết dược liệu bằng chloroform, dịch chiết Borntrager dương tính. Nhận định đúng","options":["Có anthraglycosid","Có anthranoid dạng tự do","Có anthranoid dạng kết hợp","Có cả hai dạng"],"answer":"B","explanation":"Chloroform chiết tốt anthraquinon aglycon tự do; glycosid cần thủy phân trước khi chiết.","keywords":"CHCl3 + Borntrager dương anthranoid tự do","chapter":14},{"number":17,"question":"Đối với anthranoid, phản ứng định tính đặc trưng nhất","options":["Diazo","Cyanidin","Borntrager","Liebermann-Burchard"],"answer":"C","explanation":"Borntrager là phản ứng đặc trưng cho anthraquinon, cho lớp kiềm màu đỏ/hồng.","keywords":"anthranoid Borntrager","chapter":14},{"number":18,"question":"Nhóm dược liệu cùng có saponin. Chọn câu SAI","options":["Tam thất, Cát cánh","Cam thảo, Tỳ giải","Mạch môn, Ngũ gia bì","Ngũ gia bì, Đại hoàng"],"answer":"D","explanation":"Đại hoàng nổi bật với anthranoid, không phải dược liệu điển hình chứa saponin.","keywords":"Đại hoàng anthranoid","chapter":14},{"number":19,"question":"Lưu ý về pha động CHCl3-MeOH-H2O (65:35:10)","options":["Hệ không hỗn hòa nên để ổn định tối thiểu 30 phút","Chỉ lấy lớp trên chứa nước","Khai triển chậm do CHCl3 nhớt","Tất cả đúng"],"answer":"A","explanation":"Hệ có thể phân lớp nên cần để ổn định trước khi lấy lớp được chỉ định; lớp trên chứa nhiều nước thường không dùng làm pha động chính.","keywords":"hệ phân lớp để ổn định","chapter":14},{"number":20,"question":"Lưu ý về pha động CHCl3-MeOH-H2O (65:35:10)","options":["Hệ không hỗn hòa nên để ổn định tối đa 30 phút","Chỉ lấy lớp dưới làm pha động","Khai triển nhanh do nước làm giảm độ nhớt","Tất cả đúng"],"answer":"B","explanation":"Trong thực hành thường để hệ phân lớp rồi lấy lớp dưới làm pha động; hai mệnh đề còn lại có cách diễn đạt chưa chuẩn.","keywords":"CHCl3-MeOH-H2O lấy lớp dưới","chapter":14},{"number":21,"question":"Anthranoid là những glycosid mà phần aglycon là dẫn chất của","options":["9,10-diceton anthracen","9,10-dihydroxyanthracen","9,10-dihydroxyanthraquinon","Anthraglycosid"],"answer":"A","explanation":"Khung anthraquinon cơ bản là anthracen-9,10-dion, tức 9,10-diceton anthracen. Phần lựa chọn của câu này bị thiếu trong PDF nguồn và đã được khôi phục theo câu hỏi lặp ở các đề trước.","keywords":"câu nguồn bị cắt; anthranoid 9,10-diceton anthracen","chapter":14},{"chapter":15,"number":1,"question":"Carbohydrat được định nghĩa phù hợp nhất là","options":["Chỉ các monosaccharid có công thức Cn(H2O)n","Các hợp chất hữu cơ gồm monosaccharid, dẫn chất hoặc sản phẩm ngưng tụ của chúng","Chỉ các polysaccharid có trong thực vật","Mọi chất có công thức Cn(H2O)n"],"answer":"B","explanation":"Slide nhấn mạnh công thức Cn(H2O)n không hoàn toàn chính xác cho mọi đường; định nghĩa đúng phải bao gồm monosaccharid, dẫn chất và sản phẩm ngưng tụ của chúng.","keywords":"carbohydrat = mono + dẫn chất + sản phẩm ngưng tụ"},{"chapter":15,"number":2,"question":"Tỉ lệ carbohydrat tính theo trọng lượng khô ở thực vật thường khoảng","options":["<2%","10-20%","40-50%","80-90%"],"answer":"D","explanation":"Carbohydrat chiếm ưu thế trong thực vật, khoảng 80-90% trọng lượng khô.","keywords":"thực vật 80-90% carbohydrat"},{"chapter":15,"number":3,"question":"Monosaccharid là","options":["Polyhydroxyaldehyd hoặc polyhydroxyketon có từ 3 carbon","Chỉ các aldose có 6 carbon","Các đường gồm 2-9 ose","Các polymer có trên 10 ose"],"answer":"A","explanation":"Monosaccharid có thể là aldose hoặc ketose và có ít nhất 3 nguyên tử carbon.","keywords":"monosaccharid aldose/ketose, 3C"},{"chapter":15,"number":4,"question":"Glucose thuộc nhóm","options":["Ketose","Aldose","Polyol","Aminosaccharid"],"answer":"B","explanation":"Glucose có nhóm aldehyd ở dạng mạch hở nên được xếp là aldose.","keywords":"glucose aldose"},{"chapter":15,"number":5,"question":"Fructose thuộc nhóm","options":["Aldose","Ketose","Disaccharid","Polyol"],"answer":"B","explanation":"Fructose có nhóm ceton ở dạng mạch hở nên là ketose.","keywords":"fructose ketose"},{"chapter":15,"number":6,"question":"Dẫn xuất tạo ra khi khử nhóm -CHO của glucose thành -CH2OH là","options":["Glucosamin","Sorbitol","Sucrose","Cellobiose"],"answer":"B","explanation":"Khử nhóm aldehyd của glucose tạo polyol, tiêu biểu là sorbitol; slide cũng nêu mannitol.","keywords":"khử -CHO sorbitol/manitol"},{"chapter":15,"number":7,"question":"Glucosamin là dẫn xuất glucose do","options":["Khử nhóm -CHO","Thế nhóm amino","Oxy hóa nhóm -CH2OH","Gắn acid sulfuric"],"answer":"B","explanation":"Glucosamin hình thành khi một nhóm hydroxyl được thay bằng nhóm amino.","keywords":"glucosamin đường amino"},{"chapter":15,"number":8,"question":"Vòng 5 cạnh của monosaccharid gọi là","options":["Pyranose","Furanose","Aldose","Ketose"],"answer":"B","explanation":"Furanose là dạng vòng 5 cạnh; pyranose là vòng 6 cạnh.","keywords":"5 cạnh furanose"},{"chapter":15,"number":9,"question":"Vòng 6 cạnh của monosaccharid gọi là","options":["Furanose","Pyranose","Fischer","Anomer"],"answer":"B","explanation":"Pyranose là dạng vòng 6 cạnh, tương tự cấu trúc pyran.","keywords":"6 cạnh pyranose"},{"chapter":15,"number":10,"question":"Cấu hình alpha và beta của đường vòng được xác định chủ yếu bởi","options":["Số nguyên tử carbon","Vị trí nhóm OH anomer so với mặt phẳng vòng","Loại dung môi","Khối lượng phân tử"],"answer":"B","explanation":"Alpha và beta là hai anomer khác nhau ở vị trí nhóm OH tại carbon anomer.","keywords":"alpha/beta OH tại carbon anomer"},{"chapter":15,"number":11,"question":"Cấu hình D và L theo Fischer được xác định dựa vào","options":["Nhóm OH ở carbon bất đối xa nhóm carbonyl nhất","Nhóm OH ở carbon số 1","Số vòng của phân tử","Khả năng tạo màu với iod"],"answer":"A","explanation":"Trong công thức Fischer, vị trí OH ở carbon bất đối cuối cùng quyết định cấu hình D hay L.","keywords":"D/L OH carbon bất đối cuối"},{"chapter":15,"number":12,"question":"Tính chất vật lý đúng của monosaccharid là","options":["Không tan trong nước","Tan trong dung môi hữu cơ kém phân cực","Không màu, vị ngọt, không bay hơi","Không có tính quang hoạt"],"answer":"C","explanation":"Monosaccharid tan trong nước, thường không màu, có vị ngọt, không bay hơi và nhiều chất có tính quang hoạt.","keywords":"mono tan nước, ngọt, không bay hơi"},{"chapter":15,"number":13,"question":"Mannitol được dùng trong y học chủ yếu để","options":["Điều trị táo bón","Giảm nhãn áp và áp lực nội sọ","Bao phim tan trong ruột","Làm chất nhũ hóa"],"answer":"B","explanation":"Slide nêu mannitol dùng khi tăng nhãn áp và tăng áp lực nội sọ.","keywords":"mannitol giảm nhãn áp/nội sọ"},{"chapter":15,"number":14,"question":"Sorbitol được nhắc đến với công dụng","options":["Điều trị táo bón","Giảm đường huyết","Cầm máu","Tăng miễn dịch"],"answer":"A","explanation":"Sorbitol có tác dụng nhuận tràng và được dùng trong táo bón.","keywords":"sorbitol táo bón"},{"chapter":15,"number":15,"question":"Glucosamin được dùng chủ yếu trong","options":["Bệnh khớp","Hạ cholesterol","Cầm máu ruột","Làm môi trường vi sinh"],"answer":"A","explanation":"Slide nêu glucosamin dùng hỗ trợ điều trị bệnh khớp.","keywords":"glucosamin bệnh khớp"},{"chapter":15,"number":16,"question":"Oligosaccharid theo slide gồm","options":["1 ose","2 đến 9 ose",">10 ose","Chỉ 2 ose"],"answer":"B","explanation":"Oligosaccharid chứa từ 2 đến 9 đơn vị đường; disaccharid là trường hợp có 2 ose.","keywords":"oligo 2-9 ose"},{"chapter":15,"number":17,"question":"Liên kết trong maltose là","options":["Glucose-alpha-1,4-glucose","Galactose-beta-1,4-glucose","Glucose-alpha-1,2-fructose","Glucose-beta-1,4-glucose"],"answer":"A","explanation":"Maltose gồm hai glucose nối bằng liên kết alpha-1,4.","keywords":"maltose = Glc alpha-1,4 Glc"},{"chapter":15,"number":18,"question":"Lactose có cấu tạo","options":["Glucose-alpha-1,4-glucose","Galactose-beta-1,4-glucose","Glucose-alpha-1,2-fructose","Glucose-beta-1,4-glucose"],"answer":"B","explanation":"Lactose gồm galactose nối beta-1,4 với glucose.","keywords":"lactose = Gal beta-1,4 Glc"},{"chapter":15,"number":19,"question":"Sucrose có cấu tạo","options":["Glucose-alpha-1,2-fructose","Glucose-alpha-1,4-glucose","Galactose-beta-1,4-glucose","Glucose-beta-1,4-glucose"],"answer":"A","explanation":"Sucrose gồm glucose và fructose nối qua liên kết alpha-1,2.","keywords":"sucrose = Glc alpha-1,2 Fru"},{"chapter":15,"number":20,"question":"Cellobiose có cấu tạo","options":["Glucose-beta-1,4-glucose","Glucose-alpha-1,4-glucose","Galactose-beta-1,4-glucose","Glucose-alpha-1,2-fructose"],"answer":"A","explanation":"Cellobiose gồm hai glucose nối beta-1,4.","keywords":"cellobiose = Glc beta-1,4 Glc"},{"chapter":15,"number":21,"question":"Tính chất chung của oligosaccharid là","opti
