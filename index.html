<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#5b5ce2" />
  <meta name="description" content="Web ôn tập 739 câu trắc nghiệm Dược liệu 1 - TH2 từ 18 bộ câu hỏi, có đáp án, giải thích và từ khóa." />
  <title>Dược lý 2 Mastery — 470 câu hỏi</title>
  <style>:root {
  --bg: #f5f7fb;
  --surface: #ffffff;
  --surface-2: #f8f9fd;
  --surface-3: #eef0ff;
  --text: #17182b;
  --text-2: #575b75;
  --text-3: #8a8ea8;
  --primary: #5b5ce2;
  --primary-2: #7476f1;
  --primary-weak: #ececff;
  --success: #13a46b;
  --success-weak: #e8f8f1;
  --danger: #e04f5f;
  --danger-weak: #fff0f2;
  --warning: #e49a24;
  --warning-weak: #fff7e8;
  --border: #e5e7f0;
  --shadow-sm: 0 1px 2px rgba(18, 22, 48, .04), 0 3px 10px rgba(18, 22, 48, .04);
  --shadow-md: 0 14px 38px rgba(25, 29, 70, .10);
  --radius-sm: 12px;
  --radius: 18px;
  --radius-lg: 26px;
  --sidebar: 252px;
  --content-max: 1180px;
  --transition: .18s ease;
  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #11131d;
  --surface: #191c29;
  --surface-2: #202432;
  --surface-3: #2a2c4b;
  --text: #f5f6fb;
  --text-2: #b7bbcc;
  --text-3: #81869b;
  --primary: #8587ff;
  --primary-2: #9b9dff;
  --primary-weak: #2a2c4d;
  --success: #43cf93;
  --success-weak: #17382e;
  --danger: #ff7884;
  --danger-weak: #41242a;
  --warning: #f0b653;
  --warning-weak: #40341f;
  --border: #2d3142;
  --shadow-sm: 0 2px 10px rgba(0,0,0,.18);
  --shadow-md: 0 18px 44px rgba(0,0,0,.28);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; }
button { color: inherit; }
button, [role="button"] { -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--primary) 28%, transparent);
  outline-offset: 2px;
}
svg { display: block; }

.app-shell { min-height: 100vh; }
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 30;
  width: var(--sidebar);
  display: flex;
  flex-direction: column;
  padding: 24px 18px 18px;
  background: var(--surface);
  border-right: 1px solid var(--border);
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 11px;
  padding: 4px 8px;
  color: var(--text);
  text-decoration: none;
}
.brand-mark {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  color: #fff;
  background: linear-gradient(145deg, var(--primary), #8b66f6);
  box-shadow: 0 8px 18px color-mix(in srgb, var(--primary) 26%, transparent);
}
.brand-mark svg { width: 26px; height: 26px; }
.brand > span:last-child { display: flex; flex-direction: column; line-height: 1.05; }
.brand strong { font-size: 17px; letter-spacing: .02em; }
.brand small { margin-top: 4px; color: var(--text-3); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
.nav-list { display: grid; gap: 7px; margin-top: 34px; }
.nav-item {
  width: 100%;
  min-height: 46px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 13px;
  border: 0;
  border-radius: 13px;
  background: transparent;
  color: var(--text-2);
  font-size: 14px;
  font-weight: 650;
  text-align: left;
  cursor: pointer;
  transition: background var(--transition), color var(--transition), transform var(--transition);
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item:active { transform: scale(.985); }
.nav-item.active { color: var(--primary); background: var(--primary-weak); }
.nav-item svg { width: 20px; height: 20px; fill: currentColor; flex: 0 0 auto; }
.nav-badge {
  margin-left: auto;
  min-width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  padding: 0 6px;
  border-radius: 999px;
  color: #fff;
  background: var(--danger);
  font-size: 11px;
  font-weight: 800;
}
.nav-badge:empty, .nav-badge[data-zero="true"] { display: none; }
.sidebar-spacer { flex: 1; }
.sidebar-tip {
  margin: 12px 2px 14px;
  padding: 15px;
  border: 1px solid color-mix(in srgb, var(--primary) 18%, var(--border));
  border-radius: 16px;
  background: linear-gradient(145deg, var(--primary-weak), var(--surface));
}
.sidebar-tip .tip-icon { color: var(--primary); font-size: 20px; }
.sidebar-tip strong { display: block; margin-top: 5px; font-size: 13px; }
.sidebar-tip p { margin: 6px 0 0; color: var(--text-2); font-size: 11.5px; line-height: 1.45; }

.main-content {
  min-height: 100vh;
  margin-left: var(--sidebar);
  padding: 34px 38px 60px;
}
.page { width: min(100%, var(--content-max)); margin: 0 auto; animation: pageIn .28s ease; }
.session-page { animation: none; }
@keyframes pageIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

.mobile-header, .mobile-nav { display: none; }

.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 26px;
}
.page-title { margin: 0; font-size: clamp(25px, 3vw, 34px); line-height: 1.18; letter-spacing: -.035em; }
.page-subtitle { margin: 8px 0 0; color: var(--text-2); font-size: 14px; }
.header-actions { display: flex; align-items: center; gap: 10px; }

.button {
  min-height: 43px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 10px 16px;
  border: 1px solid transparent;
  border-radius: 12px;
  font-size: 13.5px;
  font-weight: 750;
  cursor: pointer;
  transition: transform var(--transition), box-shadow var(--transition), background var(--transition), border-color var(--transition);
}
.button:hover { transform: translateY(-1px); }
.button:active { transform: translateY(0) scale(.985); }
.button.primary { color: #fff; background: linear-gradient(135deg, var(--primary), var(--primary-2)); box-shadow: 0 8px 18px color-mix(in srgb, var(--primary) 25%, transparent); }
.button.primary:hover { box-shadow: 0 10px 22px color-mix(in srgb, var(--primary) 34%, transparent); }
.button.secondary { border-color: var(--border); background: var(--surface); color: var(--text); }
.button.secondary:hover { border-color: color-mix(in srgb, var(--primary) 35%, var(--border)); }
.button.ghost { background: transparent; color: var(--text-2); }
.button.ghost:hover { background: var(--surface-2); color: var(--text); }
.button.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 25%, var(--border)); background: var(--danger-weak); }
.button.success { color: #fff; background: var(--success); }
.button.small { min-height: 35px; padding: 7px 11px; font-size: 12.5px; border-radius: 10px; }
.button.wide { width: 100%; }
.button svg { width: 18px; height: 18px; fill: currentColor; }
.button[disabled] { opacity: .5; pointer-events: none; box-shadow: none; }
.icon-button {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  cursor: pointer;
}
.icon-button:hover { background: var(--surface-2); }

.hero {
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-columns: 1.45fr .75fr;
  gap: 28px;
  min-height: 245px;
  padding: 34px 36px;
  border-radius: var(--radius-lg);
  color: #fff;
  background:
    radial-gradient(circle at 86% 20%, rgba(255,255,255,.22) 0 8%, transparent 9%),
    radial-gradient(circle at 92% 75%, rgba(255,255,255,.10) 0 20%, transparent 21%),
    linear-gradient(135deg, #4e4fd2 0%, #6e63e8 56%, #8b65ec 100%);
  box-shadow: 0 18px 50px rgba(76, 72, 190, .2);
}
.hero::after {
  content: "";
  position: absolute;
  width: 260px;
  height: 260px;
  right: -80px;
  top: -100px;
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 50%;
  box-shadow: 0 0 0 34px rgba(255,255,255,.05), 0 0 0 70px rgba(255,255,255,.035);
}
.hero-copy { position: relative; z-index: 2; align-self: center; }
.eyebrow { display: inline-flex; align-items: center; gap: 7px; margin-bottom: 12px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .86; }
.eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #baf6dc; box-shadow: 0 0 0 5px rgba(186,246,220,.13); }
.hero h1 { max-width: 630px; margin: 0; font-size: clamp(28px, 4vw, 42px); line-height: 1.13; letter-spacing: -.045em; }
.hero p { max-width: 590px; margin: 14px 0 22px; color: rgba(255,255,255,.82); font-size: 14px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.hero .button.primary { color: var(--primary); background: #fff; box-shadow: 0 8px 20px rgba(24,22,82,.18); }
.hero .button.secondary { color: #fff; border-color: rgba(255,255,255,.24); background: rgba(255,255,255,.11); backdrop-filter: blur(6px); }
.hero-visual { position: relative; z-index: 2; display: grid; place-items: center; }
.mastery-orbit { position: relative; width: 174px; height: 174px; display: grid; place-items: center; }
.mastery-ring { width: 150px; height: 150px; transform: rotate(-90deg); filter: drop-shadow(0 8px 18px rgba(25,20,96,.18)); }
.mastery-ring .track { fill: rgba(255,255,255,.08); stroke: rgba(255,255,255,.18); stroke-width: 10; }
.mastery-ring .progress { fill: none; stroke: #fff; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .7s ease; }
.mastery-label { position: absolute; text-align: center; }
.mastery-label strong { display: block; font-size: 34px; line-height: 1; letter-spacing: -.04em; }
.mastery-label span { display: block; margin-top: 8px; color: rgba(255,255,255,.72); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.orbit-dot { position: absolute; width: 14px; height: 14px; border: 3px solid rgba(255,255,255,.48); border-radius: 50%; background: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.18); }
.orbit-dot.one { top: 6px; right: 26px; }
.orbit-dot.two { bottom: 13px; left: 10px; width: 10px; height: 10px; }

.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 20px; }
.stat-card {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
  padding: 18px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}
.stat-icon { width: 43px; height: 43px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 13px; }
.stat-icon svg { width: 21px; height: 21px; fill: currentColor; }
.stat-icon.purple { color: var(--primary); background: var(--primary-weak); }
.stat-icon.green { color: var(--success); background: var(--success-weak); }
.stat-icon.orange { color: var(--warning); background: var(--warning-weak); }
.stat-icon.red { color: var(--danger); background: var(--danger-weak); }
.stat-value { display: block; font-size: 22px; font-weight: 820; line-height: 1.05; letter-spacing: -.02em; }
.stat-label { display: block; margin-top: 5px; color: var(--text-3); font-size: 11.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.section { margin-top: 30px; }
.section-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.section-heading h2 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
.section-heading p { margin: 4px 0 0; color: var(--text-3); font-size: 12.5px; }
.text-button { border: 0; background: transparent; color: var(--primary); font-size: 12.5px; font-weight: 750; cursor: pointer; }
.text-button:hover { text-decoration: underline; }

.chapter-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.chapter-card {
  position: relative;
  overflow: hidden;
  min-height: 190px;
  display: flex;
  flex-direction: column;
  padding: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
}
.chapter-card:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--chapter-color) 35%, var(--border)); box-shadow: var(--shadow-md); }
.chapter-card::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--chapter-color); }
.chapter-top { display: flex; align-items: center; justify-content: space-between; }
.chapter-number { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 13px; color: var(--chapter-color); background: color-mix(in srgb, var(--chapter-color) 12%, var(--surface)); font-weight: 850; }
.chapter-count { color: var(--text-3); font-size: 11.5px; font-weight: 700; }
.chapter-card h3 { margin: 16px 0 8px; min-height: 44px; font-size: 14px; line-height: 1.45; }
.chapter-progress-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; color: var(--text-3); font-size: 11px; font-weight: 700; }
.progress-bar { width: 100%; height: 7px; overflow: hidden; border-radius: 99px; background: var(--surface-2); }
.progress-bar > span { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--bar-color, var(--primary)); transition: width .5s ease; }
.chapter-card .progress-bar { margin-top: 8px; }
.chapter-action { margin-top: 15px; display: flex; gap: 8px; }
.chapter-action .button { flex: 1; }

.two-column { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, .72fr); gap: 18px; }
.panel { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }
.panel-header { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 19px 20px 0; }
.panel-header h3 { margin: 0; font-size: 15px; }
.panel-body { padding: 18px 20px 20px; }
.activity-list { display: grid; gap: 11px; }
.activity-item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); }
.activity-item:last-child { border-bottom: 0; }
.activity-score { width: 42px; height: 42px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 12px; background: var(--surface-2); font-size: 12px; font-weight: 850; }
.activity-score.good { color: var(--success); background: var(--success-weak); }
.activity-score.mid { color: var(--warning); background: var(--warning-weak); }
.activity-score.low { color: var(--danger); background: var(--danger-weak); }
.activity-info { min-width: 0; flex: 1; }
.activity-info strong { display: block; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.activity-info span { color: var(--text-3); font-size: 11px; }
.empty-state { padding: 28px 16px; text-align: center; }
.empty-icon { width: 58px; height: 58px; display: grid; place-items: center; margin: 0 auto 12px; border-radius: 18px; color: var(--primary); background: var(--primary-weak); font-size: 24px; }
.empty-state h3 { margin: 0; font-size: 15px; }
.empty-state p { max-width: 390px; margin: 7px auto 16px; color: var(--text-3); font-size: 12.5px; }

.study-plan { display: grid; gap: 14px; }
.plan-step { display: grid; grid-template-columns: 34px 1fr; gap: 11px; align-items: start; }
.plan-index { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; color: var(--primary); background: var(--primary-weak); font-size: 12px; font-weight: 850; }
.plan-step strong { display: block; font-size: 12.5px; }
.plan-step p { margin: 4px 0 0; color: var(--text-3); font-size: 11.5px; line-height: 1.45; }
.choice-text{

flex:1;

min-width:0;

}
/* Setup */
.setup-layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 20px; align-items: start; }
.setup-card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }
.setup-section { padding: 22px; border-bottom: 1px solid var(--border); }
.setup-section:last-child { border-bottom: 0; }
.setup-section-title { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
.setup-section-title span { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 9px; color: var(--primary); background: var(--primary-weak); font-size: 12px; font-weight: 850; }
.setup-section-title h3 { margin: 0; font-size: 14px; }
.chapter-select-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.choice-card, .mode-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: var(--surface);
  cursor: pointer;
  transition: border-color var(--transition), background var(--transition), transform var(--transition);
}
.choice-card:hover, .mode-card:hover { border-color: color-mix(in srgb, var(--primary) 40%, var(--border)); }
.choice-card.selected, .mode-card.selected { border-color: var(--primary); background: var(--primary-weak); }
.choice-card input, .mode-card input { position: absolute; opacity: 0; pointer-events: none; }
.choice-check { width: 20px; height: 20px; display: grid; place-items: center; flex: 0 0 auto; border: 1.5px solid var(--border); border-radius: 7px; color: #fff; background: var(--surface); font-size: 12px; font-weight: 900; }
.choice-card.selected .choice-check { border-color: var(--primary); background: var(--primary); }
.choice-text { min-width: 0; }
.choice-text strong { display: block; font-size: 12.5px; }
.choice-text span {

display:block;

margin-top:4px;

color:var(--text-3);

font-size:12px;

line-height:1.5;

white-space:normal;

overflow:visible;

text-overflow:unset;

word-break:break-word;

}
.mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mode-card { align-items: flex-start; min-height: 100px; }
.mode-icon { width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 10px; color: var(--primary); background: var(--primary-weak); font-size: 17px; }
.mode-card.selected .mode-icon { color: #fff; background: var(--primary); }
.mode-card strong { display: block; margin-top: 1px; font-size: 12.5px; }
.mode-card p { margin: 4px 0 0; color: var(--text-3); font-size: 10.5px; line-height: 1.4; }
.segmented { display: flex; flex-wrap: wrap; gap: 8px; }
.segmented button {
  min-width: 58px;
  padding: 9px 13px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: var(--surface);
  color: var(--text-2);
  font-size: 12px;
  font-weight: 750;
  cursor: pointer;
}
.segmented button:hover { border-color: color-mix(in srgb, var(--primary) 38%, var(--border)); }
.segmented button.active { color: var(--primary); border-color: var(--primary); background: var(--primary-weak); }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 8px 0; }
.switch-copy strong { display: block; font-size: 12.5px; }
.switch-copy span { display: block; margin-top: 3px; color: var(--text-3); font-size: 10.5px; }
.switch { position: relative; width: 43px; height: 25px; flex: 0 0 auto; }
.switch input { position: absolute; opacity: 0; }
.switch-track { position: absolute; inset: 0; border-radius: 99px; background: var(--border); transition: background var(--transition); cursor: pointer; }
.switch-track::after { content: ""; position: absolute; width: 19px; height: 19px; top: 3px; left: 3px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.18); transition: transform var(--transition); }
.switch input:checked + .switch-track { background: var(--primary); }
.switch input:checked + .switch-track::after { transform: translateX(18px); }
.setup-summary { position: sticky; top: 25px; padding: 22px; }
.setup-summary h3 { margin: 0; font-size: 15px; }
.summary-list { display: grid; gap: 11px; margin: 18px 0; padding: 14px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.summary-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--text-3); font-size: 11.5px; }
.summary-line strong { color: var(--text); font-size: 12px; text-align: right; }
.summary-note { margin: 0 0 15px; color: var(--text-3); font-size: 10.5px; line-height: 1.5; }

/* Session */
.session-page { width: min(100%, 900px); }
.session-topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.session-topbar .progress-wrap { flex: 1; }
.session-progress-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 7px; color: var(--text-3); font-size: 11px; font-weight: 700; }
.session-progress { height: 8px; overflow: hidden; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); }
.session-progress span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--primary), #9272ef); transition: width .35s ease; }
.session-tools { display: flex; gap: 8px; }
.session-card { padding: 28px; border: 1px solid var(--border); border-radius: 22px; background: var(--surface); box-shadow: var(--shadow-md); }
.question-meta { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
.question-tags { display: flex; flex-wrap: wrap; gap: 7px; }
.tag { display: inline-flex; align-items: center; gap: 5px; min-height: 25px; padding: 4px 9px; border-radius: 999px; color: var(--text-2); background: var(--surface-2); font-size: 10.5px; font-weight: 750; }
.tag.primary { color: var(--primary); background: var(--primary-weak); }
.tag.warning { color: var(--warning); background: var(--warning-weak); }
.bookmark-button { width: 37px; height: 37px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 11px; background: var(--surface); color: var(--text-3); cursor: pointer; }
.bookmark-button svg { width: 19px; height: 19px; fill: currentColor; }
.bookmark-button.active { color: var(--warning); border-color: color-mix(in srgb, var(--warning) 35%, var(--border)); background: var(--warning-weak); }
.question-title { margin: 0; font-size: clamp(20px, 3vw, 27px); line-height: 1.42; letter-spacing: -.025em; }
.options-list { display: grid; gap: 11px; margin-top: 25px; }
.option-button {
  width: 100%;
  display: grid;
  grid-template-columns: 38px 1fr auto;
  align-items: center;
  gap: 13px;
  min-height: 62px;
  padding: 11px 15px;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  background: var(--surface);
  text-align: left;
  cursor: pointer;
  transition: border-color var(--transition), background var(--transition), transform var(--transition), box-shadow var(--transition);
}
.option-button:hover:not([disabled]) { transform: translateY(-1px); border-color: color-mix(in srgb, var(--primary) 45%, var(--border)); box-shadow: var(--shadow-sm); }
.option-letter { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 11px; color: var(--text-2); background: var(--surface-2); font-size: 12px; font-weight: 850; }
.option-text { color: var(--text); font-size: 13.5px; line-height: 1.5; }
.option-indicator { width: 23px; height: 23px; display: none; place-items: center; border-radius: 50%; color: #fff; font-size: 13px; font-weight: 900; }
.option-button.selected { border-color: var(--primary); background: var(--primary-weak); }
.option-button.selected .option-letter { color: #fff; border-color: var(--primary); background: var(--primary); }
.option-button.correct { border-color: var(--success); background: var(--success-weak); }
.option-button.correct .option-letter { color: #fff; border-color: var(--success); background: var(--success); }
.option-button.correct .option-indicator { display: grid; background: var(--success); }
.option-button.wrong { border-color: var(--danger); background: var(--danger-weak); }
.option-button.wrong .option-letter { color: #fff; border-color: var(--danger); background: var(--danger); }
.option-button.wrong .option-indicator { display: grid; background: var(--danger); }
.option-button[disabled] { cursor: default; }
.feedback-box { display: flex; align-items: flex-start; gap: 12px; margin-top: 18px; padding: 14px 15px; border-radius: 13px; }
.feedback-box.correct { color: var(--success); background: var(--success-weak); }
.feedback-box.wrong { color: var(--danger); background: var(--danger-weak); }
.feedback-icon { width: 28px; height: 28px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 9px; color: #fff; background: currentColor; }
.feedback-icon span { color: #fff; font-weight: 900; }
.feedback-copy strong { display: block; font-size: 12.5px; }
.feedback-copy p { margin: 4px 0 0; color: var(--text-2); font-size: 11.5px; }
.feedback-details { display: grid; gap: 8px; margin-top: 10px; }
.feedback-note { padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--surface) 72%, transparent); }
.feedback-note b { display: block; margin-bottom: 2px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; }
.feedback-note span { color: var(--text-2); font-size: 11.5px; line-height: 1.5; }
.session-footer { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 14px; }
.side-nav {
  position: fixed;
  top: 50%;
  z-index: 20;
  width: 58px;
  height: 78px;
  min-width: 58px;
  min-height: 78px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  color: var(--text);
  box-shadow: var(--shadow-md);
  backdrop-filter: blur(12px);
  font-size: 30px;
  font-weight: 850;
  line-height: 1;
  cursor: pointer;
  transform: translateY(-50%);
  transition: border-color var(--transition), background var(--transition), opacity var(--transition);
}
.side-nav:hover { border-color: color-mix(in srgb, var(--primary) 42%, var(--border)); background: var(--surface); }
.side-nav:active { filter: brightness(.97); }
.side-nav[disabled] { opacity: .35; pointer-events: none; box-shadow: var(--shadow-sm); }
.side-nav.prev { left: calc(var(--sidebar) + 18px); }
.side-nav.next { right: 18px; color: #fff; border-color: transparent; background: linear-gradient(135deg, var(--primary), var(--primary-2)); }
.side-nav span {
  width: 1em;
  height: 1em;
  display: grid;
  place-items: center;
  font-family: Arial, sans-serif;
  line-height: 1;
}
.keyboard-hint { color: var(--text-3); font-size: 10.5px; }
kbd { min-width: 22px; display: inline-grid; place-items: center; padding: 2px 5px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; background: var(--surface-2); font: inherit; font-size: 9.5px; font-weight: 800; }

.flashcard-shell { margin-top: 8px; }
.flashcard { min-height: 520px; display: flex; flex-direction: column; padding: 30px; overflow: hidden; border: 1px solid var(--border); border-radius: 22px; background: var(--surface); box-shadow: var(--shadow-md); cursor: pointer; }
.flashcard.show-answer { border-color: color-mix(in srgb, var(--success) 36%, var(--border)); }
.flash-label { color: var(--text-3); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
.flash-question { margin: 14px 0 0; text-align: left; font-size: clamp(17px, 2.5vw, 22px); line-height: 1.45; letter-spacing: -.025em; }
.flash-options { margin-top: 14px; flex: 1; min-height: 0; overflow-y: auto; gap: 9px; }
.flash-options .option-button { min-height: 54px; padding: 9px 12px; pointer-events: none; cursor: default; transform: none !important; box-shadow: none !important; }
.flash-hint { margin-top: auto; padding-top: 12px; color: var(--text-3); text-align: center; font-size: 10.5px; }
.flash-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.flash-actions.rate { grid-template-columns: 1fr 1fr; }
.flash-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 14px; }
.flash-nav .keyboard-hint { text-align: center; }

/* Summary */
.result-hero { display: grid; grid-template-columns: 220px 1fr; gap: 30px; align-items: center; padding: 30px; border: 1px solid var(--border); border-radius: 24px; background: var(--surface); box-shadow: var(--shadow-md); }
.result-ring-wrap { position: relative; width: 190px; height: 190px; display: grid; place-items: center; margin: auto; }
.result-ring { width: 190px; height: 190px; transform: rotate(-90deg); }
.result-ring circle { fill: none; stroke-width: 13; }
.result-ring .track { stroke: var(--surface-2); }
.result-ring .value { stroke: var(--primary); stroke-linecap: round; }
.result-score { position: absolute; text-align: center; }
.result-score strong { display: block; font-size: 41px; line-height: 1; letter-spacing: -.05em; }
.result-score span { display: block; margin-top: 8px; color: var(--text-3); font-size: 11px; font-weight: 750; }
.result-copy h1 { margin: 0; font-size: 30px; letter-spacing: -.035em; }
.result-copy p { margin: 9px 0 20px; color: var(--text-2); font-size: 13px; }
.result-mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.result-mini { padding: 12px; border-radius: 12px; background: var(--surface-2); }
.result-mini strong { display: block; font-size: 18px; }
.result-mini span { color: var(--text-3); font-size: 10.5px; }
.result-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.review-list { display: grid; gap: 12px; }
.review-item { padding: 18px; border: 1px solid var(--border); border-radius: 15px; background: var(--surface); }
.review-item-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 9px; }
.review-item h4 { margin: 0; font-size: 13.5px; line-height: 1.48; }
.answer-row { display: grid; grid-template-columns: 105px 1fr; gap: 10px; margin-top: 9px; font-size: 11.5px; }
.answer-row > span:first-child { color: var(--text-3); font-weight: 700; }
.answer-row.wrong > span:last-child { color: var(--danger); }
.answer-row.correct > span:last-child { color: var(--success); }

/* Review */
.review-hero { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; padding: 25px; border: 1px solid var(--border); border-radius: 20px; background: linear-gradient(135deg, var(--surface), var(--primary-weak)); }
.review-hero h2 { margin: 0; font-size: 21px; }
.review-hero p { margin: 7px 0 0; color: var(--text-2); font-size: 12.5px; }
.review-hero-number { min-width: 118px; text-align: center; }
.review-hero-number strong { display: block; color: var(--primary); font-size: 38px; line-height: 1; }
.review-hero-number span { color: var(--text-3); font-size: 10.5px; }
.review-actions-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
.review-action-card { padding: 19px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); cursor: pointer; transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition); }
.review-action-card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 38%, var(--border)); box-shadow: var(--shadow-md); }
.review-action-icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); font-size: 18px; }
.review-action-card strong { display: block; margin-top: 12px; font-size: 13px; }
.review-action-card p { margin: 4px 0 12px; color: var(--text-3); font-size: 10.5px; line-height: 1.45; }
.review-action-card .count { color: var(--accent); font-size: 20px; font-weight: 850; }
.weak-list { display: grid; gap: 9px; }
.weak-item { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--border); }
.weak-item:last-child { border-bottom: 0; }
.weak-item strong { display: block; font-size: 12px; line-height: 1.45; }
.weak-item span { color: var(--text-3); font-size: 10.5px; }
.mastery-dots { display: flex; gap: 4px; }
.mastery-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--border); }
.mastery-dots i.on { background: var(--primary); }

/* Bank */
.filter-bar { display: grid; grid-template-columns: minmax(220px, 1fr) 180px 170px; gap: 10px; padding: 14px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-sm); }
.search-box { position: relative; }
.search-box svg { position: absolute; left: 13px; top: 50%; width: 18px; height: 18px; fill: var(--text-3); transform: translateY(-50%); }
.field, .select {
  width: 100%;
  min-height: 42px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: var(--surface-2);
  color: var(--text);
  font-size: 12.5px;
}
.search-box .field { padding-left: 40px; }
.field::placeholder { color: var(--text-3); }
.field:focus, .select:focus { border-color: var(--primary); background: var(--surface); }
.bank-meta { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin: 18px 2px 10px; color: var(--text-3); font-size: 11.5px; }
.question-list { display: grid; gap: 9px; }
.question-row { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 15px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); cursor: pointer; transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition); }
.question-row:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--primary) 35%, var(--border)); box-shadow: var(--shadow-sm); }
.question-index { width: 48px; height: 42px; display: grid; place-items: center; border-radius: 11px; color: var(--primary); background: var(--primary-weak); font-size: 11px; font-weight: 850; }
.question-row-copy { min-width: 0; }
.question-row-copy strong { display: block; font-size: 12.5px; line-height: 1.45; }
.question-row-copy span { display: block; margin-top: 4px; color: var(--text-3); font-size: 10.5px; }
.status-pill { display: inline-flex; align-items: center; gap: 5px; padding: 5px 8px; border-radius: 999px; font-size: 9.5px; font-weight: 800; white-space: nowrap; }
.status-pill.new { color: var(--text-3); background: var(--surface-2); }
.status-pill.learning { color: var(--warning); background: var(--warning-weak); }
.status-pill.mastered { color: var(--success); background: var(--success-weak); }
.status-pill.review { color: var(--danger); background: var(--danger-weak); }
.pagination { display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 18px; }
.pagination button { min-width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text-2); font-size: 11px; font-weight: 750; cursor: pointer; }
.pagination button.active { color: #fff; border-color: var(--primary); background: var(--primary); }
.pagination button:disabled { opacity: .4; cursor: default; }

/* Settings */
.settings-grid { display: grid; gap: 16px; }
.settings-card { padding: 21px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }
.settings-card h3 { margin: 0; font-size: 14px; }
.settings-card > p { margin: 5px 0 17px; color: var(--text-3); font-size: 11.5px; }
.theme-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.theme-option { padding: 13px; border: 1.5px solid var(--border); border-radius: 13px; background: var(--surface); cursor: pointer; }
.theme-option.active { border-color: var(--primary); background: var(--primary-weak); }
.theme-preview { height: 62px; overflow: hidden; padding: 9px; border-radius: 9px; background: #f4f5f9; border: 1px solid #e3e5ee; }
.theme-option.dark .theme-preview { background: #151722; border-color: #2a2e3d; }
.theme-preview::before, .theme-preview::after { content: ""; display: block; border-radius: 5px; }
.theme-preview::before { width: 42%; height: 8px; background: #5b5ce2; }
.theme-preview::after { width: 100%; height: 30px; margin-top: 7px; background: #fff; box-shadow: 0 0 0 1px #e3e5ee; }
.theme-option.dark .theme-preview::after { background: #202330; box-shadow: 0 0 0 1px #303445; }
.theme-option strong { display: block; margin-top: 8px; font-size: 11.5px; }
.data-actions { display: flex; flex-wrap: wrap; gap: 9px; }
.source-note { padding: 15px; border-radius: 13px; background: var(--surface-2); color: var(--text-2); font-size: 11.5px; line-height: 1.6; }

/* Modal & toast */
.modal-root:empty { display: none; }
.modal-root { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px; background: rgba(12,14,27,.52); backdrop-filter: blur(5px); }
.modal { width: min(100%, 650px); max-height: min(88vh, 760px); overflow: auto; border: 1px solid var(--border); border-radius: 20px; background: var(--surface); box-shadow: 0 28px 70px rgba(0,0,0,.25); animation: modalIn .2s ease; }
@keyframes modalIn { from { opacity: 0; transform: scale(.97) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.modal-header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
.modal-header h3 { margin: 0; font-size: 15px; }
.modal-body { padding: 20px; }
.modal-question { margin: 0 0 18px; font-size: 17px; line-height: 1.5; }
.modal-options { display: grid; gap: 8px; }
.modal-option { display: grid; grid-template-columns: 31px 1fr; gap: 10px; padding: 11px; border: 1px solid var(--border); border-radius: 11px; font-size: 12px; }
.modal-option.correct { border-color: var(--success); background: var(--success-weak); }
.modal-option b { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 8px; background: var(--surface-2); }
.modal-option.correct b { color: #fff; background: var(--success); }
.modal-footer { display: flex; justify-content: flex-end; gap: 9px; padding: 0 20px 20px; }
.toast-region { position: fixed; right: 22px; bottom: 22px; z-index: 120; display: grid; gap: 9px; }
.toast { min-width: 260px; max-width: 360px; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 13px; background: var(--surface); box-shadow: var(--shadow-md); font-size: 11.5px; animation: toastIn .24s ease; }
.toast.success { border-color: color-mix(in srgb, var(--success) 25%, var(--border)); }
.toast.error { border-color: color-mix(in srgb, var(--danger) 25%, var(--border)); }
.toast-icon { width: 24px; height: 24px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 8px; color: #fff; background: var(--primary); font-weight: 900; }
.toast.success .toast-icon { background: var(--success); }
.toast.error .toast-icon { background: var(--danger); }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 1100px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .chapter-grid { grid-template-columns: repeat(2, 1fr); }
  .mode-grid { grid-template-columns: 1fr; }
  .setup-layout { grid-template-columns: minmax(0, 1fr) 280px; }
}

@media (max-width: 820px) {
  :root { --mobile-header: 66px; --mobile-nav: 70px; }
  .sidebar { display: none; }
  .mobile-header {
    position: fixed;
    inset: 0 0 auto;
    z-index: 40;
    height: var(--mobile-header);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface) 90%, transparent);
    backdrop-filter: blur(14px);
  }
  .mobile-header .brand-mark { width: 34px; height: 34px; }
  .mobile-header .brand-mark svg { width: 23px; height: 23px; }
  .main-content { margin-left: 0; padding: calc(var(--mobile-header) + 22px) 16px calc(var(--mobile-nav) + 28px); }
  .mobile-nav {
    position: fixed;
    inset: auto 0 0;
    z-index: 50;
    height: var(--mobile-nav);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface) 94%, transparent);
    backdrop-filter: blur(14px);
  }
  .mobile-nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; background: transparent; color: var(--text-3); font-size: 9.5px; font-weight: 700; }
  .mobile-nav-item svg { width: 20px; height: 20px; fill: currentColor; }
  .mobile-nav-item.active { color: var(--primary); }
  .hero { grid-template-columns: 1fr; padding: 28px; }
  .hero-visual { display: none; }
  .two-column, .setup-layout { grid-template-columns: 1fr; }
  .setup-summary { position: static; }
  .review-actions-grid { grid-template-columns: 1fr; }
  .filter-bar { grid-template-columns: 1fr 1fr; }
  .filter-bar .search-box { grid-column: 1 / -1; }
  .result-hero { grid-template-columns: 1fr; text-align: center; }
  .result-actions { justify-content: center; }
}

@media (max-width: 580px) {
  .main-content { padding-left: 12px; padding-right: 12px; }
  .page-header { align-items: flex-start; }
  .header-actions .button span.optional { display: none; }
  .hero { min-height: 0; padding: 24px 21px; border-radius: 20px; }
  .hero h1 { font-size: 28px; }
  .hero p { font-size: 12.5px; }
  .hero-actions .button { flex: 1; }
  .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-card { padding: 14px 12px; gap: 10px; }
  .stat-icon { width: 37px; height: 37px; border-radius: 11px; }
  .stat-value { font-size: 18px; }
  .stat-label { font-size: 10px; }
  .chapter-grid { grid-template-columns: 1fr; }
  .chapter-card { min-height: 178px; }
  .chapter-select-grid { grid-template-columns: 1fr; }
  .setup-section { padding: 18px 15px; }
  .setup-summary { padding: 18px 15px; }
  .session-card { padding: 19px 14px; border-radius: 18px; }
  .session-topbar { gap: 8px; }
  .session-tools .icon-button:first-child { display: none; }
  .question-title { font-size: 19px; }
  .option-button { grid-template-columns: 34px 1fr auto; gap: 10px; min-height: 58px; padding: 10px; }
  .option-letter { width: 32px; height: 32px; }
  .option-text { font-size: 12.5px; }
  .keyboard-hint { display: none; }
  .side-nav {
    top: auto;
    bottom: calc(var(--mobile-nav) + 12px);
    width: 64px;
    height: 64px;
    min-width: 64px;
    min-height: 64px;
    border-radius: 50%;
    font-size: 31px;
    transform: none;
  }
  .side-nav.prev { left: 14px; }
  .side-nav.next { right: 14px; }
  .flash-actions.rate { grid-template-columns: 1fr 1fr; }
  .flashcard { min-height: 480px; }
  .flashcard { padding: 23px 18px; }
  .flash-options .option-button { min-height: 50px; padding: 8px 10px; }
  .flash-nav .keyboard-hint { display: none; }
  .result-hero { padding: 21px 15px; }
  .result-mini-stats { grid-template-columns: 1fr 1fr; }

n theo phần được in đậm trong tài liệu nguồn.","keywords":"RỐI LOẠN LIPID HUYẾT & ÔN TẬP TỔNG HỢP · câu nguồn 40","chapter":1}];</script>
  <script>(() => {
  'use strict';

  const QUESTIONS = Array.isArray(window.QUIZ_DATA) ? window.QUIZ_DATA : [];
  const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const STORAGE_KEY = 'duoc_ly_2_mastery_v1';
  const CHAPTER_COLORS = ['#5b5ce2', '#2687d9', '#12a574', '#e28a2c', '#d45e7a', '#8a62d6', '#0891b2'];
  const CHAPTERS = [
    { id: 1, title: 'Dược lý 2 — Tất cả câu hỏi', color: '#0e7490' }
  ];

  const app = document.getElementById('app');
  const modalRoot = document.getElementById('modalRoot');
  const toastRegion = document.getElementById('toastRegion');
  const questionMap = new Map(QUESTIONS.map(q => [questionId(q), q]));
  let autoNextTimer = null;

  const state = {
    view: 'dashboard',
    data: loadData(),
    setup: {
      chapters: new Set([1]),
      mode: 'practice',
      count: 20,
      shuffle: true,
      onlyUnanswered: false,
      weakFirst: false
    },
    session: null,
    bank: { search: '', chapter: 'all', status: 'all', page: 1 },
    reviewLimit: 10,
    searchTimer: null
  };

  function questionId(q) { return `c${q.chapter}q${q.number}`; }
  function correctAnswers(q) { return Array.isArray(q.answers) && q.answers.length ? q.answers : [q.answer]; }
  function isCorrectAnswer(q, answer) { return correctAnswers(q).includes(answer); }
  function e(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }
  function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }
  function percent(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function shuffle(array) {
    const result = [...array];
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }
  function formatDate(value) {
    try {
      return new Intl.DateTimeFormat('vi-VN', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }).format(new Date(value));
    } catch { return ''; }
  }
  function chapterInfo(id) { return CHAPTERS.find(c => c.id === Number(id)); }
  function chapterLabel(id) { return Number(id) <= 14 ? `Đề ${String(id).padStart(2, '0')}` : chapterInfo(id)?.title.replace('Chuyên đề ', '') || `Bộ ${id}`; }
  function chapterQuestions(id) { return QUESTIONS.filter(q => q.chapter === Number(id)); }

  function defaultData() {
    return { version: 1, progress: {}, sessions: [], theme: 'light' };
  }
  function loadData() {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (!parsed || typeof parsed !== 'object') return defaultData();
      return {
        version: 1,
        progress: parsed.progress && typeof parsed.progress === 'object' ? parsed.progress : {},
        sessions: Array.isArray(parsed.sessions) ? parsed.sessions.slice(0, 30) : [],
        theme: parsed.theme === 'dark' ? 'dark' : 'light'
      };
    } catch { return defaultData(); }
  }
  function saveData() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); } catch { /* Keep the session usable when storage is unavailable. */ }
    applyTheme();
    updateReviewBadge();
  }
  function recordFor(q) {
    return state.data.progress[questionId(q)] || {
      attempts: 0,
      correct: 0,
      mastery: 0,
      wrongCount: 0,
      lastCorrect: null,
      bookmarked: false,
      lastSeen: null
    };
  }
  function ensureRecord(q) {
    const id = questionId(q);
    if (!state.data.progress[id]) state.data.progress[id] = recordFor(q);
    return state.data.progress[id];
  }
  function updateProgress(q, isCorrect, masteryDelta = isCorrect ? 1 : -2) {
    const r = ensureRecord(q);
    r.attempts += 1;
    r.correct += isCorrect ? 1 : 0;
    r.wrongCount += isCorrect ? 0 : 1;
    r.lastCorrect = Boolean(isCorrect);
    r.lastSeen = Date.now();
    r.mastery = clamp(r.mastery + masteryDelta, 0, 5);
    saveData();
  }
  function clearAutoNext() {
    if (autoNextTimer) {
      clearTimeout(autoNextTimer);
      autoNextTimer = null;
    }
  }
  function scheduleAutoNext() {
    clearAutoNext();
    // Không tự chuyển câu để người học có thời gian đọc giải thích và từ khóa.
  }
  function toggleBookmark(q) {
    const r = ensureRecord(q);
    r.bookmarked = !r.bookmarked;
    saveData();
    toast(r.bookmarked ? 'Đã đánh dấu câu hỏi' : 'Đã bỏ đánh dấu', 'success');
    return r.bookmarked;
  }
  function statusFor(q) {
    const r = recordFor(q);
    if (!r.attempts) return { key: 'new', label: 'Chưa học' };
    if (r.lastCorrect === false) return { key: 'review', label: 'Cần ôn' };
    if (r.mastery >= 4) return { key: 'mastered', label: 'Đã vững' };
    return { key: 'learning', label: 'Đang học' };
  }
  function getStats() {
    const records = Object.values(state.data.progress);
    const answered = records.filter(r => r.attempts > 0).length;
    const attempts = records.reduce((s, r) => s + (r.attempts || 0), 0);
    const correct = records.reduce((s, r) => s + (r.correct || 0), 0);
    const mastered = records.filter(r => r.attempts > 0 && r.mastery >= 4).length;
    const review = records.filter(r => r.attempts > 0 && r.lastCorrect === false).length;
    const bookmarked = records.filter(r => r.bookmarked).length;
    return { answered, attempts, correct, mastered, review, bookmarked, accuracy: percent(correct, attempts) };
  }
  function getWrongQuestions() {
    return QUESTIONS.filter(q => {
      const r = recordFor(q);
      return r.attempts > 0 && r.lastCorrect === false;
    }).sort((a, b) => (recordFor(b).lastSeen || 0) - (recordFor(a).lastSeen || 0));
  }
  function getWeakQuestions() {
    return QUESTIONS.filter(q => {
      const r = recordFor(q);
      return r.attempts > 0 && r.mastery < 3;
    }).sort((a, b) => {
      const ra = recordFor(a), rb = recordFor(b);
      return (ra.mastery - rb.mastery) || ((rb.wrongCount || 0) - (ra.wrongCount || 0));
    });
  }
  function getBookmarkedQuestions() {
    return QUESTIONS.filter(q => recordFor(q).bookmarked);
  }

  function applyTheme() {
    document.documentElement.dataset.theme = state.data.theme;
    const mobile = document.querySelector('#mobileThemeToggle span');
    if (mobile) mobile.textContent = state.data.theme === 'dark' ? '☀' : '☾';
  }
  function toggleTheme() {
    state.data.theme = state.data.theme === 'dark' ? 'light' : 'dark';
    saveData();
    if (state.view === 'settings') render();
  }

  function setView(view, options = {}) {
    if (state.session && state.session.status === 'active' && view !== 'session' && !options.force) {
      openConfirmExit(() => setView(view, { force: true }));
      return;
    }
    state.view = view;
    if (view !== 'session' && options.force) state.session = null;
    updateNavigation();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function updateNavigation() {
    document.querySelectorAll('[data-view]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.view === state.view || (state.view === 'session' && btn.dataset.view === 'practice'));
    });
  }
  function updateReviewBadge() {
    const count = getWrongQuestions().length;
    const badge = document.getElementById('reviewBadge');
    if (badge) {
      badge.textContent = count > 99 ? '99+' : String(count);
      badge.dataset.zero = count === 0 ? 'true' : 'false';
    }
  }

  function render() {
    updateReviewBadge();
    document.title = titleForView();
    if (state.view === 'dashboard') renderDashboard();
    else if (state.view === 'practice') renderPracticeSetup();
    else if (state.view === 'review') renderReview();
    else if (state.view === 'bank') renderBank();
    else if (state.view === 'settings') renderSettings();
    else if (state.view === 'session') renderSession();
    else renderDashboard();
  }
  function titleForView() {
    const labels = { dashboard: 'Tổng quan', practice: 'Luyện tập', review: 'Ôn tập', bank: 'Ngân hàng câu hỏi', settings: 'Cài đặt', session: 'Phiên học' };
    return `${labels[state.view] || 'Dược lý 2 Mastery'} — Dược lý 2 Mastery`;
  }

  function pageHeader(title, subtitle, actions = '') {
    return `<div class="page-header"><div><h1 class="page-title">${e(title)}</h1><p class="page-subtitle">${e(subtitle)}</p></div>${actions ? `<div class="header-actions">${actions}</div>` : ''}</div>`;
  }

          <p>Luyện từng bộ, nhận phản hồi ngay, tự động gom câu sai và ôn lại theo mức độ ghi nhớ.</p>
          <div class="hero-actions">
            <button class="button primary" data-action="smart-start">

            <button class="button secondary" data-action="quick-flash">Flashcard nhanh</button>
          </div>
        </div>
        <div class="hero-visual" aria-hidden="true">
          <div class="mastery-orbit">
            <svg class="mastery-ring" viewBox="0 0 140 140">
              <circle class="track" cx="70" cy="70" r="58"></circle>
              <circle class="progress" cx="70" cy="70" r="58" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle>
            </svg>
            <div class="mastery-label"><strong>${coverage}%</strong><span>Đã tiếp cận</span></div>
            <i class="orbit-dot one"></i><i class="orbit-dot two"></i>
          </div>
        </div>
      </section>

      <section class="stats-grid" aria-label="Thống kê học tập">
        ${statCard('purple', '<path d="M5 4h14a2 2 0 0 1 2 2v13a1 1 0 0 1-1.45.89L12 16.12l-7.55 3.77A1 1 0 0 1 3 19V6a2 2 0 0 1 2-2Zm2 4v2h10V8H7Zm0 4v2h7v-2H7Z"/>', stats.answered, 'Câu đã học')}
        ${statCard('green', '<path d="m9 16.17-3.88-3.88L3.7 13.7 9 19l12-12-1.41-1.41L9 16.17Z"/>', `${stats.accuracy}%`, 'Độ chính xác')}
        ${statCard('orange', '<path d="m12 2 2.47 5.01L20 7.82l-4 3.9.94 5.5L12 14.64 7.06 17.22 8 11.72l-4-3.9 5.53-.81L12 2Z"/>', stats.mastered, 'Câu đã vững')}
        ${statCard('red', '<path d="M11 2h2v11h-2V2Zm0 15h2v2h-2v-2ZM5.64 4.22 4.22 5.64A9 9 0 1 0 19.78 5.64l-1.42-1.42A11 11 0 1 1 5.64 4.22Z"/>', stats.review, 'Câu cần ôn')}
      </section>

      <section class="section">
        <div class="section-heading"><div><h2>Tiến độ theo bộ câu hỏi</h2><p>Chọn một đề hoặc chuyên đề để bắt đầu luyện ngay.</p></div><button class="text-button" data-action="goto-practice">Tùy chỉnh phiên học →</button></div>
        <div class="chapter-grid">${CHAPTERS.map(renderChapterCard).join('')}</div>
      </section>

      <section class="section two-column">
        <div class="panel">
          <div class="panel-header"><h3>Hoạt động gần đây</h3></div>

            ${sessions.length ? `<div class="activity-list">${sessions.map(renderActivity).join('')}</div>` : `
              <div class="empty-state"><div class="empty-icon">↗</div><h3>Chưa có phiên học nào</h3><p>Kết quả luyện tập và thi thử sẽ được lưu tại đây.</p><button class="button primary small" data-action="smart-start">Bắt đầu học</button></div>`}
          </div>
        </div>
        <div class="panel">
          <div class="panel-header"><h3>Chu trình ghi nhớ</h3></div>
          <div class="panel-body"><div class="study-plan">

          </div></div>
        </div>
      </section>
    </div>`;
  }

  function statCard(color, path, value, label) {
    return `<div class="stat-card"><span class="stat-icon ${color}"><svg viewBox="0 0 24 24">${path}</svg></span><div><strong class="stat-value">${e(value)}</strong><span class="stat-label">${e(label)}</span></div></div>`;
  }

  function renderChapterCard(ch) {
    const qs = chapterQuestions(ch.id);
    const answered = qs.filter(q => recordFor(q).attempts > 0).length;
    const mastered = qs.filter(q => recordFor(q).mastery >= 4).length;
    const p = percent(answered, qs.length);
    return `<article class="chapter-card" style="--chapter-color:${ch.color}">
      <div class="chapter-top"><span class="chapter-number">${ch.id}</span><span class="chapter-count">${qs.length} câu</span></div>
      <h3>${e(ch.title)}</h3>
      <div class="chapter-progress-row"><span>${answered}/${qs.length} đã học</span><span>${mastered} đã vững</span></div>
      <div class="progress-bar"><span style="width:${p}%;--bar-color:${ch.color}"></span></div>
      <div class="chapter-action"><button class="button secondary small" data-action="start-chapter" data-chapter="${ch.id}">Luyện ${e(chapterLabel(ch.id))}</button></div>
    </article>`;
  }

  function renderActivity(s) {
    const score = percent(s.correct, s.total);
    const cls = score >= 80 ? 'good' : score >= 50 ? 'mid' : 'low';
    const modeLabel = s.mode === 'exam' ? 'Thi thử' : s.mode === 'flashcard' ? 'Flashcard' : 'Luyện tập';
    return `<div class="activity-item"><span class="activity-score ${cls}">${score}%</span><div class="activity-info"><strong>${modeLabel} · ${s.chapters.map(chapterLabel).join(', ')}</strong><span>${formatDate(s.date)} · ${s.correct}/${s.total} câu</span></div><span class="status-pill ${score >= 80 ? 'mastered' : score >= 50 ? 'learning' : 'review'}">${score >= 80 ? 'Tốt' : score >= 50 ? 'Đang tiến bộ' : 'Cần ôn'}</span></div>`;
  }

  function renderPracticeSetup() {
    const selected = [...state.setup.chapters].sort((a, b) => a - b);
    const available = QUESTIONS.filter(q => selected.includes(q.chapter) && (!state.setup.onlyUnanswered || recordFor(q).attempts === 0)).length;
    const countLabel = state.setup.count === 'all' ? `Tất cả (${available})` : `${Math.min(Number(state.setup.count), available)} câu`;
    const modeLabels = { practice: 'Luyện có phản hồi', exam: 'Thi thử', flashcard: 'Flashcard' };
    const selectedLabel = selected.length === CHAPTERS.length ? `Tất cả ${CHAPTERS.length} bộ` : selected.map(chapterLabel).join(', ');

    app.innerHTML = `<div class="page">
      ${pageHeader('Thiết lập phiên học', 'Chọn nội dung và cách học phù hợp với mục tiêu hiện tại.')}
      <div class="setup-layout">
        <div class="setup-card">
          <section class="setup-section">
            <div class="setup-section-title"><span>1</span><h3>Chọn bộ câu hỏi</h3></div>
            <div class="chapter-select-grid">
              <label class="choice-card ${selected.length === CHAPTERS.length ? 'selected' : ''}" data-action="toggle-all-chapters"><input type="checkbox" ${selected.length === CHAPTERS.length ? 'checked' : ''}><span class="choice-check">✓</span><span class="choice-text"><strong>Tất cả bộ</strong><span>${QUESTIONS.length} câu hỏi</span></span></label>
              ${CHAPTERS.map(ch => {
                const c = chapterQuestions(ch.id).length;
                const active = state.setup.chapters.has(ch.id);
                return `<label class="choice-card ${active ? 'selected' : ''}" data-action="toggle-chapter" data-chapter="${ch.id}"><input type="checkbox" ${active ? 'checked' : ''}><span class="choice-check">✓</span><span class="choice-text"><strong>${e(chapterLabel(ch.id))}</strong><span>${c} câu · ${e(ch.title)}</span></span></label>`;
              }).join('')}
            </div>
          </section>

          <section class="setup-section">
            <div class="setup-section-title"><span>2</span><h3>Chọn chế độ học</h3></div>
            <div class="mode-grid">
              ${modeCard('practice', '✓', 'Luyện tập', 'Biết đúng sai ngay sau mỗi câu.')}
              ${modeCard('exam', '◷', 'Thi thử', 'Xem kết quả sau khi hoàn thành.')}
              ${modeCard('flashcard', '▱', 'Flashcard', 'Lật thẻ và tự đánh giá mức độ nhớ.')}
            </div>
          </section>

          <section class="setup-section">
            <div class="setup-section-title"><span>3</span><h3>Số lượng và thứ tự</h3></div>
            <div class="segmented" aria-label="Số câu hỏi">
              ${[10, 20, 50, 100, 'all'].map(n => `<button class="${state.setup.count === n ? 'active' : ''}" data-action="set-count" data-count="${n}">${n === 'all' ? 'Tất cả' : n}</button>`).join('')}
            </div>
            <div style="height:14px"></div>
            <div class="switch-row"><div class="switch-copy"><strong>Trộn thứ tự câu hỏi</strong><span>Giảm ghi nhớ máy móc theo vị trí.</span></div><label class="switch"><input type="checkbox" data-setting="shuffle" ${state.setup.shuffle ? 'checked' : ''}><span class="switch-track"></span></label></div>
            <div class="switch-row"><div class="switch-copy"><strong>Chỉ lấy câu chưa học</strong><span>Bỏ qua các câu đã từng làm.</span></div><label class="switch"><input type="checkbox" data-setting="onlyUnanswered" ${state.setup.onlyUnanswered ? 'checked' : ''}><span class="switch-track"></span></label></div>
            <div class="switch-row"><div class="switch-copy"><strong>Ưu tiên câu yếu</strong><span>Đưa câu có mức ghi nhớ thấp lên trước.</span></div><label class="switch"><input type="checkbox" data-setting="weakFirst" ${state.setup.weakFirst ? 'checked' : ''}><span class="switch-track"></span></label></div>
          </section>
        </div>

        <aside class="setup-card setup-summary">
          <h3>Tóm tắt phiên học</h3>
          <div class="summary-list">
            <div class="summary-line"><span>Nội dung</span><strong>${e(selectedLabel)}</strong></div>
            <div class="summary-line"><span>Chế độ</span><strong>${e(modeLabels[state.setup.mode])}</strong></div>
            <div class="summary-line"><span>Số lượng</span><strong>${e(countLabel)}</strong></div>
            <div class="summary-line"><span>Thứ tự</span><strong>${state.setup.shuffle ? 'Ngẫu nhiên' : 'Theo số câu'}</strong></div>
          </div>
          <p class="summary-note">Tiến độ, câu sai và câu đánh dấu được lưu tự động trên trình duyệt này.</p>
          <button class="button primary wide" data-action="start-setup" ${available === 0 ? 'disabled' : ''}><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5Z"/></svg>Bắt đầu phiên học</button>
          ${available === 0 ? '<p class="summary-note" style="margin-top:10px;color:var(--danger)">Không còn câu phù hợp với bộ lọc hiện tại.</p>' : ''}
        </aside>
      </div>
    </div>`;
  }

  function modeCard(mode, icon, title, desc) {
    return `<label class="mode-card ${state.setup.mode === mode ? 'selected' : ''}" data-action="set-mode" data-mode="${mode}"><input type="radio" name="mode" ${state.setup.mode === mode ? 'checked' : ''}><span class="mode-icon">${icon}</span><span><strong>${title}</strong><p>${desc}</p></span></label>`;
  }

  function buildSetupQuestions() {
    const chapters = [...state.setup.chapters];
    let pool = QUESTIONS.filter(q => chapters.includes(q.chapter));
    if (state.setup.onlyUnanswered) pool = pool.filter(q => recordFor(q).attempts === 0);
    if (state.setup.weakFirst) {
      pool.sort((a, b) => {
        const ra = recordFor(a), rb = recordFor(b);
        const scoreA = ra.attempts ? ra.mastery : 2.5;
        const scoreB = rb.attempts ? rb.mastery : 2.5;
        return scoreA - scoreB || (rb.wrongCount || 0) - (ra.wrongCount || 0);
      });
      if (state.setup.shuffle) {
        const weak = shuffle(pool.filter(q => recordFor(q).attempts && recordFor(q).mastery < 3));
        const rest = shuffle(pool.filter(q => !(recordFor(q).attempts && recordFor(q).mastery < 3)));
        pool = [...weak, ...rest];
      }
    } else if (state.setup.shuffle) pool = shuffle(pool);
    else pool.sort((a, b) => a.chapter - b.chapter || a.number - b.number);
    if (state.setup.count !== 'all') pool = pool.slice(0, Number(state.setup.count));
    return pool;
  }

  function startSession(questions, mode = 'practice', source = 'custom') {
    if (!questions.length) {
      toast('Không có câu hỏi phù hợp để bắt đầu.', 'error');
      return;
    }
    clearAutoNext();
    state.session = {
      status: 'active', mode, source, questions: [...questions], index: 0,
      answers: {}, startedAt: Date.now(), locked: false, feedback: null,
      flashRevealed: false, result: null
    };
    state.view = 'session';
    document.title = 'Phiên học — Dược lý 2 Mastery';
    updateNavigation();
    renderSession();
    window.scrollTo({ top: 0 });
  }

  function renderSession() {
    const s = state.session;
    if (!s) { setView('practice', { force: true }); return; }
    if (s.status === 'summary') { renderSummary(); return; }
    if (s.mode === 'flashcard') { renderFlashcardSession(); return; }
    const q = s.questions[s.index];
    const id = questionId(q);
    const answerState = s.answers[id];
    const selected = answerState?.selected || null;
    const answered = Boolean(selected);
    const progress = percent(s.index, s.questions.length);
    const r = recordFor(q);

    app.innerHTML = `<div class="page session-page">
      <div class="session-topbar">
        <button class="icon-button" data-action="exit-session" aria-label="Thoát phiên học">✕</button>
        <div class="progress-wrap"><div class="session-progress-meta"><span>${s.mode === 'exam' ? 'Thi thử' : 'Luyện tập'} · Câu ${s.index + 1}/${s.questions.length}</span><span>${progress}%</span></div><div class="session-progress"><span style="width:${progress}%"></span></div></div>
        <div class="session-tools"><button class="icon-button" data-action="toggle-theme" aria-label="Đổi giao diện">${state.data.theme === 'dark' ? '☀' : '☾'}</button></div>
      </div>

      <article class="session-card">
        <div class="question-meta"><div class="question-tags"><span class="tag primary">${e(chapterLabel(q.chapter))}</span><span class="tag">Câu ${q.number}</span>${r.attempts ? `<span class="tag ${r.lastCorrect === false ? 'warning' : ''}">Đã làm ${r.attempts} lần</span>` : ''}</div><button class="bookmark-button ${r.bookmarked ? 'active' : ''}" data-action="toggle-bookmark" aria-label="Đánh dấu câu hỏi"><svg viewBox="0 0 24 24"><path d="M17 3H7a2 2 0 0 0-2 2v16l7-3 7 3V5a2 2 0 0 0-2-2Z"/></svg></button></div>
        <h1 class="question-title">${e(q.question)}</h1>
        <div class="options-list">${q.options.map((o, i) => renderOption(q, o, i, selected, s)).join('')}</div>
        ${s.feedback ? renderFeedback(q, s.feedback) : ''}
        <div class="session-footer">
          <span class="keyboard-hint"><kbd>A</kbd>–<kbd>Z</kbd> chọn đáp án · <kbd>Space</kbd>/<kbd>→</kbd> tiếp</span>
        </div>
      </article>
      <button class="side-nav prev" data-action="previous-question" aria-label="Câu trước" title="Câu trước" ${s.index === 0 ? 'disabled' : ''}><span>←</span></button>
      <button class="side-nav next" data-action="next-question" aria-label="${s.index === s.questions.length - 1 ? 'Hoàn thành' : 'Câu tiếp theo'}" title="${s.index === s.questions.length - 1 ? 'Hoàn thành' : 'Câu tiếp theo'}" ${s.mode === 'practice' ? (!s.locked ? 'disabled' : '') : (!answered ? 'disabled' : '')}><span>→</span></button>
    </div>`;
  }

  function renderOption(q, text, index, selected, s) {
    const letter = LETTERS[index];
    let cls = '';
    let indicator = '';
    if (selected === letter) cls += ' selected';
    if (s.mode === 'practice' && s.locked) {
      if (isCorrectAnswer(q, letter)) { cls = ' correct'; indicator = '✓'; }
      else if (letter === selected) { cls = ' wrong'; indicator = '×'; }
    }
    return `<button class="option-button${cls}" data-action="select-option" data-letter="${letter}" ${s.mode === 'practice' && s.locked ? 'disabled' : ''}><span class="option-letter">${letter}</span><span class="option-text">${e(text)}</span><span class="option-indicator">${indicator}</span></button>`;
  }

  function renderFlashOptions(q, reveal) {
    return q.options.map((text, i) => {
      const letter = LETTERS[i];
      const cls = reveal && isCorrectAnswer(q, letter) ? ' correct' : '';
      const indicator = reveal && isCorrectAnswer(q, letter) ? '✓' : '';
      return `<div class="option-button${cls}" data-flash-option="${letter}" data-is-answer="${isCorrectAnswer(q, letter) ? 'true' : 'false'}"><span class="option-letter">${letter}</span><span class="option-text">${e(text)}</span><span class="option-indicator">${indicator}</span></div>`;
    }).join('');
  }

  function syncFlashRevealUI() {
    const s = state.session;
    if (!s || s.mode !== 'flashcard') return;
    const card = app.querySelector('.flashcard');
    const hint = app.querySelector('[data-flash-hint]');
    if (card) card.classList.toggle('show-answer', s.flashRevealed);
    app.querySelectorAll('[data-flash-option]').forEach(option => {
      const isAnswer = option.dataset.isAnswer === 'true';
      const indicator = option.querySelector('.option-indicator');
      option.classList.toggle('correct', s.flashRevealed && isAnswer);
      if (indicator) indicator.textContent = s.flashRevealed && isAnswer ? '✓' : '';
    });
    if (hint) hint.textContent = s.flashRevealed ? 'Đáp án đúng đang được tô xanh · bấm để ẩn' : 'Bấm vào thẻ để hiện đáp án đúng màu xanh';
  }

  function toggleFlashReveal() {
    const s = state.session;
    if (!s || s.mode !== 'flashcard') return;
    s.flashRevealed = !s.flashRevealed;
    syncFlashRevealUI();
  }

  function renderFeedback(q, feedback) {
    const correctText = correctAnswers(q).map(answer => `${answer}. ${q.options[LETTERS.indexOf(answer)]}`).join(' · ');
    const details = `${q.explanation ? `<div class="feedback-note"><b>Giải thích</b><span>${e(q.explanation)}</span></div>` : ''}${q.keywords ? `<div class="feedback-note"><b>Từ khóa</b><span>${e(q.keywords)}</span></div>` : ''}`;
    return `<div class="feedback-box ${feedback.correct ? 'correct' : 'wrong'}"><span class="feedback-icon"><span>${feedback.correct ? '✓' : '×'}</span></span><div class="feedback-copy"><strong>${feedback.correct ? 'Chính xác' : 'Chưa đúng'}</strong><p>Đáp án đúng: ${e(correctText)}</p>${details ? `<div class="feedback-details">${details}</div>` : ''}</div></div>`;
  }

  function selectOption(letter) {
    const s = state.session;
    if (!s || s.status !== 'active' || s.mode === 'flashcard') return;
    const q = s.questions[s.index];
    if (s.mode === 'practice' && s.locked) return;
    const isCorrect = isCorrectAnswer(q, letter);
    s.answers[questionId(q)] = { selected: letter, correct: isCorrect };
    if (s.mode === 'practice') {
      s.locked = true;
      s.feedback = { correct: isCorrect };
      updateProgress(q, isCorrect);
      scheduleAutoNext();
    }
    renderSession();
  }

  function nextQuestion(options = {}) {
    if (!options.fromAuto) clearAutoNext();
    const s = state.session;
    if (!s || s.status !== 'active') return;
    const q = s.questions[s.index];
    const current = s.answers[questionId(q)];
    if (s.mode !== 'flashcard' && !current?.selected) { toast('Hãy chọn một đáp án trước.', 'error'); return; }
    if (s.index >= s.questions.length - 1) { finishSession(); return; }
    s.index += 1;
    s.locked = s.mode === 'practice' && Boolean(s.answers[questionId(s.questions[s.index])]);
    s.feedback = s.locked ? { correct: s.answers[questionId(s.questions[s.index])].correct } : null;
    s.flashRevealed = false;
    renderSession();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function previousQuestion() {
    clearAutoNext();
    const s = state.session;
    if (!s || s.status !== 'active' || s.index === 0) return;
    s.index -= 1;
    if (s.mode === 'flashcard') {
      s.flashRevealed = false;
    } else {
      const previous = s.answers[questionId(s.questions[s.index])];
      s.locked = s.mode === 'practice' && Boolean(previous);
      s.feedback = s.locked ? { correct: previous.correct } : null;
    }
    renderSession();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderFlashcardSession() {
    const s = state.session;
    const q = s.questions[s.index];
    const r = recordFor(q);
    const progress = percent(s.index, s.questions.length);
    const flashOptions = (reveal) => `<div class="options-list flash-options">${renderFlashOptions(q, reveal)}</div>`;
    app.innerHTML = `<div class="page session-page">
      <div class="session-topbar">
        <button class="icon-button" data-action="exit-session" aria-label="Thoát phiên học">✕</button>
        <div class="progress-wrap"><div class="session-progress-meta"><span>Flashcard · Thẻ ${s.index + 1}/${s.questions.length}</span><span>${progress}%</span></div><div class="session-progress"><span style="width:${progress}%"></span></div></div>
        <div class="session-tools"><button class="bookmark-button ${r.bookmarked ? 'active' : ''}" data-action="toggle-bookmark"><svg viewBox="0 0 24 24"><path d="M17 3H7a2 2 0 0 0-2 2v16l7-3 7 3V5a2 2 0 0 0-2-2Z"/></svg></button></div>
      </div>
      <div class="flashcard-shell">
        <div class="flashcard ${s.flashRevealed ? 'show-answer' : ''}" data-action="flip-card" role="button" tabindex="0">
          <span class="flash-label">${e(chapterLabel(q.chapter))} · Câu ${q.number}</span>
          <h1 class="flash-question">${e(q.question)}</h1>
          ${flashOptions(s.flashRevealed)}
          <span class="flash-hint" data-flash-hint>${s.flashRevealed ? 'Đáp án đúng đang được tô xanh · bấm để ẩn' : 'Bấm vào thẻ để hiện đáp án đúng màu xanh'}</span>
        </div>
      </div>
      <div class="flash-actions rate"><button class="button danger" data-action="rate-flash" data-rating="again">1 · Chưa nhớ</button><button class="button success" data-action="rate-flash" data-rating="known">2 · Nhớ rồi</button></div>
      <div class="flash-nav">
        <span class="keyboard-hint"><kbd>Space</kbd> hiện/ẩn đáp án · <kbd>1</kbd> chưa nhớ · <kbd>2</kbd> nhớ rồi · <kbd>←</kbd><kbd>→</kbd> chuyển</span>
      </div>
      <button class="side-nav prev" data-action="previous-question" aria-label="Câu trước" title="Câu trước" ${s.index === 0 ? 'disabled' : ''}><span>←</span></button>
      <button class="side-nav next" data-action="next-question" aria-label="${s.index >= s.questions.length - 1 ? 'Hoàn thành' : 'Câu tiếp theo'}" title="${s.index >= s.questions.length - 1 ? 'Hoàn thành' : 'Câu tiếp theo'}"><span>→</span></button>
    </div>`;
  }

  function rateFlash(rating) {
    const s = state.session;
    const q = s.questions[s.index];
    const correct = rating === 'known';
    const masteryDelta = correct ? 1 : -2;
    s.answers[questionId(q)] = { selected: correct ? correctAnswers(q)[0] : null, correct, selfRated: true, rating };
    updateProgress(q, correct, masteryDelta);
    if (s.index >= s.questions.length - 1) finishSession();
    else { s.index += 1; s.flashRevealed = false; renderSession(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  }

  function finishSession() {
    clearAutoNext();
    const s = state.session;
    if (!s) return;
    if (s.mode === 'exam') {
      s.questions.forEach(q => {
        const a = s.answers[questionId(q)];
        updateProgress(q, Boolean(a?.selected && isCorrectAnswer(q, a.selected)));
      });
    }
    const correct = s.questions.filter(q => s.answers[questionId(q)]?.correct).length;
    const result = {
      date: Date.now(), mode: s.mode, total: s.questions.length, correct,
      chapters: [...new Set(s.questions.map(q => q.chapter))].sort((a, b) => a - b),
      duration: Math.max(1, Math.round((Date.now() - s.startedAt) / 1000))
    };
    state.data.sessions.unshift(result);
    state.data.sessions = state.data.sessions.slice(0, 30);
    saveData();
    s.result = result;
    s.status = 'summary';
    renderSummary();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderSummary() {
    const s = state.session;
    const result = s.result;
    const score = percent(result.correct, result.total);
    const wrong = s.questions.filter(q => !s.answers[questionId(q)]?.correct);
    const radius = 72;
    const circumference = 2 * Math.PI * radius;
    const offset = circumference - score / 100 * circumference;
    const minutes = Math.floor(result.duration / 60);
    const seconds = result.duration % 60;
    const title = score >= 90 ? 'Mức độ chính xác cao' : score >= 70 ? 'Kết quả đang tiến triển' : score >= 50 ? 'Cần củng cố thêm' : 'Nên ôn lại nhóm câu này';

    app.innerHTML = `<div class="page session-page">
      <section class="result-hero">
        <div class="result-ring-wrap"><svg class="result-ring" viewBox="0 0 180 180"><circle class="track" cx="90" cy="90" r="${radius}"></circle><circle class="value" cx="90" cy="90" r="${radius}" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle></svg><div class="result-score"><strong>${score}%</strong><span>${result.correct}/${result.total} câu đúng</span></div></div>
        <div class="result-copy"><span class="tag primary">Hoàn thành phiên học</span><h1>${title}</h1><p>Kết quả đã được lưu. Các câu chưa đúng được đưa vào danh sách ôn tập để ưu tiên ở lần học sau.</p>
          <div class="result-mini-stats"><div class="result-mini"><strong>${result.correct}</strong><span>Trả lời đúng</span></div><div class="result-mini"><strong>${wrong.length}</strong><span>Cần xem lại</span></div><div class="result-mini"><strong>${minutes}:${String(seconds).padStart(2, '0')}</strong><span>Thời gian học</span></div></div>
          <div class="result-actions"><button class="button primary" data-action="back-dashboard">Về tổng quan</button>${wrong.length ? '<button class="button secondary" data-action="review-session-wrong">Ôn ngay câu sai</button>' : ''}<button class="button ghost" data-action="repeat-session">Làm lại bộ câu này</button></div>
        </div>
      </section>
      ${wrong.length ? `<section class="section"><div class="section-heading"><div><h2>Các câu cần xem lại</h2><p>So sánh lựa chọn của bạn với đáp án trong tài liệu.</p></div></div><div class="review-list">${wrong.map(q => renderWrongItem(q, s.answers[questionId(q)])).join('')}</div></section>` : `<section class="section"><div class="panel"><div class="empty-state"><div class="empty-icon">✓</div><h3>Không có câu trả lời sai</h3><p>Tiếp tục học đề khác hoặc luyện một bộ câu mới để duy trì mức độ ghi nhớ.</p></div></div></section>`}
    </div>`;
  }

  function renderWrongItem(q, answer) {
    const selectedText = answer?.selected ? `${answer.selected}. ${q.options[LETTERS.indexOf(answer.selected)]}` : 'Chưa nhớ / không chọn';
    const correctText = correctAnswers(q).map(answer => `${answer}. ${q.options[LETTERS.indexOf(answer)]}`).join(' · ');
    return `<article class="review-item"><div class="review-item-top"><span class="tag primary">${e(chapterLabel(q.chapter))} · Câu ${q.number}</span><button class="text-button" data-action="open-question" data-id="${questionId(q)}">Xem đầy đủ</button></div><h4>${e(q.question)}</h4><div class="answer-row wrong"><span>Bạn đã chọn</span><span>${e(selectedText)}</span></div><div class="answer-row correct"><span>Đáp án đúng</span><span>${e(correctText)}</span></div></article>`;
  }
