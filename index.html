ửa sạch mao quản tránh lẫn chéo","options":["CHCl3","MeOH","EtOH","EtOH 96%"],"answer":"B","explanation":"MeOH hòa tan được nhiều chất còn bám trong mao quản và bay hơi tương đối nhanh, giúp hạn chế lẫn chéo.","keywords":"rửa mao quản MeOH","chapter":3},{"number":20,"question":"Đối với polyphenol, để vết gọn cần thêm vào pha động","options":["HCl","Acid hữu cơ","NH3","H2O"],"answer":"B","explanation":"Acid hữu cơ làm giảm ion hóa của nhóm phenol/acid, hạn chế tương tác kéo đuôi với silica và giúp vết gọn hơn.","keywords":"polyphenol thêm acid hữu cơ","chapter":3},{"number":21,"question":"Phát biểu SAI về pha động trong sắc ký lớp mỏng","options":["Rf quá thấp chứng tỏ mẫu bị giữ mạnh hơn so với pha động","Có pha động hỗn hòa và không hỗn hòa","Pha động càng phân cực thì khả năng phân tách càng tốt","Muốn tăng Rf thường tăng độ phân cực pha động"],"answer":"B","explanation":"Đáp án nguồn tô B, nhưng B là một phân loại có thể gặp trong tài liệu thực hành. Mệnh đề C mới là nhận định không đúng về nguyên tắc chung. Cần xác nhận đáp án với giảng viên.","keywords":"nguồn tô B; lý thuyết nghiêng về C","chapter":3},{"number":22,"question":"Viết lại pha động Ethyl acetat 40 ml, HCOOH 1 ml, Methanol 10 ml","options":["EtOAc:HCOOH:MeOH (4-0,1-1)","EtOAc-MeOH-HCOOH (4:1:0,1)","EtOAc:HCOOH:MeOH (4-0,1-1)","EtOAc-MeOH-HCOOH (4:0,1:1)"],"answer":"B","explanation":"Thể tích 40:10:1 rút gọn thành 4:1:0,1 và được viết theo thứ tự EtOAc-MeOH-HCOOH.","keywords":"40:10:1 4:1:0,1","chapter":3},{"number":23,"question":"Viết lại pha động Ethyl acetat 40%, n-Hexan 50%, Methanol 10%","options":["n-Hexan-EtOAc-MeOH (50:40:10)","EtOAc-n-Hexan-MeOH (40:50:10)","EtOAc:n-Hexan:MeOH (40-50-10)","n-Hexan:EtOAc:MeOH (50:40:10)"],"answer":"A","explanation":"Viết tên dung môi theo thứ tự tỉ lệ giảm dần: n-Hexan 50, EtOAc 40, MeOH 10.","keywords":"50:40:10 n-Hexan-EtOAc-MeOH","chapter":3},{"number":24,"question":"Để kiểm tra độ tinh khiết trên sắc ký lớp mỏng cần","options":["Tối thiểu 3 bản mỏng với 3 pha động khác nhau về độ phân cực","Tối thiểu 3 bản mỏng với 1 pha động","1 bản mỏng với 1 pha động","3 bản với 3 pha động giống nhau ít nhất một thành phần"],"answer":"A","explanation":"Một chất chỉ được xem là tinh khiết đáng tin cậy khi vẫn cho một vết trong nhiều hệ pha động có độ phân cực khác nhau.","keywords":"tinh khiết TLC 3 bản, 3 hệ khác độ phân cực","chapter":3},{"number":25,"question":"Thuốc thử có thể áp dụng cho hầu hết hợp chất hữu cơ","options":["FeCl3/cồn","NaOH/MeOH","Vanillin-sulfuric","Dragendorff"],"answer":"C","explanation":"Vanillin-sulfuric là thuốc thử hiện màu chung, phản ứng với nhiều nhóm hợp chất hữu cơ và cho màu đa dạng.","keywords":"thuốc thử chung VS","chapter":3},{"number":26,"question":"Pha động thích hợp để phân tách mẫu chứa alkaloid","options":["n-Hexan-EtOAc (8:2)","CHCl3-MeOH-acid acetic (9:1:1)","n-Hexan-EtOAc-diethylamine (8:2:1)","CHCl3-MeOH (9:1)"],"answer":"C","explanation":"Alkaloid là base; thêm diethylamine giúp hạn chế tương tác ion với silica, giảm kéo đuôi và làm vết gọn hơn.","keywords":"alkaloid thêm base yếu/diethylamine","chapter":3},{"number":27,"question":"Thuốc thử VS là","options":["Vanillin 1%/EtOH và H2SO4 10%/EtOH (1:1, v/v)","Vanillin 10%/EtOH và H2SO4 1%/EtOH (1:1, v/v)","Vanillin 1%/EtOH và H2SO4 10%/EtOH (1:1, g/g)","Vanillin 10%/EtOH và H2SO4 10%/EtOH (1:1, v/v)"],"answer":"A","explanation":"Công thức thường dùng trong tài liệu là vanillin 1% và H2SO4 10% trong ethanol, phối hợp theo thể tích 1:1.","keywords":"VS = vanillin 1% + H2SO4 10%","chapter":3},{"number":28,"question":"Bước sóng thông dụng dùng phát hiện vết trong SKLM","options":["254-350 nm","240-366 nm","240-250 nm","254-365 nm"],"answer":"D","explanation":"254 nm dùng quan sát vết hấp thụ trên nền F254; 365 nm dùng quan sát các chất phát huỳnh quang.","keywords":"TLC 254 và 365 nm","chapter":3},{"number":29,"question":"Điều kiện khi thực hiện phản ứng với thuốc thử Diazo","options":["Nhiệt độ thấp","Tất cả đều đúng","Có OH phenol","pH kiềm"],"answer":"D","explanation":"Phản ứng ghép cặp diazo tạo phẩm màu azo thường xảy ra thuận lợi trong môi trường kiềm, nơi nhóm phenol được hoạt hóa.","keywords":"Diazo môi trường kiềm","chapter":3},{"number":30,"question":"Dung môi chiết hạt Đậu đen để định tính flavonoid nhóm anthocyanidin","options":["Chloroform","Nước","Cồn 96%","Cồn 25%"],"answer":"D","explanation":"Anthocyanidin/anthocyanin khá phân cực, thích hợp với dung môi cồn-nước; cồn 25% giúp chiết tốt sắc tố từ vỏ hạt.","keywords":"Đậu đen anthocyanin cồn 25%","chapter":3},{"number":31,"question":"Phương pháp có thể dùng định tính saponin, TRỪ","options":["TLC với chất chuẩn","HPLC đầu dò UV-Vis","Phổ IR","Chỉ số bọt và chỉ số phá huyết"],"answer":"B","explanation":"Nhiều saponin hấp thụ UV yếu nên HPLC-UV/Vis không phải lựa chọn định tính trực tiếp thuận lợi nếu không có dẫn xuất hoặc điều kiện chuyên biệt.","keywords":"saponin ít hấp thụ UV","chapter":3},{"number":32,"question":"Câu nào sau đây sai về coumarin","options":["Thường tồn tại ở dạng aglycon","Thường tan tốt trong nước","Dễ bị mở vòng bởi kiềm","Dạng mở vòng cis phát quang yếu dưới UV365"],"answer":"B","explanation":"Coumarin tự do thường kém tan trong nước và tan tốt hơn trong dung môi hữu cơ; vì vậy phát biểu tan tốt trong nước là sai.","keywords":"coumarin tự do kém tan nước","chapter":3},{"number":33,"question":"Khi dùng thuốc thử để phát hiện vết trên sắc ký đồ, có thể","options":["Tất cả đều đúng","Phun nhiều thuốc thử lên cùng một bản hoặc các bản tương tự để so sánh","Nhúng nhanh bản vào thuốc thử loãng rồi loại phần thừa","Phun hoặc nhúng bản vào thuốc thử, sau đó sấy khi bản đã khô"],"answer":"D","explanation":"Đáp án nguồn chọn D: có thể phun hoặc nhúng trực tiếp bản mỏng vào thuốc thử, để khô rồi mới gia nhiệt/sấy theo hướng dẫn.","keywords":"thuốc thử hiện vết phun/nhúng, để khô rồi sấy","chapter":3},{"number":34,"question":"Lưu ý về pha động CHCl3-MeOH-H2O (65:35:10)","options":["Hệ không hỗn hòa nên ổn định tối đa 30 phút trước khi dùng","Chỉ lấy lớp dưới làm pha động","Khai triển nhanh do nước làm giảm độ nhớt","Tất cả đúng"],"answer":"D","explanation":"Đáp án nguồn chọn D. Tuy nhiên mô tả 'tối đa 30 phút' và việc nước làm giảm độ nhớt có dấu hiệu chưa chuẩn; nên ưu tiên quy trình thực hành của giảng viên: để phân lớp ổn định và lấy lớp được chỉ định.","keywords":"hệ phân lớp; đối chiếu quy trình giảng viên","chapter":3},{"number":35,"question":"Anthranoid là glycoside mà phần aglycon là dẫn chất của","options":["9,10-dihydroxyanthracen","9,10-diceton anthracen","9,10-dihydroxyanthraquinon","9,10-dihydroxyanthraglycosid"],"answer":"B","explanation":"Anthraquinon có khung anthracen mang hai nhóm carbonyl tại vị trí 9 và 10, tức 9,10-dioxo (diceton) anthracen.","keywords":"anthraquinon 9,10-diceton anthracen","chapter":3},{"number":36,"question":"Dạng aglycon của anthranoid tan trong","options":["Cồn","Dung dịch NaOH","NaHSO3","Nước nóng"],"answer":"B","explanation":"Aglycon anthraquinon có nhóm phenol, tạo muối phenolat tan trong dung dịch kiềm NaOH và thường cho màu đỏ/hồng.","keywords":"anthranoid aglycon + NaOH muối tan, màu đỏ","chapter":3},{"number":37,"question":"Chiết anthranoid dạng aglycon","options":["Hỗn hợp cồn-nước","EtOH","MeOH","Thủy phân bằng acid rồi chiết bằng CHCl3"],"answer":"D","explanation":"Với anthranoid dạng glycosid, cần thủy phân acid giải phóng aglycon rồi dùng dung môi hữu cơ như CHCl3 để chiết.","keywords":"anthraglycosid thủy phân acid CHCl3","chapter":3},{"number":38,"question":"Khung 9,10-diceton anthracen ở dạng oxy hóa là","options":["Anthraquinon","Anthranol","Dihydroanthranol","Anthron"],"answer":"A","explanation":"Anthraquinon là dạng oxy hóa có hai nhóm carbonyl tại C9 và C10; anthron và anthranol là các dạng khử hơn.","keywords":"dạng oxy hóa anthraquinon","chapter":3},{"number":39,"question":"Dung môi chiết để định tính flavonoid trong nụ hoa Hòe","options":["Methanol","Nước","Chloroform","Ethanol 96%"],"answer":"C","explanation":"Đáp án nguồn tô C. Tuy nhiên rutin trong nụ Hòe khá phân cực và thường được chiết bằng cồn-nước hoặc methanol, không phải chloroform. Câu này cần xác nhận lại vì đáp án nguồn có dấu hiệu sai.","keywords":"nguồn tô CHCl3 nhưng rutin thường cần dung môi phân cực","chapter":3},{"number":40,"question":"Phân tích chất A bằng TLC với n-Hexan-EtOAc (7:3), Rf=0,22. Để tăng Rf cần","options":["Tăng tỷ lệ EtOAc","Tăng tỷ lệ n-Hexan","Thay bằng n-Hexan-CHCl3 (5:5)","Tất cả đúng"],"answer":"A","explanation":"Rf thấp cho thấy pha động còn kém phân cực. Tăng EtOAc làm tăng độ phân cực của pha động và kéo chất đi xa hơn. Câu nguồn bị lệch ký hiệu phương án nên đã chuẩn hóa lại.","keywords":"Rf thấp tăng EtOAc","chapter":3},{"number":1,"question":"Định tính nhóm anthocyanidin trong Đậu đen có thể dùng các thuốc thử sau","options":["HCl","H2SO4","NaOH","Tất cả đúng"],"answer":"D","explanation":"Anthocyanidin đổi màu theo pH: acid mạnh làm chuyển đỏ, môi trường kiềm làm đổi sang xanh/tím rồi có thể phân hủy. Vì vậy cả acid và base đều có thể hỗ trợ nhận biết.","keywords":"anthocyanidin đổi màu theo pH","chapter":4},{"number":2,"question":"Sau khi chiết dược liệu bằng cồn 96%, ống 1 thêm NaOH 10% và đun cách thủy, ống 2 thêm nước. Chọn phát biểu đúng","options":["Ống 1 trong hơn ống 2 có coumarin","Ống 1 đục hơn ống 2 có coumarin","Hai ống trong như nhau có coumarin","Hai ống đục như nhau có coumarin"],"answer":"A","explanation":"NaOH mở vòng lacton của coumarin tạo muối tan trong nước, nên ống có kiềm trong hơn ống đối chứng.","keywords":"coumarin + NaOH mở lacton, tăng độ tan","chapter":4},{"number":3,"question":"Các vết anthraquinon khi nhúng vào thuốc thử KOH/cồn cho màu","options":["Xanh","Đỏ","Nâu","Vàng"],"answer":"B","explanation":"Anthraquinon có nhóm phenol tạo muối phenolat trong môi trường kiềm, thường cho màu đỏ hoặc hồng đỏ.","keywords":"anthraquinon + KOH đỏ","chapter":4},{"number":4,"question":"Các vết flavonoid khi nhúng vào thuốc thử FeCl3/cồn cho màu","options":["Tím đỏ","Vàng nâu","Xanh dương","Xanh đen"],"answer":"D","explanation":"Nhóm OH phenol của flavonoid tạo phức với Fe3+, thường cho màu xanh đen hoặc xanh sẫm.","keywords":"flavonoid + FeCl3 xanh đen","chapter":4},{"number":5,"question":"Nhóm flavonoid nào dương tính với phản ứng Cyanidin","options":["Flavonoid có vòng α-pyron","Một nhóm khác","Anthocyanidin","Flavonoid có vòng γ-pyron"],"answer":"D","explanation":"Phản ứng Cyanidin (Shinoda) đặc trưng cho nhiều flavonoid có khung γ-pyron như flavon, flavonol, flavanon.","keywords":"Cyanidin flavonoid vòng γ-pyron","chapter":4},{"number":6,"question":"Dung môi hay dùng để rửa sạch mao quản tránh lẫn chéo","options":["MeOH","CHCl3","EtOH 96%","EtOH"],"answer":"A","explanation":"MeOH hòa tan được nhiều chất bám trong mao quản và bay hơi nhanh, giúp hạn chế lẫn chéo giữa các mẫu.","keywords":"rửa mao quản MeOH","chapter":4},{"number":7,"question":"Dung môi nào được xếp chung nhóm có độ phân cực gần bằng nhau","options":["Petrol ether, MeOH","Dichloromethane, ether","MeOH, EtOAc","Aceton, ether"],"answer":"B","explanation":"Dichloromethane và ether đều thuộc nhóm dung môi phân cực thấp đến trung bình và gần nhau hơn các cặp còn lại.","keywords":"DCM ether","chapter":4},{"number":8,"question":"Pha động nào sau đây viết sai nguyên tắc","options":["PE-EtOAc-NH3 đậm đặc (8:2:0,1)","n-Hexan-EtOAc (8:2)","MeOH-CHCl3 (8:2)","n-BuOH-AcOH (4:1)"],"answer":"C","explanation":"Thông thường dung môi kém phân cực được viết trước và chiếm tỉ lệ lớn hơn; hệ MeOH-CHCl3 (8:2) vừa đảo thứ tự vừa quá giàu dung môi phân cực.","keywords":"viết pha động: kém phân cực trước","chapter":4},{"number":9,"question":"Dung môi KHÔNG dùng để chiết rutin từ dược liệu Hòe","options":["Hỗn hợp chloroform-ethyl acetat","Hỗn hợp ethanol-nước","Methanol 80%","Ethanol 80%"],"answer":"A","explanation":"Rutin là glycosid flavonoid khá phân cực, tan tốt hơn trong cồn-nước hoặc methanol; hệ chloroform-ethyl acetat quá kém phân cực.","keywords":"rutin phân cực không chiết bằng CHCl3-EtOAc","chapter":4},{"number":10,"question":"Rf phụ thuộc vào nhiều yếu tố, NGOẠI TRỪ","options":["Bản chất chất tan và pha động","Kích thước bản mỏng","Độ ẩm môi trường","Nhiệt độ môi trường"],"answer":"B","explanation":"Rf phụ thuộc bản chất chất, pha động, pha tĩnh, nhiệt độ và độ ẩm; kích thước tổng thể của bản không phải yếu tố quyết định trực tiếp nếu điều kiện khai triển tương đương.","keywords":"Rf không phụ thuộc kích thước bản","chapter":4},{"number":11,"question":"Rutin là flavonoid trong dược liệu Hòe. Chọn câu SAI","options":["Có đường rutinose trong cấu trúc","Có glucose và rhamnose trong cấu trúc","Thuộc phân nhóm flavonol","Thuộc phân nhóm flavanon"],"answer":"D","explanation":"Rutin là quercetin-3-O-rutinosid, thuộc flavonol và chứa disaccharid rutinose gồm glucose + rhamnose; không phải flavanon.","keywords":"rutin quercetin rutinosid, flavonol","chapter":4},{"number":12,"question":"Hiện tượng có thể gặp khi dùng UV 254 nm để hiện vết trên TLC silica gel F254","options":["Tất cả đúng","Tất cả sai","Toàn bộ bản mỏng phát huỳnh quang sáng","Có các vết tắt quang trên nền huỳnh quang sáng"],"answer":"A","explanation":"Ở 254 nm, nền F254 phát sáng còn chất hấp thụ UV tạo vết tối. Vì C và D cùng mô tả hai phần của hiện tượng nên đáp án 'tất cả đúng' phù hợp theo cách hỏi nguồn.","keywords":"UV254 nền sáng, vết tắt quang","chapter":4},{"number":13,"question":"Để thực hiện phản ứng Cyanidin, cần có","options":["Mg và HCl đậm đặc","NaOH","HCl đậm đặc","Mg"],"answer":"A","explanation":"Mg trong môi trường HCl khử flavonoid tạo sản phẩm màu đỏ/hồng đặc trưng.","keywords":"Cyanidin/Shinoda Mg + HCl","chapter":4},{"number":14,"question":"Để tránh bị quá tải, cần","options":["Tất cả đúng","Dùng thuốc thử VS để đánh giá độ đậm nhạt của vết","Giảm số lần chấm","Pha loãng mẫu với nước"],"answer":"C","explanation":"Giảm lượng mẫu nạp hoặc số lần chấm là biện pháp trực tiếp. Không nên mặc định pha loãng bằng nước vì nước khó bay hơi và có thể làm hỏng vết; VS cũng không phải công cụ chính để phòng quá tải.","keywords":"quá tải giảm lượng mẫu/số lần chấm","chapter":4},{"number":15,"question":"Phát biểu đúng về kỹ thuật sắc ký lớp mỏng pha thuận","options":["Pha tĩnh là silica gel gắn C8/C18","Cơ chế rây phân tử","Dùng để phân tích các chất kém phân cực","Pha động thường là MeOH, H2O"],"answer":"C","explanation":"Pha thuận dùng pha tĩnh phân cực như silica gel và pha động kém phân cực, nên thường phù hợp với các chất kém đến trung bình phân cực.","keywords":"pha thuận: pha tĩnh phân cực, pha động kém phân cực","chapter":4},{"number":16,"question":"Kỹ thuật sắc ký lớp mỏng pha thuận dựa trên cơ chế","options":["Trao đổi ion","Hấp phụ","Rây phân tử","Phân bố"],"answer":"B","explanation":"Trên silica gel pha thuận, chất bị giữ nhờ tương tác hấp phụ trên bề mặt pha tĩnh rắn.","keywords":"TLC pha thuận hấp phụ","chapter":4},{"number":17,"question":"Saponin dương tính với nhóm phản ứng nào","options":["Liebermann-Burchard và thử nghiệm tạo bọt","Liebermann-Burchard và Cyanidin","Tạo bọt và Cyanidin","Tạo bọt và FeCl3"],"answer":"A","explanation":"Saponin cho bọt bền; phần sapogenin steroid/triterpen có thể dương tính với Liebermann-Burchard.","keywords":"saponin tạo bọt + Liebermann-Burchard","chapter":4},{"number":18,"question":"Dung môi phù hợp để chiết anthraglycosid","options":["Nước sôi","CHCl3","Tất cả đúng","H2SO4 25%"],"answer":"A","explanation":"Anthraglycosid có phần đường nên phân cực và có thể được chiết bằng nước nóng; CHCl3 phù hợp hơn với aglycon sau thủy phân.","keywords":"anthraglycosid nước nóng","chapter":4},{"number":19,"question":"Lưu ý khi chấm mẫu trên bản mỏng","options":["Không nên dùng MeOH để hòa mẫu vì khó bay hơi","Chấm liên tục để mẫu hấp phụ nhanh","Dùng pipet Pasteur để vết nhỏ, gọn","Làm khan nước nếu có thao tác làm mẫu bị lẫn nước"],"answer":"D","explanation":"Mẫu không nên lẫn nước vì nước làm vết loang và tăng giữ trên silica. Pipet Pasteur thường cho giọt quá lớn; phải dùng mao quản và chấm ngắt quãng.","keywords":"mẫu chấm TLC không được lẫn nước","chapter":4},{"number":20,"question":"Nhóm flavonoid nào dương tính với phản ứng Cyanidin","options":["Flavonoid có vòng α-pyron","Flavonoid có vòng γ-pyron","Một nhóm khác","Anthocyanidin"],"answer":"B","explanation":"Phản ứng Cyanidin áp dụng cho các flavonoid có vòng γ-pyron như flavon, flavonol, flavanon.","keywords":"Cyanidin vòng γ-pyron","chapter":4},{"number":21,"question":"Dịch chiết cồn 25% của hạt Đậu đen có màu","options":["Tím","Đen","Vàng nhạt","Vàng nâu"],"answer":"A","explanation":"Vỏ hạt Đậu đen chứa anthocyanin nên dịch chiết cồn-nước thường có màu tím đến tím đỏ.","keywords":"Đậu đen anthocyanin màu tím","chapter":4},{"number":22,"question":"Trong phản ứng huỳnh quang coumarin trong môi trường kiềm dưới UV, phát biểu đúng","options":["Nửa bị che tối hơn vì coumarin ở đồng phân cis","Nửa bị che sáng hơn vì coumarin ở đồng phân trans","Nửa bị che tối hơn vì ở đồng phân trans","Nửa bị che sáng hơn vì ở đồng phân cis"],"answer":"B","explanation":"Phần được chiếu UV chuyển sang dạng trans có huỳnh quang mạnh hơn; phần bị che giữ dạng cis nên kém sáng hơn.","keywords":"coumarin trans huỳnh quang mạnh","chapter":4},{"number":23,"question":"Phản ứng đóng mở vòng lacton: Ống 1 có dịch chiết + NaOH 10%, ống 2 có dịch chiết + nước. Ống nào đục hơn, tại sao","options":["Ống 2 đục hơn do coumarin tạo muối tan trong nước","Ống 1 đục hơn do coumarin kém tan trong nước","Ống 1 đục hơn do coumarin tạo muối tan trong nước","Ống 2 đục hơn do coumarin kém tan trong nước"],"answer":"D","explanation":"Ống 1 có NaOH mở vòng lacton tạo muối tan nên trong hơn; ống 2 chỉ thêm nước, coumarin tự do kém tan nên đục hơn.","keywords":"ống nước đục hơn; ống kiềm trong hơn","chapter":4},{"number":24,"question":"Lam kính sau phản ứng thăng hoa có tinh thể kim vàng; nhỏ NaOH thấy tan và cho dung dịch hồng. Nhận định đúng","options":["Dược liệu có anthranoid dạng tự do","Dược liệu có anthranoid","Dược liệu có anthranoid dạng kết hợp","Chưa đủ để kết luận"],"answer":"A","explanation":"Vi thăng hoa thu được tinh thể anthraquinon tự do; phản ứng với NaOH tạo màu hồng/đỏ của muối phenolat.","keywords":"vi thăng hoa + NaOH hồng anthranoid tự do","chapter":4},{"number":25,"question":"Thuốc thử phát hiện vết anthranoid trên bản mỏng","options":["H2SO4/cồn","FeCl3/cồn","KOH/cồn","Vanillin-sulfuric"],"answer":"C","explanation":"Anthranoid, đặc biệt anthraquinon có nhóm phenol, cho màu đỏ/hồng với KOH trong cồn.","keywords":"anthranoid TLC KOH/cồn","chapter":4},{"number":26,"question":"Lưu ý về pha động CHCl3-MeOH-H2O (65:35:10)","options":["Hệ không hỗn hòa nên ổn định tối đa 30 phút trước khi dùng","Chỉ lấy lớp dưới làm pha động","Khai triển nhanh do nước làm giảm độ nhớt","Tất cả đúng"],"answer":"B","explanation":"Hệ có thể phân lớp; trong thực hành thường để ổn định rồi lấy lớp dưới theo hướng dẫn. Hai mệnh đề còn lại có cách diễn đạt chưa chuẩn.","keywords":"CHCl3-MeOH-H2O lấy lớp dưới","chapter":4},{"number":27,"question":"Trong phản ứng huỳnh quang coumarin trong môi trường kiềm dưới UV, phát biểu đúng","options":["Nửa bị che tối hơn vì coumarin ở đồng phân cis","Nửa bị che sáng hơn vì coumarin ở đồng phân trans","Nửa bị che tối hơn vì ở đồng phân trans","Nửa bị che sáng hơn vì ở đồng phân cis"],"answer":"B","explanation":"Phần không bị che nhận UV, chuyển nhiều sang dạng trans và phát huỳnh quang mạnh hơn; phần bị che giữ cis nên tối hơn.","keywords":"trans coumarin sáng hơn","chapter":4},{"number":28,"question":"Phản ứng Borntrager dương tính khi","options":["Lớp dưới có màu đỏ","Màu thay đổi tùy dược liệu","Lớp trên có màu đỏ","Lớp kiềm có màu đỏ"],"answer":"D","explanation":"Anthraquinon được chuyển sang lớp kiềm dưới dạng muối phenolat có màu đỏ/hồng.","keywords":"Borntrager lớp kiềm màu đỏ","chapter":4},{"number":29,"question":"Phát biểu SAI về chỉ số bọt","options":["Mỗi dược liệu có chỉ số khác nhau","Chỉ số bọt càng cao thường lượng saponin càng nhiều","Một số dược liệu có saponin nhưng không tạo bọt rõ","Có thể dùng để bán định lượng và tinh chế saponin"],"answer":"D","explanation":"Chỉ số bọt có thể dùng đánh giá hoặc bán định lượng sơ bộ nhưng không phải phương pháp tinh chế saponin.","keywords":"chỉ số bọt không dùng để tinh chế","chapter":4},{"number":30,"question":"Alkaloid chiết từ cây thông đỏ, có tác dụng trị ung thư","options":["Taxol","Vinblastin","Morphin","Berberin"],"answer":"A","explanation":"Taxol (paclitaxel) được phân lập từ cây Taxus và dùng trong điều trị nhiều loại ung thư.","keywords":"thông đỏ Taxol","chapter":4},{"number":31,"question":"Chọn câu đúng","options":["Scopolamin âm tính với thuốc thử Bouchardat","HNO3 là tác nhân oxy hóa trong phản ứng Murexid","Atropin là ester của tropanol và acid tropic","H2O2 là tác nhân oxy hóa trong phản ứng Vitali-Morin"],"answer":"B","explanation":"Trong phản ứng Murexid, HNO3 oxy hóa dẫn chất purin trước khi tạo màu tím murexid. Atropin là ester của tropin (không phải tropanol theo cách gọi trong đáp án).","keywords":"Murexid HNO3 oxy hóa","chapter":4},{"number":32,"question":"Phương pháp vi thăng hoa áp dụng với","options":["Ephedrin dạng muối","Coniin dạng base","Nicotin dạng muối","Cafein dạng base"],"answer":"D","explanation":"Cafein dạng base có khả năng thăng hoa, có thể kết tinh lại trên lam kính và dùng hỗ trợ định tính.","keywords":"vi thăng hoa cafein base","chapter":4},{"number":33,"question":"Cấu tử 'đám tế bào mô cứng' đặc trưng trong dược liệu nào","options":["Vàng đắng","Trà","Mã tiền","Bình vôi"],"answer":"C","explanation":"Bột hạt Mã tiền có các đám tế bào mô cứng và cấu trúc hạt đặc trưng, dùng trong vi học định tính.","keywords":"Mã tiền đám tế bào mô cứng","chapter":4},{"number":34,"question":"Trong thí nghiệm xác định chỉ số xà phòng hóa, để phản ứng xảy ra hoàn toàn nên đun ở nhiệt độ","options":["60-70°C","70-80°C","45-50°C","95-100°C"],"answer":"D","explanation":"Phản ứng xà phòng hóa được tiến hành khi đun hồi lưu gần nhiệt độ sôi để bảo đảm triglycerid phản ứng hoàn toàn với kiềm.","keywords":"xà phòng hóa gần 100°C","chapter":4},{"number":35,"question":"Chọn khẳng định đúng. KĐ1: Có thể thay NH4OH bằng Na2CO3 5% khi chiết Mã tiền. KĐ2: Chiết alkaloid dạng base trong Mã tiền bằng CHCl3","options":["KĐ1 sai; KĐ2 đúng","KĐ1 đúng; KĐ2 đúng","KĐ1 đúng; KĐ2 sai","KĐ1 sai; KĐ2 sai"],"answer":"B","explanation":"Na2CO3 là base nhẹ có thể kiềm hóa giải phóng alkaloid dạng base; CHCl3 sau đó chiết tốt alkaloid base không ion hóa.","keywords":"kiềm hóa bằng Na2CO3 chiết base bằng CHCl3","chapter":4},{"number":36,"question":"Khi chiết tinh dầu bằng phương pháp cất kéo, cần lưu ý nhiều yếu tố, NGOẠI TRỪ","options":["Thời gian cất kéo","Thu hồi tinh dầu từ nước thơm","Độ chia nhỏ dược liệu","Dung môi sử dụng"],"answer":"D","explanation":"Cất kéo hơi nước không lựa chọn dung môi hữu cơ như phương pháp chiết; các yếu tố chính là thời gian, mức độ nghiền và thu hồi tinh dầu.","keywords":"cất kéo hơi nước không chọn dung môi hữu cơ","chapter":4},{"number":37,"question":"Phản ứng với thuốc thử chung cho tủa đục, lắng xuống ngay được đánh giá mức độ","options":["4+","2+","3+","1+"],"answer":"C","explanation":"Tủa đục xuất hiện rõ và lắng ngay thường được xếp phản ứng mạnh, khoảng 3+; 4+ thường dành cho tủa rất nhiều và tức thì.","keywords":"tủa đục, lắng ngay 3+","chapter":4},{"number":38,"question":"Chọn phát biểu SAI","options":["Trong cây, alkaloid thường ở dạng muối","Ở pH acid, alkaloid tan trong nước","Ở pH kiềm, alkaloid tồn tại dạng base","Chuyển dạng alkaloid trong chiết xuất giúp thu được nhiều alkaloid hơn"],"answer":"D","explanation":"Chuyển đổi acid-base giúp phân bố alkaloid giữa hai pha để làm sạch và thu hồi, nhưng không tạo ra thêm alkaloid; câu 'giúp thu được nhiều hơn' là diễn đạt không chính xác.","keywords":"chuyển dạng giúp phân bố/làm sạch, không tạo thêm alkaloid","chapter":4},{"number":39,"question":"Mục đích của việc cô dịch chiết cồn trong định tính saponin","options":["Làm tăng nồng độ hoạt chất","Loại cồn khỏi dịch chiết","Tăng tốc độ phản ứng","Loại nước khỏi dịch chiết"],"answer":"B","explanation":"Cần loại ethanol vì cồn làm giảm khả năng tạo bọt; sau cô, cắn được hòa lại trong nước để thực hiện thử nghiệm saponin.","keywords":"cô dịch cồn loại cồn","chapter":4},{"number":40,"question":"Nhóm dược liệu cùng có saponin. Chọn câu SAI","options":["Tam thất, Cát cánh","Cam thảo, Tỳ giải","Mạch môn, Ngũ gia bì","Ngũ gia bì, Đại hoàng"],"answer":"D","explanation":"Đại hoàng nổi bật với anthranoid, không phải dược liệu điển hình chứa saponin như Ngũ gia bì.","keywords":"Đại hoàng anthranoid","chapter":4},{"number":1,"question":"Phản ứng Liebermann-Burchard xuất hiện vòng nhẫn, lớp trên màu xanh. Nhận định đúng","options":["Dược liệu có saponin","Dược liệu có saponin triterpen","Tất cả đều sai","Dược liệu có saponin steroid"],"answer":"D","explanation":"Màu xanh lục/xanh lam trong phản ứng Liebermann-Burchard thường gợi ý khung steroid, trong khi saponin triterpen thường thiên về đỏ tím.","keywords":"Liebermann xanh steroid","chapter":5},{"number":2,"question":"Có thể dùng nước để chiết coumarin không","options":["Được vì coumarin thường ở dạng aglycon tan tốt trong dung môi phân cực","Không được vì coumarin thường ở dạng aglycon, tan tốt hơn trong dung môi kém phân cực","Không được vì coumarin thường ở dạng glycosid tan tốt hơn trong dung môi kém phân cực","Được vì coumarin thường ở dạng glycosid tan tốt trong nước"],"answer":"B","explanation":"Coumarin thường gặp ở dạng aglycon, kém tan trong nước và tan tốt hơn trong dung môi hữu cơ.","keywords":"coumarin aglycon kém tan nước","chapter":5},{"number":3,"question":"Chiết dược liệu bằng toluen, dịch chiết cho phản ứng Borntrager dương tính. Nhận định đúng","options":["Có anthraglycosid","Có anthranoid dạng tự do","Có anthranoid dạng kết hợp","Có cả dạng tự do và kết hợp"],"answer":"B","explanation":"Toluen là dung môi kém phân cực, ưu tiên chiết anthranoid aglycon tự do. Borntrager dương tính cho thấy có anthranoid tự do.","keywords":"toluen + Borntrager dương anthranoid tự do","chapter":5},{"number":4,"question":"Chọn đáp án sai về các thử nghiệm dùng nhận định saponin","options":["Thử nghiệm tạo bọt","Thử nghiệm phát huyết","Thử nghiệm tạo tủa với hồng cầu","Thử nghiệm độc với cá"],"answer":"C","explanation":"Saponin gây phá huyết chứ không phải 'tạo tủa với hồng cầu'.","keywords":"saponin phá huyết, không tạo tủa hồng cầu","chapter":5},{"number":5,"question":"Phản ứng huỳnh quang coumarin trong môi trường kiềm dưới UV: phát biểu đúng","options":["Nửa bị che tối hơn vì coumarin ở đồng phân cis","Nửa bị che sáng hơn vì coumarin ở đồng phân trans","Nửa bị che tối hơn vì ở đồng phân trans","Nửa bị che sáng hơn vì ở đồng phân cis"],"answer":"B","explanation":"Phần được chiếu UV chuyển nhiều sang dạng trans và phát huỳnh quang mạnh hơn; phần bị che giữ dạng cis, tối hơn.","keywords":"coumarin trans huỳnh quang mạnh","chapter":5},{"number":6,"question":"Chọn câu sai về thuốc thử VS","options":["Thuốc thử kém bền nên pha ngay trước khi dùng","Ngâm bản mỏng trong thuốc thử khoảng 1 phút","Đợi bản khô sau khi nhúng rồi mới nung","Cơ chế liên quan oxy hóa-khử và loại nước tạo nhóm mang màu"],"answer":"B","explanation":"Không nên ngâm lâu vì dễ loang vết; thường phun hoặc nhúng nhanh rồi để khô trước khi gia nhiệt.","keywords":"VS nhúng nhanh, không ngâm lâu","chapter":5},{"number":7,"question":"Dùng hệ EtOAc-MeOH-HCOOH (90:9:1) làm pha động đánh giá anthranoid trong Đại hoàng được không","options":["Không vì mắc tiền","Được vì có MeOH nên tách tốt hơn","Không vì hệ quá phân cực","Được vì hệ có độ phân cực tương đương"],"answer":"C","explanation":"Anthranoid aglycon tương đối kém phân cực; hệ có EtOAc-MeOH-HCOOH ở tỉ lệ này có thể quá phân cực, làm Rf cao và giảm phân giải.","keywords":"anthranoid aglycon tránh pha động quá phân cực","chapter":5},{"number":8,"question":"Ngoài saponin, nhóm chất nào cũng có khả năng tạo bọt","options":["Glycosid tim","Sapogenin","Coumarin","Anthraglycosid"],"answer":"A","explanation":"Một số glycosid tim có cấu trúc glycosid và tính hoạt động bề mặt nhất định nên có thể tạo bọt, dù không đặc trưng bằng saponin.","keywords":"tạo bọt không tuyệt đối riêng cho saponin","chapter":5},{"number":9,"question":"Phản ứng huỳnh quang coumarin dưới UV365 trong môi trường kiềm: phát biểu đúng","options":["Nửa bị che tối hơn vì coumarin cis","Nửa bị che sáng hơn vì coumarin trans","Nửa bị che tối hơn vì trans","Nửa bị che sáng hơn vì cis"],"answer":"B","explanation":"Dạng trans tạo dưới tác dụng UV có huỳnh quang mạnh hơn dạng cis.","keywords":"trans sáng hơn cis","chapter":5},{"number":10,"question":"Chiết dược liệu bằng chloroform, dịch chiết có phản ứng Borntrager dương tính. Nhận định đúng","options":["Có anthraglycosid","Có anthranoid dạng tự do","Có anthranoid dạng kết hợp","Có cả dạng tự do và kết hợp"],"answer":"B","explanation":"CHCl3 chiết tốt aglycon anthranoid tự do; glycosid cần thủy phân trước khi chuyển sang dung môi hữu cơ.","keywords":"CHCl3 anthranoid tự do","chapter":5},{"number":11,"question":"Sau khi chiết bằng cồn 96%, ống 1 thêm NaOH 10% và đun, ống 2 thêm nước. Chọn phát biểu đúng","options":["Ống 1 đục hơn ống 2 có coumarin","Ống 1 trong hơn ống 2 có coumarin","Hai ống đục như nhau có coumarin","Hai ống trong như nhau có coumarin"],"answer":"B","explanation":"NaOH mở vòng lacton tạo muối tan, làm ống 1 trong hơn ống nước.","keywords":"coumarin + kiềm tăng độ tan","chapter":5},{"number":12,"question":"Chọn đáp án đúng về độ tan anthranoid","options":["Dạng kết hợp tan tốt trong dung môi kém phân cực","Dạng tự do tan tốt trong dung môi phân cực","Dạng tự do và kết hợp đều tan trong nước","Dạng tự do tan được trong dung môi kém phân cực"],"answer":"D","explanation":"Aglycon anthranoid kém phân cực hơn glycosid nên tan tốt trong CHCl3, toluen và các dung môi hữu cơ kém phân cực.","keywords":"anthranoid tự do dung môi kém phân cực","chapter":5},{"number":13,"question":"Coumarin phản ứng với kiềm làm thay đổi tính tan là do","options":["Có vòng lacton (ester nội)","Có chức acid","Có tính kiềm","Có chức alcol"],"answer":"A","explanation":"Kiềm mở vòng lacton của coumarin, tạo muối acid coumarinic tan tốt hơn trong nước.","keywords":"coumarin lacton mở vòng trong kiềm","chapter":5},{"number":14,"question":"Dung môi thường dùng để kết tủa saponin","options":["Butanol","Ethanol","Aceton","Methanol"],"answer":"C","explanation":"Saponin ít tan trong acetone nên acetone thường dùng để kết tủa saponin từ dịch chiết cồn.","keywords":"kết tủa saponin acetone","chapter":5},{"number":15,"question":"Thuốc thử phát hiện vết anthranoid trên TLC cho màu gì","options":["Vàng","Tím","Xanh đen","Đỏ"],"answer":"D","explanation":"KOH/cồn hoặc kiềm tạo muối phenolat màu đỏ/hồng với anthraquinon.","keywords":"anthranoid + kiềm đỏ","chapter":5},{"number":16,"question":"Nhóm chất có thể dùng H2SO4 10%/cồn để hiện màu trong TLC","options":["Tất cả đúng","Anthraquinon","Flavonoid","Saponin"],"answer":"A","explanation":"H2SO4/cồn là thuốc thử hiện màu khá rộng, có thể dùng cho nhiều nhóm hợp chất hữu cơ sau gia nhiệt.","keywords":"H2SO4/cồn thuốc thử chung","chapter":5},{"number":17,"question":"H2SO4 trong quy trình định tính anthranoid dạng kết hợp có mục đích","options":["Kiềm hóa","Thủy phân","Tạo môi trường trung tính","Oxy hóa hợp chất có màu"],"answer":"B","explanation":"Acid thủy phân liên kết glycosid, giải phóng aglycon anthranoid để chiết bằng dung môi hữu cơ và làm Borntrager.","keywords":"anthraglycosid thủy phân acid","chapter":5},{"number":18,"question":"Phát biểu sai về chỉ số bọt","options":["Mỗi dược liệu có chỉ số khác nhau","Chỉ số càng cao thường lượng saponin càng nhiều","Một số dược liệu có saponin nhưng không tạo bọt rõ","Có thể dùng để bán định lượng và tinh chế saponin"],"answer":"D","explanation":"Chỉ số bọt chỉ hỗ trợ đánh giá/bán định lượng sơ bộ, không dùng để tinh chế saponin.","keywords":"chỉ số bọt tinh chế","chapter":5},{"number":19,"question":"Phản ứng định tính đặc trưng nhất đối với anthranoid","options":["Diazo","Cyanidin","Borntrager","Liebermann-Burchard"],"answer":"C","explanation":"Borntrager là phản ứng đặc trưng cho anthraquinon, cho lớp kiềm màu đỏ/hồng.","keywords":"anthranoid Borntrager","chapter":5},{"number":20,"question":"Anthocyanidin trong hạt Đậu đen tác dụng NaOH cho màu","options":["Tím","Cam","Xanh","Đỏ"],"answer":"C","explanation":"Anthocyanidin đổi màu theo pH; trong môi trường kiềm thường chuyển xanh.","keywords":"anthocyanidin + kiềm xanh","chapter":5},{"number":21,"question":"Để phân biệt một loại tinh bột với tinh bột khác, có thể","options":["Soi hạt tinh bột","Dùng Lugol","Dùng NaOH","Một phương pháp khác"],"answer":"A","explanation":"Hình dạng, kích thước, rốn hạt và vân tăng trưởng dưới kính hiển vi giúp phân biệt nguồn tinh bột.","keywords":"phân biệt tinh bột soi vi học","chapter":5},{"number":22,"question":"Nhóm hợp chất đổi màu theo pH: acid đỏ, kiềm xanh, trung tính tím","options":["Chalcon","Flavon","Flavan","Anthocyanidin"],"answer":"D","explanation":"Anthocyanidin có hệ màu phụ thuộc pH, là cơ sở nhận biết sắc tố anthocyanin.","keywords":"anthocyanidin chỉ thị pH tự nhiên","chapter":5},{"number":23,"question":"Thuốc thử cần dùng nhiệt độ để hiện vết trong TLC","options":["FeCl3","KOH/MeOH","VS","Diazo"],"answer":"C","explanation":"Vanillin-sulfuric thường phải gia nhiệt sau phun/nhúng để phát triển màu.","keywords":"VS cần gia nhiệt","chapter":5},{"number":24,"question":"Phản ứng OH-phenol với thuốc thử diazonium xảy ra ở nhiệt độ thấp, trong môi trường","options":["Acid","Kiềm","Trung tính","Acid hoặc kiềm đều được"],"answer":"B","explanation":"Trong môi trường kiềm, phenol chuyển thành phenolat hoạt hóa cho phản ứng ghép cặp azo.","keywords":"Diazo + phenol pH kiềm","chapter":5},{"number":25,"question":"Pha tĩnh thường dùng trong TLC hiện nay","options":["Salicylic acid","Nhôm hydroxyd","Silica gel","Bảng nhôm kim loại"],"answer":"C","explanation":"Silica gel là pha tĩnh thông dụng nhất nhờ diện tích bề mặt lớn và tính hấp phụ tốt.","keywords":"TLC silica gel","chapter":5},{"number":26,"question":"Cơ chế hấp phụ dựa vào bản chất chất về","options":["Tất cả đúng","Kích thước","Khối lượng phân tử","Độ phân cực"],"answer":"D","explanation":"Trong TLC hấp phụ, độ phân cực quyết định mức tương tác với bề mặt silica và do đó ảnh hưởng mạnh đến Rf.","keywords":"hấp phụ TLC độ phân cực","chapter":5},{"number":27,"question":"Quá trình song song xảy ra khi khai triển TLC","options":["Hấp phụ - giải hấp","Hấp phụ - hòa tan","Rửa giải - hòa tan","Hòa tan - giải hấp"],"answer":"A","explanation":"Chất liên tục hấp phụ lên pha tĩnh và giải hấp vào pha động khi mặt dung môi di chuyển.","keywords":"khai triển TLC hấp phụ/giải hấp","chapter":5},{"number":28,"question":"Hiện tượng đường bờ xảy ra do","options":["Mẫu chấm quá sát rìa bản mỏng","Mẫu quá phân cực","Chấm mẫu quá tải","Bình chưa bão hòa"],"answer":"A","explanation":"Ở sát mép, dòng dung môi và sự bay hơi khác vùng giữa khiến vết di chuyển lệch, tạo hiệu ứng đường bờ.","keywords":"đường bờ chấm sát mép","chapter":5},{"number":29,"question":"Hình ảnh kết quả của quá trình sắc ký gọi là","options":["Sắc ký bản","Sắc ký lớp mỏng","Sắc ký rửa giải","Sắc ký đồ"],"answer":"D","explanation":"Kết quả phân bố các vết sau khai triển được gọi là sắc ký đồ.","keywords":"kết quả sắc ký sắc ký đồ","chapter":5},{"number":30,"question":"Mẫu chạy bị xéo khi khai triển do","options":["Bình chưa bão hòa","Mẫu quá phân cực","Bị quá tải","Bản mỏng bị mẻ ở chân làm dung môi đi không đều"],"answer":"D","explanation":"Chân bản mỏng không đều làm mặt dung môi dâng lệch, khiến các vết chạy xéo.","keywords":"bản mẻ/chân lệch dung môi đi xéo","chapter":5},{"number":31,"question":"Thuốc thử FeCl3 không hiện màu xanh đen với","options":["Saponin","Coumarin","Flavonoid","Tanin"],"answer":"A","explanation":"FeCl3 đặc trưng cho nhóm phenol như tanin và nhiều flavonoid; saponin không có phản ứng xanh đen đặc trưng.","keywords":"FeCl3 polyphenol, không phải saponin","chapter":5},{"number":32,"question":"Lưu ý khi chấm mẫu trên bản mỏng","options":["Mẫu kém phân cực có thể hòa bằng CHCl3","Không nên chấm liên tục vì làm vết loang","Nên chấm vạch nếu mẫu đa thành phần","Tất cả đúng"],"answer":"D","explanation":"Cả ba lưu ý đều giúp tạo vết gọn và cải thiện phân giải.","keywords":"chấm TLC dung môi phù hợp, ngắt quãng, chấm vạch","chapter":5},{"number":33,"question":"Nguyên nhân mẫu có Rf quá cao","options":["Mẫu lẫn nước","Pha động quá kém phân cực","Mẫu quá kém phân cực","Tất cả đúng"],"answer":"C","explanation":"Trong TLC pha thuận, mẫu càng kém phân cực càng tương tác yếu với silica nên chạy xa và Rf cao.","keywords":"Rf cao mẫu kém phân cực hoặc pha động quá phân cực","chapter":5},{"number":34,"question":"Bước sóng thường dùng phát hiện chất có vòng thơm","options":["254 nm","245 nm","345 nm","365 nm"],"answer":"A","explanation":"Nhiều hợp chất có vòng thơm hấp thụ tại 254 nm và hiện vết tối trên bản F254.","keywords":"vòng thơm UV254","chapter":5},{"number":35,"question":"Thuốc thử có thể dùng với polyphenol, NGOẠI TRỪ","options":["Dragendorff","Diazonium","Vanillin-sulfuric","FeCl3"],"answer":"A","explanation":"Dragendorff chọn lọc chủ yếu cho alkaloid, không phải polyphenol.","keywords":"polyphenol Dragendorff","chapter":5},{"number":36,"question":"Thuốc thử chọn lọc, NGOẠI TRỪ","options":["Vanillin-sulfuric","Dragendorff","KOH/cồn","FeCl3"],"answer":"A","explanation":"Vanillin-sulfuric là thuốc thử chung, không chọn lọc; các thuốc thử còn lại định hướng nhóm chất rõ hơn.","keywords":"VS thuốc thử không chọn lọc","chapter":5},{"number":37,"question":"Nhóm chất có thể dùng H2SO4 10%/cồn để hiện màu trong TLC","options":["Flavonoid","Anthraquinon","Tất cả đúng","Saponin"],"answer":"C","explanation":"H2SO4/cồn có thể hiện màu nhiều nhóm hữu cơ sau gia nhiệt, gồm flavonoid, anthraquinon và saponin.","keywords":"H2SO4/cồn thuốc thử chung","chapter":5},{"number":38,"question":"Vết anthraquinon khi nhúng KOH/cồn cho màu","options":["Xanh","Nâu","Vàng","Đỏ"],"answer":"D","explanation":"Anthraquinon phenol tạo muối kiềm màu đỏ/hồng.","keywords":"anthraquinon + KOH đỏ","chapter":5},{"number":39,"question":"Vết tanin khi nhúng FeCl3/cồn cho màu","options":["Xanh dương","Tím đỏ","Vàng nâu","Xanh đen"],"answer":"D","explanation":"Tanin tạo phức sẫm màu với Fe3+, thường xanh đen hoặc xanh tím tùy loại.","keywords":"tanin + FeCl3 xanh đen","chapter":5},{"number":40,"question":"Tính chất của anthraquinon","options":["Mùi thơm","Tan trong nước sôi","Thăng hoa","Dễ bị thủy phân trong acid"],"answer":"C","explanation":"Nhiều anthraquinon tự do có khả năng vi thăng hoa và kết tinh lại; chúng không tan tốt trong nước.","keywords":"anthraquinon tự do thăng hoa","chapter":5},{"number":1,"question":"Quá trình song song xảy ra khi khai triển sắc ký lớp mỏng","options":["Hấp phụ - hòa tan","Hấp phụ - giải hấp","Hòa tan - giải hấp","Rửa giải - hòa tan"],"answer":"B","explanation":"Trong quá trình khai triển, chất liên tục hấp phụ lên pha tĩnh rồi giải hấp vào pha động; sự cân bằng này quyết định tốc độ di chuyển.","keywords":"TLC hấp phụ và giải hấp","chapter":6},{"number":2,"question":"Lưu ý khi chấm mẫu trên bản mỏng. Chọn câu SAI","options":["Nên chọn dung môi dễ bay hơi như CHCl3, EtOAc để hòa tan mẫu","Rửa mao quản bằng MeOH trước khi chấm mẫu mới","Có thể dùng máy sấy để dung môi bay hơi nhanh hơn","Đèn UV hữu hiệu để kiểm tra lượng mẫu nếu mẫu là saponin hoặc hợp chất vòng no"],"answer":"D","explanation":"Saponin và nhiều hợp chất vòng no không hấp thụ UV rõ, nên UV không phải công cụ hữu hiệu để kiểm tra lượng chấm của các nhóm này.","keywords":"UV không phù hợp với saponin/vòng no","chapter":6},{"number":3,"question":"Nhóm chất có thể dùng Vanillin Sulfuric (VS) để hiện màu trong TLC","options":["Tất cả đúng","Anthraquinon","Saponin","Flavonoid"],"answer":"A","explanation":"VS là thuốc thử hiện màu khá rộng, có thể áp dụng cho nhiều nhóm hợp chất hữu cơ sau gia nhiệt.","keywords":"VS thuốc thử chung","chapter":6},{"number":4,"question":"Bước sóng thường dùng để phát hiện chất qua khả năng phát huỳnh quang","options":["254 nm","245 nm","365 nm","345 nm"],"answer":"C","explanation":"UV 365 nm thường dùng để quan sát các vết phát huỳnh quang trên nền tối.","keywords":"phát huỳnh quang UV365","chapter":6},{"number":5,"question":"Thuốc thử thường dùng để kiểm tra tạp trên sắc ký lớp mỏng","options":["Vanillin sulfuric","KOH/cồn","FeCl3","Dragendorff"],"answer":"A","explanation":"Vanillin sulfuric hiện màu được nhiều nhóm chất nên thích hợp để quan sát phổ vết và phát hiện tạp không mong muốn.","keywords":"kiểm tra tạp TLC thuốc thử chung VS","chapter":6},{"number":6,"question":"Silica gel là","options":["Chất vô cơ chứa silic","Tồn tại dạng hạt kích thước 1-2 cm","Hợp chất hữu cơ giàu carbon","Có nhiều nhóm -COOH trong cấu trúc"],"answer":"A","explanation":"Silica gel là silicon dioxide ngậm nước, vật liệu vô cơ có nhiều nhóm silanol trên bề mặt.","keywords":"silica gel chất vô cơ, nhóm silanol","chapter":6},{"number":7,"question":"Trong sắc ký lớp mỏng, giới hạn giá trị Rf là","options":["1,0 < Rf < 2,0","0 < Rf < 1,0","0,5 < Rf < 1,0","0 < Rf < 0,5"],"answer":"B","explanation":"Rf là tỉ số quãng đường chất đi được trên quãng đường dung môi, nên giá trị nằm từ 0 đến 1.","keywords":"Rf = quãng đường chất / quãng đường dung môi","chapter":6},{"number":8,"question":"Phát biểu sai về thí nghiệm Liebermann-Burchard","options":["Phytosterol, glycosid tim cũng có thể dương tính do khung steroid","Môi trường càng khan, vòng nhẫn càng rõ","Giúp sơ bộ phân biệt cấu trúc saponin","Dịch chiết càng đậm, vòng nhẫn càng rõ"],"answer":"D","explanation":"Độ rõ vòng màu phụ thuộc môi trường khan và kỹ thuật tạo lớp; dịch quá đậm có thể làm màu khó quan sát.","keywords":"Liebermann-Burchard môi trường khan","chapter":6},{"number":9,"question":"Nhóm OH phenol của flavonoid tác dụng FeCl3 cho màu","options":["Xanh rêu đến xanh đen","Vàng chanh","Đỏ mận","Vàng cam"],"answer":"A","explanation":"Fe3+ tạo phức với nhóm OH phenol của flavonoid, cho màu xanh rêu đến xanh đen.","keywords":"flavonoid + FeCl3 xanh sẫm","chapter":6},{"number":10,"question":"Rf phụ thuộc vào các yếu tố, NGOẠI TRỪ","options":["Nhiệt độ môi trường","Độ ẩm môi trường","Kích thước bản mỏng","Bản chất chất tan và pha động"],"answer":"C","explanation":"Kích thước tổng thể của bản không quyết định trực tiếp Rf nếu điều kiện khai triển tương đương.","keywords":"Rf không phụ thuộc kích thước bản","chapter":6},{"number":11,"question":"Thuốc thử phát hiện vết hợp chất hữu cơ nói chung trong TLC","options":["AlCl3 1%","Vanillin sulfuric 1%","ZnCl2 1%","CoCl3 1%"],"answer":"B","explanation":"Vanillin sulfuric là thuốc thử hiện màu chung cho nhiều hợp chất hữu cơ.","keywords":"thuốc thử chung VS","chapter":6},{"number":12,"question":"Đặc điểm KHÔNG phải của anthocyanidin","options":["Thay đổi màu khi thêm kiềm","Có nhân pyrylium","Thay đổi màu khi thêm acid","Có nhân gamma-pyron"],"answer":"D","explanation":"Anthocyanidin có cation flavylium/pyrylium và màu phụ thuộc pH; không mang nhân gamma-pyron điển hình như flavon.","keywords":"anthocyanidin nhân pyrylium","chapter":6},{"number":13,"question":"Phản ứng Liebermann-Burchard gồm","options":["CHCl3, aldehyd acetic, H2SO4 đậm đặc","CHCl3, Ac2O, H2SO4 đậm đặc","CHCl3, AcOH, H2SO4 đậm đặc","CHCl3, ether ethylic, H2SO4 đậm đặc"],"answer":"B","explanation":"Thuốc thử gồm anhydrid acetic và H2SO4 đậm đặc trong môi trường chloroform.","keywords":"Liebermann-Burchard Ac2O + H2SO4","chapter":6},{"number":14,"question":"Ý nghĩa của tỉ số Rf: đặc trưng cho","options":["Chất lượng bản mỏng","Chất phân tích và giá mang bản mỏng","Chất phân tích và pha động sử dụng","Pha tĩnh và pha động"],"answer":"C","explanation":"Trong cùng điều kiện TLC, Rf phản ánh mối quan hệ giữa chất phân tích và hệ pha động/pha tĩnh đang dùng; trong các lựa chọn, C phù hợp nhất.","keywords":"Rf đặc trưng chất và hệ dung môi","chapter":6},{"number":15,"question":"Đặc điểm KHÔNG phải của anthocyanidin","options":["Thay đổi màu khi thêm kiềm","Có nhân pyrylium","Thay đổi màu khi thêm acid","Có nhân gamma-pyron"],"answer":"D","explanation":"Anthocyanidin có nhân flavylium và thay đổi màu theo pH, không có nhân gamma-pyron như flavon.","keywords":"anthocyanidin gamma-pyron","chapter":6},{"number":16,"question":"Khi soi bản silica gel F254 dưới UV254","options":["Giữa bản phát quang sáng nhất","Tất cả vị trí tắt quang","Cả bản tắt quang trừ vết mẫu","Cả bản phát quang, trừ vết mẫu hấp thụ UV"],"answer":"D","explanation":"Nền F254 phát huỳnh quang xanh lục; chất hấp thụ 254 nm làm tắt quang tạo vết tối.","keywords":"UV254 nền sáng, vết tối","chapter":6},{"number":17,"question":"Sản phẩm của phản ứng Cyanidin là","options":["Flavan","Flavanon","Leucoanthocyanidin","Anthocyanidin"],"answer":"D","explanation":"Phản ứng Cyanidin khử flavonoid tạo dẫn chất anthocyanidin có màu đỏ/hồng.","keywords":"Cyanidin anthocyanidin màu","chapter":6},{"number":18,"question":"Phát biểu sai về chỉ số bọt","options":["Mỗi dược liệu có chỉ số khác nhau","Chỉ số càng cao thường lượng saponin càng nhiều","Một số dược liệu có saponin nhưng không tạo bọt rõ","Có thể dùng để bán định lượng và tinh chế saponin"],"answer":"D","explanation":"Chỉ số bọt chỉ dùng đánh giá hoặc bán định lượng sơ bộ, không dùng để tinh chế.","keywords":"chỉ số bọt tinh chế","chapter":6},{"number":19,"question":"Vết chấm phải cách mép bản tối thiểu 5 mm để tránh","options":["Vết đi quá chậm","Chất bị hòa tan vào pha động","Chất hấp phụ quá mạnh","Hiện tượng bờ"],"answer":"D","explanation":"Chấm quá sát mép gây dòng dung môi không đều và tạo hiệu ứng đường bờ.","keywords":"cách mép 5 mm tránh đường bờ","chapter":6},{"number":20,"question":"Thuốc thử KHÔNG dùng định tính nhóm OH-phenol của flavonoid","options":["AlCl3","HCl","NaOH","FeCl3"],"answer":"B","explanation":"HCl đơn thuần không phải thuốc thử đặc trưng cho nhóm OH-phenol; AlCl3, NaOH và FeCl3 đều cho phản ứng màu/phức đặc trưng.","keywords":"OH-phenol flavonoid HCl đơn","chapter":6},{"number":21,"question":"Rutin là một flavonoid có","options":["Mạch đường gồm hai rhamnose","Là một O-glycosid","Là một C-glycosid","Tất cả đúng"],"answer":"B","explanation":"Rutin là quercetin-3-O-rutinosid; phần đường rutinose gồm glucose và rhamnose, không phải hai rhamnose.","keywords":"rutin O-glycosid","chapter":6},{"number":22,"question":"Phát biểu đúng về tính chất saponosid","options":["Tan tốt trong n-butanol","Tan trong n-hexan, ether dầu hỏa","Tạo bọt bền khi lắc với nước hoặc cồn-nước","A và B đúng"],"answer":"C","explanation":"Saponosid có tính hoạt động bề mặt nên tạo bọt bền trong nước; chúng không tan tốt trong dung môi rất kém phân cực.","keywords":"saponosid tạo bọt bền","chapter":6},{"number":23,"question":"Nhóm hợp chất có màu thay đổi theo pH môi trường","options":["Chalcon","Anthocyanidin","Flavon","Flavan"],"answer":"B","explanation":"Anthocyanidin đổi màu rõ theo pH nhờ cân bằng giữa các dạng cấu trúc khác nhau.","keywords":"anthocyanidin đổi màu theo pH","chapter":6},{"number":24,"question":"Để sơ bộ kiểm tra độ tinh khiết của chất phân lập bằng TLC, tiến hành","options":["Với mẫu ở ba nồng độ khác nhau","Với ba hệ pha động có độ phân cực khác nhau","Trên ba bản kích thước khác nhau","Phát hiện bằng ba phương pháp khác nhau"],"answer":"B","explanation":"Chất tinh khiết đáng tin cậy phải cho một vết trong nhiều hệ dung môi có độ phân cực khác nhau.","keywords":"kiểm tra tinh khiết 3 hệ pha động","chapter":6},{"number":25,"question":"Phản ứng định tính anthocyanidin dựa vào nguyên tắc","options":["Màu thay đổi theo áp suất","Màu thay đổi theo nhiệt độ","Màu thay đổi theo nồng độ","Màu thay đổi theo pH môi trường"],"answer":"D","explanation":"Màu anthocyanidin phụ thuộc pH do thay đổi dạng cấu trúc và trạng thái proton hóa.","keywords":"anthocyanidin màu phụ thuộc pH","chapter":6},{"number":26,"question":"Thành phần thuốc thử phản ứng Cyanidin","options":["Chì acetat","NaOH","FeCl3","Mg/HCl"],"answer":"D","explanation":"Phản ứng Cyanidin/Shinoda dùng Mg và HCl đậm đặc để tạo màu đỏ/hồng.","keywords":"Cyanidin Mg/HCl","chapter":6},{"number":27,"question":"Phản ứng Cyanidin định tính phần nào trong khung flavonoid","options":["Vòng lacton","OH-phenol","Vòng gamma-pyron","Vòng benzen"],"answer":"C","explanation":"Phản ứng đặc trưng cho hệ gamma-pyron của nhiều flavonoid.","keywords":"Cyanidin vòng gamma-pyron","chapter":6},{"number":28,"question":"Hệ dung môi KHÔNG thích hợp trong sắc ký rutin","options":["EtOAc-HCOOH-H2O (8:1:1)","Petrol ether-EtOAc-HCOOH (15:5:1)","EtOAc-MeOH-H2O (100:17:13)","BuOH-AcOH-H2O (4:1:5)"],"answer":"B","explanation":"Rutin rất phân cực; hệ giàu petrol ether quá kém phân cực nên không kéo rutin khỏi silica hiệu quả.","keywords":"rutin phân cực tránh petrol ether","chapter":6},{"number":29,"question":"Thuốc thử phát hiện vết saponin trong TLC","options":["H2SO4 10%","HCl 20%","Hager","FeCl3 1%"],"answer":"A","explanation":"H2SO4 10% sau gia nhiệt có thể hiện màu vết saponin; Hager dùng cho alkaloid, FeCl3 cho phenol.","keywords":"saponin TLC H2SO4 10%","chapter":6},{"number":30,"question":"Phản ứng KHÔNG phải của nhóm OH-phenol","options":["Phản ứng với diazonium","Phản ứng với FeCl3","Phản ứng với H2SO4 10%","Tạo phức với kim loại đa hóa trị"],"answer":"C","explanation":"H2SO4 10% là thuốc thử hiện màu chung, không đặc trưng cho nhóm OH-phenol.","keywords":"OH-phenol H2SO4 10% đặc hiệu","chapter":6},{"number":31,"question":"Cơ chế thuốc thử hiện màu H2SO4 10%/EtOH","options":["Oxy hóa và loại nước tạo nhóm mang màu","Tạo muối sulfate mang màu","Hydrat hóa vòng thơm","Gắn nhóm mang màu vào vòng thơm"],"answer":"A","explanation":"Acid sulfuric thúc đẩy khử nước và oxy hóa, tạo hệ liên hợp mang màu sau gia nhiệt.","keywords":"H2SO4/EtOH oxy hóa, khử nước","chapter":6},{"number":32,"question":"Phân nhóm flavonoid dương tính với phản ứng Cyanidin","options":["Flavon","Anthocyanidin","Flavon và flavanon","Flavanon"],"answer":"C","explanation":"Cả flavon và flavanon đều có thể cho phản ứng Cyanidin sau khử trong môi trường Mg/HCl.","keywords":"Cyanidin flavon, flavanon","chapter":6},{"number":33,"question":"Khi chuẩn bị pha động sắc ký alkaloid, thường thêm","options":["Acid sulfuric","Nước cất","Acid acetic","Amoniac"],"answer":"D","explanation":"Alkaloid là base; thêm amoniac giúp giữ ở dạng base tự do, giảm kéo đuôi và làm vết gọn.","keywords":"alkaloid thêm NH3/NH4OH","chapter":6},{"number":34,"question":"Lưu ý về pha động CHCl3-MeOH-H2O (65:35:10)","options":["Hệ không hỗn hòa, để ổn định tối thiểu 30 phút trước khi dùng","Chỉ lấy lớp trên chứa nước","Khai triển chậm do CHCl3 nhớt","Tất cả đúng"],"answer":"A","explanation":"Hệ có thể phân lớp nên cần để ổn định trước khi lấy lớp được chỉ định. Mệnh đề lấy lớp trên không phù hợp với quy trình thường dùng.","keywords":"hệ phân lớp để ổn định","chapter":6},{"number":35,"question":"KĐ1: tanin pyrogallic tan tốt trong ether; KĐ2: tanin pyrocatechic không tan trong ether","options":["KĐ1 đúng; KĐ2 sai","KĐ1 sai; KĐ2 đúng","Cả hai đúng","Cả hai sai"],"answer":"D","explanation":"Tanin pyrogallic thường tan trong nước và dung môi phân cực, không tan tốt trong ether; tanin pyrocatechic thường có thể được chiết một phần bằng ether/ethyl acetate.","keywords":"pyrogallic kém tan ether; pyrocatechic tan hơn","chapter":6},{"number":36,"question":"Các polymethoxy flavonoid tan tốt trong","options":["MeOH","EtOAc","CHCl3","EtOH"],"answer":"C","explanation":"Nhiều nhóm methoxy làm giảm độ phân cực, nên polymethoxy flavonoid tan tốt trong CHCl3.","keywords":"nhiều OCH3 kém phân cực CHCl3","chapter":6},{"number":37,"question":"Pha động trong sắc ký lớp mỏng là","options":["Mao quản chấm","Bình sắc ký","Hệ dung môi","Bản mỏng"],"answer":"C","explanation":"Pha động là hệ dung môi di chuyển nhờ mao dẫn qua lớp pha tĩnh.","keywords":"pha động hệ dung môi","chapter":6},{"number":38,"question":"Cùng một mẫu, pha động nào cho các vết có Rf thấp nhất","options":["n-Hexan-DCM (7:3)","n-Hexan-aceton (8:2)","n-Hexan-CHCl3 (7:3)","n-Hexan-EtOAc (8:2)"],"answer":"C","explanation":"Trong các hệ, n-hexan-CHCl3 thường có sức rửa giải thấp hơn hệ chứa DCM, EtOAc hoặc aceton, nên cho Rf thấp hơn.","keywords":"Rf thấp pha động kém phân cực hơn","chapter":6},{"number":39,"question":"Muốn chạy TLC anthranoid dạng glycosid có thể dùng pha động","options":["Kém phân cực, thêm kiềm","Kém phân cực, thêm acid","Phân cực, thêm acid","Phân cực, thêm kiềm"],"answer":"C","explanation":"Anthraglycosid phân cực nên cần hệ pha động phân cực; thêm acid giúp hạn chế ion hóa nhóm phenol và gọn vết.","keywords":"anthraglycosid pha động phân cực + acid","chapter":6},{"number":40,"question":"Thứ tự dung môi theo sức rửa giải tăng dần","options":["CHCl3 < EtOAc < ether ethylic < butanol","Ether ethylic < CHCl3 < EtOAc < butanol","Ether ethylic < EtOAc < CHCl3 < butanol","CHCl3 < ether ethylic < EtOAc < butanol"],"answer":"D","explanation":"Trên silica gel pha thuận, sức rửa giải tăng theo độ phân cực: CHCl3 < ether ethylic < EtOAc < butanol.","keywords":"sức rửa giải tăng: CHCl3 < ether < EtOAc < BuOH","chapter":6},{"number":1,"question":"Trong thử nghiệm vi thăng hoa anthranoid, tinh thể bám trên lam kính ở dạng","options":["Dihydroanthranol","Anthron","Anthraglycosid","Anthraquinon"],"answer":"D","explanation":"Anthraquinon tự do có khả năng vi thăng hoa và kết tinh lại trên lam kính; dạng glycosid không thăng hoa trực tiếp.","keywords":"vi thăng hoa anthranoid anthraquinon","chapter":7},{"number":2,"question":"Trong thử nghiệm tạo bọt định tính saponin, kết quả dương tính được ghi nhận sau","options":["10 phút, cột bọt cao 2 cm","10 phút, chỉ cần có bọt","15 phút, cột bọt cao 1 cm","15 phút, chỉ cần có bọt"],"answer":"C","explanation":"Thử nghiệm dương tính khi sau 15 phút vẫn còn cột bọt bền khoảng 1 cm.","keywords":"saponin bọt bền 1 cm sau 15 phút","chapter":7},{"number":3,"question":"Trong thử nghiệm tạo bọt định tính saponin, hiện tượng âm tính là","options":["Sau 15 phút không còn bọt","Sau 15 phút có màu tím không bền","Sau 15 phút có cột bọt cao 1 cm","Sau 15 phút chuyển vàng"],"answer":"A","explanation":"Không còn cột bọt bền sau thời gian quy định nghĩa là thử nghiệm âm tính.","keywords":"âm tính không còn bọt sau 15 phút","chapter":7},{"number":4,"question":"Chiết anthranoid bằng toluen (d<1), thêm NaOH loãng; lớp kiềm ở vị trí","options":["Dưới","Không xác định","Trên","Giữa"],"answer":"A","explanation":"Toluen nhẹ hơn nước nên ở lớp trên; dung dịch NaOH có khối lượng riêng lớn hơn nằm dưới.","keywords":"toluen trên - lớp kiềm dưới","chapter":7},{"number":5,"question":"Cho 2 ml nước vào dịch chiết cồn 96% chứa coumarin, hiện tượng","options":["Đục","Trong","Phát quang","Tăng màu"],"answer":"A","explanation":"Coumarin tự do kém tan trong nước nên khi thêm nước vào dịch cồn sẽ giảm độ tan và gây đục.","keywords":"coumarin + nước đục","chapter":7},{"number":6,"question":"EGCG là","options":["Polyphenol","Epigallocatechin gallate","Có nhiều trong hoa Hòe","FeCl3 1% cho xanh rêu"],"answer":"A","explanation":"EGCG là epigallocatechin gallate, thuộc nhóm polyphenol; trong các lựa chọn, A là mô tả khái quát đúng nhất.","keywords":"EGCG polyphenol","chapter":7},{"number":7,"question":"Phát biểu ĐÚNG về EGCG","options":["Có nhiều trong hoa Hòe","Epigallocatechin gallic","Là coumarin","FeCl3 1% cho xanh đen"],"answer":"D","explanation":"EGCG có nhiều nhóm phenol nên tạo phức sẫm màu với FeCl3, thường xanh rêu đến xanh đen.","keywords":"EGCG + FeCl3 xanh sẫm","chapter":7},{"number":8,"question":"Dịch chiết nước sôi của dược liệu cho gelatin: tủa đục; FeCl3 1%: xanh đen. Dược liệu có","options":["Tanin ngưng tụ","Tanin pyrocatechic","Không có tanin","Tanin pyrogallic"],"answer":"D","explanation":"Tanin thủy phân kiểu pyrogallic thường cho màu xanh đen với FeCl3 và kết tủa với gelatin.","keywords":"FeCl3 xanh đen tanin pyrogallic","chapter":7},{"number":9,"question":"Sản phẩm khi cho dịch chiết coumarin phản ứng NaOH 10%, đun cách thủy rồi soi UV365","options":["Coumarat","Coumarin","Coumarinat","Đóng vòng"],"answer":"C","explanation":"Kiềm mở vòng lacton tạo muối coumarinat tan và phát huỳnh quang mạnh hơn dưới UV365.","keywords":"coumarin + kiềm coumarinat","chapter":7},{"number":10,"question":"Sản phẩm khi cho dịch chiết coumarin phản ứng NaOH 10%, đun cách thủy","options":["Coumarat","Coumarinat","Coumarin","Đóng vòng"],"answer":"B","explanation":"NaOH mở vòng lacton và tạo muối coumarinat.","keywords":"mở vòng lacton coumarinat","chapter":7},{"number":11,"question":"Chọn phát biểu SAI về phản ứng diazo","options":["Thế vào vị trí ortho, para so với OH","Bền với nhiệt","Xảy ra trong môi trường kiềm","Không dùng thừa thuốc thử"],"answer":"B","explanation":"Hợp chất diazo và phẩm màu azo thường kém bền với nhiệt, nên phản ứng tiến hành ở nhiệt độ thấp.","keywords":"diazo kém bền nhiệt","chapter":7},{"number":12,"question":"Chọn phát biểu SAI về phản ứng diazo","options":["Thế vào ortho, para so với OH","Không dùng thừa thuốc thử","Môi trường acid","Kém bền với nhiệt"],"answer":"C","explanation":"Phản ứng ghép cặp với nhóm OH phenol cần môi trường kiềm để tạo phenolat hoạt hóa.","keywords":"diazo + phenol môi trường kiềm","chapter":7},{"number":13,"question":"Chọn phát biểu SAI về phản ứng diazo","options":["Kém bền với nhiệt","Môi trường kiềm","Không dùng thừa thuốc thử","Thế vào meta so với OH"],"answer":"D","explanation":"Nhóm azo thường thế ở vị trí ortho hoặc para so với OH, không phải meta.","keywords":"diazo thế ortho/para","chapter":7},{"number":14,"question":"Theo DĐVN IV, hàm lượng rutin trong nụ hoa Hòe tối thiểu","options":["90%","30%","20%","50%"],"answer":"C","explanation":"Chỉ tiêu thường dùng cho nụ hoa Hòe là hàm lượng rutin không dưới 20%.","keywords":"nụ Hòe rutin tối thiểu 20%","chapter":7},{"number":15,"question":"Dược liệu chứa saponin triterpen cho phản ứng Liebermann-Burchard","options":["Mặt phân cách màu xanh lá","Dung dịch hồng đến đỏ tím","Mặt phân cách vàng với hồng đỏ","Dung dịch xanh lá"],"answer":"B","explanation":"Saponin triterpen thường cho màu hồng, đỏ đến đỏ tím; steroid thiên xanh lục/xanh lam.","keywords":"triterpen hồng/đỏ tím","chapter":7},{"number":16,"question":"Vết flavonoid trên TLC với thuốc thử VS có màu","options":["Xanh đen","Đỏ","Tím","Vàng"],"answer":"D","explanation":"Flavonoid thường cho màu vàng đến vàng cam với vanillin-sulfuric sau gia nhiệt.","keywords":"flavonoid + VS vàng","chapter":7},{"number":17,"question":"Dịch chiết coumarin: ống 1 thêm nước, ống 2 thêm NaOH 10% và đun. So sánh độ đục","options":["Hai ống trong như nhau","Ống 1 đục hơn","Hai ống đục như nhau","Ống 2 đục hơn"],"answer":"B","explanation":"Ống nước chứa coumarin tự do kém tan nên đục; ống kiềm tạo muối tan nên trong hơn.","keywords":"ống nước đục hơn ống kiềm","chapter":7},{"number":18,"question":"Phản ứng Cyanidin dương tính với cấu trúc","options":["Flavan-3-ol","Leucoanthocyanidin","Flavonol/anthocyanidin","Catechin"],"answer":"C","explanation":"Phản ứng Cyanidin đặc trưng cho nhiều flavonoid có hệ gamma-pyron như flavonol; đáp án nguồn gộp flavonol/AC.","keywords":"Cyanidin flavonol","chapter":7},{"number":19,"question":"Dung môi ưu tiên chiết saponin khỏi dược liệu","options":["Kiềm mạnh, đun nóng","MeOH hoặc EtOH 60-80%","Acid mạnh, đun nóng","n-Butanol bão hòa nước"],"answer":"B","explanation":"Cồn 60-80% hoặc methanol chiết tốt saponin mà hạn chế thủy phân; n-butanol thường dùng ở bước phân bố/làm sạch.","keywords":"saponin cồn 60-80%","chapter":7},{"number":20,"question":"Anthocyanidin trong môi trường trung tính có màu","options":["Tím","Đỏ","Xanh","Vàng huỳnh quang"],"answer":"A","explanation":"Anthocyanidin thường đỏ trong acid, tím gần trung tính và xanh trong kiềm.","keywords":"anthocyanidin trung tính tím","chapter":7},{"number":21,"question":"Phát biểu ĐÚNG về thuốc thử ninhydrin","options":["Thuốc thử chọn lọc cho hợp chất có chức amin","Thuốc thử chung cho hợp chất có N","Thuốc thử chọn lọc cho alkaloid","Thuốc thử chung cho hợp chất có chức amin"],"answer":"A","explanation":"Ninhydrin là thuốc thử chọn lọc phát hiện amino acid và hợp chất có nhóm amin tự do.","keywords":"ninhydrin nhóm amin","chapter":7},{"number":22,"question":"Từ 'Chroman' trong Chromatography có nghĩa là","options":["Lưu trữ","Ghi chép","Phân bố","Màu sắc"],"answer":"D","explanation":"Từ gốc Hy Lạp 'chroma' nghĩa là màu sắc; chromatography ban đầu dùng để tách sắc tố.","keywords":"chroma màu sắc","chapter":7},{"number":23,"question":"Hiện tượng dồn vết là do","options":["Dung môi hòa tan mẫu lẫn kim loại","Dung môi chưa bão hòa","Pha động quá kém phân cực","Pha động quá phân cực"],"answer":"A","explanation":"Tạp kim loại/ion trong dung môi mẫu có thể tương tác mạnh với silica, làm vết co cụm hoặc dồn.","keywords":"dồn vết tạp kim loại","chapter":7},{"number":24,"question":"Chọn phát biểu SAI về coumarin","options":["Dễ tan trong nước","Có khả năng thăng hoa","Có ester nội phân tử","Có mùi thơm"],"answer":"A","explanation":"Coumarin tự do thường kém tan trong nước nhưng tan trong dung môi hữu cơ.","keywords":"coumarin kém tan nước","chapter":7},{"number":25,"question":"Phản ứng đặc hiệu của coumarin","options":["Phản ứng OH-phenol","Đóng mở vòng lacton/tăng huỳnh quang trong kiềm","Diazo","Tất cả đúng"],"answer":"B","explanation":"Đặc trưng nhất là vòng lacton bị mở trong kiềm và huỳnh quang tăng dưới UV.","keywords":"coumarin mở lacton + tăng huỳnh quang","chapter":7},{"number":26,"question":"Phản ứng giúp sơ bộ phân định cấu trúc saponin","options":["Murexid","Cyanidin","Borntrager","Liebermann-Burchard"],"answer":"D","explanation":"Liebermann-Burchard hỗ trợ nhận biết khung steroid hoặc triterpen của sapogenin.","keywords":"saponin Liebermann-Burchard","chapter":7},{"number":27,"question":"Tính chất quan trọng để định tính tanin","options":["Tủa với protein","Tủa với thuốc thử Stiasny","Tủa với FeCl3 1%","Tủa với brom"],"answer":"A","explanation":"Tanin có khả năng tạo phức và kết tủa protein, là tính chất đặc trưng nền tảng.","keywords":"tanin kết tủa protein","chapter":7},{"number":28,"question":"Tên gọi 'Flavon' bắt nguồn từ","options":["Cấu trúc hóa học","Tính acid","Màu sắc","Độ tan"],"answer":"C","explanation":"'Flavus' trong Latin nghĩa là vàng, liên quan màu đặc trưng của nhiều flavonoid.","keywords":"flavon màu vàng","chapter":7},{"number":29,"question":"Trong phản ứng Liebermann-Burchard, vai trò của chloroform","options":["Hòa tan phần aglycon","Tác nhân thủy phân","Tạo màu đỏ","Tác nhân oxy hóa-khử"],"answer":"A","explanation":"Chloroform là dung môi hòa tan sapogenin/sterol để phản ứng với anhydrid acetic và H2SO4.","keywords":"CHCl3 hòa tan aglycon","chapter":7},{"number":30,"question":"Yếu tố KHÔNG ảnh hưởng đến chỉ số Rf","options":["Bản chất pha động","Độ hoạt hóa pha tĩnh","Bản chất pha tĩnh","Độ hoạt hóa pha động"],"answer":"D","explanation":"Khái niệm 'độ hoạt hóa' áp dụng chủ yếu cho pha tĩnh; pha động được mô tả bằng thành phần và độ phân cực.","keywords":"Rf không phụ thuộc 'độ hoạt hóa pha động'","chapter":7},{"number":31,"question":"Thuốc thử diazo không bền ở","options":["Độ ẩm cao","Nhiệt độ thấp","Độ ẩm thấp","Nhiệt độ cao"],"answer":"D","explanation":"Muối diazoni dễ phân hủy khi nhiệt độ tăng, nên phải giữ lạnh.","keywords":"diazo không bền ở nhiệt độ cao","chapter":7},{"number":32,"question":"Tinh thể coumarin","options":["Hình kim, trong suốt","Hình que, màu vàng","Hình que, không màu","Hình kim, màu vàng"],"answer":"A","explanation":"Coumarin thường tạo tinh thể hình kim không màu/trong suốt, có mùi thơm.","keywords":"coumarin tinh thể kim không màu","chapter":7},{"number":33,"question":"Thuốc thử phát hiện rutin bằng TLC","options":["FeCl3 1%/cồn","KOH/H2O","FeCl3 1%/H2O","KOH/MeOH"],"answer":"A","explanation":"Rutin là polyphenol flavonoid, tạo phức màu với FeCl3 trong cồn.","keywords":"rutin + FeCl3/cồn","chapter":7},{"number":34,"question":"Phát biểu sai về Liebermann-Burchard","options":["Phytosterol, glycosid tim cũng dương tính","Môi trường càng khan, vòng càng rõ","Giúp sơ bộ phân biệt cấu trúc saponin","Dịch chiết càng đậm, vòng càng rõ"],"answer":"D","explanation":"Dịch quá đậm không bảo đảm vòng rõ; yếu tố quan trọng là môi trường khan và thao tác tạo lớp.","keywords":"Liebermann khan, không phải càng đậm càng tốt","chapter":7},{"number":35,"question":"Saponin KHÔNG có tính chất","options":["Khó bị thẩm tích","Tạo bọt của sapogenin kém hơn saponin","Độc với cá và động vật nhuyễn thể","Tạo bọt nhiều trong cồn nên có khả năng nhũ hóa"],"answer":"D","explanation":"Saponin tạo bọt tốt trong nước/cồn-nước; không phải tạo bọt nhiều trong cồn tuyệt đối.","keywords":"saponin tạo bọt trong nước","chapter":7},{"number":36,"question":"Dịch chiết coumarin: ống 1 thêm NaOH, ống 2 thêm nước rồi đun. So sánh độ đục","options":["Hai ống đục như nhau","Ống 1 đục hơn","Hai ống trong như nhau","Ống 2 đục hơn"],"answer":"D","explanation":"Ống NaOH tạo muối tan nên trong hơn; ống nước chứa coumarin tự do kém tan nên đục.","keywords":"ống nước đục hơn","chapter":7},{"number":37,"question":"Phát biểu đúng về Rf trong TLC pha thuận","options":["Hai vết cùng Rf trên hai bản khác nhau chắc chắn giống nhau","Rf cao thì chọn pha động phân cực hơn","Rf thấp thì chọn pha động phân cực hơn","Rf càng gần 1 càng tốt"],"answer":"C","explanation":"Rf thấp nghĩa là chất bị giữ mạnh; tăng độ phân cực pha động giúp kéo chất đi xa hơn.","keywords":"Rf thấp tăng phân cực pha động","chapter":7},{"number":38,"question":"Trong thực vật, flavonoid chủ yếu có cấu trúc","options":["Isoflavonoid","Neoflavonoid","Euflavonoid","Biflavonoid"],"answer":"C","explanation":"Đa số flavonoid tự nhiên thuộc kiểu euflavonoid với vòng B gắn tại C2 của vòng C.","keywords":"flavonoid chủ yếu euflavonoid","chapter":7},{"number":39,"question":"Cả dạng aglycon và glycosid của anthranoid đều tan trong","options":["Dung dịch NaOH","Dung dịch NaHSO3","Nước nóng","Dung dịch HCl"],"answer":"A","explanation":"Các anthranoid có nhóm phenol tạo muối tan trong kiềm; glycosid cũng tan trong môi trường kiềm.","keywords":"anthranoid + NaOH muối tan","chapter":7},{"number":40,"question":"Dạng glycosid của anthranoid tan trong các dung môi sau, NGOẠI TRỪ","options":["Dung dịch NaOH","Nước nóng","NaHSO3","Cồn"],"answer":"C","explanation":"Anthraglycosid tan trong nước nóng, cồn và dung dịch kiềm; NaHSO3 không phải dung môi điển hình cho dạng glycosid.","keywords":"anthraglycosid không ưu tiên NaHSO3","chapter":7},{"number":1,"question":"Chiết dược liệu bằng nước sôi; thử gelatin không tủa, FeCl3 1% cho xanh rêu. Kết luận","options":["Tanin pyrogallic","Tanin thủy phân","Tanin pyrocatechic","Không có tanin"],"answer":"D","explanation":"Phản ứng gelatin âm tính cho thấy không có đủ tanin để kết tủa protein; màu xanh rêu với FeCl3 có thể do polyphenol khác nên chưa đủ kết luận có tanin.","keywords":"gelatin âm chưa xác định tanin","chapter":8},{"number":2,"question":"Chiết dược liệu bằng nước sôi; gelatin tạo tủa đục, FeCl3 1% cho xanh rêu. Dược liệu có","options":["Không có tanin","Tanin pyrogallic","Tanin pyrocatechic","Tanin thủy phân"],"answer":"C","explanation":"Tanin ngưng tụ/pyrocatechic thường cho màu xanh rêu với FeCl3 và kết tủa với gelatin.","keywords":"FeCl3 xanh rêu tanin pyrocatechic","chapter":8},{"number":3,"question":"Sắc ký lớp mỏng là phương pháp sắc ký dùng pha tĩnh nào trải thành lớp mỏng trên tấm kính","options":["Pha tĩnh phân bố","Pha tĩnh rây phân tử","Pha tĩnh trao đổi ion","Pha tĩnh là chất hấp phụ"],"answer":"D","explanation":"TLC pha thuận thông dụng dùng lớp chất hấp phụ rắn như silica gel hoặc alumina phủ trên bản.","keywords":"TLC pha tĩnh hấp phụ","chapter":8},{"number":4,"question":"Phương pháp loại chlorophyll khi chiết flavonoid của lá sen","options":["Chì acetat","Than hoạt","FeCl3","Gelatin muối"],"answer":"B","explanation":"Than hoạt hấp phụ mạnh các sắc tố như chlorophyll, giúp làm trong dịch chiết trước khi định tính flavonoid.","keywords":"loại chlorophyll than hoạt","chapter":8},{"number":5,"question":"Cho 2 ml NaOH 10% vào dịch chiết cồn 96% chứa coumarin rồi đun cách thủy, hiện tượng","options":["Trong","Phát quang","Đục","Tăng màu"],"answer":"A","explanation":"NaOH mở vòng lacton tạo muối coumarinat tan trong nước nên dung dịch trong hơn.","keywords":"coumarin + NaOH trong","chapter":8},{"number":6,"question":"Pha động dùng trong định tính flavonoid bằng TLC","options":["PE-EtOAc-HCOOH","CHCl3-EtOAc-HCOOH","EtOAc-MeOH-H2O","CHCl3-MeOH-H2O"],"answer":"C","explanation":"Flavonoid thường khá phân cực nên hệ EtOAc-MeOH-H2O phù hợp hơn các hệ quá kém phân cực.","keywords":"flavonoid EtOAc-MeOH-H2O","chapter":8},{"number":7,"question":"Chọn câu SAI về chỉ số Rf","options":["Điều kiện sắc ký lặp lại giống nhau thì Rf có tính lặp lại","Rf đặc trưng tuyệt đối cho chất trong TLC","Rf là tỉ số quãng đường chất đi trên quãng đường dung môi","Rf có giá trị từ 0 đến 1"],"answer":"B","explanation":"Rf chỉ có ý nghĩa so sánh trong cùng điều kiện; không phải hằng số tuyệt đối của một chất.","keywords":"Rf phụ thuộc điều kiện sắc ký","chapter":8},{"number":8,"question":"Dịch chiết Đậu đen trong cồn tác dụng FeCl3 cho","options":["Dung dịch tăng màu","Phức xanh đen","Tủa vàng đục","Vàng huỳnh quang"],"answer":"B","explanation":"Anthocyanin và các polyphenol trong Đậu đen tạo phức sẫm màu với Fe3+, thường xanh đen.","keywords":"Đậu đen + FeCl3 xanh đen","chapter":8},{"number":9,"question":"Hợp chất có tính vi thăng hoa, NGOẠI TRỪ","options":["Anthraquinon","Anthranoid dạng oxy hóa","Anthraglycosid","Coumarin"],"answer":"C","explanation":"Anthraglycosid không thăng hoa trực tiếp do phân tử lớn, phân cực; aglycon anthraquinon và coumarin có thể vi thăng hoa.","keywords":"glycosid không vi thăng hoa","chapter":8},{"number":10,"question":"Liebermann-Burchard có vòng nhẫn xanh lơ nghĩa là dịch chiết có","options":["Triterpen","Saponin triterpen","Steroid","Saponin steroid"],"answer":"D","explanation":"Màu xanh lơ/xanh lục gợi ý khung steroid; trong bối cảnh định tính saponin, đó là saponin steroid.","keywords":"xanh lơ saponin steroid","chapter":8},{"number":11,"question":"Dược liệu không có flavonoid","options":["Râu mèo","Hòe","Bạch quả","Ba kích"],"answer":"D","explanation":"Râu mèo, Hòe và Bạch quả đều giàu flavonoid; Ba kích nổi bật với anthranoid và iridoid hơn.","keywords":"Ba kích không điển hình flavonoid","chapter":8},{"number":12,"question":"Dung môi chiết flavonoid nhóm pyrylium trong thực hành","options":["MeOH","CHCl3","Cồn 96%","Cồn 25%"],"answer":"D","explanation":"Anthocyanidin/anthocyanin rất phân cực, phù hợp dung môi cồn-nước loãng như cồn 25%.","keywords":"pyrylium/anthocyanin cồn 25%","chapter":8},{"number":13,"question":"Tinh thể coumarin, chọn câu SAI","options":["Dạng aglycon","Có mùi thơm","Phản ứng với kiềm cho màu đỏ","Hình que, không màu"],"answer":"C","explanation":"Coumarin với kiềm chủ yếu mở vòng, tăng độ tan và huỳnh quang; màu đỏ không phải phản ứng đặc trưng.","keywords":"coumarin + kiềm đỏ","chapter":8},{"number":14,"question":"Tên gọi saponin dựa vào","options":["Tính chất đặc trưng","Cấu trúc","Tên dược liệu","Phản ứng kiểm nghiệm"],"answer":"A","explanation":"Tên saponin bắt nguồn từ khả năng tạo bọt như xà phòng.","keywords":"saponin sapo = xà phòng","chapter":8},{"number":15,"question":"Tanin có tính chất đặc trưng","options":["Khó tan trong kiềm loãng","Có nguồn gốc động vật","Không tan trong cồn","Không tan trong CHCl3, có vị chát và tính thuộc da"],"answer":"D","explanation":"Tanin là polyphenol phân cực, kém tan trong CHCl3, có vị chát và khả năng thuộc da nhờ kết tủa protein.","keywords":"tanin vị chát, thuộc da","chapter":8},{"number":16,"question":"Flavonoid có tác dụng phytoestrogen","options":["Biflavonoid","Euflavonoid","Isoflavonoid","Neoflavonoid"],"answer":"C","explanation":"Isoflavonoid có cấu trúc tương tự estrogen và thường biểu hiện tác dụng phytoestrogen.","keywords":"phytoestrogen isoflavonoid","chapter":8},{"number":17,"question":"Thuốc thử VS là","options":["Vanillin 1%/EtOH + H2SO4 10%/nước","Vanillin 1%/nước + H2SO4 10%/EtOH","Vanillin 1%/EtOH + H2SO4 10%/EtOH","Vanillin 1%/nước + H2SO4 10%/nước"],"answer":"C","explanation":"Thuốc thử vanillin-sulfuric thường được pha trong ethanol cho cả vanillin và acid sulfuric theo công thức thực hành.","keywords":"VS = vanillin 1%/EtOH + H2SO4 10%/EtOH","chapter":8},{"number":18,"question":"Họ thực vật thường có flavonoid cho tác dụng bảo vệ gan","options":["Asteraceae","Asphodelaceae","Fabaceae","Lamiaceae"],"answer":"A","explanation":"Nhiều dược liệu họ Cúc (Asteraceae) chứa flavonoid và sesquiterpen có tác dụng bảo vệ gan.","keywords":"bảo vệ gan Asteraceae","chapter":8},{"number":19,"question":"Cho mẫu có anthraquinon, chọn pha động phân tách thích hợp","options":["EtOAc-MeOH-HCOOH (5:5:1)","EtOAc-MeOH-H2O (100:17:13)","CHCl3-MeOH-HCOOH (9:1:1)","CHCl3-MeOH-H2O (65:35:10)"],"answer":"C","explanation":"Anthraquinon aglycon tương đối kém phân cực; hệ CHCl3-MeOH-HCOOH có độ phân cực vừa và acid giúp vết gọn.","keywords":"anthraquinon CHCl3-MeOH-HCOOH","chapter":8},{"number":20,"question":"Dung môi phù hợp để chiết anthraquinon","options":["Cồn 70%","Nước sôi","Cồn 25%","Dichloromethane"],"answer":"D","explanation":"Anthraquinon tự do kém phân cực, tan tốt trong DCM và các dung môi hữu cơ tương tự.","keywords":"anthraquinon tự do DCM","chapter":8},{"number":21,"question":"Trong thử nghiệm tạo bọt saponin, thực hiện trong dung môi nào và lắc liên tục bao lâu","options":["Nước cất - 15 phút","Nước cất - 1 phút","Methanol - 15 phút","Methanol - 1 phút"],"answer":"B","explanation":"Ống nghiệm được lắc mạnh với nước cất khoảng 1 phút, sau đó để yên và đọc cột bọt bền sau thời gian quy định.","keywords":"lắc 1 phút trong nước, đọc sau 15 phút","chapter":8},{"number":22,"question":"KĐ1: tính thuộc da của tanin nhờ liên kết hydro; KĐ2: dựa vào tính thuộc da để phân loại tanin","options":["KĐ1 sai; KĐ2 đúng","KĐ1 sai; KĐ2 sai","KĐ1 đúng; KĐ2 sai","KĐ1 đúng; KĐ2 đúng"],"answer":"C","explanation":"Tanin liên kết với protein nhờ liên kết hydro và tương tác kỵ nước; nhưng phân loại tanin chủ yếu dựa vào cấu trúc và khả năng thủy phân, không dựa vào tính thuộc da.","keywords":"thuộc da do liên kết H; phân loại theo cấu trúc","chapter":8},{"number":23,"question":"Thành phần thuốc thử Liebermann-Burchard","options":["Anhydrid acetic, EtOAc, H2SO4 10%","Anhydrid acetic, EtOAc, H2SO4 đậm đặc","Anhydrid acetic, CHCl3, H2SO4 10%","Anhydrid acetic, CHCl3, H2SO4 đậm đặc"],"answer":"D","explanation":"Phản ứng dùng anhydrid acetic và H2SO4 đậm đặc trong môi trường chloroform.","keywords":"Liebermann-Burchard Ac2O + CHCl3 + H2SO4 đ","chapter":8},{"number":24,"question":"Tinh thể anthraquinon trong thử nghiệm vi thăng hoa","options":["Hình kim, màu vàng","Hình que, trong suốt","Hình que, màu vàng","Hình kim, trong suốt"],"answer":"A","explanation":"Anthraquinon thường cho tinh thể hình kim màu vàng trên lam kính.","keywords":"anthraquinon kim vàng","chapter":8},{"number":25,"question":"Pha động thường dùng định tính saponin bằng TLC","options":["CHCl3-H2O-MeOH (65:35:10)","MeOH-CHCl3-H2O (65:35:10)","CHCl3-MeOH-H2O (65:35:10)","MeOH-H2O-CHCl3 (65:35:10)"],"answer":"C","explanation":"Hệ chuẩn được viết theo thứ tự CHCl3-MeOH-H2O với tỉ lệ 65:35:10.","keywords":"saponin TLC CHCl3-MeOH-H2O","chapter":8},{"number":26,"question":"Dạng tồn tại của coumarin trong tự nhiên","options":["Aglycon","Glycon","Kết hợp","Muối"],"answer":"A","explanation":"Coumarin thường gặp chủ yếu ở dạng aglycon tự do, có mùi thơm và kém tan trong nước.","keywords":"coumarin tự nhiên aglycon","chapter":8},{"number":27,"question":"Silica gel là gel của","options":["Acid silicic","Silica","Silimic","Silicon"],"answer":"A","explanation":"Silica gel là dạng gel của acid silicic, thường biểu diễn gần đúng SiO2·nH2O.","keywords":"silica gel gel acid silicic","chapter":8},{"number":28,"question":"Dung môi chiết anthocyanidin trong thực hành","options":["MeOH","Cồn 96%","CHCl3","Cồn 25%"],"answer":"D","explanation":"Anthocyanidin/anthocyanin phân cực, phù hợp cồn-nước loãng như cồn 25%.","keywords":"anthocyanidin cồn 25%","chapter":8},{"number":29,"question":"Cho nước vào dịch chiết cồn thấy đục; thêm NaOH đun thấy trong; thêm HCl đậm đặc lại đục. Dược liệu có","options":["Tanin","Coumarin","Flavonoid","Anthranoid"],"answer":"B","explanation":"Coumarin tự do kém tan gây đục; kiềm mở vòng tạo muối tan làm trong; acid hóa đóng vòng trở lại gây đục.","keywords":"đục trong kiềm đục lại = coumarin","chapter":8},{"number":30,"question":"Rutinose gồm","options":["Rhamnose và glucose","Glucose và galactose","Acid glucuronic và rhamnose","Galactose và glucose"],"answer":"A","explanation":"Rutinose là disaccharid gồm rhamnose và glucose.","keywords":"rutinose = rhamnose + glucose","chapter":8},{"number":31,"question":"Nếu nồng độ mẫu thử ít, ảnh hưởng đến TLC","options":["Đỡ hao dược liệu","Vết ít, khó phát hiện","Vết nhiều, dễ phát hiện","Hiện màu rõ hơn"],"answer":"B","explanation":"Nồng độ quá thấp tạo vết nhạt, có thể dưới giới hạn phát hiện.","keywords":"mẫu loãng vết khó thấy","chapter":8},{"number":32,"question":"Cho nước vào dịch chiết cồn thấy trong; thêm NaOH đun thấy đục; thêm HCl đậm đặc thấy trong. Dược liệu có","options":["Không xác định","Anthranoid","Flavonoid","Coumarin"],"answer":"A","explanation":"Chuỗi hiện tượng này không phù hợp phản ứng đóng-mở lacton điển hình của coumarin, nên chưa đủ cơ sở xác định nhóm chất.","keywords":"hiện tượng không điển hình không xác định","chapter":8},{"number":33,"question":"Thành phần hóa học chính của Đại hoàng","options":["Anthranoid","Coumarin","Flavonoid","Saponin"],"answer":"A","explanation":"Đại hoàng nổi bật với anthranoid, đặc biệt anthraquinon và glycosid của chúng.","keywords":"Đại hoàng anthranoid","chapter":8},{"number":34,"question":"Silica gel là","options":["Chất mang trong sắc ký khí","Chất hấp phụ thường dùng trong sắc ký","Chất mang trong sắc ký lỏng siêu tới hạn","Pha tĩnh thường dùng trong mọi dạng sắc ký"],"answer":"B","explanation":"Silica gel là chất hấp phụ rất phổ biến trong TLC và sắc ký cột.","keywords":"silica gel chất hấp phụ","chapter":8},{"number":35,"question":"Phát biểu SAI về EGCG","options":["FeCl3 1% cho xanh rêu","Có tác dụng chống oxy hóa","Là epigallocatechin gallate","Có nhiều trong trà xanh"],"answer":"A","explanation":"EGCG thường cho màu xanh đen/xanh sẫm với FeCl3; mô tả xanh rêu được xem là không đúng theo đáp án nguồn.","keywords":"EGCG + FeCl3 xanh đen","chapter":8},{"number":36,"question":"Chọn phát biểu SAI về coumarin","options":["Khó tan trong cồn 96%","Có mùi thơm","Có khả năng mở vòng lacton","Có ester nội phân tử"],"answer":"A","explanation":"Coumarin tan tốt trong ethanol 96%; ba mệnh đề còn lại là tính chất đặc trưng.","keywords":"coumarin tan trong cồn 96%","chapter":8},{"number":37,"question":"Anthranoid là glycosid mà phần aglycon là dẫn chất của","options":["1,2-dihydroxyanthracen","9,10-anthracendion","1,2-dihydroxyanthraquinon","1,8-dihydroxyanthraquinon"],"answer":"B","explanation":"Khung cơ bản của anthraquinon là anthracen-9,10-dion.","keywords":"anthranoid anthracen-9,10-dion","chapter":8},{"number":38,"question":"Sản phẩm thu được khi soi dịch chiết coumarin dưới UV365","options":["Coumarinat","Mở vòng","Coumarin đóng vòng","Coumarat"],"answer":"C","explanation":"Nếu chỉ soi UV365 mà không kiềm hóa, coumarin vẫn ở dạng vòng lacton đóng.","keywords":"UV365 đơn thuần coumarin đóng vòng","chapter":8},{"number":39,"question":"Với thuốc thử vanillin-sulfuric, chọn câu SAI","options":["Màu đa dạng do thành phần vanillin","Cho màu nhờ phản ứng oxy hóa","Màu tùy thuộc mẫu sắc ký","Không cho màu với vết saponin"],"answer":"D","explanation":"Vanillin-sulfuric thường dùng hiện màu saponin, nên nói không cho màu với saponin là sai.","keywords":"VS hiện màu saponin","chapter":8},{"number":40,"question":"Tính chất của anthraglycosid, NGOẠI TRỪ","options":["Thăng hoa","Tan trong nước sôi","Dễ
